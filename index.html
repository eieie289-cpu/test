  const [zoomedSlip, setZoomedSlip] = useState(null);
  const [custName, setCustName] = useState("");
  const [custPhone, setCustPhone] = useState(""); // เบอร์โทรติดต่อกลับ (ร้านโทรหาถ้าเกิดปัญหา)
  const [deliveryMethod, setDeliveryMethod] = useState("delivery"); // pickup | delivery — รับที่ร้าน หรือ จัดส่ง
  const [deliveryNow, setDeliveryNow] = useState(true); // จัดส่ง: true = ส่งตอนนี้ (เร็วที่สุด) / false = เลือกวันเวลาล่วงหน้า
  const [custHouseNo, setCustHouseNo] = useState("");
  const [custDeliveryDate, setCustDeliveryDate] = useState("");
  const [custDeliveryTime, setCustDeliveryTime] = useState("");
  const [custError, setCustError] = useState(false);
  const [phoneError, setPhoneError] = useState(false); // เบอร์โทรไม่ถูกต้อง (ต้อง 10 หลัก ขึ้นต้น 0)
  const custFormRef = useRef(null);
  const dateOptions = useMemo(() => upcomingDateOptions(7), []);
  // เวลาปัจจุบัน (อัปเดตทุก 30 วินาที) — วันนี้จะปัดช่วงเวลาที่ผ่านไปแล้วออกจากตัวเลือก
  // nowTs (timestamp ตัวเลข) ใช้ตรวจโปรโมชั่นแบบ "เฉพาะช่วงเวลา/วัน" ด้วย — ให้ส่วนลดในตะกร้า
  // อัปเดตเองเมื่อเวลาข้ามเงื่อนไข โดยไม่ต้องรอให้ลูกค้าแก้ตะกร้าก่อนถึงจะรีเฟรช
  const [nowStr, setNowStr] = useState(() => {
    const d = new Date();
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  });
  const [nowTs, setNowTs] = useState(() => Date.now());
  useEffect(() => {
    const t = setInterval(() => {
      const d = new Date();
      setNowStr(`${pad2(d.getHours())}:${pad2(d.getMinutes())}`);
      setNowTs(d.getTime());
    }, 30000);
    return () => clearInterval(t);
  }, []);
  // ช่วงเวลาจัดส่งที่ร้านตั้งไว้ (จากหน้าจัดการเมนู) — ถ้ายังไม่ได้ตั้ง ใช้ค่าเริ่มต้น 09:00–20:00
  const deliverySlots = useMemo(
    () => buildTimeSlots((deliveryHours && deliveryHours.deliveryOpenTime) || "09:00", (deliveryHours && deliveryHours.deliveryCloseTime) || "20:00"),
    [deliveryHours && deliveryHours.deliveryOpenTime, deliveryHours && deliveryHours.deliveryCloseTime]
  );
  const isTodayDelivery = custDeliveryDate === todayKey();
  const remainingSlotsToday = isTodayDelivery ? deliverySlots.filter((t) => t > nowStr) : deliverySlots;
  // โค้ดส่วนลด — ลด % หรือบาทจากยอดรวมสินค้า (เฉพาะโค้ดที่พนักงานสร้างไว้ในหน้าโปรโมชั่น)
  const [promoCode, setPromoCode] = useState("");
  const [appliedPromo, setAppliedPromo] = useState(null);
  const [promoError, setPromoError] = useState(""); // ข้อความ error ของโค้ดส่วนลด ("" = ไม่มี) — เช่น ใช้ครบแล้ว / 1 ครั้งต่อคน
  const [bringCup, setBringCup] = useState(false); // ลูกค้าติ๊ก "นำแก้วมาเอง" เพื่อรับส่วนลด
  const subtotal = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
  // โปรโมชั่น "นำแก้วมาเอง" ที่เปิดใช้ — ลูกค้าติ๊กในหน้าชำระเงินเพื่อรับส่วนลด
  // รองรับทั้งโปรเก่า (type: byoc) และโปรตัวต่อ (เงื่อนไข byoc)
  const byocPromo = (promos || []).find(
    (p) => p && p.active && (p.type === "byoc" || (p.rules && (p.rules.conds || []).includes("byoc")))
  );
  // จำนวนส่วนลดนำแก้วมาเอง (โปรตัวต่ออ่านจาก rules.actionAmount)
  const byocBahtValue = byocPromo
    ? byocPromo.rules
      ? Number(byocPromo.rules.actionAmount) || 0
      : Number(byocPromo.discountBaht) || 0
    : 0;
  // ส่วนลดโค้ด (เป็น % หรือบาทก็ได้) + ส่วนลดนำแก้วมาเอง
  const codeBaht = appliedPromo
    ? Number(appliedPromo.discountBaht) > 0
      ? Math.min(Number(appliedPromo.discountBaht), subtotal)
      : Math.round((subtotal * (Number(appliedPromo.discountPercent) || 0)) / 100)
    : 0;
  // นำแก้วมาเอง — ปกติใช้ได้เฉพาะรับที่ร้าน (ลูกค้าที่สั่งจัดส่งเอาแก้วไปส่งไม่ได้)
  // แต่พนักงานตั้งได้ว่าให้ใช้ได้ทั้งสองแบบ (pickupOnly = false)
  const byocPickupOnly = byocPromo ? (byocPromo.rules ? byocPromo.rules.pickupOnly !== false : byocPromo.pickupOnly !== false) : true;
  const byocBaht = bringCup && byocPromo && (!byocPickupOnly || deliveryMethod === "pickup") ? Math.min(byocBahtValue, subtotal) : 0;
  // โปรโมชั่น "ซื้อครบ" — หักให้อัตโนมัติเมื่อยอดรวมถึงเกณฑ์ (ลูกค้าไม่ต้องทำอะไร)
  const thresholdPromo = (promos || []).find((p) => p && p.active && p.type === "threshold");
  const thresholdMet = !!thresholdPromo && subtotal >= (Number(thresholdPromo.minSpend) || 0);
  const thresholdBaht = thresholdMet ? Math.min(Number(thresholdPromo.discountBaht) || 0, subtotal) : 0;
  // โปรโมชั่นตัวต่อ (rules) — ส่วนลดระดับตะกร้า (ซื้อครบ/1แถม1/ชิ้นN/ชุด/โค้ด/แก้วมาเอง/ท็อปปิ้งฟรีมีเงื่อนไข)
  // ที่ยังไม่ได้หักตอนเพิ่มลงตะกร้า — คำนวณจากตะกร้าทั้งใบ + วิธีรับ + โค้ด + ติ๊กแก้วมาเอง
  const ruleCartDiscount = computeRuleCartDiscount(cart, promos, {
    deliveryMethod,
    bringCup,
    appliedPromoId: appliedPromo ? appliedPromo.id : "",
    subtotal,
    cart,
    now: nowTs,
    uid,
  });
  // รวมส่วนลดจากหลายแหล่ง (โค้ด/แก้วมาเอง/ซื้อครบ/โปรตัวต่ออื่นๆ) — แต่ละก้อนถูกปัดเป็นสตางค์มาแล้ว
  // แต่การบวกเลขทศนิยมใน JS อาจเกิดเศษ float คลาดเคลื่อนได้ (เช่น 0.01+0.09 = 0.09999999999999999)
  // ปัดซ้ำอีกรอบตรงนี้กันราคาสุดท้ายที่ลูกค้า/พนักงานเห็นมีเศษยิบย่อยที่ไม่ควรมี
  const discountBaht = Math.round((codeBaht + byocBaht + thresholdBaht + ruleCartDiscount.baht) * 100) / 100;
  const total = Math.round(Math.max(0, subtotal - discountBaht) * 100) / 100;
  // ป้ายสรุปส่วนลด เช่น "ซื้อครบ + นำแก้วมาเอง + โค้ด SAVE5 + 1แถม1 (ฟรี 1 ชิ้น)"
  const discountSummaryLabel = [
    thresholdBaht > 0 ? "ซื้อครบ" : null,
    byocBaht > 0 ? "นำแก้วมาเอง" : null,
    appliedPromo ? `โค้ด ${promoCodeText(appliedPromo)}` : null,
    ruleCartDiscount.label || null,
  ]
    .filter(Boolean)
    .join(" + ");
  const isCash = method === "cash";

  const applyPromoCode = () => {
    const promo = findPromoCode(promoCode, promos);
    if (!promo) {
      setAppliedPromo(null);
      setPromoError("โค้ดส่วนลดไม่ถูกต้อง หรือยังไม่ได้เปิดใช้");
      return;
    }
    // จำนวนที่ใช้ไปแล้ว — อ่านจากฟิลด์ usage (ใหม่) หรือ uses เดิมในตัวโปรโมชั่น (ข้อมูลเก่า)
    const usesCount = Number((promo._usage && promo._usage.uses) || promo.uses) || 0;
    const usedByList = (promo._usage && promo._usage.usedBy) || promo.usedBy || [];
    // จำกัดจำนวนครั้งที่ใช้ได้ทั้งหมด (เช่น ใช้ได้ 50 ครั้ง)
    if (Number(promo.maxUses) > 0 && usesCount >= Number(promo.maxUses)) {
      setAppliedPromo(null);
      setPromoError("โค้ดนี้ใช้ครบจำนวนครั้งแล้ว");
      return;
    }
    // จำกัด 1 ครั้งต่อลูกค้า (เช่น โค้ดเพื่อนแนะนำ)
    if (promo.perCustomer && usedByList.includes(uid)) {
      setAppliedPromo(null);
      setPromoError("โค้ดนี้ใช้ได้คนละ 1 ครั้งเท่านั้น");
      return;
    }
    setAppliedPromo(promo);
    setPromoError("");
  };

  // ข้อมูลส่วนลดที่จะแนบไปกับออร์เดอร์ (ส่งให้พนักงานเห็นยอดที่หักจริง)
  const getDiscount = () => {
    if (discountBaht <= 0) return null;
    const finalPromoId = appliedPromo ? appliedPromo.id : ruleCartDiscount.promoId || "";
    // maxUses ของโปรที่ใช้จริง — ส่งไปให้ placeOrder เช็คซ้ำแบบ transaction ตอนเขียนจริง (กันสองเครื่องแย่งโควตาสุดท้ายพร้อมกัน)
    const finalPromo = finalPromoId ? (promos || []).find((p) => p.id === finalPromoId) : null;
    return {
      code: promoCodeText(appliedPromo),
      percent: promoDiscountPercent(appliedPromo),
      baht: discountBaht,
      label: discountSummaryLabel,
      promoId: finalPromoId, // ใช้ใน placeOrder เพื่อนับจำนวนการใช้โค้ด
      perCustomer: appliedPromo ? !!appliedPromo.perCustomer : !!ruleCartDiscount.perCustomer, // โค้ดแบบ 1 ครั้ง/คน — ใช้อัปเดต usedBy ตอนสั่งสำเร็จ
      maxUses: finalPromo ? Number(finalPromo.maxUses) || 0 : 0,
    };
  };

  // แค่เก็บรูปสลิปไว้ให้พนักงานเปิดดูเอง — ไม่มีการอ่าน/ตรวจสอบอัตโนมัติใด ๆ
  // รูปจะถูกบีบอัดแล้วฝังลง Firestore โดยตรง (ไม่ผ่าน Firebase Storage เพราะ Storage
  // ต้องผูกบัตร/อัปเกรดเป็นแผน Blaze ตั้งแต่ ก.พ. 2026 เป็นต้นมา ร้านนี้เลยไม่ใช้)
  // จึงไม่มีขั้นตอนอัปโหลดขึ้นเน็ตแยกต่างหาก — บีบอัดเสร็จก็พร้อมใช้ทันที ไม่ต้องรอเน็ต
  const handleSlipUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    setCompressing(true);
    let dataUrl;
    try {
      // บีบให้เล็กพอฝังใน Firestore ได้สบาย ๆ (เอกสารจำกัดที่ 1MB/ชิ้น) —
      // 1000px + คุณภาพ 0.72 ปกติเหลือแค่ ~150-400KB ยังอ่านตัวเลข/ยอดเงินในสลิปได้ชัด
      const compressed = await compressImage(file, 1000, 0.72);
      dataUrl = compressed.dataUrl;
    } catch (compressErr) {
      // เผื่อบีบอัดไม่สำเร็จ (บราวเซอร์แปลก ๆ) — fallback ไปใช้ไฟล์ต้นฉบับแทน
      console.error("Compress slip failed, using original file:", compressErr);
      dataUrl = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }
    setSlipImg({ dataUrl, url: dataUrl });
    setCompressing(false);
  };

  const removeSlip = () => {
    setSlipImg(null);
  };

  const handleConfirm = () => {
    const isPickup = deliveryMethod === "pickup";
    // รับที่ร้าน: ต้องกรอกชื่อเท่านั้น — จัดส่ง: ต้องกรอกชื่อ+บ้านเลขที่ และถ้าเลือกส่งล่วงหน้าต้องเลือกวันเวลาด้วย
    const missing =
      !custName.trim() ||
      !custPhone.trim() ||
      (!isPickup && (!custHouseNo.trim() || (!deliveryNow && (!custDeliveryDate || !custDeliveryTime))));
    // ตรวจรูปแบบเบอร์โทรด้วย (10 หลัก ขึ้นต้น 0) — กันเบอร์ปลอม/พิมพ์ผิด
    const badPhone = !isValidPhone(custPhone);
    if (missing || badPhone) {
      setCustError(true);
      setPhoneError(badPhone);
      // เลื่อนจอไปที่ฟอร์มชื่อ/บ้านเลขที่/เวลาจัดส่ง ให้ลูกค้าเห็นทันทีว่าลืมกรอกตรงไหน
      if (custFormRef.current) {
        custFormRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      return;
    }
    setCustError(false);
    setPhoneError(false);
    const customer = {
      name: custName.trim(),
      phone: custPhone.trim(),
      method: deliveryMethod,
      houseNo: isPickup ? "" : custHouseNo.trim(),
      deliveryDate: isPickup || deliveryNow ? "" : custDeliveryDate,
      deliveryTime: isPickup || deliveryNow ? "" : custDeliveryTime,
      deliveryNow: deliveryMethod === "delivery" && deliveryNow, // ส่งตอนนี้ (เร็วที่สุด) — ฝั่งพนักงานจะเห็นป้ายนี้
    };
    if (isCash) {
      // เงินสด = เก็บเงินตอนรับของ (คนส่ง/หน้าร้านเก็บ) — ไม่ต้องแนบสลิป
      onPaid(method, null, customer, getDiscount(), true);
      return;
    }
    if (collectOnDelivery) {
      // เลือก "เก็บปลายทาง" = ยังไม่ต้องโอนตอนนี้ จ่ายตอนรับของ — ไม่ต้องแนบสลิป
      onPaid(method, null, customer, getDiscount(), true);
      return;
    }
    if (!slipImg) return;
    setPaying(true);
    setTimeout(() => {
      setPaying(false);
      onPaid(method, { url: slipImg.url, dataUrl: slipImg.dataUrl }, customer, getDiscount(), false);
    }, 400);
  };

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <button onClick={onBack} style={{ color: COLORS.inkSoft }} className="flex items-center gap-1 text-sm mb-4">
        <ArrowLeft size={16} /> กลับไปแก้ตะกร้า
      </button>
      <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold mb-5">
        ชำระเงิน
      </h1>

      <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-4 mb-4">
        {cart.map((item) => (
          <div key={item.cartId} className="py-1.5">
            <div className="flex justify-between gap-2">
              <span style={{ color: COLORS.ink, fontSize: 16 }} className="flex-1 min-w-0 break-words font-semibold">{item.name} × {item.qty}</span>
              <span style={{ color: COLORS.ink, fontSize: 16 }} className="font-semibold flex-shrink-0">฿{fmtBaht(item.price * item.qty)}</span>
            </div>
            {item.addOns && item.addOns.length > 0 && (
              <p style={{ color: COLORS.caramelDark, fontSize: 12 }} className="mt-0.5">
                + {item.addOns.map((a) => a.name).join(", ")}
              </p>
            )}
            {item.note && item.note.trim() && (
              <p style={{ color: COLORS.caramelDark, fontSize: 12 }} className="mt-0.5 flex items-start gap-1">
                <Pencil size={10} className="mt-0.5 flex-shrink-0" /> {item.note}
              </p>
            )}
          </div>
        ))}
        <div style={{ borderTop: `1px dashed ${COLORS.line}` }} className="pt-3 mt-2">
          {/* นำแก้วมาเอง — ลูกค้าติ๊กเพื่อรับส่วนลด (เฉพาะรับที่ร้าน หรือทั้งสองแบบ ตามที่ร้านตั้งไว้) */}
          {byocPromo && (!byocPickupOnly || deliveryMethod === "pickup") && (
            <button
              type="button"
              onClick={() => setBringCup(!bringCup)}
              className="w-full flex items-center justify-between rounded-xl px-3 py-2.5 mb-2"
              style={{ border: `1px solid ${bringCup ? COLORS.sage : COLORS.line}`, background: bringCup ? COLORS.sageSoft : "#FFFFFF" }}
            >
              <span className="flex items-center gap-2">
                <span
                  style={{ border: `2px solid ${bringCup ? COLORS.sage : COLORS.line}`, background: bringCup ? COLORS.sage : "transparent" }}
                  className="w-4 h-4 rounded flex items-center justify-center flex-shrink-0"
                >
                  {bringCup && <Check size={10} color="#fff" />}
                </span>
                <span style={{ color: COLORS.ink }} className="text-sm font-medium min-w-0 break-words">{byocPromo.name || "นำแก้วมาเอง"}</span>
              </span>
              <span style={{ color: COLORS.sage }} className="text-xs font-bold">ลด ฿{fmtBaht(byocBahtValue)}</span>
            </button>
          )}
          {byocPromo && byocPickupOnly && deliveryMethod === "delivery" && (
            <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-2">
              ส่วนลดนำแก้วมาเอง ใช้ได้เฉพาะการรับที่ร้านเท่านั้น
            </p>
          )}
          {/* โค้ดส่วนลด */}
          <div className="flex gap-2 mb-2">
            <input
              value={promoCode}
              onChange={(e) => {
                setPromoCode(e.target.value.toUpperCase());
                setPromoError("");
              }}
              placeholder="ใส่โค้ดส่วนลด (ถ้ามี)"
              style={{
                border: `1px solid ${promoError ? "#C0533F" : COLORS.line}`,
                color: COLORS.ink,
                textTransform: "uppercase",
              }}
              className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm focus:outline-none placeholder:normal-case"
            />
            <button
              type="button"
              onClick={appliedPromo ? () => { setAppliedPromo(null); setPromoCode(""); setPromoError(""); } : applyPromoCode}
              style={{
                background: appliedPromo ? COLORS.sageSoft : COLORS.caramel,
                color: appliedPromo ? COLORS.sage : "#FFF9F0",
              }}
              className="rounded-xl px-4 py-2.5 text-sm font-semibold flex-shrink-0 active:scale-[0.98] transition-transform"
            >
              {appliedPromo ? "ลบโค้ด" : "ใช้โค้ด"}
            </button>
          </div>
          {promoError && (
            <p style={{ color: "#C0533F" }} className="text-[11px] font-semibold mb-1">
              {promoError}
            </p>
          )}
          {appliedPromo && (
            <p style={{ color: COLORS.sage }} className="text-[11px] font-semibold mb-1">
              {appliedPromo.rules
                ? `โค้ด ${promoCodeText(appliedPromo)}${ruleCartDiscount.label ? ` · ${ruleCartDiscount.label}` : ""}`
                : <>โค้ด {appliedPromo.code} · ลด{" "}
                    {Number(appliedPromo.discountBaht) > 0 ? `฿${appliedPromo.discountBaht}` : `${Number(appliedPromo.discountPercent) || 0}%`} จากยอดรวม
                  </>}
            </p>
          )}
          {discountBaht > 0 && (
            <div className="flex justify-between text-xs mb-1">
              <span style={{ color: COLORS.sage }} className="font-semibold">ส่วนลด {discountSummaryLabel}</span>
              <span style={{ color: COLORS.sage }} className="font-semibold">-฿{fmtBaht(discountBaht)}</span>
            </div>
          )}
          {thresholdPromo && !thresholdMet && (
            <p style={{ color: COLORS.caramelDark }} className="text-[11px] font-semibold mb-1">
              ซื้อเพิ่มอีก ฿{fmtBaht(Math.max(0, (Number(thresholdPromo.minSpend) || 0) - subtotal))} รับส่วนลด ฿{fmtBaht(thresholdPromo.discountBaht)}
            </p>
          )}
          <div className="flex justify-between pt-2">
            <span style={{ color: COLORS.ink }} className="font-semibold">ยอดรวมทั้งหมด</span>
            <span style={{ color: COLORS.caramelDark }} className="font-bold text-lg">฿{fmtBaht(total)}</span>
          </div>
        </div>
      </div>

      <p style={{ color: COLORS.inkSoft }} className="text-xs font-semibold mb-2 px-1">ข้อมูลการรับออเดอร์</p>
      <div ref={custFormRef} style={{ background: "#FFFFFF", border: `1px solid ${custError ? "#C0533F" : COLORS.line}` }} className="rounded-2xl p-4 mb-4 space-y-3">
        <div>
          <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1 block">วิธีการรับ</label>
          <div className="flex gap-2">
            {[
              { id: "pickup", label: "รับที่ร้าน", icon: ChefHat },
              { id: "delivery", label: "จัดส่ง", icon: Truck },
            ].map((m) => (
              <button
                key={m.id}
                type="button"
                onClick={() => { setDeliveryMethod(m.id); setCustError(false); if (m.id !== "pickup" && byocPickupOnly) setBringCup(false); }}
                style={{
                  flex: 1,
                  background: deliveryMethod === m.id ? COLORS.peachSoft : "#FFFFFF",
                  border: `1.5px solid ${deliveryMethod === m.id ? COLORS.caramel : COLORS.line}`,
                }}
                className="rounded-xl px-4 py-3 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
              >
                <m.icon size={16} style={{ color: deliveryMethod === m.id ? COLORS.caramelDark : COLORS.inkSoft }} />
                <span style={{ color: deliveryMethod === m.id ? COLORS.caramelDark : COLORS.inkSoft }} className="text-sm font-semibold">{m.label}</span>
              </button>
            ))}
          </div>
        </div>
        <div>
          <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1 block">ชื่อลูกค้า</label>
          <input
            type="text"
            value={custName}
            onChange={(e) => { setCustName(e.target.value); setCustError(false); }}
            placeholder="เช่น คุณสมศรี"
            style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}
            className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
          />
        </div>
        <div>
          <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1 block">เบอร์โทรติดต่อกลับ *</label>
          <input
            type="tel"
            inputMode="tel"
            autoComplete="tel"
            required
            value={custPhone}
            onChange={(e) => { setCustPhone(formatPhoneInput(e.target.value)); setCustError(false); setPhoneError(false); }}
            placeholder="เช่น 081-234-5678"
            style={{ border: `1.5px solid ${phoneError ? "#C0533F" : COLORS.line}`, color: COLORS.ink }}
            className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
          />
        </div>
        {deliveryMethod === "delivery" ? (
          <>
            <div>
              <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1 block">เวลาที่ต้องการจัดส่ง</label>
              <div className="flex gap-2">
                {[
                  { id: "now", label: "ส่งตอนนี้", icon: Truck },
                  { id: "schedule", label: "ส่งล่วงหน้า", icon: CalendarIcon },
                ].map((o) => {
                  const active = (o.id === "now") === deliveryNow;
                  return (
                    <button
                      key={o.id}
                      type="button"
                      onClick={() => { setDeliveryNow(o.id === "now"); setCustError(false); }}
                      style={{
                        flex: 1,
                        background: active ? COLORS.peachSoft : "#FFFFFF",
                        border: `1.5px solid ${active ? COLORS.caramel : COLORS.line}`,
                      }}
                      className="rounded-xl px-4 py-3 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
                    >
                      <o.icon size={16} style={{ color: active ? COLORS.caramelDark : COLORS.inkSoft }} />
                      <span style={{ color: active ? COLORS.caramelDark : COLORS.inkSoft }} className="text-sm font-semibold">{o.label}</span>
                    </button>
                  );
                })}
              </div>
              {deliveryNow ? (
                <p style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-xs rounded-xl px-3.5 py-2.5 mt-2 leading-relaxed">
                  กรุณารอสักครู่ — เมื่อออร์เดอร์ทำเสร็จแล้ว ร้านจะดำเนินการจัดส่งให้เร็วที่สุด
                </p>
              ) : (
                <>
                  <div className="mt-3">
                    <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1.5 block">วันที่ต้องการจัดส่ง</label>
                    <div className="flex gap-1.5 overflow-x-auto pb-1" style={{ scrollbarWidth: "none" }}>
                      {dateOptions.map((opt) => (
                        <button
                          key={opt.key}
                          type="button"
                          onClick={() => {
                            setCustDeliveryDate(opt.key);
                            setCustError(false);
                            // เปลี่ยนมาเลือก "วันนี้" แล้วเวลาที่เคยเลือกไว้อาจผ่านไปแล้ว — เคลียร์ให้เลือกใหม่
                            if (opt.key === todayKey() && custDeliveryTime && custDeliveryTime <= nowStr) setCustDeliveryTime("");
                          }}
                          style={{
                            background: custDeliveryDate === opt.key ? COLORS.caramel : COLORS.paper,
                            color: custDeliveryDate === opt.key ? "#FFF9F0" : COLORS.inkSoft,
                            border: `1.5px solid ${custDeliveryDate === opt.key ? COLORS.caramel : COLORS.line}`,
                          }}
                          className="flex-shrink-0 rounded-full px-3.5 py-2 text-xs font-semibold whitespace-nowrap"
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1 block">ช่วงเวลาที่ต้องการจัดส่ง</label>
                    <select
                      value={custDeliveryTime}
                      onChange={(e) => { setCustDeliveryTime(e.target.value); setCustError(false); }}
                      style={{ border: `1.5px solid ${COLORS.line}`, color: custDeliveryTime ? COLORS.ink : COLORS.inkSoft }}
                      className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none bg-white"
                    >
                      <option value="">เลือกเวลา...</option>
                      {/* วันนี้ — ปัดช่วงเวลาที่ผ่านไปแล้วออก (เลือกไม่ได้) เหลือแต่เวลาที่ยังจัดส่งได้ */}
                      {deliverySlots.map((t) => {
                        const past = isTodayDelivery && t <= nowStr;
                        return (
                          <option key={t} value={t} disabled={past}>
                            {t} น.{past ? " (ผ่านไปแล้ว)" : ""}
                          </option>
                        );
                      })}
                    </select>
                    {isTodayDelivery ? (
                      remainingSlotsToday.length > 0 ? (
                        <p style={{ color: COLORS.sage }} className="text-xs mt-1.5 flex items-center gap-1">
                          <Clock size={11} className="flex-shrink-0" />
                          ตอนนี้เวลา {nowStr} น. — วันนี้เหลือเวลาจัดส่ง {remainingSlotsToday.length} ช่วงเวลา
                        </p>
                      ) : (
                        <p style={{ color: "#C0533F" }} className="text-xs mt-1.5">
                          วันนี้หมดเวลาจัดส่งแล้ว ({nowStr} น.) — กรุณาเลือกวันพรุ่งนี้หรือวันถัดไป
                        </p>
                      )
                    ) : (
                      <p style={{ color: COLORS.inkSoft }} className="text-xs mt-1.5">
                        ร้านจัดส่งช่วง {deliverySlots[0] || "09:00"} – {deliverySlots[deliverySlots.length - 1] || "20:00"} น. (ทุก 30 นาที)
                      </p>
                    )}
                  </div>
                </>
              )}
            </div>
            <div>
              <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium mb-1 block">บ้านเลขที่ / ที่อยู่จัดส่ง</label>
              <input
                type="text"
                inputMode="text"
                autoComplete="street-address"
                value={custHouseNo}
                onChange={(e) => { setCustHouseNo(e.target.value); setCustError(false); }}
                placeholder="เช่น 15/113 ซอย 4"
                style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}
                className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
              />
            </div>
          </>
        ) : (
          <p style={{ color: COLORS.inkSoft, background: COLORS.paper }} className="text-xs rounded-xl px-3.5 py-2.5" >
            มารับที่ร้านได้เลย ร้านเปิด {(deliveryHours && deliveryHours.openTime) || "09:00"} – {(deliveryHours && deliveryHours.closeTime) || "20:00"} น. — ไม่ต้องเลือกวันเวลาจัดส่ง
          </p>
        )}
        {custError && (
          <p className="text-xs" style={{ color: "#C0533F" }}>
            {phoneError
              ? "เบอร์โทรไม่ถูกต้อง — ต้องเป็นเบอร์ 10 หลัก ขึ้นต้น 0 เช่น 081-234-5678"
              : deliveryMethod === "pickup"
              ? "กรุณากรอกชื่อและเบอร์โทรติดต่อกลับก่อนยืนยัน"
              : deliveryNow
              ? "กรุณากรอกชื่อ เบอร์โทร และบ้านเลขที่ก่อนยืนยัน"
              : "กรุณากรอกชื่อ เบอร์โทร บ้านเลขที่ และเลือกวันเวลาจัดส่งก่อนยืนยัน"}
          </p>
        )}
      </div>

      <p style={{ color: COLORS.inkSoft }} className="text-xs font-semibold mb-2 px-1">เลือกวิธีชำระเงิน</p>
      <div className="space-y-2 mb-6">
        {[
          { id: "cash", label: "จ่ายเงินสด", icon: Banknote },
          { id: "promptpay", label: "พร้อมเพย์ (สแกน QR)", icon: QrCode },
        ].map((m) => (
          <button
            key={m.id}
            onClick={() => { setMethod(m.id); setCollectOnDelivery(false); }}
            style={{
              background: method === m.id ? COLORS.peachSoft : "#FFFFFF",
              border: `1.5px solid ${method === m.id ? COLORS.caramel : COLORS.line}`,
            }}
            className="w-full rounded-xl px-4 py-3.5 flex items-center justify-between text-left"
          >
            <span className="flex items-center gap-2.5">
              <m.icon size={17} style={{ color: COLORS.caramelDark }} />
              <span style={{ color: COLORS.ink }} className="text-sm font-medium">{m.label}</span>
            </span>
            <div
              style={{
                border: `2px solid ${method === m.id ? COLORS.caramel : COLORS.line}`,
                background: method === m.id ? COLORS.caramel : "transparent",
              }}
              className="w-4 h-4 rounded-full flex items-center justify-center flex-shrink-0"
            >
              {method === m.id && <Check size={10} color="#fff" />}
            </div>
          </button>
        ))}
      </div>

      {isCash ? (
        <div style={{ background: COLORS.sageSoft, border: `1px dashed ${COLORS.sage}` }} className="rounded-xl px-4 py-3 mb-6 text-xs">
          <span style={{ color: COLORS.ink }}>
            เตรียมเงินสด ฿{fmtBaht(total)} ไว้จ่ายตอนพนักงานไปส่งของที่บ้านได้เลย ไม่ต้องจ่ายผ่านแอปตอนนี้
          </span>
        </div>
      ) : (
        <div className="mb-6">
          {/* โอนแล้วแต่ยังไม่อยากโอนตอนนี้ — ติ๊ก "เก็บปลายทาง" ได้ ไม่ต้องแนบสลิป */}
          <button
            type="button"
            onClick={() => setCollectOnDelivery(!collectOnDelivery)}
            className="w-full flex items-center justify-between rounded-xl px-3.5 py-3 mb-2"
            style={{ border: `1.5px solid ${collectOnDelivery ? COLORS.caramel : COLORS.line}`, background: collectOnDelivery ? COLORS.peachSoft : "#FFFFFF" }}
          >
            <span className="flex items-center gap-2.5">
              <span
                style={{ border: `2px solid ${collectOnDelivery ? COLORS.caramel : COLORS.line}`, background: collectOnDelivery ? COLORS.caramel : "transparent" }}
                className="w-4 h-4 rounded flex items-center justify-center flex-shrink-0"
              >
                {collectOnDelivery && <Check size={10} color="#fff" />}
              </span>
              <span style={{ color: COLORS.ink }} className="text-sm font-medium">เก็บปลายทาง (จ่ายตอนรับของ)</span>
            </span>
            <span style={{ color: collectOnDelivery ? COLORS.caramelDark : COLORS.inkSoft }} className="text-xs font-bold">
              {collectOnDelivery ? "ไม่ต้องแนบสลิป" : "ต้องแนบสลิป"}
            </span>
          </button>
          {collectOnDelivery && (
            <p style={{ background: COLORS.peachSoft, border: `1px dashed ${COLORS.caramel}` }} className="rounded-xl px-4 py-3 mb-3 text-xs">
              <span style={{ color: COLORS.caramelDark }} className="font-semibold flex items-center gap-1.5">
                <Banknote size={14} /> เก็บปลายทาง — เตรียมเงินสด ฿{fmtBaht(total)} ไว้จ่ายตอนรับของ พนักงานจะเก็บเงินให้ตอนส่ง
              </span>
            </p>
          )}
          {!collectOnDelivery && method === "promptpay" && (shopQr || PROMPTPAY_QR_URL) && (
            <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-xl p-4 mb-3 text-center">
              <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-3">สแกนจ่ายผ่านพร้อมเพย์</p>
              <img
                src={shopQr || PROMPTPAY_QR_URL}
                alt="QR พร้อมเพย์ของร้าน"
                className="w-48 h-48 mx-auto rounded-lg object-contain"
                style={{ border: `1px solid ${COLORS.line}` }}
              />
              <p style={{ color: COLORS.caramelDark }} className="text-sm font-bold mt-3">ยอดที่ต้องโอน ฿{fmtBaht(total)}</p>

              {/* เครื่องที่เปิดแอปสั่งของ กับเครื่องที่ใช้สแกนจ่าย มักเป็นเครื่องเดียวกัน (มือถือเครื่องเดียวสแกน QR บนจอตัวเองไม่ได้)
                  จึงให้ลูกค้าเซฟรูป QR นี้ไว้ก่อน แล้วค่อยเปิดแอปธนาคารไปเลือกรูปจากคลังภาพเพื่อสแกนจ่ายแทน */}
              <a
                href={shopQr || PROMPTPAY_QR_URL}
                download="promptpay-qr.jpg"
                style={{ border: `1.5px solid ${COLORS.caramel}`, color: COLORS.caramelDark }}
                className="w-full mt-3 rounded-xl px-4 py-2.5 text-xs font-semibold inline-flex items-center justify-center gap-1.5"
              >
                <UploadCloud size={14} style={{ transform: "rotate(180deg)" }} /> บันทึกรูป QR ลงเครื่อง
              </a>
              <p style={{ color: "#C0533F" }} className="text-[11px] font-semibold mt-2 leading-relaxed">
                กรุณาตรวจสอบยอดชำระให้ตรงกับที่สั่ง และตรวจชื่อก่อนโอนนะครับ
              </p>
            </div>
          )}
          {collectOnDelivery && (
            <p style={{ color: COLORS.inkSoft }} className="text-[11px] font-semibold mb-2">
              ไม่ต้องอัปโหลดสลิป — ระบบจะจดไว้ว่าออร์เดอร์นี้ยังไม่จ่าย และพนักงานจะเก็บเงินตอนส่งของให้
            </p>
          )}
          {!collectOnDelivery && (
          <div style={{ background: "#FFFFFF", border: `1.5px dashed ${COLORS.line}` }} className="rounded-xl p-4">
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">แนบสลิปการโอนเงิน</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-3">
              โอนผ่านแอปธนาคาร/พร้อมเพย์ ฿{fmtBaht(total)} แล้วอัปโหลดรูปสลิปที่นี่ พนักงานจะตรวจสอบสลิปให้อีกครั้งก่อนเริ่มทำออร์เดอร์
            </p>

            {!slipImg && !compressing && (
              <label
                style={{ border: `1.5px dashed ${COLORS.caramel}`, color: COLORS.caramelDark, background: COLORS.peachSoft }}
                className="w-full flex flex-col items-center justify-center gap-1.5 rounded-xl py-6 cursor-pointer text-xs font-semibold"
              >
                <UploadCloud size={22} />
                เลือกรูปสลิปจากเครื่อง
                <input type="file" accept="image/*" onChange={handleSlipUpload} className="hidden" />
              </label>
            )}

            {!slipImg && compressing && (
              <div
                style={{ border: `1.5px dashed ${COLORS.line}`, color: COLORS.inkSoft }}
                className="w-full flex flex-col items-center justify-center gap-1.5 rounded-xl py-6 text-xs font-semibold"
              >
                <Loader2 size={22} className="animate-spin" />
                กำลังเตรียมรูป...
              </div>
            )}

            {slipImg && (
              <div className="flex items-start gap-3">
                <button
                  onClick={() => setZoomedSlip(slipImg.dataUrl)}
                  className="relative flex-shrink-0"
                  style={{ border: `1px solid ${COLORS.line}`, borderRadius: 10 }}
                >
                  <img
                    src={slipImg.dataUrl}
                    alt="สลิปการโอนเงิน"
                    className="w-20 h-28 rounded-lg object-cover block"
                  />
                </button>
                <div className="flex-1 min-w-0">
                  <span style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-xs font-semibold px-2.5 py-1 rounded-full inline-flex items-center gap-1">
                    <Check size={12} /> แนบรูปแล้ว
                  </span>
                  <div className="flex items-center gap-3 mt-2">
                    <button onClick={() => setZoomedSlip(slipImg.dataUrl)} style={{ color: COLORS.caramelDark }} className="text-xs font-semibold underline underline-offset-2">
                      ดูรูปใหญ่
                    </button>
                    <button onClick={removeSlip} style={{ color: COLORS.inkSoft }} className="text-xs font-semibold underline underline-offset-2">
                      เปลี่ยนรูป
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
          )}
        </div>
      )}

      <ImageLightbox src={zoomedSlip} onClose={() => setZoomedSlip(null)} />

      <PrimaryButton full onClick={handleConfirm} disabled={paying || (!isCash && !slipImg && !collectOnDelivery)}>
        {paying
          ? "กำลังดำเนินการ..."
          : isCash
          ? "ยืนยันสั่งอาหาร"
          : collectOnDelivery
          ? "ยืนยันสั่งอาหาร (จ่ายตอนรับของ)"
          : `ยืนยันการโอน ฿${total}`}
      </PrimaryButton>
    </div>
  );
}

// ================= ORDER SUCCESS =================
// วาดภาพหลักฐานออร์เดอร์ (ใบยืนยัน) ลง canvas — ใช้ Canvas API ล้วน ๆ ไม่พึ่งไลบรารีเพิ่ม
// ให้ลูกค้าเซฟ/แชร์ไว้เป็นหลักฐานเวลามารับสินค้าหรือรับของที่บ้าน
function drawOrderReceipt(order, shopName) {
  const items = (order && order.items) || [];
  const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
  const discount = (order && order.discount && Number(order.discount.baht)) || 0;
  const total = Math.round(Math.max(0, subtotal - discount) * 100) / 100;
  const W = 640;
  const M = 28;

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = 10; // ความสูงจริงจะตั้งใหม่หลังคำนวณเนื้อหาเสร็จ (ด้านล่าง)
  const ctx = canvas.getContext("2d");

  const text = (str, x, y, size, weight, color, align = "left") => {
    ctx.font = `${weight || 500} ${size}px 'Itim', sans-serif`;
    ctx.fillStyle = color || "#3A2A1E";
    ctx.textAlign = align;
    ctx.fillText(str, x, y);
  };

  // ห่อบรรทัดข้อความยาว ๆ ตามความกว้างสูงสุด
  const wrap = (str, maxWidth, size) => {
    ctx.font = `500 ${size}px 'Itim', sans-serif`;
    const lines = [];
    let cur = "";
    for (const ch of String(str)) {
      if (ctx.measureText(cur + ch).width > maxWidth && cur) {
        lines.push(cur);
        cur = ch;
      } else {
        cur += ch;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  };

  // คำนวณความสูงใบให้พอดีกับเนื้อหาจริง (กันตัดท้ายใบเมื่อมีหลายรายการ/ท็อปปิ้ง/หมายเหตุ/ส่วนลด)
  let itemH = 0;
  items.forEach((i) => {
    itemH += 28;
    const nameLines = Math.min(2, wrap(`${i.name} × ${i.qty}`, W - M - 150, 16).length);
    itemH += (nameLines - 1) * 24;
    itemH += 22 * ((i.addOns && i.addOns.length) || 0);
    if (i.note && i.note.trim()) itemH += 30;
  });
  // แถวข้อมูลลูกค้า: นับตามข้อมูลจริง (ชื่อ + เบอร์โทร + วิธีรับ + ชำระเงิน [+ เวลาจัดส่ง ถ้ามีวันเวลาหรือส่งตอนนี้])
  const infoRows =
    (order.customerName ? 1 : 0) +
    (order.phone ? 1 : 0) +
    2 + // การรับสินค้า + ชำระเงิน
    (order.method === "delivery" && ((order.deliveryDate && order.deliveryTime) || order.deliveryNow) ? 1 : 0);
  // ชื่อร้าน — ลดขนาดอัตโนมัติถ้ายาวเกิน (กันล้นขอบใบ) ยาวมากจริง ๆ ห่อเป็น 2 บรรทัดแล้วเลื่อนส่วนหัวลง
  const shopNameText = shopName || "น้ำหวาน & เบเกอรี่";
  const nameMaxW = W - 2 * M - 16;
  let nameSize = 34;
  ctx.font = `700 ${nameSize}px 'Itim', sans-serif`;
  while (nameSize > 18 && ctx.measureText(shopNameText).width > nameMaxW) nameSize -= 3;
  const nameLines =
    ctx.measureText(shopNameText).width > nameMaxW ? wrap(shopNameText, nameMaxW, 18).slice(0, 2) : [shopNameText];
  const headerShift = (nameLines.length - 1) * 26; // ระยะเลื่อนส่วนหัวลง (เฉพาะเมื่อห่อ 2 บรรทัด)
  // 214 (เริ่มข้อมูล) + แถวข้อมูล + ช่องว่าง + หัวตาราง + รายการ + เส้นคั่น + ส่วนลด + ยอดรวม + ท้ายใบ 2 บรรทัด + ขอบล่าง
  const H = 214 + headerShift + infoRows * 27 + 16 + 40 + itemH + 42 + (discount > 0 ? 24 : 0) + 44 + 70;
  canvas.height = H; // ตั้งความสูงจริง (ล้าง canvas แล้ววาดทับด้วยความสูงที่พอดี)

  // พื้นหลังครีม
  ctx.fillStyle = "#FBF3E7";
  ctx.fillRect(0, 0, W, H);

  // ส่วนหัวร้าน + เลขออร์เดอร์ (ชื่อร้านยาว -> ลดขนาด/ห่อบรรทัด + เลื่อนส่วนหัวลง)
  nameLines.forEach((ln, i) =>
    text(ln, W / 2, 62 - headerShift / 2 + i * 26, i > 0 ? 18 : nameSize, 700, "#B5652E", "center")
  );
  text("หลักฐานยืนยันออร์เดอร์", W / 2, 92 + headerShift, 16, 500, "#6B5642", "center");
  text(`ออร์เดอร์ #${order.orderNo}`, W / 2, 142 + headerShift, 40, 700, "#3A2A1E", "center");

  ctx.strokeStyle = "#E4D3B8";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(M, 168 + headerShift);
  ctx.lineTo(W - M, 168 + headerShift);
  ctx.stroke();
  ctx.setLineDash([]);

  let y = 214 + headerShift;

  // ข้อมูลลูกค้า / วิธีรับสินค้า
  const info = [];
  if (order.customerName) info.push(["ชื่อลูกค้า", order.customerName]);
  if (order.phone) info.push(["โทรติดต่อ", order.phone]);
  if (order.method === "pickup") {
    info.push(["การรับสินค้า", "รับที่ร้าน"]);
  } else {
    info.push(["การรับสินค้า", `จัดส่ง${order.houseNo ? " · บ้านเลขที่ " + order.houseNo : ""}`]);
    if (order.deliveryDate && order.deliveryTime) {
      info.push(["เวลาจัดส่ง", `${formatDeliveryDateLabel(order.deliveryDate)} ${order.deliveryTime} น.`]);
    } else if (order.deliveryNow) {
      info.push(["เวลาจัดส่ง", "ส่งตอนนี้ (เร็วที่สุด)"]);
    }
  }
  info.push(["ชำระเงิน", orderIsPaid(order) ? "ชำระแล้ว" : orderCollectsOnDelivery(order) ? "ยังไม่จ่าย — เก็บปลายทาง" : "พร้อมเพย์/โอน"]);

  info.forEach(([k, v]) => {
    text(k, M, y, 14, 600, "#6B5642");
    text(v, W - M, y, 14, 500, "#3A2A1E", "right");
    y += 27;
  });

  y += 16;

  // หัวตารางรายการ
  text("รายการ", M, y, 16, 700, "#3A2A1E");
  text("รวม", W - M, y, 16, 700, "#3A2A1E", "right");
  y += 12;
  ctx.strokeStyle = "#E4D3B8";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(M, y);
  ctx.lineTo(W - M, y);
  ctx.stroke();
  y += 28;

  items.forEach((i) => {
    const itemTotal = i.price * i.qty;
    text(`฿${itemTotal}`, W - M, y, 16, 600, "#3A2A1E", "right");
    // ชื่อเมนู + จำนวน — ถ้ายาวให้ขึ้นบรรทัดใหม่ (สูงสุด 2 บรรทัด)
    const lines = wrap(`${i.name} × ${i.qty}`, W - M - 150, 16).slice(0, 2);
    lines.forEach((ln, idx) => {
      text(idx === 1 ? ln + "…" : ln, M, y + idx * 24, 16, 500, "#3A2A1E");
    });
    y += 28 + (lines.length - 1) * 24;
    if (i.addOns && i.addOns.length) {
      i.addOns.forEach((a) => {
        text(`+ ${a.name}`, M + 18, y, 14, 400, "#8A4A1F");
        text(`฿${a.price || 0}`, W - M, y, 14, 400, "#8A4A1F", "right");
        y += 22;
      });
    }
    if (i.note && i.note.trim()) {
      text(`หมายเหตุ: ${i.note.trim()}`, M + 18, y, 13, 400, "#B5652E");
      y += 30;
    }
  });

  y += 10;
  ctx.strokeStyle = "#E4D3B8";
  ctx.beginPath();
  ctx.moveTo(M, y);
  ctx.lineTo(W - M, y);
  ctx.stroke();
  y += 32;

  if (discount > 0) {
    const discountLabel = (order && order.discount && order.discount.label) || "ส่วนลดโค้ด";
    text(discountLabel, M, y, 14, 500, "#6B5642");
    text(`-฿${discount}`, W - M, y, 14, 600, "#6B5642", "right");
    y += 24;
  }

  text("ยอดรวม", M, y, 20, 700, "#3A2A1E");
  text(`฿${total}`, W - M, y, 22, 700, "#B5652E", "right");
  y += 44;

  // ท้ายใบ
  text("นำภาพนี้แสดงที่ร้านเมื่อมารับสินค้า / รับของ", W / 2, y, 15, 600, "#6B5642", "center");
  text(new Date(order.createdAt).toLocaleString("th-TH"), W / 2, y + 30, 13, 400, "#6B5642", "center");

  return canvas;
}


function OrderSuccessView({ orderNo, customer, onNewOrder, paymentMethod, order, shopName }) {
  const [receiptState, setReceiptState] = useState(""); // "" | "saving" | "error"
  const [receiptImg, setReceiptImg] = useState(null); // dataUrl ภาพหลักฐานที่สร้างแล้ว — เปิดหน้าต่างให้เลือกบันทึก/แชร์
  const [savedNow, setSavedNow] = useState(false); // เพิ่งกดบันทึกลงเครื่อง

  const receiptFileName = `หลักฐานออร์เดอร์-${order.orderNo}.png`;

  // สร้างภาพหลักฐาน แล้วเปิดหน้าต่างให้ลูกค้าเลือกเอง: บันทึกลงเครื่องตรง ๆ หรือแชร์
  // (ไม่บังคับเปิดช่องแชร์อีกแล้ว — บนมือถือกดค้างที่รูปก็เซฟลงเครื่องได้)
  const saveReceipt = async () => {
    if (!order || receiptState === "saving") return;
    setReceiptState("saving");
    try {
      const canvas = drawOrderReceipt(order, shopName);
      setReceiptImg(canvas.toDataURL("image/png"));
      setSavedNow(false);
    } catch (err) {
      console.error("Failed to create receipt image:", err);
      setReceiptState("error");
    } finally {
      setReceiptState("");
    }
  };

  // ดาวน์โหลดไฟล์ลงเครื่องตรง ๆ (คอม + Android ใช้ได้ / iPhone กดค้างที่รูปแทน)
  const downloadReceipt = () => {
    if (!receiptImg) return;
    const a = document.createElement("a");
    a.href = receiptImg;
    a.download = receiptFileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setSavedNow(true);
  };

  // แชร์ผ่านแอปอื่น (LINE/เมล/ฯลฯ) — ทางเลือกเสริม ไม่ใช่ทางบังคับ
  const shareReceipt = async () => {
    if (!receiptImg) return;
    try {
      const blob = await (await fetch(receiptImg)).blob();
      const file = new File([blob], receiptFileName, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: `หลักฐานออร์เดอร์ #${order.orderNo}`, text: `ออร์เดอร์ #${order.orderNo}${customer?.name ? " · " + customer.name : ""}` });
        } catch (e) {
          // ผู้ใช้ยกเลิกช่องแชร์ — ปล่อยผ่าน ไม่ต้องทำอะไร
        }
      } else {
        downloadReceipt(); // แชร์ไฟล์ไม่ได้ → บันทึกลงเครื่องแทน
      }
    } catch (e) {
      downloadReceipt();
    }
  };

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-6 pt-16 flex flex-col items-center text-center">
      <div style={{ background: COLORS.sageSoft }} className="w-20 h-20 rounded-full flex items-center justify-center mb-5">
        <Check size={36} color={COLORS.sage} strokeWidth={3} />
      </div>
      <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold mb-2">
        สั่งสำเร็จแล้ว!
      </h1>
      <p style={{ color: COLORS.inkSoft }} className="text-sm mb-1">
        ออร์เดอร์ #{orderNo} ของคุณ{customer?.name}{customer?.houseNo ? ` (บ้านเลขที่ ${customer.houseNo})` : ""} ถูกบันทึกแล้ว
      </p>
      {customer?.method === "pickup" ? (
        <p style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-xs font-semibold rounded-full px-3.5 py-1.5 mb-3 inline-flex items-center gap-1.5">
          <ChefHat size={13} /> รับที่ร้าน
        </p>
      ) : customer?.deliveryDate && customer?.deliveryTime ? (
        <p style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="text-xs font-semibold rounded-full px-3.5 py-1.5 mb-3 inline-flex items-center gap-1.5">
          <Truck size={13} /> จัดส่ง {formatDeliveryDateLabel(customer.deliveryDate)} เวลา {customer.deliveryTime} น.
        </p>
      ) : customer?.deliveryNow ? (
        <p style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="text-xs font-semibold rounded-full px-3.5 py-1.5 mb-3 inline-flex items-center gap-1.5">
          <Truck size={13} /> จัดส่งตอนนี้ — ร้านจะจัดส่งให้เร็วที่สุดเมื่อออร์เดอร์เสร็จ
        </p>
      ) : null}
      {(paymentMethod === "cash" || order?.collectOnDelivery) && (
        <p style={{ color: COLORS.caramelDark }} className="text-xs font-semibold mb-5">
          อย่าลืมเตรียมเงิน{customer?.method === "pickup" ? "มารับของ" : "จ่ายพนักงานตอนไปส่งของ"}นะครับ
        </p>
      )}

      <button
        onClick={saveReceipt}
        disabled={receiptState === "saving"}
        style={{ background: COLORS.caramel, color: "#FFF9F0" }}
        className="w-full max-w-xs rounded-2xl px-5 py-3.5 text-sm font-semibold inline-flex items-center justify-center gap-2 disabled:opacity-60 active:scale-[0.98] transition-transform mt-1"
      >
        {receiptState === "saving" ? <Loader2 size={18} className="animate-spin" /> : <DownloadIcon size={18} />}
        {receiptState === "saving" ? "กำลังสร้างภาพ..." : "บันทึกหลักฐานการสั่ง (ภาพ)"}
      </button>
      {receiptState === "error" && (
        <p style={{ color: "#C0533F" }} className="text-xs font-semibold mt-2">
          สร้างภาพไม่สำเร็จ ลองอีกครั้งนะครับ
        </p>
      )}

      <button onClick={onNewOrder} style={{ color: COLORS.caramelDark }} className="text-sm font-semibold underline underline-offset-4 mt-4">
        สั่งเพิ่มอีก
      </button>

      {receiptImg && (
        <div
          style={{ position: "fixed", inset: 0, background: "rgba(38, 28, 20, 0.85)", zIndex: 9999 }}
          className="flex flex-col items-center justify-center p-5"
          onClick={() => setReceiptImg(null)}
        >
          <SheetLock />
          <div className="w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
            <div style={{ background: "#FFFFFF", borderRadius: 20, padding: 14 }} className="max-h-[62vh] overflow-auto">
              <img src={receiptImg} alt="หลักฐานออร์เดอร์" style={{ width: "100%", borderRadius: 10, display: "block" }} />
            </div>
            <p style={{ color: "#FFF3E6" }} className="text-xs text-center mt-3 leading-relaxed">
              บนมือถือ: <b>กดค้างที่รูป</b> แล้วเลือก "บันทึกรูป" เพื่อเซฟลงเครื่องได้เลย
            </p>
            <div className="flex gap-2 mt-3">
              <button
                onClick={downloadReceipt}
                style={{ background: COLORS.caramel, color: "#FFF9F0", flex: 1 }}
                className="rounded-xl px-4 py-3 text-sm font-semibold inline-flex items-center justify-center gap-1.5 active:scale-95 transition-transform"
              >
                <DownloadIcon size={16} /> บันทึกลงเครื่อง
              </button>
              <button
                onClick={shareReceipt}
                style={{ background: "#FFFFFF", color: COLORS.caramelDark, flex: 1 }}
                className="rounded-xl px-4 py-3 text-sm font-semibold inline-flex items-center justify-center gap-1.5 active:scale-95 transition-transform"
              >
                <ShareIcon size={16} /> แชร์
              </button>
            </div>
            {savedNow && (
              <p style={{ color: "#B8E0C0" }} className="text-xs font-semibold text-center mt-2.5">
                กำลังดาวน์โหลด — เช็คโฟลเดอร์ดาวน์โหลด/รูปภาพในเครื่องได้เลย
              </p>
            )}
            <button
              onClick={() => setReceiptImg(null)}
              style={{ color: "#FFF3E6" }}
              className="w-full text-xs font-semibold underline underline-offset-4 mt-3"
            >
              ปิด
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= MENU MANAGER (staff) =================
function MenuManagerView({ menu, setMenu, menuLoaded, menuSaveError, shopInfo, onSaveShopInfo, stockItems, categories, updateCategories, promos }) {
  const [editing, setEditing] = useState(null); // item being edited, or "new"
  const [form, setForm] = useState({ name: "", desc: "", price: "", category: "drink", img: "", addOns: [], cost: "", recipe: {} });
  const [newOptionName, setNewOptionName] = useState({}); // groupId -> ชื่อตัวเลือกที่กำลังพิมพ์
  const [newOptionPrice, setNewOptionPrice] = useState({}); // groupId -> ราคาที่กำลังพิมพ์
  const [newOptionCost, setNewOptionCost] = useState({}); // groupId -> ต้นทุนตัวเลือกที่กำลังพิมพ์

  // ---- ตั้งค่าร้าน: ชื่อร้าน + คำขวัญ + โค้ด QR (พร้อมเพย์) + เวลาเปิด-ปิดร้าน/จัดส่ง ----
  const [shopNameInput, setShopNameInput] = useState("");
  const [shopSloganInput, setShopSloganInput] = useState("");
  const [shopQrInput, setShopQrInput] = useState("");
  const [openTimeInput, setOpenTimeInput] = useState("09:00");
  const [closeTimeInput, setCloseTimeInput] = useState("20:00");
  const [deliveryOpenInput, setDeliveryOpenInput] = useState("09:00");
  const [deliveryCloseInput, setDeliveryCloseInput] = useState("20:00");
  const [shopSavedFlash, setShopSavedFlash] = useState(false); // แสดง "บันทึกแล้ว" ชั่วคราว
  const [qrCompressInfo, setQrCompressInfo] = useState(null); // { before, after } — ขนาดไฟล์ก่อน/หลังบีบอัด
  const [qrVerify, setQrVerify] = useState(null); // { ok, data } — ผลตรวจว่า QR ยังอ่านได้ไหม (null = ยังไม่ตรวจ)
  const qrInputRef = useRef(null);
  // ---- จัดการหมวดเมนู: เพิ่ม/ลบหมวด + สถานะยืนยันการลบ (กด 2 ครั้ง) ----
  const [newCatName, setNewCatName] = useState("");
  const [confirmDelCat, setConfirmDelCat] = useState(null);
  const [editingCat, setEditingCat] = useState(null); // หมวดที่กำลังแก้ไข (เปิดฟอร์มย่อย)
  const [catEditName, setCatEditName] = useState(""); // ชื่อหมวดในฟอร์มแก้ไข
  const [confirmDelMenu, setConfirmDelMenu] = useState(false); // ยืนยันลบเมนูจากฟอร์ม (กด 2 ครั้ง)
  const [confirmDelOption, setConfirmDelOption] = useState(null); // id ตัวเลือกเพิ่มที่รอกดยืนยันซ้ำ (เฉพาะตัวที่มีโปรผูกอยู่)
  const [confirmDelGroup, setConfirmDelGroup] = useState(null); // id กลุ่มตัวเลือกเพิ่มที่รอกดยืนยันซ้ำ (เฉพาะกลุ่มที่มีตัวเลือกผูกโปรอยู่)
  // ---- ลากวาง (HTML5 drag & drop): สลับตำแหน่งเมนู / ย้ายข้ามหมวด / เรียงลำดับหมวด ----
  const [dragItem, setDragItem] = useState(null); // { id, cat } รายการเมนูที่กำลังลาก
  const [overItem, setOverItem] = useState(null); // { id, cat } จุดที่กำลังจะปล่อย (ไฮไลต์)
  const [dragCat, setDragCat] = useState(null); // id หมวดที่กำลังลาก
  const [overCat, setOverCat] = useState(null); // id หมวดที่กำลังจะปล่อย (ไฮไลต์)
  // ---- ลากวางกลุ่ม/ตัวเลือกเพิ่ม (ในฟอร์มแก้ไขเมนู) — แพทเทิร์นเดียวกับลากเมนู/หมวดข้างบน ----
  const [dragGroup, setDragGroup] = useState(null); // id กลุ่มตัวเลือกเพิ่มที่กำลังลาก
  const [overGroup, setOverGroup] = useState(null); // id กลุ่มที่กำลังจะปล่อย (ไฮไลต์)
  const [dragOption, setDragOption] = useState(null); // { id, gid } ตัวเลือกย่อยที่กำลังลาก
  const [overOption, setOverOption] = useState(null); // { id, gid } ตัวเลือกย่อยที่กำลังจะปล่อย (ไฮไลต์)

  // ซิงก์ค่าจากข้อมูลร้าน (ตอนโหลดหน้า / เมื่อพนักงานเครื่องอื่นแก้แล้วทุกเครื่องเห็น)
  useEffect(() => {
    setShopNameInput((shopInfo && shopInfo.name) || "");
    setShopSloganInput((shopInfo && shopInfo.slogan) || "");
    setShopQrInput((shopInfo && shopInfo.qr) || "");
    setOpenTimeInput((shopInfo && shopInfo.openTime) || "09:00");
    setCloseTimeInput((shopInfo && shopInfo.closeTime) || "20:00");
    setDeliveryOpenInput((shopInfo && shopInfo.deliveryOpenTime) || "09:00");
    setDeliveryCloseInput((shopInfo && shopInfo.deliveryCloseTime) || "20:00");
  }, [shopInfo]);

  const handleQrUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setQrVerify(null);
    setQrCompressInfo(null);
    try {
      // บีบอัดเป็น PNG (lossless — QR ต้องขอบคม สแกนได้เหมือนเดิม) + ย่อขนาดอัตโนมัติ
      const before = file.size;
      const { dataUrl, blob } = await compressQrImage(file, 1200);
      let finalDataUrl = dataUrl;
      let after = blob.size;
      let kept = false;
      // ถ้า PNG ใหญ่กว่าไฟล์เดิม (เช่นไฟล์เดิมเล็กอยู่แล้ว ~<150KB) ใช้ไฟล์เดิมแทน กันขนาดบวม
      if (blob.size >= before) {
        finalDataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
        after = before;
        kept = true;
      }
      setShopQrInput(finalDataUrl);
      setQrCompressInfo({ before, after, kept });
      // ตรวจอัตโนมัติทันทีว่า QR (ตัวที่เลือกใช้จริง) ยังถอด/สแกนได้ไหม
      const r = await decodeQrFromImage(finalDataUrl);
      setQrVerify(r);
    } catch (err) {
      console.error("Compress QR failed, using original file:", err);
      const reader = new FileReader();
      reader.onload = async () => {
        setShopQrInput(reader.result);
        const r = await decodeQrFromImage(reader.result);
        setQrVerify(r);
      };
      reader.readAsDataURL(file);
    }
  };

  // กดปุ่ม "ตรวจสอบว่า QR สแกนได้ไหม" — ถอด QR จากรูปปัจจุบันอีกครั้ง
  const verifyQrAgain = async () => {
    setQrVerify(null);
    const r = await decodeQrFromImage(shopQrInput);
    setQrVerify(r);
  };

  const saveShopSettings = () => {
    onSaveShopInfo({
      name: shopNameInput,
      slogan: shopSloganInput,
      qr: shopQrInput,
      openTime: clampTimeInput(openTimeInput, "09:00"),
      closeTime: clampTimeInput(closeTimeInput, "20:00"),
      deliveryOpenTime: clampTimeInput(deliveryOpenInput, "09:00"),
      deliveryCloseTime: clampTimeInput(deliveryCloseInput, "20:00"),
    });
    setShopSavedFlash(true);
    setTimeout(() => setShopSavedFlash(false), 2000);
  };

  // เพิ่มหมวดเมนูใหม่ — ลูกค้าจะเห็นเป็นแท็บหมวดบนหน้าสั่งทันที
  const addCategory = () => {
    const label = newCatName.trim();
    if (!label) return;
    const id = `cat${Date.now().toString(36)}`;
    updateCategories([...(categories || DEFAULT_CATEGORIES), { id, label }]);
    setNewCatName("");
  };

  // ลบหมวด — กด 2 ครั้งเพื่อยืนยัน (กันลบพลาด) เมนูที่อยู่ในหมวดจะย้ายไปหมวดแรกที่เหลือ
  const deleteCategory = (id) => {
    const remaining = (categories || DEFAULT_CATEGORIES).filter((c) => c.id !== id);
    if (remaining.length === 0) return;
    if (confirmDelCat !== id) {
      setConfirmDelCat(id);
      setTimeout(() => setConfirmDelCat((v) => (v === id ? null : v)), 3500);
      return;
    }
    const firstId = remaining[0].id;
    updateCategories(remaining);
    setMenu((prev) => prev.map((m) => (m.category === id ? { ...m, category: firstId } : m)));
    if (form.category === id) setForm((f) => ({ ...f, category: firstId }));
    setConfirmDelCat(null);
  };

  // เปิดฟอร์มแก้ไขหมวด (แตะที่แถวหมวด) — เปลี่ยนชื่อ + ปุ่มลบหมวดอยู่ที่นี่
  const openCatEdit = (c) => {
    setConfirmDelCat(null);
    setEditingCat(c);
    setCatEditName(c.label);
  };

  const saveCategory = () => {
    const label = catEditName.trim();
    if (!editingCat || !label) return;
    updateCategories((prev) => (prev && prev.length ? prev : DEFAULT_CATEGORIES).map((c) => (c.id === editingCat.id ? { ...c, label } : c)));
    setEditingCat(null);
  };

  const deleteCatFromForm = () => {
    if (!editingCat) return;
    if (confirmDelCat !== editingCat.id) {
      setConfirmDelCat(editingCat.id);
      setTimeout(() => setConfirmDelCat((v) => (v === editingCat.id ? null : v)), 3500);
      return;
    }
    deleteCategory(editingCat.id);
    setEditingCat(null);
  };

  // สร้างภาพลาก (drag image) ให้เป็นกล่องเล็ก ๆ ตามชื่อเมนู/หมวด — กันเบราว์เซอร์แสดงภาพลากเป็นกล่องขาว/ใหญ่เกิน
  // (ตอนนี้ลากได้ทั้งการ์ด ไม่ใช่แค่ที่จับ ☰ — ต้องตั้ง drag image เองทุกครั้ง)
  const makeDragImage = (label) => {
    const el = document.createElement("div");
    el.textContent = label;
    Object.assign(el.style, {
      position: "fixed",
      left: "-9999px",
      top: 0,
      background: COLORS.ink,
      color: "#FFF9F0",
      padding: "8px 14px",
      borderRadius: "10px",
      fontSize: "13px",
      fontWeight: 600,
      fontFamily: "'Itim', sans-serif",
      whiteSpace: "nowrap",
      maxWidth: "60vw",
      overflow: "hidden",
      textOverflow: "ellipsis",
      boxShadow: "0 6px 18px rgba(0,0,0,0.25)",
    });
    document.body.appendChild(el);
    requestAnimationFrame(() => el.remove());
    return el;
  };

  // ปล่อยเมนูลงบนการ์ดอื่น — หมวดเดียวกัน = สลับตำแหน่ง / หมวดต่างกัน = ย้ายไปหมวดนั้น (วางต่อท้ายตัวที่ปล่อยลงบน)
  const dropItem = (src, dst) => {
    if (!src || !dst || src.id === dst.id) return;
    setMenu((prev) => {
      const s = prev.findIndex((m) => m.id === src.id);
      const d = prev.findIndex((m) => m.id === dst.id);
      if (s < 0 || d < 0) return prev;
      const moved = { ...prev[s], category: dst.cat };
      const rest = prev.filter((m) => m.id !== src.id);
      const dstIdx = rest.findIndex((m) => m.id === dst.id);
      if (dstIdx < 0) return prev;
      const next = [...rest];
      // หมวดเดียวกัน: ลากลง (s<d) วางต่อท้ายตัวเป้าหมาย / ลากขึ้น (s>d) วางแทนที่ — ได้ผลลัพธ์แบบสลับตำแหน่ง
      // หมวดต่างกัน: ย้ายไปวางต่อท้ายตัวเป้าหมาย (อยู่ในบล็อกหมวดใหม่)
      const insertAt = src.cat === dst.cat ? dstIdx + (s < d ? 1 : 0) : dstIdx + 1;
      next.splice(insertAt, 0, moved);
      return next;
    });
  };

  // ปล่อยหมวดลงบนแถวหมวดอื่น — เรียงลำดับหมวดใหม่ (ลูกค้าเห็นแท็บหมวดตามลำดับนี้)
  const reorderCategory = (srcId, targetId) => {
    if (!srcId || srcId === targetId) return;
    updateCategories((prev) => {
      const list = prev && prev.length ? prev : DEFAULT_CATEGORIES;
      const from = list.findIndex((c) => c.id === srcId);
      const to = list.findIndex((c) => c.id === targetId);
      if (from < 0 || to < 0) return prev;
      const next = [...list];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };
  const dropCategory = (targetId) => reorderCategory(dragCat, targetId);

  // ปุ่มย้ายหมวดขึ้น/ลง (สำรองสำหรับจอสัมผัสที่ลากไม่ถนัด)
  const moveCategory = (id, dir) => {
    updateCategories((prev) => {
      const list = prev && prev.length ? prev : DEFAULT_CATEGORIES;
      const idx = list.findIndex((c) => c.id === id);
      const j = idx + dir;
      if (idx < 0 || j < 0 || j >= list.length) return prev;
      const next = [...list];
      const t = next[idx];
      next[idx] = next[j];
      next[j] = t;
      return next;
    });
  };

  // ---- ลากวางด้วยนิ้ว (จอสัมผัส) — HTML5 drag & drop ใช้กับเมาส์เท่านั้น เลยจำลอง touch drag เอง ----
  // หลักการ: นิ้วแตะที่จับ ☰ → สร้างกล่อง ghost ตามนิ้ว → นิ้วชี้ที่การ์ดไหน (elementFromPoint) ให้ไฮไลต์ → ปล่อยนิ้ว = drop เหมือนลากเมาส์
  const touchDragRef = useRef(null); // { kind:'item'|'cat', id, cat, ghost, startX, startY, moved, lastX, lastY, raf }
  const pendingTouchRef = useRef(null); // { timer, kind, id, cat, label, x, y } — กดค้างรอเริ่มลาก (long-press)
  const lastTouchDragEndRef = useRef(0); // เวลาที่ลากด้วยนิ้ว/เมาส์เพิ่งจบ — กันการคลิกหลังลากไปเปิดแก้ไข

  const startTouchDrag = (t, kind, id, cat, label) => {
    if (!t) return;
    const ghost = document.createElement("div");
    ghost.textContent = label;
    Object.assign(ghost.style, {
      position: "fixed",
      left: "0px",
      top: "0px",
      transform: `translate3d(${t.clientX + 12}px, ${t.clientY + 12}px, 0)`,
      willChange: "transform", // บอกเบราว์เซอร์ให้เรนเดอร์ ghost บน GPU — ลื่นกว่า left/top
      background: COLORS.ink,
      color: "#FFF9F0",
      padding: "8px 14px",
      borderRadius: "10px",
      fontSize: "13px",
      fontWeight: 600,
      zIndex: 9999,
      pointerEvents: "none",
      boxShadow: "0 6px 18px rgba(0,0,0,0.25)",
      fontFamily: "'Itim', sans-serif",
      whiteSpace: "nowrap",
      maxWidth: "70vw",
      overflow: "hidden",
      textOverflow: "ellipsis",
    });
    document.body.appendChild(ghost);
    touchDragRef.current = { kind, id, cat, ghost, startX: t.clientX, startY: t.clientY, moved: false, lastX: t.clientX, lastY: t.clientY, raf: 0 };
  };

  const moveTouchDrag = (e) => {
    const d = touchDragRef.current;
    const t = e.touches && e.touches[0];
    if (!d || !t) return;
    const dx = t.clientX - d.startX;
    const dy = t.clientY - d.startY;
    if (!d.moved && Math.abs(dx) + Math.abs(dy) < 8) return; // แค่แตะ ยังไม่เริ่มลาก
    if (!d.moved) {
      d.moved = true;
      if (d.kind === "item") setDragItem({ id: d.id, cat: d.cat });
      else if (d.kind === "option") setDragOption({ id: d.id, gid: d.cat });
      else if (d.kind === "group") setDragGroup(d.id);
      else setDragCat(d.id);
    }
    d.lastX = t.clientX;
    d.lastY = t.clientY;
    // ลูป rAF เดียวทำทั้งเลื่อน ghost + เลื่อนหน้าอัตโนมัติ + หาเป้าหมาย — ลื่นและประหยัดกว่าเลื่อนทีละเหตุการณ์
    if (!d.raf) {
      const tick = () => {
        const dd = touchDragRef.current;
        if (!dd || !dd.moved) { dd && (dd.raf = 0); return; }
        // ghost ตามนิ้ว (transform — GPU)
        dd.ghost.style.transform = `translate3d(${dd.lastX + 12}px, ${dd.lastY + 12}px, 0)`;
        // เลื่อนอัตโนมัติ — ยิ่งนิ้วใกล้ขอบจอ ยิ่งเลื่อนเร็ว (0 → 16px/เฟรม ค่อย ๆ ปรับตามระยะ)
        const edge = 90;
        let speed = 0;
        if (dd.lastY < edge) speed = -((edge - dd.lastY) / edge) * 16;
        else if (dd.lastY > window.innerHeight - edge) speed = ((dd.lastY - (window.innerHeight - edge)) / edge) * 16;
        if (speed) window.scrollBy(0, speed);
        // หาการ์ด/แถวที่นิ้วชี้ → ไฮไลต์ (อัปเดตเฉพาะตอนเปลี่ยน — กัน re-render ซ้ำทุกเฟรม)
        const under = document.elementFromPoint(dd.lastX, dd.lastY);
        if (dd.kind === "item") {
          const card = under && under.closest("[data-item-id]");
          const nid = card ? card.dataset.itemId : null;
          setOverItem((prev) => (prev && prev.id === nid ? prev : nid ? { id: nid, cat: card.dataset.cat } : null));
        } else if (dd.kind === "option") {
          const row = under && under.closest("[data-option-id]");
          const nid = row ? row.dataset.optionId : null;
          setOverOption((prev) => (prev && prev.id === nid ? prev : nid ? { id: nid, gid: row.dataset.groupId } : null));
        } else if (dd.kind === "group") {
          const row = under && under.closest("[data-group-id]");
          const nid = row ? row.dataset.groupId : null;
          setOverGroup((prev) => (prev === nid ? prev : nid));
        } else {
          const row = under && under.closest("[data-cat-id]");
          const nid = row ? row.dataset.catId : null;
          setOverCat((prev) => (prev === nid ? prev : nid));
        }
        dd.raf = requestAnimationFrame(tick);
      };
      d.raf = requestAnimationFrame(tick);
    }
  };

  const endTouchDrag = (e) => {
    const d = touchDragRef.current;
    const t = e.changedTouches && e.changedTouches[0];
    if (d) {
      if (d.raf) cancelAnimationFrame(d.raf);
      if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
      lastTouchDragEndRef.current = Date.now(); // เพิ่งลากเสร็จ — คลิกถัดไป (ถ้ามี) ไม่ควรเปิดแก้ไข
    }
    if (d && d.moved && t) {
      const under = document.elementFromPoint(t.clientX, t.clientY);
      if (d.kind === "item") {
        const card = under && under.closest("[data-item-id]");
        if (card) dropItem({ id: d.id, cat: d.cat }, { id: card.dataset.itemId, cat: card.dataset.cat });
      } else if (d.kind === "option") {
        const row = under && under.closest("[data-option-id]");
        if (row) dropOption({ id: d.id, gid: d.cat }, { id: row.dataset.optionId, gid: row.dataset.groupId });
      } else if (d.kind === "group") {
        const row = under && under.closest("[data-group-id]");
        if (row) reorderGroup(d.id, row.dataset.groupId);
      } else {
        const row = under && under.closest("[data-cat-id]");
        if (row) reorderCategory(d.id, row.dataset.catId);
      }
    }
    touchDragRef.current = null;
    setDragItem(null);
    setOverItem(null);
    setDragCat(null);
    setOverCat(null);
    setDragGroup(null);
    setOverGroup(null);
    setDragOption(null);
    setOverOption(null);
  };
  const cancelTouchDrag = () => {
    const d = touchDragRef.current;
    if (d) {
      if (d.raf) cancelAnimationFrame(d.raf);
      if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    }
    touchDragRef.current = null;
    setDragItem(null);
    setOverItem(null);
    setDragCat(null);
    setOverCat(null);
    setDragGroup(null);
    setOverGroup(null);
    setDragOption(null);
    setOverOption(null);
  };

  // ต่อ touch drag ผ่าน native listener (React รับ touchstart/touchmove เป็น passive ที่ root —
  // ป้องกัน scroll ไม่ได้และบางสภาพแวดล้อมไม่ยิง เลยใช้ native แทน แล้วอ่านข้อมูลจาก data-* ของที่จับ)
  useEffect(() => {
    const onStart = (e) => {
      const t = e.touches && e.touches[0];
      if (!t) return;
      const closest = (sel) => (e.target && e.target.closest ? e.target.closest(sel) : null);
      // ที่จับ ☰ — เริ่มลากได้ทันที (ตัว grip ตั้ง touchAction:none กันหน้าเลื่อนอยู่แล้ว)
      const grip = closest("[data-touch-grip]");
      if (grip) {
        e.preventDefault(); // กันนิ้วลากแล้วหน้าเลื่อน/ซูม
        startTouchDrag(t, grip.dataset.touchKind, grip.dataset.touchId, grip.dataset.touchCat, grip.dataset.touchLabel);
        return;
      }
      // แตะบนการ์ดเมนู/แถวหมวด/แถวกลุ่มตัวเลือก/แถวตัวเลือกย่อยโดยตรง (ไม่ใช่ปุ่ม/อินพุต) → กดค้าง 300ms แล้วค่อยเริ่มลาก
      // (ต้องกดค้างก่อน ไม่งั้นนิ้วที่เลื่อนหน้าปกติจะโดนแย่งไปลากการ์ดตลอด)
      if (pendingTouchRef.current) { clearTimeout(pendingTouchRef.current.timer); pendingTouchRef.current = null; }
      const interactive = closest("button, input, select, textarea, a, label");
      if (interactive) return;
      // ตัวเลือกย่อยซ้อนอยู่ใน div ของกลุ่ม เลยต้องเช็คตัวเลือกก่อนกลุ่ม ไม่งั้นแตะตัวเลือกจะโดนจับเป็นลากกลุ่มแทน
      const card = closest("[data-item-id]");
      const optRow = !card ? closest("[data-option-id]") : null;
      const groupRow = !card && !optRow ? closest("[data-group-id]") : null;
      const row = !card && !optRow && !groupRow ? closest("[data-cat-id]") : null;
      const kind = card ? "item" : optRow ? "option" : groupRow ? "group" : row ? "cat" : null;
      if (!kind) return;
      const el = card || optRow || groupRow || row;
      const id = card ? card.dataset.itemId : optRow ? optRow.dataset.optionId : groupRow ? groupRow.dataset.groupId : row.dataset.catId;
      const cat = card ? card.dataset.cat : optRow ? optRow.dataset.groupId : "";
      const label = el.dataset.touchLabel || "";
      const timer = setTimeout(() => {
        if (!pendingTouchRef.current) return;
        pendingTouchRef.current = null;
        startTouchDrag(t, kind, id, cat, label);
      }, 300);
      pendingTouchRef.current = { timer, kind, id, cat, label, x: t.clientX, y: t.clientY };
    };
    const onMove = (e) => {
      const t = e.touches && e.touches[0];
      // ยังแค่กดค้างรอ (pending) — นิ้วขยับเกิน 8px = ตั้งใจเลื่อนหน้า ให้ยกเลิกการรอลาก
      const p = pendingTouchRef.current;
      if (p) {
        if (t && Math.abs(t.clientX - p.x) + Math.abs(t.clientY - p.y) > 8) {
          clearTimeout(p.timer);
          pendingTouchRef.current = null;
        }
        return;
      }
      const d = touchDragRef.current;
      if (!d) return;
      // ยังไม่เริ่มลากจริง (เพิ่งกดค้างขึ้นมา) — ปล่อยให้เลื่อนหน้าได้จนกว่าจะขยับเกิน 8px
      if (!d.moved && t) {
        const dx = t.clientX - d.startX;
        const dy = t.clientY - d.startY;
        if (Math.abs(dx) + Math.abs(dy) < 8) return;
      }
      e.preventDefault();
      moveTouchDrag(e);
    };
    const onEnd = (e) => {
      if (pendingTouchRef.current) { clearTimeout(pendingTouchRef.current.timer); pendingTouchRef.current = null; }
      if (touchDragRef.current) endTouchDrag(e);
    };
    const onCancel = () => {
      if (pendingTouchRef.current) { clearTimeout(pendingTouchRef.current.timer); pendingTouchRef.current = null; }
      if (touchDragRef.current) cancelTouchDrag();
    };
    document.addEventListener("touchstart", onStart, { passive: false });
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onEnd);
    document.addEventListener("touchcancel", onCancel);
    return () => {
      document.removeEventListener("touchstart", onStart);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onEnd);
      document.removeEventListener("touchcancel", onCancel);
      // ถ้าคอมโพเนนต์ unmount ระหว่างกำลังลากอยู่ (เช่น สลับแท็บพนักงานกลางคัน) ต้องเก็บกวาด ghost element
      // และ pending long-press timer ด้วย ไม่งั้น ghost จะค้างอยู่บนจอ (ติดอยู่ที่ document.body ตรง ๆ
      // ไม่ได้อยู่ใน React tree เลย unmount ปกติไม่ช่วยเก็บให้)
      if (pendingTouchRef.current) { clearTimeout(pendingTouchRef.current.timer); pendingTouchRef.current = null; }
      if (touchDragRef.current) cancelTouchDrag();
    };
  }, []);

  const startEdit = (item) => {
    // ให้เลข id ใหม่ต่อจาก id ที่มีอยู่แล้วในเมนู (กัน id ซ้ำข้าม session)
    seedIdCounter(menu);
    seedAddOnCounters(menu);
    setConfirmDelMenu(false);
    setEditing(item.id);
    // แปลงข้อมูลเก่า (list ราบ) ให้เป็น "กลุ่ม" — คงลำดับเดิมของกลุ่ม/ตัวเลือกไว้ตามที่บันทึกไว้ล่าสุด
    // (ไม่บังคับเรียงตามราคาอีกต่อไป เพราะพนักงานจัดลำดับเองได้แล้วด้วยปุ่มขึ้น/ลง — ถ้ายัง sort ที่นี่
    // จะทับลำดับที่ตั้งใจจัดไว้ทุกครั้งที่เปิดฟอร์มแก้ไข)
    const groups = normalizeAddOnGroups(item.addOns);
    setForm({
      name: item.name,
      desc: item.desc,
      price: String(item.price),
      category: item.category,
      img: item.img || "",
      addOns: groups,
      cost: item.cost != null && item.cost !== "" ? String(item.cost) : "",
      recipe: Object.fromEntries(Object.entries(item.recipe || {}).map(([k, v]) => [k, String(v)])),
      active: item.active !== false,
    });
    setNewOptionName({});
    setNewOptionPrice({});
  };

  const startNew = () => {
    seedIdCounter(menu);
    seedAddOnCounters(menu);
    setEditing("new");
    const firstCat = (categories && categories[0] && categories[0].id) || "drink";
    setForm({ name: "", desc: "", price: "", category: firstCat, img: "", addOns: [], cost: "", recipe: {}, active: true });
    setNewOptionName({});
    setNewOptionPrice({});
  };

  // รูปเมนูจะถูกบีบอัดก่อนเก็บเสมอ (จำเป็นกว่ารูปสลิปอีก เพราะเมนูทั้งร้าน
  // ถูกเก็บรวมกันไว้ใน Firestore document เดียว ซึ่งจำกัดขนาดที่ 1MB/document —
  // ถ้าไม่บีบอัด อัปโหลดรูปจากกล้องมือถือ 2-3 เมนูก็เกิน 1MB ทำให้บันทึกเมนูทั้งร้านไม่ผ่านเลย)
  // รูปเมนูแสดงผลเล็กสุดแค่ ~80px บนจอ เลยบีบได้แน่นกว่ารูปสลิปที่ต้องอ่านตัวหนังสือ
  const [photoError, setPhotoError] = useState("");

  const handlePhotoUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setPhotoError("");
    try {
      const { dataUrl } = await compressImage(file, 500, 0.7);
      setForm((f) => ({ ...f, img: dataUrl }));
    } catch (err) {
      console.error("Compress menu photo failed, using original file:", err);
      const reader = new FileReader();
      reader.onload = () => setForm((f) => ({ ...f, img: reader.result }));
      reader.onerror = () => setPhotoError("อ่านรูปไม่สำเร็จ ลองรูปอื่นดูนะครับ");
      reader.readAsDataURL(file);
    }
  };

  // ---- กลุ่มตัวเลือกเพิ่ม (add-on groups) ----
  const addGroup = () => {
    setForm((f) => ({ ...f, addOns: [...f.addOns, { id: nextAddOnGroupId(), name: "", required: false, single: false, options: [] }] }));
  };

  const updateGroup = (gid, patch) => {
    setForm((f) => ({ ...f, addOns: f.addOns.map((g) => (g.id === gid ? { ...g, ...patch } : g)) }));
  };

  // ลากกลุ่มตัวเลือกเพิ่มไปปล่อยบนกลุ่มอื่น — ย้ายไปแทรกตรงตำแหน่งนั้น (ลำดับนี้คือลำดับที่ลูกค้าเห็นจริงตอนเลือกท็อปปิ้ง)
  const reorderGroup = (srcId, targetId) => {
    if (!srcId || srcId === targetId) return;
    setForm((f) => {
      const list = f.addOns;
      const from = list.findIndex((g) => g.id === srcId);
      const to = list.findIndex((g) => g.id === targetId);
      if (from < 0 || to < 0) return f;
      const next = [...list];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return { ...f, addOns: next };
    });
  };
  const dropGroup = (targetId) => reorderGroup(dragGroup, targetId);

  // ลากตัวเลือกย่อยไปปล่อยบนตัวเลือกอื่น — ย้ายได้เฉพาะภายในกลุ่มเดียวกัน (ข้ามกลุ่มไม่ได้ ราคาเท่ากันก็จัดลำดับเองได้)
  const dropOption = (src, dst) => {
    if (!src || !dst || src.id === dst.id || src.gid !== dst.gid) return;
    setForm((f) => ({
      ...f,
      addOns: f.addOns.map((g) => {
        if (g.id !== src.gid) return g;
        const list = g.options || [];
        const from = list.findIndex((o) => o.id === src.id);
        const to = list.findIndex((o) => o.id === dst.id);
        if (from < 0 || to < 0) return g;
        const next = [...list];
        const [moved] = next.splice(from, 1);
        next.splice(to, 0, moved);
        return { ...g, options: next };
      }),
    }));
  };

  const removeGroup = (gid) => {
    setForm((f) => ({ ...f, addOns: f.addOns.filter((g) => g.id !== gid) }));
    setConfirmDelGroup(null);
  };

  const addOption = (gid) => {
    const name = (newOptionName[gid] || "").trim();
    const price = Number(newOptionPrice[gid]);
    if (!name || !newOptionPrice[gid] || Number.isNaN(price)) return;
    // ตัวเลือกใหม่ต่อท้ายกลุ่มตามลำดับที่เพิ่ม — พนักงานจัดลำดับเองได้ภายหลังด้วยปุ่มขึ้น/ลง (ไม่ auto-sort ตามราคาอีกต่อไป)
    setForm((f) => ({
      ...f,
      addOns: f.addOns.map((g) =>
        g.id === gid
          ? { ...g, options: [...(g.options || []), { id: nextAddOnId(), name, price, cost: newOptionCost[gid] || "", recipe: {} }] }
          : g
      ),
    }));
    setNewOptionName((m) => ({ ...m, [gid]: "" }));
    setNewOptionPrice((m) => ({ ...m, [gid]: "" }));
    setNewOptionCost((m) => ({ ...m, [gid]: "" }));
  };

  // แก้ไขท็อปปิ้ง/แอดออนตัวเดียว — ชื่อ/ราคา/ต้นทุน/วัตถุดิบที่ผูกไว้
  const updateOption = (gid, oid, patch) => {
    setForm((f) => ({
      ...f,
      addOns: f.addOns.map((g) =>
        g.id === gid
          ? { ...g, options: (g.options || []).map((o) => (o.id === oid ? { ...o, ...patch } : o)) }
          : g
      ),
    }));
  };

  const removeOption = (gid, oid) => {
    setForm((f) => ({
      ...f,
      addOns: f.addOns.map((g) => (g.id === gid ? { ...g, options: (g.options || []).filter((o) => o.id !== oid) } : g)),
    }));
    setConfirmDelOption(null);
  };

  const save = () => {
    if (!form.name.trim() || !form.price) return;
    const priceNum = Number(form.price);
    // ซ่อม id ซ้ำ (ข้อมูลเก่า) ให้อัตโนมัติก่อนบันทึก — ตัวที่ซ้ำจะได้ id ใหม่ ไม่ชนกันอีก
    const addOns = ensureUniqueAddOnIds(form.addOns);
    // ต้นทุนต่อหน่วย (บาท) — เว้นว่าง = ไม่ได้ตั้งต้นทุน
    const costNum = form.cost === "" || form.cost == null ? null : Number(form.cost);
    // สูตรวัตถุดิบ: เก็บเฉพาะรายการที่เลือกสต็อกจริงและจำนวน > 0
    const recipe = {};
    Object.entries(form.recipe || {}).forEach(([sid, v]) => {
      const per = Number(v);
      if (sid && per > 0) recipe[sid] = per;
    });
    if (editing === "new") {
      setMenu((prev) => [
        ...prev,
        { id: nextId(), name: form.name.trim(), desc: form.desc.trim(), price: priceNum, category: form.category, active: form.active !== false, img: form.img, addOns, cost: costNum, recipe },
      ]);
    } else {
      setMenu((prev) =>
        prev.map((m) =>
          m.id === editing
            ? { ...m, name: form.name.trim(), desc: form.desc.trim(), price: priceNum, category: form.category, img: form.img, addOns, cost: costNum, recipe, active: form.active !== false }
            : m
        )
      );
    }
    setEditing(null);
  };

  const remove = (id) => {
    setMenu((prev) => prev.filter((m) => m.id !== id));
    if (editing === id) setEditing(null);
  };

  const toggleActive = (id) => {
    setMenu((prev) => prev.map((m) => (m.id === id ? { ...m, active: !m.active } : m)));
  };

  // สลับตำแหน่งเมนูขึ้น/ลง ภายในหมวดเดียวกัน (ข้ามเมนูหมวดอื่นไม่ได้) — ลูกค้าจะเห็นลำดับใหม่ทันที
  const moveItem = (id, dir) => {
    setMenu((prev) => {
      const idx = prev.findIndex((m) => m.id === id);
      if (idx < 0) return prev;
      const cat = prev[idx].category;
      // หารายการถัดไป/ก่อนหน้าในอาร์เรย์ที่เป็นหมวดเดียวกัน (เลื่อนข้ามเมนูหมวดอื่นไปก่อน)
      let j = idx + dir;
      while (j >= 0 && j < prev.length && prev[j].category !== cat) j += dir;
      if (j < 0 || j >= prev.length) return prev;
      const next = [...prev];
      const t = next[idx];
      next[idx] = next[j];
      next[j] = t;
      return next;
    });
  };

  const grouped = useMemo(() => {
    const g = {};
    menu.forEach((m) => {
      g[m.category] = g[m.category] || [];
      g[m.category].push(m);
    });
    return g;
  }, [menu]);

  // รายการหมวดเรียงตามลำดับที่ร้านตั้งไว้ (ลูกค้าเห็นแท็บเรียงแบบนี้) + หมวดเก่าที่เมนูยังใช้อยู่แต่ไม่อยู่ในลิสต์
  const orderedCats = useMemo(() => {
    const catList = categories && categories.length ? categories : DEFAULT_CATEGORIES;
    const extra = Object.keys(grouped).filter((id) => !catList.some((c) => c.id === id));
    return [...catList, ...extra.map((id) => ({ id, label: categoryLabel(id, catList) }))];
  }, [categories, grouped]);

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <div className="flex items-center justify-between mb-5">
        <div>
          <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold">
            จัดการเมนู
          </h1>
          <p style={{ color: COLORS.inkSoft }} className="text-xs mt-0.5">แตะการ์ด = แก้ไข · กดค้าง (มือถือ) หรือลาก (คอม) = สลับลำดับ (ลูกค้าเห็นตามลำดับนี้)</p>
        </div>
        <button
          onClick={startNew}
          style={{ background: COLORS.caramel, color: "#FFF9F0" }}
          className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-transform flex-shrink-0"
        >
          <Plus size={20} />
        </button>
      </div>

      {/* ตั้งค่าร้าน — ชื่อร้าน + โค้ด QR (พร้อมเพย์) */}
      <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-4 mb-6">
