                    style={{ background: form.active ? COLORS.sage : "#D8CBB8", width: 40, height: 22, borderRadius: 999 }}
                    className="relative inline-block"
                  >
                    <span
                      style={{ left: form.active ? 20 : 3, background: "#FFF", width: 16, height: 16, borderRadius: 999, top: 3 }}
                      className="absolute transition-all"
                    />
                  </span>
                  <span style={{ color: COLORS.ink }} className="text-sm font-medium">
                    {form.active ? "เปิดใช้ (ลูกค้าเห็นทันที)" : "ปิดใช้ (ลูกค้ายังไม่เห็น)"}
                  </span>
                </button>
              </div>

              <button
                onClick={save}
                disabled={!!validationMsg}
                style={{ background: COLORS.ink, color: "#FFF9F0", opacity: validationMsg ? 0.4 : 1 }}
                className="w-full py-3 rounded-2xl text-sm font-bold mt-1"
              >
                {editing === "new" ? "เพิ่มโปรโมชั่น" : "บันทึกการแก้ไข"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STAFF: จัดการสิทธิ์พนักงาน =================
// เฉพาะเครื่องที่ได้รับสิทธิ์แล้วเท่านั้นที่เข้าได้ — เพิ่ม/ลบสิทธิ์เครื่องพนักงานได้ที่นี่
// (rules บังคับว่าเขียน/อ่านรายชื่อได้เฉพาะคนที่อยู่ใน staffUids อยู่แล้ว)

// แปลง error จากการเพิ่ม/แก้/ลบสิทธิ์พนักงานเป็นข้อความที่เห็นแล้วรู้ว่าต้องแก้ตรงไหน
// (เคสพบบ่อยสุดคือ rules ยังไม่เปิดเขียนให้ staffUids → บอกให้ไปอัปเดต rules ใน Firebase Console)
const staffWriteErrorMsg = (err, action) => {
  const code = String((err && (err.code || err.message)) || "");
  if (code.includes("permission-denied") || code.includes("PERMISSION_DENIED")) {
    return `ไม่สำเร็จ (${action}) — Firestore ปฏิเสธการเขียน ตรวจว่า rules ของ staffUids เปิดให้พนักงานเขียนได้แล้ว (Firebase Console → Firestore → Rules) แล้วลองใหม่`;
  }
  return `ไม่สำเร็จ (${action}) — ${code || "เกิดข้อผิดพลาด"} ตรวจอินเทอร์เน็ตแล้วลองใหม่`;
};

function StaffMembersView({ uid, staffMembers, onAdd, onRemove, onRename }) {
  const [newUid, setNewUid] = useState("");
  const [newName, setNewName] = useState("");
  const [formError, setFormError] = useState("");
  const [actionError, setActionError] = useState(""); // error จากการเพิ่ม/ลบ/ตั้งชื่อสิทธิ์ (โชว์แถบแดงใต้หัว)
  const [confirmRemove, setConfirmRemove] = useState(null);
  const [renameFor, setRenameFor] = useState(null); // uid ของเครื่องที่กำลังตั้งชื่อ
  const [renameValue, setRenameValue] = useState("");
  const [uidCopied, setUidCopied] = useState(false);

  const add = async () => {
    const v = newUid.trim();
    if (!v) return;
    if (staffMembers.some((m) => m.uid === v)) {
      setFormError("เครื่องนี้ได้รับสิทธิ์อยู่แล้ว");
      return;
    }
    // กันพิมพ์ผิด/วางรหัสปลอม — รหัสอุปกรณ์จริงเป็นตัวอักษร-ตัวเลขล้วน ไม่มีสัญลักษณ์พิเศษ
    if (/[^A-Za-z0-9]/.test(v)) {
      setFormError("รหัสอุปกรณ์ไม่ถูกต้อง — ให้คัดลอกจากจอ \"เครื่องนี้ยังไม่ได้รับสิทธิ์\" ของเครื่องนั้นมาตรง ๆ");
      return;
    }
    const err = await onAdd(v, newName.trim());
    if (err) {
      // เขียนไม่สำเร็จ (เช่น rules ยังไม่เปิด) — โชว์เหตุผลให้เห็นแทนที่จะเงียบ ๆ
      setActionError(err);
      return;
    }
    setNewUid("");
    setNewName("");
    setFormError("");
    setActionError("");
  };

  const remove = async (v) => {
    const err = await onRemove(v);
    if (err) {
      setActionError(err);
      return;
    }
    setConfirmRemove(null);
    setActionError("");
  };

  const copyUid = async () => {
    if (!uid) return;
    try {
      await navigator.clipboard.writeText(uid);
      setUidCopied(true);
      setTimeout(() => setUidCopied(false), 2000);
    } catch (err) {
      console.error("Copy uid failed:", err);
    }
  };

  const startRename = (m) => {
    setRenameFor(m.uid);
    setRenameValue(m.name || "");
  };

  const saveRename = async () => {
    if (!renameFor) return;
    const err = await onRename(renameFor, renameValue.trim());
    if (err) {
      setActionError(err);
      return;
    }
    setRenameFor(null);
    setActionError("");
  };

  // ลบได้เฉพาะเครื่องอื่น และต้องเหลือพนักงานอย่างน้อย 1 เครื่อง (กันล็อกตัวเองออกทั้งร้าน)
  const canDelete = (v) => v !== uid && staffMembers.length > 1;

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold mb-1">
        สิทธิ์พนักงาน
      </h1>
      <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
        เครื่องไหนได้รับอนุญาตให้เข้าหน้าพนักงานได้ — เพิ่ม/ลบได้ที่นี่ ซิงก์กับ Firebase ทันที
      </p>

      {/* แจ้ง error จากการเพิ่ม/ลบ/ตั้งชื่อสิทธิ์ — เช่น rules ยังไม่เปิดเขียน จะได้เห็นเหตุผลทันที */}
      {actionError && (
        <div
          style={{ background: "#F3D9D3", color: "#A03A2A", border: "1px solid #E4B4A9" }}
          className="rounded-xl px-3.5 py-2.5 text-[11px] font-medium mb-4 leading-relaxed"
        >
          {actionError}
        </div>
      )}

      {/* เครื่องที่ใช้อยู่ */}
      <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-3.5 mb-4">
        <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">รหัสอุปกรณ์เครื่องนี้</p>
        <div className="flex gap-2 items-stretch">
          <div
            style={{ background: COLORS.cream, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-xs font-mono break-all select-all"
          >
            {uid}
          </div>
          <button
            type="button"
            onClick={copyUid}
            style={{ background: uidCopied ? COLORS.sageSoft : COLORS.peachSoft, color: uidCopied ? COLORS.sage : COLORS.caramelDark }}
            className="rounded-xl px-3.5 text-xs font-semibold flex-shrink-0"
          >
            {uidCopied ? "คัดลอกแล้ว" : "คัดลอก"}
          </button>
        </div>
        <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1.5">
          เครื่องนี้คือเครื่องที่กำลังใช้อยู่ — ใช้รหัสนี้เป็นตัวอย่างว่าเครื่องใหม่ต้องส่งรหัสอะไรให้เพิ่มสิทธิ์
        </p>
      </div>

      {/* เพิ่มสิทธิ์ */}
      <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-3.5 mb-4">
        <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">เพิ่มสิทธิ์เครื่องใหม่</p>
        <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-2 leading-relaxed">
          ให้เครื่องนั้นเปิดลิงก์พนักงาน (?staff=1) → ใส่ PIN → หน้า "เครื่องนี้ยังไม่ได้รับสิทธิ์" จะโชว์รหัสอุปกรณ์
          → คัดลอกมาวางตรงนี้ แล้วกดเพิ่มสิทธิ์ (ทำครั้งเดียวต่อเครื่อง)
        </p>
        <div className="space-y-2">
          <input
            value={newUid}
            onChange={(e) => { setNewUid(e.target.value); setFormError(""); }}
            placeholder="วางรหัสอุปกรณ์ที่นี่"
            style={{ border: `1px solid ${formError ? "#C0533F" : COLORS.line}`, color: COLORS.ink }}
            className="w-full rounded-xl px-3.5 py-2.5 text-xs font-mono bg-white outline-none"
          />
          <input
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            placeholder="ชื่อ/ตำแหน่ง เช่น พนักงาน 1, พี่บี (ไม่กรอกก็ได้)"
            style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            className="w-full rounded-xl px-3.5 py-2.5 text-xs bg-white outline-none"
          />
          <button
            type="button"
            onClick={add}
            disabled={!newUid.trim()}
            style={{ background: COLORS.caramel, color: "#FFF9F0", opacity: newUid.trim() ? 1 : 0.4 }}
            className="w-full rounded-xl py-2.5 text-xs font-semibold"
          >
            เพิ่มสิทธิ์
          </button>
        </div>
        {formError && <p style={{ color: "#C0533F" }} className="text-[11px] font-medium mt-1.5">{formError}</p>}
      </div>

      {/* รายชื่อเครื่องพนักงาน */}
      <p style={{ color: COLORS.caramelDark }} className="text-xs font-bold uppercase tracking-wide mb-2 px-1">
        เครื่องที่ได้รับสิทธิ์ ({staffMembers.length})
      </p>
      <div className="space-y-2 md:grid md:grid-cols-2 md:gap-2 md:space-y-0 xl:grid-cols-3 2xl:grid-cols-4">
        {staffMembers.length === 0 && (
          <p style={{ color: COLORS.inkSoft }} className="text-xs px-1">
            กำลังโหลดรายชื่อ... (ถ้าไม่ขึ้น ให้ตรวจว่าเครื่องนี้ถูกเพิ่มสิทธิ์ใน Firebase แล้ว)
          </p>
        )}
        {staffMembers.map((m) => (
          <div key={m.uid} style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-xl p-3 flex items-center gap-2">
            <div className="flex-1 min-w-0">
              {renameFor === m.uid ? (
                <div className="flex gap-1.5 items-center">
                  <input
                    value={renameValue}
                    onChange={(e) => setRenameValue(e.target.value)}
                    placeholder="ชื่อ/ตำแหน่ง"
                    autoFocus
                    style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    className="flex-1 min-w-0 rounded-lg px-2.5 py-1.5 text-xs bg-white outline-none"
                  />
                  <button
                    type="button"
                    onClick={saveRename}
                    style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                    className="text-[11px] font-semibold px-2.5 py-1.5 rounded-lg flex-shrink-0"
                  >
                    บันทึก
                  </button>
                  <button type="button" onClick={() => setRenameFor(null)} style={{ color: COLORS.inkSoft }} className="text-[11px] px-1 flex-shrink-0">
                    ยกเลิก
                  </button>
                </div>
              ) : (
                <div className="flex items-center gap-1.5">
                  <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">{m.name || "ไม่ระบุชื่อ"}</p>
                  <button type="button" onClick={() => startRename(m)} style={{ color: COLORS.inkSoft }} title="ตั้งชื่อเครื่องนี้">
                    <Pencil size={12} />
                  </button>
                </div>
              )}
              <p style={{ color: COLORS.inkSoft }} className="text-[11px] font-mono break-all mt-0.5">{m.uid}</p>
              {m.uid === uid && (
                <span style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-[10px] font-bold px-2 py-0.5 rounded-full inline-block mt-1">
                  เครื่องนี้
                </span>
              )}
            </div>
            {canDelete(m.uid) ? (
              <button
                type="button"
                onClick={() => setConfirmRemove(m.uid)}
                style={{ color: "#C0533F" }}
                className="text-xs font-semibold px-2 py-1.5 flex-shrink-0"
              >
                ลบ
              </button>
            ) : (
              <span
                title={m.uid === uid ? "ลบเครื่องที่ใช้อยู่ไม่ได้ — ใช้เครื่องอื่นลบแทน" : "ต้องเหลือพนักงานอย่างน้อย 1 เครื่อง (กันล็อกตัวเองออก)"}
                style={{ color: "#B9A88F" }}
                className="text-xs px-2 py-1.5 flex-shrink-0"
              >
                ลบไม่ได้
              </span>
            )}
          </div>
        ))}
      </div>

      {/* ยืนยันลบสิทธิ์ */}
      {confirmRemove && (
        <div className="fixed inset-0 z-40 flex items-center justify-center px-8">
          <SheetLock />
          <div onClick={() => setConfirmRemove(null)} className="absolute inset-0 bg-black/30" />
          <div style={{ background: "#FFFFFF", borderRadius: 20 }} className="relative w-full max-w-xs p-5 text-center">
            <p style={{ color: COLORS.ink }} className="text-sm font-bold mb-1">ลบสิทธิ์เครื่องนี้เลยไหม?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4 break-all">
              {confirmRemove} — เครื่องนั้นจะเข้าหน้าพนักงานไม่ได้ทันที
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmRemove(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                className="flex-1 text-xs font-semibold py-2.5 rounded-xl bg-white"
              >
                ยกเลิก
              </button>
              <button onClick={() => remove(confirmRemove)} style={{ background: "#C0533F", color: "#FFF" }} className="flex-1 text-xs font-semibold py-2.5 rounded-xl">
                ลบสิทธิ์
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STAFF STOCK VIEW (สต็อก) =================
// เก็บวัตถุดิบ/ของคงเหลือ + จุดแจ้งเตือนใกล้หมด + ผูกกับเมนู (เมนูไหนใช้ของอะไร)
function StaffStockView({ stockItems, updateStock, menu }) {
  const [editing, setEditing] = useState(null); // "new" | id รายการที่กำลังแก้
  const [form, setForm] = useState({ name: "", unit: "ชิ้น", qty: "", minQty: "" });
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  // แผนที่ stockId -> เมนูที่ใช้ (ชื่อเมนู + จำนวนต่อ 1 หน่วย) — ดูย้อนกลับว่า "ของนี้ใช้กับเมนูไหนบ้าง"
  const stockUsage = useMemo(() => {
    const map = new Map();
    (menu || []).forEach((m) => {
      Object.entries(m.recipe || {}).forEach(([sid, per]) => {
        if (!map.has(sid)) map.set(sid, []);
        map.get(sid).push({ menuName: m.name, per: Number(per) || 0 });
      });
    });
    return map;
  }, [menu]);

  const statusOf = (s) => {
    const qty = Number(s.qty) || 0;
    const min = Number(s.minQty) || 0;
    if (qty <= 0) return { label: "หมด", color: "#C0533F", bg: "#F3D9D3" };
    if (min > 0 && qty <= min) return { label: "ใกล้หมด", color: "#B08628", bg: "#F5EAC9" };
    return { label: "ปกติ", color: COLORS.sage, bg: COLORS.sageSoft };
  };

  const outCount = stockItems.filter((s) => (Number(s.qty) || 0) <= 0).length;
  const lowCount = stockItems.filter(
    (s) => (Number(s.qty) || 0) > 0 && (Number(s.minQty) || 0) > 0 && (Number(s.qty) || 0) <= (Number(s.minQty) || 0)
  ).length;

  const startNew = () => {
    seedStockCounter(stockItems); // กันวัตถุดิบใหม่ได้ id ซ้ำกับของเดิม (บั๊ก id ซ้ำข้าม session)
    setEditing("new");
    setForm({ name: "", unit: "ชิ้น", qty: "", minQty: "" });
  };
  const startEdit = (item) => {
    setEditing(item.id);
    setForm({ name: item.name, unit: item.unit || "ชิ้น", qty: String(item.qty ?? ""), minQty: String(item.minQty ?? "") });
  };

  const save = () => {
    if (!form.name.trim()) return;
    const qty = form.qty === "" ? 0 : Number(form.qty);
    const minQty = form.minQty === "" ? 0 : Number(form.minQty);
    if (editing === "new") {
      updateStock((prev) => [...prev, { id: nextStockId(), name: form.name.trim(), unit: form.unit, qty, minQty }]);
    } else {
      updateStock((prev) => prev.map((s) => (s.id === editing ? { ...s, name: form.name.trim(), unit: form.unit, qty, minQty } : s)));
    }
    setEditing(null);
  };

  // ปรับจำนวนทันที (+1/-1) — ใช้ตอนรับของเข้าร้านหรือนับสต็อก
  const adjust = (id, delta) => {
    updateStock((prev) => prev.map((s) => (s.id === id ? { ...s, qty: Math.max(0, (Number(s.qty) || 0) + delta) } : s)));
  };

  const remove = (id) => {
    updateStock((prev) => prev.filter((s) => s.id !== id));
    setConfirmDeleteId(null);
  };

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <div className="flex items-start justify-between gap-2 mb-1">
        <div>
          <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold">
            สต็อกวัตถุดิบ
          </h1>
          <p style={{ color: COLORS.inkSoft }} className="text-xs mt-0.5">
            {stockItems.length} รายการ · ตัดอัตโนมัติเมื่อออเดอร์ทำเสร็จ
          </p>
        </div>
        <button
          onClick={startNew}
          style={{ background: COLORS.caramel, color: "#FFF9F0" }}
          className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-transform flex-shrink-0"
        >
          <Plus size={20} />
        </button>
      </div>

      {/* แจ้งเตือนของใกล้หมด/หมด */}
      {(outCount > 0 || lowCount > 0) && (
        <div
          style={{ background: outCount > 0 ? "#F3D9D3" : "#F5EAC9", color: outCount > 0 ? "#8A3A2B" : "#7A5B12" }}
          className="rounded-2xl px-4 py-3 mb-4 flex items-center gap-2"
        >
          <AlertTriangle size={16} className="flex-shrink-0" />
          <p className="text-xs font-semibold leading-relaxed">
            {outCount > 0 && `${outCount} รายการหมดแล้ว`}
            {outCount > 0 && lowCount > 0 && " · "}
            {lowCount > 0 && `${lowCount} รายการใกล้หมด`}
            {" "}— ไปซื้อของก่อนลูกค้าสั่งไม่ได้นะครับ
          </p>
        </div>
      )}

      {stockItems.length === 0 && (
        <div className="text-center py-16" style={{ color: COLORS.inkSoft }}>
          <Box size={32} className="mx-auto mb-2 opacity-50" />
          ยังไม่มีรายการสต็อก
          <p className="text-[11px] mt-1">เพิ่มวัตถุดิบ/ของคงเหลือ แล้วไปผูกกับเมนูที่หน้าจัดการเมนู เพื่อตัดสต็อกอัตโนมัติ</p>
        </div>
      )}

      <div className="space-y-2.5 md:grid md:grid-cols-2 md:gap-2.5 md:space-y-0 xl:grid-cols-3 2xl:grid-cols-4">
        {stockItems.map((s) => {
          const st = statusOf(s);
          const usedIn = stockUsage.get(s.id) || [];
          return (
            <div key={s.id} style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-3.5">
              <div className="flex items-center gap-2">
                <div className="flex-1 min-w-0">
                  <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">{s.name}</p>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span style={{ background: st.bg, color: st.color }} className="text-[10px] font-bold px-2 py-0.5 rounded-full">
                      {st.label}
                    </span>
                    {Number(s.minQty) > 0 && (
                      <span style={{ color: COLORS.inkSoft }} className="text-[11px]">แจ้งเตือนที่ ≤ {s.minQty} {s.unit}</span>
                    )}
                  </div>
                </div>
                <div className="flex items-center gap-1 flex-shrink-0">
                  <button onClick={() => adjust(s.id, -1)} style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }} className="w-7 h-7 rounded-lg flex items-center justify-center active:scale-90">
                    <Minus size={13} />
                  </button>
                  <span style={{ color: COLORS.ink }} className="text-lg font-bold min-w-[52px] text-center">
                    {Number(s.qty) || 0}
                  </span>
                  <button onClick={() => adjust(s.id, 1)} style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }} className="w-7 h-7 rounded-lg flex items-center justify-center active:scale-90">
                    <Plus size={13} />
                  </button>
                </div>
                <span style={{ color: COLORS.inkSoft }} className="text-[11px] w-8 flex-shrink-0">{s.unit}</span>
                <button onClick={() => startEdit(s)} style={{ color: COLORS.inkSoft }} className="w-7 h-7 flex items-center justify-center flex-shrink-0">
                  <Pencil size={14} />
                </button>
                <button onClick={() => setConfirmDeleteId(s.id)} style={{ color: "#C0533F" }} className="w-7 h-7 flex items-center justify-center flex-shrink-0">
                  <Trash2 size={14} />
                </button>
              </div>
              <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-2 leading-relaxed">
                {usedIn.length > 0
                  ? `ใช้ในเมนู: ${usedIn.map((u) => `${u.menuName} (${u.per} ${s.unit}/หน่วย)`).join(" · ")}`
                  : "ยังไม่ได้ผูกกับเมนูไหน — แก้เมนูแล้วเลือกวัตถุดิบนี้ที่หน้าจัดการเมนู"}
              </p>
            </div>
          );
        })}
      </div>

      {/* ยืนยันลบ */}
      {confirmDeleteId && (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-6">
          <SheetLock />
          <div onClick={() => setConfirmDeleteId(null)} className="absolute inset-0 bg-black/30" />
          <div style={{ background: COLORS.cream }} className="relative rounded-2xl p-5 w-full max-w-xs">
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-2">ลบรายการสต็อกนี้?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">เมนูที่ผูกวัตถุดิบนี้ไว้จะไม่ถูกตัดสต็อกอีก (สูตรยังอยู่แต่ไม่มีของให้ตัด)</p>
            <div className="flex gap-2">
              <button onClick={() => setConfirmDeleteId(null)} className="flex-1 rounded-xl py-2.5 text-xs font-semibold" style={{ background: "#FFFFFF", color: COLORS.inkSoft, border: `1px solid ${COLORS.line}` }}>
                ยกเลิก
              </button>
              <button onClick={() => remove(confirmDeleteId)} className="flex-1 rounded-xl py-2.5 text-xs font-semibold" style={{ background: "#C0533F", color: "#FFF9F0" }}>
                ลบ
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Drawer เพิ่ม/แก้ไขสต็อก */}
      {editing && (
        <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
          <SheetLock />
          <div style={{ overflowY: "auto", overscrollBehavior: "contain" }} className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8">
            <div className="flex items-center justify-between mb-4">
              <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                {editing === "new" ? "เพิ่มวัตถุดิบ" : "แก้ไขวัตถุดิบ"}
              </h2>
              <button onClick={() => setEditing(null)} style={{ color: COLORS.inkSoft }}>
                <X size={20} />
              </button>
            </div>
            <div className="space-y-3">
              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ชื่อวัตถุดิบ</label>
                <input
                  value={form.name}
                  onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))}
                  placeholder="เช่น ไข่มุกดำ, ชานม, ถ้วยกระดาษ"
                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                  className="w-full rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none"
                />
              </div>
              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">หน่วยนับ</label>
                <select
                  value={form.unit}
                  onChange={(e) => setForm((f) => ({ ...f, unit: e.target.value }))}
                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                  className="w-full rounded-xl px-3 py-2.5 text-sm bg-white outline-none"
                >
                  {STOCK_UNITS.map((u) => (
                    <option key={u} value={u}>{u}</option>
                  ))}
                </select>
              </div>
              <div className="flex gap-2">
                <div className="flex-1">
                  <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">จำนวนคงเหลือ</label>
                  <input
                    value={form.qty}
                    onChange={(e) => setForm((f) => ({ ...f, qty: decimalDigitsOnly(e.target.value) }))}
                    placeholder="0"
                    inputMode="decimal"
                    style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    className="w-full rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none"
                  />
                </div>
                <div className="flex-1">
                  <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">แจ้งเตือนเมื่อ ≤</label>
                  <input
                    value={form.minQty}
                    onChange={(e) => setForm((f) => ({ ...f, minQty: decimalDigitsOnly(e.target.value) }))}
                    placeholder="เช่น 10 (เว้นว่าง = ไม่เตือน)"
                    inputMode="decimal"
                    style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    className="w-full rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none"
                  />
                </div>
              </div>
            </div>
            <div className="flex gap-2 mt-5">
              <PrimaryButton full onClick={save} disabled={!form.name.trim()}>
                บันทึก
              </PrimaryButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STAFF ACCOUNTING VIEW (บัญชี) =================
// ต้นทุน/กำไรต่อเมนู + สรุปแยกวิธีชำระ + บันทึกรายจ่ายรายวัน
function StaffAccountingView({ orders, menu, expenses, updateExpenses, salesRound, updateSalesRound }) {
  const [range, setRange] = useState("today"); // today | 7d | 30d | all
  const [expForm, setExpForm] = useState({ title: "", amount: "", category: "วัตถุดิบ", note: "", date: todayKey() });
  const [confirmDeleteExpense, setConfirmDeleteExpense] = useState(null);

  // ---- รอบการขายรายวัน: เปิดรอบ → จดเบิก/ฝาก → ปิดรอบสรุปเงินสด ----
  const [roundOpenForm, setRoundOpenForm] = useState({ cash: "", note: "" });
  const [roundEntryForm, setRoundEntryForm] = useState({ type: "withdraw", amount: "", note: "" });
  const [roundCloseForm, setRoundCloseForm] = useState({ cash: "", note: "" });
  const [showRoundHistory, setShowRoundHistory] = useState(false);

  const activeRound = salesRound && salesRound.active ? salesRound.active : null;
  const roundHistory = (salesRound && salesRound.history) || [];

  // ยอดขายเงินสดในรอบนี้ — นับเฉพาะออร์เดอร์เงินสดที่เก็บเงินได้แล้ว (คนส่งกด "เก็บเงินแล้ว" แล้ว) ตั้งแต่เปิดรอบ
  const cashSalesInRound = useMemo(() => {
    if (!activeRound) return 0;
    // ปัดยอดรวมอีกรอบหลังบวก — บวกเลขทศนิยมหลายออร์เดอร์ต่อกันอาจสะสมเศษ float ได้ (เช่นเดียวกับ discountBaht)
    return Math.round(
      orders
        .filter((o) => o.paymentMethod === "cash" && o.status !== "cancelled" && o.createdAt >= activeRound.openedAt && orderIsPaid(o))
        .reduce((s, o) => s + calcOrderTotal(o), 0) * 100
    ) / 100;
  }, [orders, activeRound]);

  const roundDeposits = (entries) =>
    (entries || []).filter((e) => e.type === "deposit").reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const roundWithdrawals = (entries) =>
    (entries || []).filter((e) => e.type === "withdraw").reduce((s, e) => s + (Number(e.amount) || 0), 0);
  // ยอดเงินสดที่ควรมีในลิ้นชักตอนปิดรอบ — พนักงานเอาไปเทียบกับเงินที่นับได้จริง ต้องปัดกันเศษ float
  // สะสมจากการบวก/ลบหลายรายการ (เงินฝาก/เบิกออกตั้งเป็นทศนิยมได้)
  const roundExpected = (entries) =>
    Math.round(
      ((Number(activeRound && activeRound.openingCash) || 0) + cashSalesInRound + roundDeposits(entries) - roundWithdrawals(entries)) * 100
    ) / 100;

  const openRound = () => {
    const cash = Number(roundOpenForm.cash);
    if (!roundOpenForm.cash || Number.isNaN(cash) || cash < 0) return;
    seedSalesRoundCounters(salesRound); // กันรอบใหม่ได้ id ซ้ำกับรอบเก่าที่ปิดไปแล้ว (บั๊ก id ซ้ำข้าม session)
    updateSalesRound((prev) => ({
      active: { id: nextSalesRoundId(), openedAt: Date.now(), openingCash: cash, note: roundOpenForm.note.trim(), entries: [] },
      history: prev.history || [],
    }));
    setRoundOpenForm({ cash: "", note: "" });
  };

  const addRoundEntry = () => {
    const amount = Number(roundEntryForm.amount);
    if (!roundEntryForm.amount || Number.isNaN(amount) || amount <= 0 || !activeRound) return;
    seedSalesRoundCounters(salesRound); // กันรายการเบิก/ฝากใหม่ได้ id ซ้ำกับรายการเดิม (บั๊ก id ซ้ำข้าม session)
    updateSalesRound((prev) => ({
      ...prev,
      active: {
        ...prev.active,
        entries: [...(prev.active.entries || []), { id: nextRoundEntryId(), type: roundEntryForm.type, amount, note: roundEntryForm.note.trim(), createdAt: Date.now() }],
      },
    }));
    setRoundEntryForm((f) => ({ ...f, amount: "", note: "" }));
  };

  const removeRoundEntry = (eid) => {
    if (!activeRound) return;
    updateSalesRound((prev) => ({
      ...prev,
      active: { ...prev.active, entries: (prev.active.entries || []).filter((e) => e.id !== eid) },
    }));
  };

  const closeRound = () => {
    if (!activeRound) return;
    const actual = Number(roundCloseForm.cash);
    if (!roundCloseForm.cash || Number.isNaN(actual) || actual < 0) return;
    const expected = roundExpected(activeRound.entries);
    const record = {
      id: activeRound.id,
      openedAt: activeRound.openedAt,
      closedAt: Date.now(),
      openingCash: Number(activeRound.openingCash) || 0,
      cashSales: cashSalesInRound,
      expected,
      actual,
      diff: Math.round((actual - expected) * 100) / 100,
      note: roundCloseForm.note.trim(),
      entries: activeRound.entries || [],
    };
    updateSalesRound((prev) => ({ active: null, history: [record, ...(prev.history || [])] }));
    setRoundCloseForm({ cash: "", note: "" });
  };

  const rangeStart = useMemo(() => {
    const now = new Date();
    if (range === "all") return null;
    if (range === "today") {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return d.getTime();
    }
    const days = range === "7d" ? 7 : 30;
    return now.getTime() - days * 24 * 60 * 60 * 1000;
  }, [range]);

  const rangeLabels = { today: "วันนี้", "7d": "7 วันล่าสุด", "30d": "30 วันล่าสุด", all: "ทั้งหมด" };

  // ยอดขายในช่วง — นับเฉพาะออร์เดอร์ที่เก็บเงินได้แล้ว (จ่ายแล้ว/รับเงินแล้ว) ไม่รวมที่ยกเลิก
  const sold = useMemo(() => {
    const list = rangeStart === null ? orders : orders.filter((o) => o.createdAt >= rangeStart);
    return list.filter((o) => o.status !== "cancelled" && orderIsPaid(o));
  }, [orders, rangeStart]);

  // ต้นทุนของสินค้าแต่ละชิ้นในออร์เดอร์ — ต้นทุนตัวเมนู + ต้นทุนท็อปปิ้ง/แอดออนที่เลือก (ต้นทุน/หน่วย x จำนวน)
  const costOfItem = (item) => {
    const mi = menu.find((m) => m.id === item.menuId || m.name === item.name);
    let cost = (mi && mi.cost != null ? Number(mi.cost) : 0) * item.qty;
    (item.addOns || []).forEach((ao) => {
      const opt = mi ? findMenuOption(mi, ao) : null;
      if (opt && opt.cost != null) cost += Number(opt.cost) * item.qty;
    });
    return cost;
  };

  // ปัดยอดรวมอีกรอบหลังบวกหลายออร์เดอร์ — กันเศษ float สะสม (ยอดต่อออร์เดอร์แต่ละอันสะอาดอยู่แล้วจาก calcOrderTotal)
  const totalRevenue = Math.round(sold.reduce((s, o) => s + calcOrderTotal(o), 0) * 100) / 100;
  // ต้นทุน/หน่วยตั้งเป็นทศนิยมได้ (ไม่บังคับเป็นจำนวนเต็มเหมือนราคาขาย) บวกสะสมหลายรายการ/ออร์เดอร์เลยต้องปัดด้วย
  const totalCost = Math.round(sold.reduce((s, o) => s + (o.items || []).reduce((s2, it) => s2 + costOfItem(it), 0), 0) * 100) / 100;
  const grossProfit = Math.round((totalRevenue - totalCost) * 100) / 100;

  // รายจ่ายในช่วง (เรียงใหม่สุดก่อน)
  const filteredExpenses = useMemo(() => {
    const list = (expenses || []).filter((e) => rangeStart === null || (e.createdAt || 0) >= rangeStart);
    return [...list].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }, [expenses, rangeStart]);
  const totalExpense = Math.round(filteredExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0) * 100) / 100;
  // ออร์เดอร์ที่ทำเสร็จแล้ว (ถึงสถานะ "เสร็จแล้ว") แล้วถูกยกเลิก — ต้นทุนวัตถุดิบที่เสียไปจริง ("เข้าเนื้อ")
  // เอามาโชว์แยกบรรทัดเป็นขาดทุน ลดกำไรสุทธิ (ออร์เดอร์ที่ยกเลิกก่อนทำ ไม่นับ)
  const cancelledMade = useMemo(() => {
    const list = rangeStart === null ? orders : orders.filter((o) => o.createdAt >= rangeStart);
    return list.filter(
      (o) => o.status === "cancelled" && o.cancelledFrom === "done" && !o.goodsUsedByOrderId
    );
  }, [orders, rangeStart]);
  const lostCost = Math.round(
    cancelledMade.reduce((s, o) => s + (o.items || []).reduce((s2, it) => s2 + costOfItem(it), 0), 0) * 100
  ) / 100;
  const netProfit = Math.round((grossProfit - totalExpense - lostCost) * 100) / 100;

  // สรุปแยกตามวิธีชำระเงิน (นับเฉพาะที่เก็บเงินได้แล้ว)
  const payStats = useMemo(() => {
    const map = {
      cash: { label: "เงินสด", amount: 0, count: 0 },
      promptpay: { label: "โอน/พร้อมเพย์", amount: 0, count: 0 },
    };
    sold.forEach((o) => {
      const key = o.paymentMethod === "cash" ? "cash" : "promptpay";
      map[key].count += 1;
      map[key].amount += calcOrderTotal(o);
    });
    // ปัดยอดรวมแต่ละช่องทางอีกรอบหลังบวกสะสมหลายออร์เดอร์ — กันเศษ float
    map.cash.amount = Math.round(map.cash.amount * 100) / 100;
    map.promptpay.amount = Math.round(map.promptpay.amount * 100) / 100;
    return map;
  }, [sold]);

  // กำไร/ขาดทุนต่อเมนู (เมนูที่มีการขายในช่วง) — ต้นทุนรวมท็อปปิ้ง/แอดออนด้วย (ใช้ costOfItem)
  // บวกนับตัวเลือกเสริมที่ลูกค้าเลือก (เช่น เพิ่มไข่มุกกี่ครั้ง) — จากหน้า "ยอดขาย" เดิมที่รวบมา
  const menuProfit = useMemo(() => {
    const map = new Map();
    sold.forEach((o) =>
      (o.items || []).forEach((it) => {
        const key = it.menuId || it.name;
        if (!map.has(key)) map.set(key, { key, name: it.name, qty: 0, revenue: 0, cost: 0, hasCost: false, addOnCounts: new Map() });
        const e = map.get(key);
        e.qty += it.qty;
        e.revenue += it.price * it.qty;
        const c = costOfItem(it);
        e.cost += c;
        if (c > 0) e.hasCost = true;
        (it.addOns || []).forEach((a) => e.addOnCounts.set(a.name, (e.addOnCounts.get(a.name) || 0) + it.qty));
      })
    );
    return [...map.values()]
      .map((e) => ({ ...e, cost: Math.round(e.cost * 100) / 100 })) // ปัดต้นทุนสะสมต่อเมนู กันเศษ float จากต้นทุน/หน่วยที่เป็นทศนิยมได้
      .sort((a, b) => b.revenue - a.revenue);
  }, [sold]);

  // ---- ข้อมูลจากหน้า "ยอดขาย" เดิมที่รวบมาไว้ในแท็บบัญชีเดียว ----
  const totalOrders = sold.length; // จำนวนออร์เดอร์ที่ขายได้
  const totalItemsSold = sold.reduce((s, o) => s + (o.items || []).reduce((s2, it) => s2 + (Number(it.qty) || 0), 0), 0);
  // รายการที่ยกเลิกในช่วงที่เลือก — แยกไว้อีกส่วน เพื่อดูสาเหตุการยกเลิกย้อนหลัง + ส่งออก Excel
  const cancelledOrders = useMemo(() => {
    const list = rangeStart === null ? orders : orders.filter((o) => o.createdAt >= rangeStart);
    return list.filter((o) => o.status === "cancelled").sort((a, b) => b.createdAt - a.createdAt);
  }, [orders, rangeStart]);
  const cancelledInRange = cancelledOrders.length;
  const [expandedKey, setExpandedKey] = useState(null); // เมนูที่กดขยายดูตัวเลือกเสริม (ท็อปปิ้งยอดนิยม)

  const addExpense = () => {
    if (!expForm.title.trim() || !expForm.amount) return;
    const amount = Number(expForm.amount);
    if (Number.isNaN(amount) || amount <= 0) return;
    seedExpenseCounter(expenses); // กันรายจ่ายใหม่ได้ id ซ้ำกับของเดิม (บั๊ก id ซ้ำข้าม session)
    const date = expForm.date || todayKey();
    const ts = new Date(`${date}T00:00:00`).getTime();
    updateExpenses((prev) => [
      ...prev,
      { id: nextExpenseId(), title: expForm.title.trim(), amount, category: expForm.category, note: expForm.note.trim(), createdAt: ts },
    ]);
    setExpForm((f) => ({ title: "", amount: "", category: f.category, note: "", date }));
  };

  const removeExpense = (id) => {
    updateExpenses((prev) => prev.filter((e) => e.id !== id));
    setConfirmDeleteExpense(null);
  };

  // ส่งออกรายงานบัญชีเป็น CSV (เปิดใน Excel ได้ — ใส่ BOM UTF-8 กันภาษาไทยเพี้ยน)
  // ไฟล์เดียวรวม 3 ส่วน: สรุป + กำไรต่อเมนู + รายจ่าย (+ แยกวิธีชำระ) เพื่อยื่นภาษี/ส่งคนทำบัญชี
  const exportAccounting = () => {
    const BOM = "\uFEFF";
    const esc = (v) => {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = [];
    rows.push(["รายงานบัญชี", rangeLabels[range]]);
    rows.push([]);
    rows.push(["สรุป"]);
    rows.push(["ยอดขาย (บาท)", totalRevenue]);
    rows.push(["ต้นทุนวัตถุดิบ (บาท)", totalCost]);
    rows.push(["กำไรขั้นต้น (บาท)", grossProfit]);
    rows.push(["รายจ่ายรวม (บาท)", totalExpense]);
    rows.push(["ต้นทุนออร์เดอร์ที่ทำแล้วยกเลิก (บาท)", lostCost]);
    rows.push(["กำไรสุทธิ (บาท)", netProfit]);
    rows.push([]);
    rows.push(["วิธีชำระเงิน", "จำนวนออร์เดอร์", "ยอดรวม (บาท)"]);
    Object.values(payStats).forEach((p) => rows.push([p.label, p.count, p.amount]));
    rows.push([]);
    rows.push(["กำไรต่อเมนู", "ชิ้นที่ขาย", "รายได้ (บาท)", "ต้นทุน (บาท)", "กำไร (บาท)"]);
    menuProfit.forEach((m) => rows.push([m.name, m.qty, m.revenue, m.cost, m.revenue - m.cost]));
    rows.push([]);
    rows.push(["รายจ่าย", "วันที่", "หมวด", "หมายเหตุ", "จำนวน (บาท)"]);
    filteredExpenses.forEach((e) =>
      rows.push([e.title, new Date(e.createdAt).toLocaleDateString("th-TH"), e.category, e.note || "", e.amount])
    );
    const csv = BOM + rows.map((r) => r.map(esc).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `รายงานบัญชี-${rangeLabels[range]}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // ดาวน์โหลดไฟล์ CSV (เปิดใน Excel ได้ รองรับภาษาไทย) — ใส่ BOM UTF-8 กันภาษาไทยเพี้ยน
  const downloadCsv = (filename, rows) => {
    const BOM = "\uFEFF";
    const esc = (v) => {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = BOM + rows.map((r) => r.map(esc).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // รวมรายการสินค้าของออร์เดอร์เป็นข้อความเดียว (ชื่อ xจำนวน + ท็อปปิ้ง) สำหรับลงไฟล์
  const formatItems = (o) =>
    (o.items || [])
      .map((i) => {
        const addOns = (i.addOns || []).map((a) => `+${a.name}`).join(" ");
        return `${i.name} x${i.qty}${addOns ? " (" + addOns + ")" : ""}`;
      })
      .join(" | ");

  // ส่งออกออร์เดอร์ทั้งหมด (จากหน้า "ยอดขาย" เดิม) — รายละเอียดทีละออร์เดอร์ + สถานะจ่ายเงิน
  const exportOrders = () => {
    const rows = [
      ["เลขออร์เดอร์", "วันที่สั่ง", "ชื่อลูกค้า", "วิธีรับ", "รายการ", "ยอดรวม (บาท)", "ส่วนลด (บาท)", "วิธีชำระเงิน", "สถานะ"],
      ...sold.map((o) => [
        o.orderNo,
        new Date(o.createdAt).toLocaleString("th-TH"),
        o.customerName || "",
        o.method === "pickup" ? "รับที่ร้าน" : "จัดส่ง",
        formatItems(o),
        calcOrderTotal(o),
        (o.discount && o.discount.baht) || 0,
        o.paymentMethod === "cash" ? "เงินสด" : "พร้อมเพย์",
        o.status,
      ]),
    ];
    downloadCsv(`ออร์เดอร์-${rangeLabels[range]}.csv`, rows);
  };

  // ส่งออกออร์เดอร์ที่ยกเลิก — พร้อมสาเหตุ (จากหน้า "ยอดขาย" เดิม)
  const exportCancelled = () => {
    const rows = [
      ["เลขออร์เดอร์", "วันที่สั่ง", "วันที่ยกเลิก", "ชื่อลูกค้า", "วิธีรับ", "รายการ", "ยอดรวม (บาท)", "สาเหตุที่ยกเลิก"],
      ...cancelledOrders.map((o) => [
        o.orderNo,
        new Date(o.createdAt).toLocaleString("th-TH"),
        o.cancelledAt ? new Date(o.cancelledAt).toLocaleString("th-TH") : "",
        o.customerName || "",
        o.method === "pickup" ? "รับที่ร้าน" : "จัดส่ง",
        formatItems(o),
        calcOrderTotal(o),
        o.cancelReason || "",
      ]),
    ];
    downloadCsv(`ที่ยกเลิก-${rangeLabels[range]}.csv`, rows);

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">

        บัญชีร้าน

      </p>

        {["today", "7d", "30d", "all"].map((r) => (
          <button
            key={r}

              background: range === r ? COLORS.caramel : "#FFFFFF",
              color: range === r ? "#FFF9F0" : COLORS.inkSoft,
              border: `1px solid ${range === r ? COLORS.caramel : COLORS.line}`,

            {rangeLabels[r]}
          </button>

      {/* ส่งออกไฟล์ Excel — รายงานบัญชี + ออร์เดอร์ + ที่ยกเลิก */}

        <button
          onClick={exportAccounting}
          disabled={sold.length === 0 && filteredExpenses.length === 0}

            background: sold.length > 0 || filteredExpenses.length > 0 ? COLORS.sage : "#E3DDD3",
            color: sold.length > 0 || filteredExpenses.length > 0 ? "#FFF9F0" : "#A99A87",

        >
          <DownloadIcon size={13} /> รายงานบัญชี (Excel)
        </button>
        <button
          onClick={exportOrders}
          disabled={sold.length === 0}
          style={{
            background: sold.length > 0 ? COLORS.caramel : "#E3DDD3",
            color: sold.length > 0 ? "#FFF9F0" : "#A99A87",
            border: `1px solid ${sold.length > 0 ? COLORS.caramel : "#E3DDD3"}`,
          }}
          className="flex-1 rounded-xl py-2.5 text-xs font-semibold flex items-center justify-center gap-1.5 disabled:cursor-not-allowed"
        >

        <button

      {/* รอบการขายรายวัน — เปิดรอบ/จดเบิกฝาก/ปิดรอบ สรุปเงินสดตรง-เกิน-ขาด */}

              >
                <option value="withdraw">เบิก (เอาเงินออก)</option>

              </select>
              <input
                value={roundEntryForm.amount}

                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                className="w-20 rounded-xl px-3 py-2 text-sm bg-white outline-none text-center"
              />
              <input
                value={roundEntryForm.note}
                onChange={(e) => setRoundEntryForm((f) => ({ ...f, note: e.target.value }))}

                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}

              <button

                จด
              </button>
            </div>

            {/* ปิดรอบ */}
            <div style={{ borderTop: `1px dashed ${COLORS.line}` }} className="pt-2.5 space-y-1.5">
              <p style={{ color: COLORS.inkSoft }} className="text-[11px]">
                ปิดรอบเมื่อเลิกงาน — กรอกยอดเงินสดจริงในลิ้นชัก ระบบจะสรุปว่าตรง/เกิน/ขาด
              </p>
              <div className="flex gap-2">
                <input
                  value={roundCloseForm.cash}
                  onChange={(e) => setRoundCloseForm((f) => ({ ...f, cash: e.target.value.replace(/[^0-9.]/g, "") }))}

                  inputMode="decimal"
                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                  className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm bg-white outline-none"
                />
                <input
                  value={roundCloseForm.note}
                  onChange={(e) => setRoundCloseForm((f) => ({ ...f, note: e.target.value }))}

                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                  className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm bg-white outline-none"
                />
                <button
                  onClick={closeRound}
                  disabled={!roundCloseForm.cash}
                  style={{ background: COLORS.sage, color: "#FFF9F0" }}
                  className="rounded-xl px-3.5 text-xs font-semibold disabled:opacity-40"
                >
                  ปิดรอบ
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ประวัติรอบที่ปิดแล้ว */}
        {showRoundHistory && roundHistory.length > 0 && (
          <div className="mt-3 space-y-2">
            {roundHistory.map((r) => (
              <div key={r.id} style={{ background: COLORS.paper }} className="rounded-xl p-3">
                <div className="flex items-center justify-between mb-1">
                  <span style={{ color: COLORS.ink }} className="text-xs font-bold">
                    {new Date(r.openedAt).toLocaleDateString("th-TH")}
                  </span>
                  <span
                    style={{ color: r.diff === 0 ? COLORS.sage : r.diff > 0 ? "#B08628" : "#C0533F" }}
                    className="text-xs font-bold"
                  >
                    {r.diff === 0 ? "ตรงเป๊ะ" : r.diff > 0 ? `เกิน ฿${r.diff}` : `ขาด ฿${Math.abs(r.diff)}`}
                  </span>
                </div>
                <p style={{ color: COLORS.inkSoft }} className="text-[11px] leading-relaxed">
                  เปิด {new Date(r.openedAt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })} ·{" "}
                  ปิด {new Date(r.closedAt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })} · เงินสดเปิด ฿{fmtBaht(r.openingCash)} ·{" "}
                  ขายเงินสด ฿{fmtBaht(r.cashSales)} · ควรมี ฿{fmtBaht(r.expected)} · จริง ฿{fmtBaht(r.actual)}
                </p>
                {r.note && <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-0.5">หมายเหตุ: {r.note}</p>}
              </div>
            ))}
          </div>

      </div>

      {/* การ์ดสรุปกำไร/ขาดทุน */}
      <div className="grid grid-cols-2 gap-2 mb-4">
        <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-3.5">

          <p style={{ color: COLORS.caramelDark }} className="text-lg font-bold">฿{fmtBaht(totalRevenue)}</p>
        </div>
        <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-3.5">

      </div>
      {cancelledMade.length > 0 && (
        <div
          style={{ background: "#F3D9D3", color: "#8A3A2B", border: `1px solid #E3B7AC` }}

      {/* รายการที่ยกเลิก — แยกไว้อีกส่วน ดูสาเหตุการยกเลิกย้อนหลังได้ (จากหน้า "ยอดขาย" เดิมที่รวบมา) */}

            {cancelledOrders.map((o) => (
              <div

      {/* ยืนยันลบรายจ่าย */}
      {confirmDeleteExpense && (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-6">

    </div>
  );
}

// ================= ROOT APP =================
// กันหน้าจอขาวทั้งแอป — ถ้ามี error ตอน render (เช่นตอนลากวาง) จะแสดงข้อความ + ปุ่มรีเฟรชแทน
// และล็อก error จริงลง console ให้หาสาเหตุได้
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { err: null };
  }
  static getDerivedStateFromError(err) {
    return { err };
  }
  componentDidCatch(err, info) {
    console.error("ErrorBoundary caught:", err, info);
  }
  render() {
    if (this.state.err) {
      return (
        <div
          style={{
            minHeight: "100vh",
            background: COLORS.cream,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 12,
            padding: 24,
            fontFamily: "'Itim', sans-serif",
            color: COLORS.ink,
          }}
        >
          <p style={{ fontSize: 16, fontWeight: 600 }}>เกิดข้อผิดพลาดชั่วคราว</p>
          <p style={{ fontSize: 12, color: COLORS.inkSoft, textAlign: "center", maxWidth: 320, lineHeight: 1.6 }}>
            {(this.state.err && this.state.err.message) || "ไม่ทราบสาเหตุ"} — กดปุ่มด้านล่างเพื่อรีเฟรชหน้าจอ
          </p>
          <button
            onClick={() => window.location.reload()}
            style={{ background: COLORS.caramel, color: "#FFF9F0", padding: "10px 24px", borderRadius: 12, fontSize: 14, fontWeight: 600 }}
          >
            รีเฟรชหน้า
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [role, setRole] = useState("customer"); // customer | staff-menu | staff-orders
  // เมนูเริ่มต้นเป็น [] เมื่อเปิด sync — อย่าใช้ initialMenu (รูป stock จากลิงก์ Unsplash) ขึ้นก่อน
  // เดิมตอนโหลดหน้าครั้งแรกจะเห็นรูปที่เป็นลิงก์สต็อก แทนรูปจริงที่ร้านอัปโหลด จนกว่า Firestore จะตอบกลับมา
  const [menu, setMenu] = useState(FIREBASE_SYNC_ENABLED ? [] : initialMenu);
  const [promos, setPromos] = useState([]); // โปรโมชั่น — ซิงก์ผ่าน Firestore (config/promotions) เหมือนเมนู
  const [stockItems, setStockItems] = useState([]); // สต็อกวัตถุดิบ — config/stock: [{ id, name, unit, qty, minQty }]
  const [expenses, setExpenses] = useState([]); // รายจ่าย — config/expenses: [{ id, title, amount, category, note, createdAt }]
  // รอบการขายรายวัน — config/salesRound: { active: {...} | null, history: [...] }
  // active = รอบที่เปิดอยู่ตอนนี้ { id, openedAt, openingCash, note, entries: [{id,type,amount,note,createdAt}] }
  // history = รอบที่ปิดแล้ว { id, openedAt, closedAt, openingCash, expected, actual, diff, note, entries }
  const [salesRound, setSalesRound] = useState({ active: null, history: [] });
  const [staffMembers, setStaffMembers] = useState([]); // [{ uid, name }] รายชื่อเครื่องพนักงานที่ได้รับสิทธิ์ (staffUids)
  const [menuLoaded, setMenuLoaded] = useState(!FIREBASE_SYNC_ENABLED); // เมนูโหลดจาก Firestore เสร็จแล้วหรือยัง
  const [menuSaveError, setMenuSaveError] = useState(""); // ข้อความเตือนเมื่อบันทึกเมนูขึ้น Firestore ไม่สำเร็จ (เช่น เอกสารเกิน 1MB จากรูปเยอะ) — เดิมเงียบแค่ console.error พนักงานไม่รู้ว่าที่แก้ไปไม่ถูกบันทึกจริง
  const [cart, setCart] = useState([]);
  const [shopOpen, setShopOpen] = useState(true); // สถานะเปิด/ปิดร้าน — ซิงก์ผ่าน Firestore (config/shopStatus) เหมือนเมนู
  const [orders, setOrders] = useState([]);
  const [recentOrderIds, setRecentOrderIds] = useState(new Set()); // ออร์เดอร์ที่เพิ่งเข้ามาสด ๆ (ไว้ไฮไลต์ชั่วคราว)
  const [customerStage, setCustomerStage] = useState("menu"); // menu | checkout | success
  const [lastOrderNo, setLastOrderNo] = useState(null);
  const [lastPaymentMethod, setLastPaymentMethod] = useState(null);
  const [lastCustomer, setLastCustomer] = useState(null); // { name, houseNo } of the most recent order
  const [lastOrder, setLastOrder] = useState(null); // ออร์เดอร์ล่าสุดเต็มใบ — ใช้สร้างภาพหลักฐานการรับสินค้า
  // ข้อมูลร้าน (ชื่อร้าน + โค้ด QR พร้อมเพย์) — ตั้งค่าได้ที่หน้าจัดการเมนูฝั่งพนักงาน ซิงก์แบบเรียลไทม์
  // (ชื่อร้านแสดงที่หัวเมนูลูกค้า/ใบหลักฐาน QR ใช้รับเงินตอนชำระเงิน)
  const [shopInfo, setShopInfo] = useState({
    name: "น้ำหวาน & เบเกอรี่",
    slogan: "อบใหม่ทุกวัน · ปั่นสดทุกแก้ว",
    qr: PROMPTPAY_QR_URL,
    openTime: "09:00",
    closeTime: "20:00",
    deliveryOpenTime: "09:00",
    deliveryCloseTime: "20:00",
  });
  // หมวดเมนู — พนักงานเพิ่ม/ลบ/จัดเมนูเข้ากลุ่มได้ที่หน้าจัดการเมนู (ซิงก์ผ่าน Firestore config/categories)
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);

  // Staff access: only reachable via a link with ?staff=1, and only after a PIN.
  // Regular customers opening the shop link never see this — the switcher below
  // simply doesn't render for them.
  const [isStaffLink, setIsStaffLink] = useState(false);
  const [staffUnlocked, setStaffUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [staffChecking, setStaffChecking] = useState(false); // กำลังตรวจสอบสิทธิ์ใน staffUids (ต้องได้รับสิทธิ์จากเจ้าของร้านก่อน)
  const [staffDenied, setStaffDenied] = useState(false); // เครื่องนี้ยังไม่ได้รับสิทธิ์เข้าหน้าพนักงาน
  const [staffCheckError, setStaffCheckError] = useState(false); // ตรวจสอบสิทธิ์ไม่สำเร็จ (เน็ต / rules ยังไม่ได้อัปเดต)
  const [uidCopied, setUidCopied] = useState(false);
  const [uid, setUid] = useState(null); // ทุกคนที่เปิดแอป (ลูกค้า/พนักงาน) ได้ uid นิรนามจาก Firebase Auth (เฉพาะตอนเปิด sync)
  const [prevUid, setPrevUid] = useState(null); // uid ที่เครื่องนี้เคยใช้ครั้งก่อน (จดไว้ใน localStorage) — ไว้เตือนถ้า uid เปลี่ยน
  const staffTabsRef = useRef(null); // แถบแท็บพนักงาน — ใช้เลื่อนซ้าย/ขวาด้วยลูกศร
  const [anyModalOpen, setAnyModalOpen] = useState(false); // มีหน้าต่าง/ดรอว์เวอร์เปิดอยู่ → ซ่อนแถบแท็บ (ไม่ให้บังปุ่มปิดของหน้าต่าง)
  // ตรวจจับหน้าต่างที่เปิดอยู่ (fixed inset-0) ทุกหน้า — มีหน้าต่างเปิดเมื่อไหร่ แถบแท็บหายทันที
  useEffect(() => {
    const check = () => setAnyModalOpen(!!document.querySelector(".fixed.inset-0"));
    check();
    const obs = new MutationObserver(check);
    obs.observe(document.body, { childList: true, subtree: true });
    return () => obs.disconnect();
  }, []);
  // เลื่อนแถบแท็บพนักงาน (คอมจอแคบเห็นไม่ครบ 9 แท็บ ใช้ลูกศรเลื่อนได้)
  const scrollStaffTabs = (dir) => {
    const el = staffTabsRef.current;
    if (!el) return;
    el.scrollBy({ left: dir * 130, behavior: "smooth" });
  };

  useEffect(() => {
    if (!FIREBASE_SYNC_ENABLED) {
      setUid("offline"); // ไม่ได้เปิด sync — ไม่ต้องรอ auth ใด ๆ ปลดล็อกได้ทันที
      return;
    }
    const unsubscribe = auth.onAuthStateChanged((user) => {
      if (user) {
        setUid(user.uid);
      } else {
        auth.signInAnonymously().catch((err) => console.error("Anonymous sign-in failed:", err));
      }
    });
    return unsubscribe;
  }, []);

  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("staff") === "1") setIsStaffLink(true);    } catch (e) {
      // no-op — if URL isn't accessible for some reason, just stay in customer mode
    }
  }, []);

  // จดจำ uid ล่าสุดของเครื่องนี้ไว้ — ถ้า uid เปลี่ยน (เช่น เปิดลิงก์คนละเบราว์เซอร์ / ล้างข้อมูล / โหมดส่วนตัว)
  // จะเตือนบนหน้า "เครื่องนี้ยังไม่ได้รับสิทธิ์" เพราะรหัสที่เจ้าของร้านเพิ่มไปแล้วอาจไม่ตรงกับรหัสปัจจุบันของเครื่อง
  useEffect(() => {
    if (!isStaffLink || !uid || uid === "offline") return;
    try {
      const key = "freebuff_lastDeviceUid";
      const prev = localStorage.getItem(key);
      if (prev && prev !== uid) setPrevUid(prev);
      localStorage.setItem(key, uid);
    } catch (e) {
      // localStorage อาจถูกปิดใช้งาน — ข้ามไป ไม่กระทบฟังก์ชันหลัก
    }
  }, [isStaffLink, uid]);

  // ตรวจสอบว่าเครื่องนี้ได้รับสิทธิ์เป็นพนักงานแล้วหรือยัง — อ่านเฉพาะเอกสาร staffUids/{uid ของตัวเอง}
  // (rules เปิด read ให้เฉพาะ uid ตัวเอง → ไม่เปิดเผยรายชื่อพนักงานทั้งหมดให้ลูกค้าเห็น)
  // ถ้ายังไม่มีสิทธิ์ จะเข้าหน้าพนักงานไม่ได้เลย ต้องให้เจ้าของร้านเพิ่ม uid ใน Firebase Console ก่อน
  const checkStaffAccess = async () => {
    if (!FIREBASE_SYNC_ENABLED) {
      // โหมดออฟไลน์ (เปิดไฟล์เองในเครื่อง) — ไม่มี Firestore ให้ตรวจ ปลดล็อกตรง ๆ
      setStaffUnlocked(true);
      setRole("staff-orders");
      return;
    }
    if (!uid) throw new Error("ยังไม่พร้อมตรวจสิทธิ์ (uid ว่าง)"); // จริง ๆ ปุ่มเข้าสู่ระบบจะกดไม่ได้จนกว่า auth เสร็จ
    const doc = await db.collection("staffUids").doc(uid).get();
    if (doc.exists) {
      setStaffUnlocked(true);
      setRole("staff-orders");
    } else {
      setStaffDenied(true);
    }
  };

  const runStaffCheck = async () => {
    setStaffChecking(true);
    setStaffDenied(false);
    setStaffCheckError(false);
    try {
      await checkStaffAccess();
    } catch (err) {
      console.error("ตรวจสอบสิทธิ์พนักงานไม่สำเร็จ:", err);
      setStaffCheckError(true);
    } finally {
      setStaffChecking(false);
    }
  };

  const handlePinSubmit = async (e) => {
    e.preventDefault();
    if (pinInput !== STAFF_PIN) {
      setPinError(true);
      return;
    }
    setPinError(false);
    await runStaffCheck();
  };

  const copyUid = async () => {
    if (!uid) return;
    try {
      await navigator.clipboard.writeText(uid);
      setUidCopied(true);
      setTimeout(() => setUidCopied(false), 2000);
    } catch (err) {
      console.error("Copy uid failed:", err);
    }
  };

  // ฟัง Firestore แบบ real-time — ทุกเครื่องที่เปิดแอปนี้ (มือถือลูกค้า, แท็บเล็ตพนักงาน)
  // จะเห็นรายการออร์เดอร์ชุดเดียวกัน อัปเดตสดโดยไม่ต้องรีเฟรช
  // (โหมดออฟไลน์ — ไม่ทำอะไรตรงนี้ ออร์เดอร์อยู่แค่ใน state ของเครื่องนี้เครื่องเดียว)
  // เก็บ id ออร์เดอร์ล่าสุดที่ sync มาไว้เทียบรอบถัดไป (ref เพราะไม่ต้องการ re-render ตอนนี้เปลี่ยน)
  const prevOrderIdsRef = useRef(null);
  // เลขออร์เดอร์ล่าสุดที่เครื่องนี้สร้าง — กันเลขซ้ำกับออร์เดอร์ก่อนหน้าของเครื่องเดียวกัน (ถ้าซ้ำจริงจะ +1)
  const lastOrderNoRef = useRef(null);
  // กันเสียงเตือนรัว: ออเดอร์ใหม่ที่เข้ามาในหน้าต่าง 30 วิ จะเตือนรวมกันครั้งเดียว (เสียง + พูดจำนวนรวม)
  const NEW_ALERT_COOLDOWN_MS = 30000;
  const lastNewAlertAtRef = useRef(0);
  const pendingNewAlertRef = useRef(0);
  const newAlertTimerRef = useRef(null);

  useEffect(() => {
    if (!FIREBASE_SYNC_ENABLED) return;
    // rules อนุญาต read เฉพาะ staff — ลูกค้าทั่วไปยังไม่ปลดล็อกจะไม่มีสิทธิ์อ่าน
    // ไม่ subscribe ตั้งแต่แรกเลย กันไม่ให้เจอ permission-denied เต็ม console โดยเปล่าประโยชน์
    if (!staffUnlocked) return;
    const unsubscribe = db
      .collection("orders")
      .orderBy("createdAt", "asc")
      .onSnapshot(
        (snap) => {
          const newOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

          // ถ้ามีออร์เดอร์ใหม่โผล่มา (เทียบกับรอบก่อนหน้า) และพนักงานปลดล็อกอยู่ —
          // เล่นเสียง/สั่นเตือน + ไฮไลต์ออร์เดอร์นั้นชั่วคราว ให้รู้ทันทีไม่ต้องรีเฟรชเอง
          // (ข้ามรอบแรกสุดตอนเพิ่งโหลดหน้า เพื่อไม่ให้เตือนรัวกับออร์เดอร์เก่าที่มีอยู่แล้ว)
          if (prevOrderIdsRef.current) {
            const newlyArrivedIds = newOrders
              .filter((o) => !prevOrderIdsRef.current.has(o.id))
              .map((o) => o.id);
            if (newlyArrivedIds.length > 0 && staffUnlocked) {
              // กันเสียงรัว: ออเดอร์ใหม่ที่เข้ามาในหน้าต่าง 30 วิ จะเตือนรวมกันครั้งเดียว
              pendingNewAlertRef.current += newlyArrivedIds.length;
              const fireAlert = (orderNo) => {
                playNewOrderAlert();
                // พูดแจ้งเตือนเป็นประโยคด้วย — บอกจำนวนออเดอร์ใหม่ที่ยังค้างรวมกัน + เลขออเดอร์ (ถ้าออเดอร์เดียว)
                speakNewOrderAlert(pendingNewAlertRef.current, orderNo);
                lastNewAlertAtRef.current = Date.now();
                pendingNewAlertRef.current = 0;
              };
              if (Date.now() - lastNewAlertAtRef.current >= NEW_ALERT_COOLDOWN_MS) {
                const firstNew = newOrders.find((o) => newlyArrivedIds.includes(o.id));
                fireAlert(firstNew && firstNew.orderNo);
              } else if (!newAlertTimerRef.current) {
                // ยังอยู่ในช่วง cooldown — รวมจำนวนแล้วตั้งเวลาเตือนเป็นชุดเมื่อครบ 30 วิ
                const wait = NEW_ALERT_COOLDOWN_MS - (Date.now() - lastNewAlertAtRef.current);
                newAlertTimerRef.current = setTimeout(() => {
                  newAlertTimerRef.current = null;
                  if (pendingNewAlertRef.current > 0) fireAlert(null);
                }, wait);
              }
              setRecentOrderIds((prev) => new Set([...prev, ...newlyArrivedIds]));
              setTimeout(() => {
                setRecentOrderIds((prev) => {
                  const next = new Set(prev);
                  newlyArrivedIds.forEach((id) => next.delete(id));
                  return next;
                });
              }, 20000);
            }
          }
          prevOrderIdsRef.current = new Set(newOrders.map((o) => o.id));
          setOrders(newOrders);
        },
        (err) => {
          console.error("Firestore orders subscription failed:", err);
        }
      );
    return () => {
      if (newAlertTimerRef.current) {
        clearTimeout(newAlertTimerRef.current);
        newAlertTimerRef.current = null;
      }
      unsubscribe();
    };
  }, [staffUnlocked]);




  // ฟังเมนูจาก Firestore แบบเดียวกัน — เก็บเมนูทั้งชุดไว้ในเอกสารเดียว (config/menu)

            //    ตลอดไป (ทั้งฝั่งลูกค้าและฝั่งพนักงาน) เพราะเงื่อนไข !menuLoaded ไม่เคยเป็น false

            //    ทั้งที่จริงข้อมูลใน Firestore/ตัวแปร menu ยังอยู่ครบ — ถ้ากด "เพิ่มเมนูใหม่" ตอนนั้น
            //    (ปุ่มนี้ไม่ได้ล็อกไว้ตาม menuLoaded) เมนูเดิมจะไม่หาย เพราะ setMenu ใช้ prev ที่มีของเดิมอยู่แล้ว
            //    แต่ที่ "ดูเหมือน" เมนูหายทั้งร้านคือหน้าจอค้างโหลดไม่ยอมแสดงเมนูเดิมให้เห็นเลย
          } else {

          //    (ถ้าใส่ initialMenu จะเสี่ยงเขียนทับเมนูจริงตอนท้าย)

  useEffect(() => {

      .collection("config")

            // ⚠️ กันกรณี permission error ชั่วคราวทำให้ doc.exists = false แล้วเขียนทับข้อมูลจริง
            //    หมวดจะถูกสร้างใน Firebase ตอนพนักงานกดบันทึกหมวดครั้งแรกเอง
          }

  // เขียนหมวดเมนูกลับขึ้น Firestore ทุกครั้งที่พนักงานเพิ่ม/ลบหมวด
  const updateCategories = (updater) => {
    setCategories((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      // กดย้ายหมวดขึ้น/ลงซ้ำตอนอยู่ขอบ หรือลากวางบนหมวดเดิม — ลำดับไม่เปลี่ยนจริง (next === prev)
      // ข้ามการเขียน Firestore เลย กัน write + read ฟรีโดยไม่ได้เปลี่ยนอะไร
      if (next === prev) return prev;
      if (FIREBASE_SYNC_ENABLED) {
        db.collection("config")
          .doc("categories")
          .set({ items: next })
          .catch((err) => console.error("บันทึกหมวดเมนูขึ้น Firestore ไม่สำเร็จ:", err));
      }
      return next;
    });
  };

  // เขียนโปรโมชั่นกลับขึ้น Firestore ทุกครั้งที่พนักงานแก้ — ใช้จาก StaffPromoView
  const updatePromos = (updater) => {
    setPromos((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (FIREBASE_SYNC_ENABLED) {
        // ตัด _usage ออกก่อนเขียน (เป็นข้อมูลชั่วคราวที่ merge มาจากฟิลด์ usage ของเอกสาร ไม่ใช่ส่วนของ items)
        const clean = (next || []).map(({ _usage, ...rest }) => rest);
        // merge: true — กันทับฟิลด์ usage (จำนวนการใช้โค้ดที่ลูกค้าอัปเดต) ตอนพนักงานบันทึกโปรโมชั่น
        db.collection("config")
          .doc("promotions")
          .set({ items: clean }, { merge: true })
          .catch((err) => {
            console.error("บันทึกโปรโมชั่นขึ้น Firestore ไม่สำเร็จ:", err);
          });

      return next;
    });
  };

  // เขียนสต็อกกลับขึ้น Firestore ทุกครั้งที่พนักงานแก้ (เพิ่ม/แก้ไข/ลบ/นับสต็อก)
  const updateStock = (updater) => {

  // เขียนรายจ่ายกลับขึ้น Firestore ทุกครั้งที่พนักงานเพิ่ม/ลบ
  const updateExpenses = (updater) => {

  // หักสต็อกอัตโนมัติเมื่อออเดอร์ถูกทำเสร็จ (สถานะ → done) — ใช้สูตร recipe ของแต่ละเมนู
  // (เมนูไหนผูกวัตถุดิบอะไรไว้ กี่หน่วยต่อ 1 เสิร์ฟ ก็หักตามจำนวนที่สั่งจริง)
  // รวมท็อปปิ้ง/แอดออนที่ลูกค้าเลือกด้วย — แต่ละตัวเลือกก็ผูก recipe ได้เหมือนเมนูหลัก
  // ทำตอน "เสร็จแล้ว" ไม่ใช่ตอนสั่ง เพราะรู้แล้วว่าออเดอร์ถูกทำจริง (ออเดอร์ที่ยกเลิกจะไม่หัก)
  const deductStockForOrder = (order) => {
    if (!order || !Array.isArray(order.items)) return;
    const needs = {}; // stockId -> จำนวนที่ต้องใช้รวม
    (order.items || []).forEach((item) => {
      const mi = menu.find((m) => m.id === item.menuId || m.name === item.name);
      if (!mi) return;
      // วัตถุดิบของตัวเมนูหลัก
      Object.entries(mi.recipe || {}).forEach(([sid, qtyPer]) => {
        const per = Number(qtyPer) || 0;
        if (per > 0 && sid) needs[sid] = (needs[sid] || 0) + per * item.qty;
      });
      // วัตถุดิบของท็อปปิ้ง/แอดออนที่เลือก
      (item.addOns || []).forEach((ao) => {
        const opt = findMenuOption(mi, ao);
        if (!opt || !opt.recipe) return;
        Object.entries(opt.recipe).forEach(([sid, qtyPer]) => {
          const per = Number(qtyPer) || 0;
          if (per > 0 && sid) needs[sid] = (needs[sid] || 0) + per * item.qty;
        });
      });
    });
    const ids = Object.keys(needs);
    if (ids.length === 0) return;
    if (!FIREBASE_SYNC_ENABLED) {
      // โหมดออฟไลน์ — ไม่มีเครื่องอื่นมาแย่งเขียนพร้อมกันอยู่แล้ว อัปเดต local state ตรงๆ ได้ปลอดภัย
      setStockItems((prev) => prev.map((s) => (ids.includes(s.id) ? { ...s, qty: Math.max(0, (Number(s.qty) || 0) - needs[s.id]) } : s)));
      return;
    }
    // ใช้ transaction แทนการอ่าน state ในเครื่อง (prev) แล้ว .set() ทับทั้งก้อน — ถ้าพนักงาน 2 เครื่องกด
    // "เสร็จแล้ว" ของคนละออร์เดอร์เกือบพร้อมกัน วิธีเดิมจะเขียนทับกันเอง ทำให้การหักสต็อกของอีกฝั่งหายไปเงียบๆ
    // (สต็อกจะโชว์เหลือมากกว่าความจริง) transaction จะอ่านค่าล่าสุดจากเซิร์ฟเวอร์ก่อนคำนวณเสมอทุกครั้ง
    const docRef = db.collection("config").doc("stock");
    db.runTransaction(async (tx) => {
      const snap = await tx.get(docRef);
      const items = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : [];
      const nextItems = items.map((s) => (ids.includes(s.id) ? { ...s, qty: Math.max(0, (Number(s.qty) || 0) - needs[s.id]) } : s));
      tx.set(docRef, { items: nextItems });
    }).catch((err) => console.error("หักสต็อกขึ้น Firestore ไม่สำเร็จ:", err));
  };

  // รายชื่อเครื่องพนักงานที่ได้รับสิทธิ์ (staffUids) — ซิงก์แบบเรียลไทม์:
  // เพิ่มสิทธิ์เครื่องใหม่จากเครื่องไหนแล้ว ทุกเครื่องเห็นอัปเดตทันที (เฉพาะตอนปลดล็อกแล้ว)
  useEffect(() => {

    const unsubscribe = db
      .collection("staffUids")
      .onSnapshot(
        (snap) => setStaffMembers(snap.docs.map((d) => ({ uid: d.id, name: (d.data() && d.data().name) || "" }))),

  // เพิ่มสิทธิ์พนักงานให้เครื่องใหม่ — เขียนเอกสาร staffUids/{uid}
  // (rules บังคับว่าต้องเป็นพนักงานที่มีสิทธิ์อยู่แล้วเท่านั้นถึงเขียนได้)
  // คืนข้อความ error ถ้าไม่สำเร็จ → หน้า "สิทธิ์พนักงาน" จะโชว์ให้เห็น แทนที่จะเงียบ ๆ แล้วงงว่าทำไมไม่ขึ้น
  const addStaffUid = async (targetUid, name) => {
    if (!targetUid) return "ไม่มีรหัสอุปกรณ์";
    if (!FIREBASE_SYNC_ENABLED) return "เครื่องนี้ไม่ได้ต่อ Firebase — เปิดใช้งาน sync ก่อน";
    try {
      await db.collection("staffUids").doc(targetUid).set({ addedAt: Date.now(), name: name || "" });
      return null;
    } catch (err) {
      console.error("เพิ่มสิทธิ์พนักงานไม่สำเร็จ:", err);
      return staffWriteErrorMsg(err, "เพิ่มสิทธิ์");
    }
  };

  // ตั้งชื่อ/แก้ชื่อเครื่องพนักงาน (เช่น ชื่อคนหรือตำแหน่ง) — เก็บในเอกสาร staffUids/{uid}
  const renameStaffUid = async (targetUid, name) => {

  // ลบสิทธิ์พนักงาน — เครื่องนั้นจะเข้าหน้าพนักงานไม่ได้ทันที
  const removeStaffUid = async (targetUid) => {
