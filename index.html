  };

  // เขียนเมนูกลับขึ้น Firestore ทุกครั้งที่พนักงานแก้ (เพิ่ม/แก้ไข/ลบ/เปิดปิดขาย)
  // ห่อ setMenu เดิมไว้ชั้นหนึ่ง — MenuManagerView เรียกใช้เหมือนเดิมทุกอย่าง ไม่ต้องแก้โค้ดฝั่งนั้น
  const updateMenu = (updater) => {
    // ⚠️ กันบั๊กร้ายแรง: ถ้าเมนูจาก Firestore ยังโหลดไม่เสร็จ (เช่น เน็ตช้า/หลุดตอนเพิ่งเปิดแอป)
    // ตัวแปร menu ในเครื่องตอนนั้นยังเป็น [] (ว่าง) อยู่ — ถ้าพนักงานดันแก้ไข/เพิ่มเมนูในจังหวะนี้พอดี
    // โค้ดจะเอาเมนูว่างมาบวกของใหม่ แล้ว .set() ทับทั้งเอกสารบน Firestore ทำให้เมนูเก่าทั้งร้านหายจริง
    // (ไม่ใช่แค่หายในหน้าจอ) จึงต้องกันไว้ไม่ให้เขียนอะไรขึ้นเซิร์ฟเวอร์จนกว่าจะยืนยันว่าโหลดเมนูจริงมาแล้ว
    if (FIREBASE_SYNC_ENABLED && !menuLoaded) {
      setMenuSaveError("ระบบกำลังซิงค์เมนูจากเซิร์ฟเวอร์ กรุณารอสักครู่แล้วลองใหม่ (ป้องกันเมนูเก่าหายจากการบันทึกทับ)");
      return; // ไม่แก้แม้แต่ในเครื่อง กันพนักงานเข้าใจผิดว่าบันทึกแล้ว
    }
    setMenu((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      // กดย้ายขึ้น/ลงซ้ำตอนอยู่ขอบ (บนสุด/ล่างสุด) — ลำดับไม่เปลี่ยนจริง (next === prev)
      // ข้ามการเขียน Firestore เลย กัน write + read ฟรีโดยไม่ได้เปลี่ยนอะไร
      if (next === prev) return prev;
      if (FIREBASE_SYNC_ENABLED) {
        setMenuSaveError(""); // เคลียร์ error เก่าไว้ก่อน — ถ้าครั้งนี้เขียนสำเร็จจะได้ไม่ค้างข้อความเตือนเดิม
        db.collection("config").doc("menu").set({ items: next }).catch((err) => {
          console.error("บันทึกเมนูขึ้น Firestore ไม่สำเร็จ:", err);
          // ⚠️ เดิมเงียบแค่ console.error — พนักงานเห็นเมนูเปลี่ยนในเครื่องตัวเอง (optimistic UI)
          // แต่จริง ๆ ยังไม่ถูกบันทึกขึ้น Firestore เลย พอปิดแอป/เปิดใหม่ค่าจะหลุดกลับไปเป็นของเก่า
          // เช่น เอกสารเมนูรวมทั้งร้านเกิน 1MB (รูปเยอะเกินไป) หรือเน็ตหลุดตอนบันทึก
          setMenuSaveError(
            err && err.code === "resource-exhausted"
              ? "บันทึกเมนูไม่สำเร็จ: ข้อมูลเมนูรวมกันใหญ่เกิน 1MB (รูปเมนูเยอะเกินไป) กรุณาลดขนาด/จำนวนรูปแล้วลองใหม่"
              : "บันทึกเมนูขึ้นเซิร์ฟเวอร์ไม่สำเร็จ การแก้ไขนี้อาจหายไปถ้าปิดแอป — ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง"
          );
        });
      }
      return next;
    });
  };

  const placeOrder = async (paymentMethod, slip, customer, discount, cod) => {
    // เลขออร์เดอร์ — ใช้เลขท้าย 6 หลักของเวลาปัจจุบัน (เดิมใช้ 4 หลักซึ่งวนซ้ำทุก 10 วินาที
    // ทำให้ออร์เดอร์ที่มาใกล้กันได้เลขซ้ำ — 6 หลักวนซ้ำทุก ~16.6 นาที โอกาสชนกันแทบไม่มี
    // สำหรับร้านเล็ก) บวกกันเลขซ้ำกับออร์เดอร์ก่อนหน้าของเครื่องนี้ด้วย (ถ้าซ้ำจริงจะ +1)
    const base = Number(String(Date.now()).slice(-6));
    const orderNo = base === lastOrderNoRef.current ? (base + 1) % 1000000 : base;
    lastOrderNoRef.current = orderNo;
    // นับการใช้โค้ดส่วนลดเมื่อสั่งสำเร็จ — เพิ่มจำนวนครั้งที่ใช้ + จดเครื่องที่ใช้ (กันใช้ซ้ำถ้าเป็นแบบ 1 ครั้ง/คน)
    // เขียนไปที่ฟิลด์ usage ของ config/promotions ด้วย FieldValue increment/arrayUnion (อัปเดตแบบอะตอมมิก)
    // ทำไมไม่เขียนทับ items ทั้งก้อน: เครื่องลูกค้าไม่มีสิทธิ์เขียน config (rules กันไว้) —
    // rules เปิดให้ลูกค้าอัปเดตได้เฉพาะฟิลด์ usage เท่านั้น พนักงานยังเขียนได้ทุกอย่างเหมือนเดิม
    const countPromoUse = () => {
      if (!discount || !discount.promoId) return;
      if (!FIREBASE_SYNC_ENABLED) {
        // โหมดออฟไลน์ — อัปเดตเฉพาะ state ในเครื่อง (ไม่มี Firestore ไม่มีลูกค้าเครื่องอื่นมาแย่งพร้อมกันอยู่แล้ว)
        setPromos((prev) =>
          prev.map((p) =>
            p.id === discount.promoId
              ? {
                  ...p,
                  uses: (Number(p.uses) || 0) + 1,
                  usedBy: discount.perCustomer ? [...((p.usedBy || []).filter((u) => u !== uid)), uid] : p.usedBy || [],
                }
              : p
          )
        );
        return;
      }
      // ใช้ transaction แทน update ตรงๆ — กันสองเครื่องกดสั่งพร้อมกันแย่งโควตาสุดท้ายของโค้ดที่ตั้ง "จำกัดจำนวนใช้"
      // (update ธรรมดา + increment แม้เป็น atomic แต่ไม่เช็คโควตาตอนเขียนจริง สองเครื่องอาจผ่านทั้งคู่ทั้งที่โควตาเหลือ 1)
      // transaction จะอ่านค่าล่าสุดจากเซิร์ฟเวอร์ก่อนเขียนเสมอ ถ้าชนกันจะลองใหม่อัตโนมัติ หรือถ้าโควตาเต็มแล้วจะไม่เขียน
      const docRef = db.collection("config").doc("promotions");
      db.runTransaction(async (tx) => {
        const snap = await tx.get(docRef);
        const data = snap.exists ? snap.data() : {};
        const usage = (data.usage && data.usage[discount.promoId]) || {};
        const usesCount = Number(usage.uses) || 0;
        const usedByList = usage.usedBy || [];
        if (Number(discount.maxUses) > 0 && usesCount >= Number(discount.maxUses)) {
          throw new Error("โควตาการใช้โค้ดเต็มแล้วก่อนที่ออร์เดอร์นี้จะบันทึกสำเร็จ");
        }
        if (discount.perCustomer && usedByList.includes(uid)) {
          throw new Error("ลูกค้าคนนี้เคยใช้โค้ด 1 ครั้ง/คนนี้ไปแล้ว");
        }
        const upd = { [`usage.${discount.promoId}.uses`]: firebase.firestore.FieldValue.increment(1) };
        if (discount.perCustomer) {
          upd[`usage.${discount.promoId}.usedBy`] = firebase.firestore.FieldValue.arrayUnion(uid);
        }
        tx.update(docRef, upd);
      }).catch((err) => {
        // ออร์เดอร์ยังบันทึกสำเร็จอยู่ (ลูกค้าจ่ายเงินไปแล้ว) แค่การนับโควตาโค้ดพลาด — พนักงานตรวจสอบย้อนหลังได้จาก log
        // ไม่ throw ต่อ เพราะไม่อยากบล็อกออร์เดอร์ที่ลูกค้าจ่ายเงินสำเร็จแล้วจากการนับโควตาที่พลาดทีหลัง
        console.error("นับการใช้โค้ดไม่สำเร็จ:", err);
      });
    };
    const newOrder = {
      orderNo,
      customerName: customer?.name || "",
      phone: customer?.phone || "", // เบอร์ติดต่อกลับ (ร้านโทรหาถ้าเกิดปัญหา)
      method: customer?.method || "delivery", // pickup | delivery
      houseNo: customer?.houseNo || "",
      deliveryDate: customer?.deliveryDate || "",
      deliveryTime: customer?.deliveryTime || "",
      deliveryNow: customer?.deliveryNow || false, // ส่งตอนนี้ (เร็วที่สุด) — ไม่มีวันเวลาล่วงหน้า
      items: cart,
      status: "new",
      createdAt: Date.now(),
      paymentMethod,
      slip: slip || null,
      discount: discount || null, // { code, percent, baht } — ส่วนลดจากโค้ด (ถ้ามี)
      // สถานะการจ่ายเงิน — จ่ายแล้วตอนสั่ง (โอน + แนบสลิป) หรือยังไม่จ่าย (เงินสด / เก็บปลายทาง)
      // ใช้กับป้าย "จ่ายแล้ว / ยังไม่จ่าย" ในการ์ดออร์เดอร์ฝั่งพนักงาน และให้คนส่งรู้ว่าต้องเก็บเงินไหม
      collectOnDelivery: !!cod || paymentMethod === "cash",
      paid: !!slip && paymentMethod !== "cash" && !cod,
    };
    if (FIREBASE_SYNC_ENABLED) {
      try {
        const docRef = await db.collection("orders").add(newOrder);
        setLastOrderNo(orderNo);
        setLastPaymentMethod(paymentMethod);
        setLastCustomer(customer || null);
        setLastOrder({ ...newOrder, id: docRef.id });
        countPromoUse();
        setCart([]);
        setCustomerStage("success");
        return docRef.id;
      } catch (err) {
        console.error("Failed to place order:", err);
        alert("ส่งออร์เดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง");
        return null;
      }
    } else {
      // โหมดออฟไลน์ — เก็บไว้ใน state ของเครื่องนี้เท่านั้น (รีเฟรชหน้าแล้วจะหาย)
      const localId = `local-${orderNo}`;
      setOrders((prev) => [...prev, { id: localId, ...newOrder }]);
      setLastOrderNo(orderNo);
      setLastPaymentMethod(paymentMethod);
      setLastCustomer(customer || null);
      setLastOrder({ ...newOrder, id: localId });
      countPromoUse();
      setCart([]);
      setCustomerStage("success");
      return localId;
    }
  };

  const advanceOrder = async (id) => {
    const order = orders.find((o) => o.id === id);
    if (!order) return;
    // ลำดับสถานะ: new → preparing → done (กดจากหน้าออร์เดอร์ร้าน)
    // → รับที่ร้าน: received (รับสินค้าแล้ว) / จัดส่ง: delivered (จัดส่งเสร็จแล้ว) — กดจากหน้าคิวจัดส่ง
    // กดปุ่มซ้ำจาก delivered/received → done = ย้อนกลับ เผื่อกดผิด
    const next =
      order.status === "new"
        ? "preparing"
        : order.status === "preparing"
        ? "done"
        : order.status === "done"
        ? (order.method === "pickup" ? "received" : "delivered")
        : "done";
    // อัปเดต state ท้องถิ่นทันที (optimistic) — UI ตอบสนองไว ไม่ต้องรอ Firestore รอบกลับ
    // แล้วค่อยซิงก์ขึ้น Firestore ด้านหลัง (บนเครื่องที่มีสิทธิ์ อีกสักครู่ Firestore จะยืนยันสถานะเดียวกันอีกที)
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, status: next } : o)));
    // หักสต็อกอัตโนมัติตอนออเดอร์ทำเสร็จ (ใหม่ → กำลังทำ → เสร็จแล้ว) — ตามสูตรวัตถุดิบที่ผูกไว้กับเมนู
    // เฉพาะตอนเพิ่งเสร็จครั้งแรก (preparing → done) — ย้อนกลับจาก delivered → done จะไม่หักซ้ำ
    // ออเดอร์ที่ได้ของสำเร็จรูปมา (goodsFromOrderId) จะไม่หักซ้ำ — ของอีกใบตัดสต็อกไปแล้ว
    if (next === "done" && order.status === "preparing" && !order.goodsFromOrderId) {
      deductStockForOrder(order);
    }
    if (FIREBASE_SYNC_ENABLED) {
      try {
        await db.collection("orders").doc(id).update({ status: next });
      } catch (err) {
        console.error("Failed to update order status:", err);
      }
    }
  };

  // ยกเลิกออร์เดอร์ — เช่นลูกค้าโทรมายกเลิกที่ร้าน แยกจากการลบถาวร
  // ออร์เดอร์ที่ยกเลิกยังอยู่ในระบบให้ดูย้อนหลังได้ แต่จะไม่ถูกนับรวมในแดชบอร์ดยอดขาย
  // ยกเลิกออร์เดอร์ — เช่นลูกค้าโทรมายกเลิกที่ร้าน ต้องระบุสาเหตุด้วยเสมอ
  // อัปเดต state ท้องถิ่นทันที (optimistic) แล้วค่อยซิงก์ Firestore ด้านหลัง
  const cancelOrder = async (id, reason) => {
    const order = orders.find((o) => o.id === id);
    const cancelReason = (reason || "").trim();
    const cancelledAt = Date.now();
    // บันทึกสถานะตอนยกเลิก (cancelledFrom) — ใช้ในบัญชีว่าใบนี้เคยทำเสร็จแล้วหรือยัง
    // (ยกเลิกจาก "เสร็จแล้ว" = ทำจริงแล้ว → ต้นทุนติดบัญชีเป็นขาดทุน)
    const cancelledFrom = order ? order.status : "";
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, status: "cancelled", cancelReason, cancelledAt, cancelledFrom } : o)));
    if (FIREBASE_SYNC_ENABLED) {
      try {
        await db.collection("orders").doc(id).update({ status: "cancelled", cancelReason, cancelledAt, cancelledFrom });
      } catch (err) {
        console.error("Failed to cancel order:", err);
      }
    }
  };

  // ลูกค้ามารับของออร์เดอร์ที่ยกเลิกไปแล้ว — กดจากปุ่ม "ลูกค้ามารับของแล้ว" บนการ์ดที่ยกเลิก
  // เปลี่ยนกลับเป็น "รับสินค้าแล้ว" (รับที่ร้าน) / "จัดส่งเสร็จแล้ว" (จัดส่ง) เพื่อนับรวมยอดขาย
  // (ถ้ายังไม่จ่าย พนักงานกด "เก็บเงินแล้ว" ตามปกติ)
  const reviveCancelledOrder = async (id) => {
    const order = orders.find((o) => o.id === id);
    if (!order || order.status !== "cancelled") return;
    const next = order.method === "pickup" ? "received" : "delivered";
    const completedAt = Date.now();
    setOrders((prev) =>
      prev.map((o) => (o.id === id ? { ...o, status: next, cancelReason: "", cancelledFrom: "", completedAt } : o))
    );
    if (FIREBASE_SYNC_ENABLED) {
      try {
        await db.collection("orders").doc(id).update({ status: next, cancelReason: "", cancelledFrom: "", completedAt });
      } catch (err) {
        console.error("Failed to revive cancelled order:", err);
      }
    }
  };

  // เอาของที่ทำเสร็จแล้วของออร์เดอร์ที่ยกเลิก (A) ไปให้ออร์เดอร์ใหม่ (B) ที่สั่งรายการเดียวกัน
  // A: กำกับ goodsUsedByOrderId → ไม่นับขาดทุนในบัญชี (ของไม่ได้ทิ้ง)
  // B: กำกับ goodsFromOrderId → ตอน B ทำเสร็จจะไม่ตัดสต็อกซ้ำ (ของ A ตัดไปแล้วตอนทำ)
  const transferGoods = async (id, targetId) => {
    const order = orders.find((o) => o.id === id);
    const target = orders.find((o) => o.id === targetId);
    if (!order || !target || order.status !== "cancelled") return;
    setOrders((prev) =>
      prev.map((o) =>
        o.id === id
          ? { ...o, goodsUsedByOrderId: targetId }
          : o.id === targetId
          ? { ...o, goodsFromOrderId: id }
          : o
      )
    );
    if (FIREBASE_SYNC_ENABLED) {
      try {
        await db.collection("orders").doc(id).update({ goodsUsedByOrderId: targetId });
        await db.collection("orders").doc(targetId).update({ goodsFromOrderId: id });
      } catch (err) {
        console.error("Failed to transfer goods:", err);
        // เขียน Firestore ไม่สำเร็จ — ย้อนป้ายกลับในเครื่องให้ตรงกับระบบจริง แล้วแจ้งให้ลองใหม่
        // (ไม่งั้น snapshot รอบถัดไปจะเอาป้ายกลับมา ทำให้การ์ด/บัญชีสลับไปมาเงียบ ๆ)
        setOrders((prev) =>
          prev.map((o) => {
            if (o.id === id) {
              const { goodsUsedByOrderId, ...rest } = o;
              return rest;
            }
            if (o.id === targetId) {
              const { goodsFromOrderId, ...rest } = o;
              return rest;
            }
            return o;
          })
        );
        alert("โอนของไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง");
      }
    }
  };

  // ยกเลิกการโอนของ — กดจากปุ่มเดิมบนการ์ด A ที่โอนไปแล้ว (เลือก B ผิด/เปลี่ยนใจ)
  // ล้างเครื่องหมายทั้ง 2 ฝั่งกลับเป็น "ยังไม่ได้โอน": A กลับไปนับขาดทุนในบัญชี, B ต้องทำของใหม่ + ตัดสต็อกตอนทำเสร็จ
  const untagTransferGoods = async (id) => {
    const order = orders.find((o) => o.id === id);
    if (!order || order.status !== "cancelled" || !order.goodsUsedByOrderId) return;
    const targetId = order.goodsUsedByOrderId;
    setOrders((prev) =>
      prev.map((o) => {
        if (o.id === id) {
          const { goodsUsedByOrderId, ...rest } = o;
          return rest;
        }
        if (o.id === targetId) {
          const { goodsFromOrderId, ...rest } = o;
          return rest;
        }
        return o;
      })
    );
    if (FIREBASE_SYNC_ENABLED) {
      try {
        await db
          .collection("orders")
          .doc(id)
          .update({ goodsUsedByOrderId: firebase.firestore.FieldValue.delete() });
        await db
          .collection("orders")
          .doc(targetId)
          .update({ goodsFromOrderId: firebase.firestore.FieldValue.delete() });
      } catch (err) {
        console.error("Failed to undo goods transfer:", err);
        // เขียน Firestore ไม่สำเร็จ — เอาป้ายกลับคืนให้ตรงกับระบบจริง แล้วแจ้งให้ลองใหม่
        // (ไม่งั้น snapshot รอบถัดไปจะเอาป้ายกลับมา ทำให้การ์ด/บัญชีสลับไปมาเงียบ ๆ)
        setOrders((prev) =>
          prev.map((o) => {
            if (o.id === id) return { ...o, goodsUsedByOrderId: targetId };
            if (o.id === targetId) return { ...o, goodsFromOrderId: id };
            return o;
          })
        );
        alert("ยกเลิกการโอนไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง");
      }
    }
  };

  // ลบออร์เดอร์รายตัว — พนักงานกดลบเองจากการ์ดออร์เดอร์ (มี confirm กันกดพลาด)
  const deleteOrder = async (id) => {
    if (FIREBASE_SYNC_ENABLED) {
      try {
        await db.collection("orders").doc(id).delete();
      } catch (err) {
        console.error("Failed to delete order:", err);
      }
    } else {
      setOrders((prev) => prev.filter((o) => o.id !== id));
    }
  };

  // เก็บเงินแล้ว (คนส่งเก็บเงินสด/เก็บปลายทางจากลูกค้าแล้ว) — จดสถานะว่าออร์เดอร์นี้จ่ายแล้ว
  // อัปเดต state ท้องถิ่นทันที (optimistic) แล้วค่อยซิงก์ Firestore ด้านหลัง
  // หมายเหตุ: ไม่แตะฟิลด์ collectOnDelivery — เก็บค่าเดิมไว้ (ถ้าย้อนกลับเป็น "ยังไม่จ่าย"
  // จะได้รู้ว่าออร์เดอร์นี้ต้องเก็บเงินตอนรับของไหม เหมือนตอนที่สั่ง)
  const markOrderPaid = (id) => {
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, paid: true } : o)));
    if (FIREBASE_SYNC_ENABLED) {
      db.collection("orders")
        .doc(id)
        .update({ paid: true })
        .catch((err) => console.error("บันทึกสถานะจ่ายเงินไม่สำเร็จ:", err));
    }
  };

  // ย้อนกลับสถานะเป็น "ยังไม่จ่าย" (กดผิด/เก็บเงินยังไม่ครบ) — มีป็อปอัพยืนยันก่อนกดที่หน้าการ์ด
  // คืนค่า collectOnDelivery กลับตามเดิม: ออร์เดอร์เงินสดต้องเก็บตอนรับของเสมอ ส่วนออร์เดอร์อื่น
  // ใช้ค่าเดิมที่จดไว้ตอนสั่ง (เก็บปลายทาง = true, โอน+สลิป = false)
  const unmarkOrderPaid = (id) => {
    const order = orders.find((o) => o.id === id);
    if (!order) return;
    const restoreCollect = order.paymentMethod === "cash" ? true : order.collectOnDelivery;
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, paid: false, collectOnDelivery: restoreCollect } : o)));
    if (FIREBASE_SYNC_ENABLED) {
      db.collection("orders")
        .doc(id)
        .update({ paid: false, collectOnDelivery: restoreCollect })
        .catch((err) => console.error("ย้อนกลับสถานะจ่ายเงินไม่สำเร็จ:", err));
    }
  };

  // ลบออร์เดอร์ตาม id ที่พนักงานติ๊กเลือก — ลบทีละรายการ/เฉพาะที่เลือก กันลบทั้งก้อนพลาด
  // ลบออกจาก state ท้องถิ่นทันที (optimistic) แล้วค่อยลบขึ้น Firestore ด้านหลัง
  const deleteOrdersByIds = async (ids) => {
    const list = Array.isArray(ids) ? ids : [ids];
    if (list.length === 0) return;
    setOrders((prev) => prev.filter((o) => !list.includes(o.id)));
    if (FIREBASE_SYNC_ENABLED) {
      try {
        const batch = db.batch();
        list.forEach((id) => batch.delete(db.collection("orders").doc(id)));
        await batch.commit();
      } catch (err) {
        console.error("Failed to delete orders:", err);
      }
    }
  };


  // กำลังตรวจสอบสิทธิ์ (หลังกรอก PIN ถูกต้อง)
  if (isStaffLink && staffChecking) {
    return (
      <div
        style={{ fontFamily: "'Itim', sans-serif", background: COLORS.cream || "#FFF9F0" }}
        className="w-full min-h-screen flex flex-col items-center justify-center px-6"
      >
        <div className="w-full max-w-xs text-center">
          <p style={{ color: COLORS.ink }} className="text-lg font-semibold mb-1">กำลังตรวจสอบสิทธิ์...</p>
          <p style={{ color: COLORS.inkSoft }} className="text-xs">ตรวจสอบว่าเครื่องนี้ได้รับอนุญาตจากเจ้าของร้านแล้ว</p>
        </div>
      </div>
    );
  }

  // PIN ถูกต้องแล้ว แต่เครื่องนี้ยังไม่ได้รับสิทธิ์ — บังคับให้เจ้าของร้านเพิ่ม uid ใน Firebase Console ก่อน
  if (isStaffLink && staffDenied) {
    return (
      <div
        style={{ fontFamily: "'Itim', sans-serif", background: COLORS.cream || "#FFF9F0" }}
        className="w-full min-h-screen flex flex-col items-center justify-center px-6"
      >
        <div className="w-full max-w-xs text-center">
          <div style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
            <X size={22} />
          </div>
          <p style={{ color: COLORS.ink }} className="text-lg font-semibold mb-1">เครื่องนี้ยังไม่ได้รับสิทธิ์</p>
          <p style={{ color: COLORS.inkSoft }} className="text-xs mb-3 leading-relaxed">
            ต้องให้เจ้าของร้านเพิ่มรหัสอุปกรณ์ด้านล่างนี้ (ในแอป: แท็บ "สิทธิ์พนักงาน" → วางรหัส → เพิ่มสิทธิ์
            หรือใน Firebase Console: Firestore → staffUids → สร้างเอกสารใหม่โดยใช้รหัสนี้เป็นชื่อเอกสาร)
            แล้วกด "ตรวจสอบสิทธิ์อีกครั้ง" — ทำครั้งเดียวต่อเครื่อง
          </p>

          {/* ถ้ารหัสอุปกรณ์เปลี่ยนจากครั้งก่อน (เปิดคนละเบราว์เซอร์ / ล้างข้อมูล / โหมดส่วนตัว) — เตือนว่าทำไมสิทธิ์ถึงยังไม่ติด */}
          {prevUid && (
            <div
              style={{ background: "#F3D9D3", color: "#A03A2A", border: "1px solid #E4B4A9" }}
              className="rounded-xl px-3 py-2.5 text-[11px] font-medium mb-3 leading-relaxed text-left"
            >
              ⚠️ รหัสอุปกรณ์ของเครื่องนี้เปลี่ยนจากครั้งก่อนหน้าแล้ว — ถ้าเจ้าของร้านเพิ่มรหัสเก่าไปแล้ว รหัสใหม่ด้านล่างนี้จะยังเข้าไม่ได้
              ให้เจ้าของร้านเพิ่มรหัสใหม่นี้ หรือเปิดลิงก์ด้วยเบราว์เซอร์เดิมที่เคยเปิด
            </div>
          )}
          <div
            style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            className="rounded-xl px-3 py-3 text-xs font-mono break-all mb-2 select-all"
          >
            {uid}
          </div>
          <button
            type="button"
            onClick={copyUid}
            style={{ background: uidCopied ? COLORS.sageSoft : COLORS.peachSoft, color: uidCopied ? COLORS.sage : COLORS.caramelDark }}
            className="w-full rounded-xl py-2.5 text-sm font-semibold mb-2 flex items-center justify-center gap-1.5"
          >
            {uidCopied ? <Check size={15} /> : null}
            {uidCopied ? "คัดลอกแล้ว" : "คัดลอกรหัส"}
          </button>
          <button
            type="button"
            onClick={runStaffCheck}
            style={{ background: COLORS.ink, color: "#FFF9F0" }}
            className="w-full rounded-xl py-3 text-sm font-semibold"
          >
            ตรวจสอบสิทธิ์อีกครั้ง
          </button>
          <button
            type="button"
            onClick={() => { window.location.href = window.location.pathname; }}
            style={{ color: COLORS.inkSoft }}
            className="w-full text-xs font-medium mt-3"
          >
            ออกจากหน้าพนักงาน
          </button>
        </div>
      </div>
    );
  }

  // ตรวจสอบสิทธิ์ไม่สำเร็จ (เน็ตขัดข้อง หรือเจ้าของร้านยังไม่ได้อัปเดต rules ให้อ่าน staffUids/{uid ตัวเอง})
  if (isStaffLink && staffCheckError) {
    return (
      <div
        style={{ fontFamily: "'Itim', sans-serif", background: COLORS.cream || "#FFF9F0" }}
        className="w-full min-h-screen flex flex-col items-center justify-center px-6"
      >
        <div className="w-full max-w-xs text-center">
          <p style={{ color: COLORS.ink }} className="text-lg font-semibold mb-1">ตรวจสอบสิทธิ์ไม่สำเร็จ</p>
          <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4 leading-relaxed">
            ตรวจอินเทอร์เน็ตให้เรียบร้อยแล้วลองอีกครั้ง ถ้ายังไม่หาย ตรวจสอบว่าเจ้าของร้านอัปเดต rules ของ staffUids แล้ว
            (ต้องเปิดให้อ่านเฉพาะ uid ของตัวเอง)
          </p>
          <button
            type="button"
            onClick={runStaffCheck}
            style={{ background: COLORS.ink, color: "#FFF9F0" }}
            className="w-full rounded-xl py-3 text-sm font-semibold"
          >
            ลองอีกครั้ง
          </button>
          <button
            type="button"
            onClick={() => { window.location.href = window.location.pathname; }}
            style={{ color: COLORS.inkSoft }}
            className="w-full text-xs font-medium mt-3"
          >
            ออกจากหน้าพนักงาน
          </button>
        </div>
      </div>
    );
  }

  // Staff link but not unlocked yet → show a PIN screen instead of the app.
  if (isStaffLink && !staffUnlocked) {
    return (
      <div
        style={{ fontFamily: "'Itim', sans-serif", background: COLORS.cream || "#FFF9F0" }}
        className="w-full min-h-screen flex flex-col items-center justify-center px-6"
      >
        <form onSubmit={handlePinSubmit} className="w-full max-w-xs">
          <p style={{ color: COLORS.ink }} className="text-lg font-semibold mb-1 text-center">เข้าสู่หน้าพนักงาน</p>
          <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4 text-center">กรอกรหัส PIN ของร้าน</p>
          <input
            type="password"
            inputMode="numeric"
            value={pinInput}
            onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
            style={{ border: `1.5px solid ${pinError ? "#C0533F" : COLORS.line}` }}
            className="w-full rounded-xl px-4 py-3 text-center text-lg tracking-widest mb-2 outline-none"
            placeholder="••••"
            autoFocus
          />
          {pinError && <p className="text-xs text-center mb-2" style={{ color: "#C0533F" }}>รหัสไม่ถูกต้อง</p>}
          <button
            type="submit"
            disabled={!uid}
            style={{ background: COLORS.ink, color: "#FFF9F0", opacity: uid ? 1 : 0.5 }}
            className="w-full rounded-xl py-3 text-sm font-semibold"
          >
            {uid ? "เข้าสู่ระบบ" : "กำลังเชื่อมต่อ..."}
          </button>
        </form>
      </div>
    );
  }

  return (
    <div
      style={{ fontFamily: "'Itim', sans-serif" }}
      className="w-full min-h-screen flex flex-col items-center"
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');
      `}</style>

      {/* Role switcher — only rendered once a staff PIN has been entered.
          A plain customer opening the site never sees this at all.
          แถบแท็บ (ออร์เดอร์ร้าน/จัดการเมนู) sticky ติดบนจอตอนเลื่อน
          ส่วนปุ่มตั้งค่าซิงค์ เลื่อนไปกับเนื้อหาปกติ ไม่ลอยค้างกลางจอ */}
      {staffUnlocked && !anyModalOpen && (
        <>
          <div className={`w-full ${role === "customer" ? "max-w-md" : "max-w-md md:max-w-none"} sticky top-0 z-30 px-3 pt-3`}>
            <div
              style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }}
              className="rounded-2xl p-1 shadow-sm flex items-center gap-1"
            >
              {/* ลูกศรซ้าย — เลื่อนแท็บ (คอมจอแคบไม่เห็นทุกแท็บ ใช้เลื่อนได้) */}
              <button
                onClick={() => scrollStaffTabs(-1)}
                aria-label="เลื่อนแท็บซ้าย"
                className="flex-shrink-0 w-7 h-7 rounded-xl flex items-center justify-center active:scale-95 transition-transform"
                style={{ background: COLORS.cream, color: COLORS.inkSoft }}
              >
                <ChevronLeft size={16} />
              </button>
              <div
                ref={staffTabsRef}
                onWheel={(e) => {
                  // เลื่อนล้อเมาส์แนวตั้ง → เลื่อนแท็บแนวนอน (ใช้งานง่ายกว่าบนคอม)
                  if (staffTabsRef.current && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    staffTabsRef.current.scrollBy({ left: e.deltaY, behavior: "auto" });
                    e.preventDefault();
                  }
                }}
                className="flex-1 flex gap-1 overflow-x-auto no-scrollbar py-1"
              >
                {[
                  { id: "staff-orders", label: "ออร์เดอร์ร้าน" },
                  { id: "staff-delivery", label: "จัดส่ง" },
                  { id: "staff-menu", label: "จัดการเมนู" },
                  { id: "staff-accounting", label: "บัญชี" },
                  { id: "staff-stock", label: "สต็อก" },
                  { id: "staff-promos", label: "โปรโมชั่น" },
                  { id: "staff-members", label: "พนักงาน" },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setRole(t.id)}
                    style={{
                      background: role === t.id ? COLORS.ink : "transparent",
                      color: role === t.id ? "#FFF9F0" : COLORS.inkSoft,
                    }}
                    className="flex-shrink-0 whitespace-nowrap px-2.5 text-xs font-semibold py-2 rounded-xl transition-colors"
                  >
                    {t.label}
                  </button>
                ))}
              </div>
              {/* ลูกศรขวา — เลื่อนแท็บ */}
              <button
                onClick={() => scrollStaffTabs(1)}
                aria-label="เลื่อนแท็บขวา"
                className="flex-shrink-0 w-7 h-7 rounded-xl flex items-center justify-center active:scale-95 transition-transform"
                style={{ background: COLORS.cream, color: COLORS.inkSoft }}
              >
                <ChevronRight size={16} />
              </button>
            </div>

            {/* ปุ่มเปิด/ปิดร้าน — ดีไซน์เดียวกับสวิตช์ "เปิดใช้" ในฟอร์มโปรโมชั่น (แทร็กเขียว + วงกลมขาว) อยู่บนกรอบแท็บ แสดงทุกหน้า */}
            <button
              onClick={toggleShopOpen}
              className="mt-2 w-full rounded-2xl px-4 py-3 flex items-center gap-3 shadow-sm active:scale-[0.99] transition-transform"
              style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }}
            >
              <span
                className="relative inline-block"
                style={{ background: shopOpen ? COLORS.sage : "#D8CBB8", width: 40, height: 22, borderRadius: 999 }}
              >
                <span
                  className="absolute transition-all"
                  style={{ left: shopOpen ? 20 : 3, background: "#FFF", width: 16, height: 16, borderRadius: 999, top: 3 }}
                />
              </span>
              <span style={{ color: COLORS.ink }} className="text-sm font-semibold text-left">
                {shopOpen ? "เปิดร้านอยู่ — ลูกค้าสั่งของได้" : "ปิดร้านอยู่ — ลูกค้าสั่งของไม่ได้"}
              </span>
            </button>
          </div>

        </>
      )}

      <div className={`w-full flex-1 ${role === "customer" ? "max-w-md" : "max-w-md md:max-w-none"}`}>
        {role === "customer" && customerStage === "menu" && (
          <CustomerView
            menu={menu}
            cart={cart}
            setCart={setCart}
            onCheckout={() => setCustomerStage("checkout")}
            shopOpen={shopOpen}
            menuLoaded={menuLoaded}
            promos={promos}
            shopName={shopInfo.name}
            shopSlogan={shopInfo.slogan}
            categories={categories}
            shopHours={shopInfo}
          />
        )}
        {role === "customer" && customerStage === "checkout" && (
          <CheckoutView
            cart={cart}
            onBack={() => setCustomerStage("menu")}
            onPaid={placeOrder}
            orders={orders}
            promos={promos}
            uid={uid}
            shopQr={shopInfo.qr}
            deliveryHours={shopInfo}
          />
        )}
        {role === "customer" && customerStage === "success" && (
          <OrderSuccessView
            orderNo={lastOrderNo}
            customer={lastCustomer}
            onNewOrder={() => setCustomerStage("menu")}
            paymentMethod={lastPaymentMethod}
            order={lastOrder}
            shopName={shopInfo.name}
          />
        )}
        {role === "staff-orders" && (
          <StaffOrdersView
            orders={orders}
            recentOrderIds={recentOrderIds}
            onAdvance={advanceOrder}
            onCancel={cancelOrder}
            onRevive={reviveCancelledOrder}
            onTransferGoods={transferGoods}
            onUntagTransfer={untagTransferGoods}
            onDelete={deleteOrder}
            onDeleteOrders={deleteOrdersByIds}
            onMarkPaid={markOrderPaid}
            onUnmarkPaid={unmarkOrderPaid}
          />
        )}
        {role === "staff-delivery" && (
          <StaffDeliveryView orders={orders} onAdvance={advanceOrder} onMarkPaid={markOrderPaid} onUnmarkPaid={unmarkOrderPaid} />
        )}
        {role === "staff-menu" && (
          <MenuManagerView
            menu={menu}
            setMenu={updateMenu}
            menuLoaded={menuLoaded}
            menuSaveError={menuSaveError}
            shopInfo={shopInfo}
            onSaveShopInfo={saveShopInfo}
            stockItems={stockItems}
            categories={categories}
            updateCategories={updateCategories}
            promos={promos}
          />
        )}
        {role === "staff-promos" && <StaffPromoView promos={promos} updatePromos={updatePromos} menu={menu} />}
        {role === "staff-members" && (
          <StaffMembersView uid={uid} staffMembers={staffMembers} onAdd={addStaffUid} onRemove={removeStaffUid} onRename={renameStaffUid} />
        )}
        {role === "staff-accounting" && (
          <StaffAccountingView
            orders={orders}
            menu={menu}
            expenses={expenses}
            updateExpenses={updateExpenses}
            salesRound={salesRound}
            updateSalesRound={updateSalesRound}
          />
        )}
        {role === "staff-stock" && <StaffStockView stockItems={stockItems} updateStock={updateStock} menu={menu} />}
      </div>
    </div>
  );
}

ReactDOM.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>,
  document.getElementById("root")
);
</script>
</body>
</html>
