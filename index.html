          onClick={() => setConfirmUntagTransferId(null)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">ยกเลิกการโอนของไหม?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
              ออร์เดอร์ #{orders.find((o) => o.id === confirmUntagTransferId)?.orderNo || ""} จะกลับเป็น "ยังไม่ได้โอน" —
              ออร์เดอร์ #
              {orders.find((o) => o.id === orders.find((x) => x.id === confirmUntagTransferId)?.goodsUsedByOrderId)?.orderNo || ""}
              จะต้องทำของใหม่ (ตัดสต็อกตอนทำเสร็จ) และต้นทุนของออร์เดอร์นี้จะกลับไปนับเป็นขาดทุนในบัญชี
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmUntagTransferId(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ไม่เอาแล้ว
              </button>
              <button
                onClick={() => { onUntagTransfer(confirmUntagTransferId); setConfirmUntagTransferId(null); }}
                style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยืนยัน ยกเลิกการโอน
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ชีตติ๊กเลือกออร์เดอร์ที่ยกเลิกที่จะลบ — ลบเฉพาะที่เลือก กันลบทั้งก้อนพลาด */}
      {deleteCancelPickOpen && (
        <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
          <SheetLock />
          <div className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8 flex flex-col">
            <div className="flex items-center justify-between mb-1">
              <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                เลือกออร์เดอร์ที่ยกเลิกที่ต้องการลบ
              </h2>
              <button onClick={() => setDeleteCancelPickOpen(false)} style={{ color: COLORS.inkSoft }}>
                <X size={20} />
              </button>
            </div>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-2">
              ติ๊กเฉพาะรายการที่ยกเลิกแล้วและอยากลบ ({cancelledCount} รายการ) — ออร์เดอร์อื่นไม่โดนแตะ
            </p>
            <button
              onClick={() => {
                setDeleteCancelPickIds((prev) =>
                  prev.length === cancelledOrders.length && cancelledOrders.length > 0
                    ? []
                    : cancelledOrders.map((o) => o.id)
                );
              }}
              style={{ color: COLORS.caramelDark }}
              className="text-xs font-semibold self-start mb-2"
            >
              {deleteCancelPickIds.length === cancelledOrders.length && cancelledOrders.length > 0
                ? "ไม่เลือกทั้งหมด"
                : "เลือกทั้งหมด"}
            </button>

            <div style={{ overscrollBehavior: "contain" }} className="flex-1 min-h-0 overflow-y-auto space-y-2 pb-3">
              {cancelledOrders.map((order) => {
                const checked = deleteCancelPickIds.includes(order.id);
                const total = calcOrderTotal(order);
                return (
                  <button
                    key={order.id}
                    onClick={() =>
                      setDeleteCancelPickIds((prev) =>
                        checked ? prev.filter((id) => id !== order.id) : [...prev, order.id]
                      )
                    }
                    style={{
                      background: "#FFFFFF",
                      border: `1.5px solid ${checked ? COLORS.caramel : COLORS.line}`,
                    }}
                    className="w-full rounded-2xl px-4 py-3 flex items-center gap-3 text-left"
                  >
                    <div
                      style={{
                        border: `2px solid ${checked ? COLORS.caramel : COLORS.line}`,
                        background: checked ? COLORS.caramel : "transparent",
                      }}
                      className="w-5 h-5 rounded flex items-center justify-center flex-shrink-0"
                    >
                      {checked && <Check size={12} color="#fff" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">
                        #{order.orderNo} · {order.customerName || "ไม่ระบุชื่อ"}
                      </p>
                      <p style={{ color: COLORS.inkSoft }} className="text-xs truncate">
                        {order.method === "pickup"
                          ? "รับที่ร้าน"
                          : order.deliveryDate && order.deliveryTime
                          ? `จัดส่ง ${formatDeliveryDateLabel(order.deliveryDate)} ${order.deliveryTime} น.`
                          : order.deliveryNow
                          ? "จัดส่งตอนนี้"
                          : "จัดส่ง"}{" "}
                        · ฿{fmtBaht(total)}
                        {order.cancelReason ? ` · ${order.cancelReason}` : ""}
                      </p>
                    </div>
                  </button>
                );
              })}
            </div>

            <div style={{ borderTop: `1px solid ${COLORS.line}` }} className="pt-3 mt-1 flex gap-2">
              <button
                onClick={() => setDeleteCancelPickOpen(false)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-3 text-sm font-semibold"
              >
                ยกเลิก
              </button>
              <button
                onClick={() => {
                  if (deleteCancelPickIds.length > 0) setConfirmDeleteCancelled(true);
                }}
                disabled={deleteCancelPickIds.length === 0}
                style={{
                  background: deleteCancelPickIds.length > 0 ? "#C0533F" : "#D8C9B8",
                  color: "#FFF9F0",
                }}
                className="flex-1 rounded-xl py-3 text-sm font-semibold disabled:cursor-not-allowed"
              >
                ลบ {deleteCancelPickIds.length} รายการ
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ยืนยันลบออร์เดอร์ที่ยกเลิกที่ติ๊กเลือกไว้ */}
      {confirmDeleteCancelled && (
        <div
          onClick={() => setConfirmDeleteCancelled(false)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">
              ลบ {deleteCancelPickIds.length} รายการที่เลือกเลยไหม?
            </p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">ลบแล้วกู้คืนไม่ได้ (เฉพาะที่ยกเลิกที่ติ๊กไว้)</p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmDeleteCancelled(false)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยกเลิก
              </button>
              <button
                onClick={() => {
                  onDeleteOrders(deleteCancelPickIds);
                  setConfirmDeleteCancelled(false);
                  setDeleteCancelPickOpen(false);
                  setDeleteCancelPickIds([]);
                }}
                style={{ background: "#C0533F", color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ลบเลย
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STAFF DELIVERY VIEW (จัดเรียงตามวัน-เวลาจัดส่ง) =================
// รวมออร์เดอร์ที่ยังไม่ยกเลิกทั้งหมด จัดกลุ่มตามวันที่จัดส่ง แล้วเรียงเวลาไล่จากเช้าไปเย็นในแต่ละวัน
// ให้พนักงานเห็นภาพรวมว่าแต่ละวันต้องจัดส่งกี่ออร์เดอร์ เวลาไหนบ้าง วางแผนออกรอบส่งได้ง่ายขึ้น
function StaffDeliveryView({ orders, onAdvance, onMarkPaid, onUnmarkPaid }) {
  const [confirmRevertId, setConfirmRevertId] = useState(null); // order id ที่รอป็อปอัพยืนยันย้อนกลับการจัดส่ง
  const statusMeta = {
    new: { label: "ออร์เดอร์ใหม่", color: COLORS.caramel, bg: COLORS.peachSoft, action: null },
    preparing: { label: "กำลังทำ", color: "#B08628", bg: "#F5EAC9", action: null },
    done: { label: "เสร็จแล้ว", color: COLORS.sage, bg: COLORS.sageSoft, action: null },
    delivered: { label: "จัดส่งเสร็จแล้ว", color: "#FFFFFF", bg: COLORS.sage, action: null },
    received: { label: "รับสินค้าแล้ว", color: "#FFFFFF", bg: COLORS.sage, action: null },
    cancelled: { label: "ยกเลิกแล้ว", color: "#C0533F", bg: "#F3D9D3", action: null },
  };

  // คิวจัดส่งแสดงเฉพาะออร์เดอร์ที่ทำเสร็จแล้ว (พร้อมจัดส่ง/พร้อมรับ) กับที่จบแล้ว (จัดส่งเสร็จ/รับสินค้าแล้ว)
  // ขั้นตอนใหม่: ออร์เดอร์เข้ามาที่หน้าออร์เดอร์ร้าน → กด "เสร็จแล้ว" → ถึงจะขึ้นมาที่นี่
  const active = orders.filter((o) => o.status === "done" || o.status === "delivered" || o.status === "received");

  // ออร์เดอร์แบบรับที่ร้าน แยกไว้ต่างหาก — ไม่มีวันเวลาจัดส่ง
  const pickups = active.filter((o) => o.method === "pickup");
  const scheduled = active.filter((o) => o.method !== "pickup" && o.deliveryDate && o.deliveryTime);
  const unscheduled = active.filter((o) => o.method !== "pickup" && (!o.deliveryDate || !o.deliveryTime));

  // จัดกลุ่มตามวันที่ แล้วเรียงแต่ละกลุ่มตามเวลา (ตัวอักษร HH:MM เทียบกันได้ตรง ๆ)
  const groupsByDate = {};
  scheduled.forEach((o) => {
    if (!groupsByDate[o.deliveryDate]) groupsByDate[o.deliveryDate] = [];
    groupsByDate[o.deliveryDate].push(o);
  });
  const sortedDateKeys = Object.keys(groupsByDate).sort();
  sortedDateKeys.forEach((k) => {
    groupsByDate[k].sort((a, b) => a.deliveryTime.localeCompare(b.deliveryTime));
  });

  const totalScheduled = scheduled.length;

  // การ์ดออร์เดอร์ในคิวจัดส่ง — รูปแบบเดียวกับการ์ดออร์เดอร์เข้าร้าน (ชื่อ/เบอร์/ที่อยู่แยกบรรทัด)
  // + ป้ายสถานะการจ่ายเงิน ให้คนส่งรู้ว่าต้องเก็บเงินตอนไปส่งไหม
  const renderCard = (order) => {
    const meta = statusMeta[order.status];
    const total = calcOrderTotal(order);
    const isDelivered = order.status === "delivered" || order.status === "received";
    return (
      <div
        key={order.id}
        style={{ background: isDelivered ? "#EEF5EA" : "#FFFFFF", border: `1px solid ${COLORS.line}` }}
        className="rounded-2xl p-4"
      >
        {/* หัวการ์ด: หมายเลขออร์เดอร์ + เวลานัดส่ง + สถานะ */}
        <div className="flex items-center justify-between gap-2 mb-1.5">
          <div className="flex items-center gap-2 min-w-0 flex-wrap">
            <span style={{ color: COLORS.ink }} className="font-bold text-sm flex-shrink-0">#{order.orderNo}</span>
            {order.method === "pickup" ? (
              <span style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-[11px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 flex-shrink-0">
                <ChefHat size={11} /> รับที่ร้าน
              </span>
            ) : order.deliveryTime ? (
              <span style={{ background: COLORS.paper, color: COLORS.caramelDark }} className="text-[11px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 flex-shrink-0">
                <Clock size={11} /> {order.deliveryTime} น.
              </span>
            ) : (
              <span style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-[11px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 flex-shrink-0">
                <Truck size={11} /> ส่งตอนนี้
              </span>
            )}
          </div>
          <span
            style={{ background: meta.bg, color: meta.color }}
            className="text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 whitespace-nowrap flex-shrink-0"
          >
            {meta.label}
          </span>
        </div>

        {/* ชื่อ / เบอร์ / ที่อยู่ — แยกบรรทัด อ่านง่าย */}
        <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">{order.customerName || "ไม่ระบุชื่อ"}</p>
        <div className="flex items-center gap-3 flex-wrap mt-0.5 mb-2">
          {order.phone && (
            <span style={{ color: COLORS.inkSoft }} className="text-xs flex items-center gap-1">
              <Phone size={11} /> {order.phone}
            </span>
          )}
          {order.method !== "pickup" && (
            <span style={{ color: COLORS.inkSoft }} className="text-xs flex items-center gap-1">
              <MapPin size={11} /> บ้านเลขที่ {order.houseNo || "-"}
            </span>
          )}
          <span style={{ color: COLORS.inkSoft }} className="text-xs flex items-center gap-1">
            <Clock size={11} /> {formatOrderTime(order.createdAt)}
          </span>
        </div>

        {/* สถานะการจ่ายเงิน — คนส่งดูว่าต้องเก็บเงินไหม */}
        <div className="flex items-center gap-1.5 flex-wrap mb-3">
          <PaymentStatusBadge order={order} onMarkPaid={onMarkPaid} onUnmarkPaid={onUnmarkPaid} />
        </div>

        {/* ออเดอร์ที่ได้ของสำเร็จรูปมา (โอนจากออร์เดอร์ที่ยกเลิก) — บอกพนักงานว่าไม่ต้องทำใหม่ */}
        {order.goodsFromOrderId && (
          <div style={{ background: COLORS.sage, color: "#FFF9F0" }} className="rounded-xl px-3 py-2 mb-2.5 flex items-center gap-2">
            <ArrowLeft size={14} className="flex-shrink-0" />
            <span className="text-xs font-bold">
              ของมาจากออร์เดอร์ #{orders.find((o) => o.id === order.goodsFromOrderId)?.orderNo || ""}
            </span>
            <span className="text-[11px] font-medium opacity-90 ml-auto flex-shrink-0">ไม่ต้องทำใหม่</span>
          </div>
        )}

        {/* รายการอาหาร */}
        <div className="space-y-1.5 mb-2.5">
          {order.items.map((i) => (
            <div key={i.cartId || i.id} className="text-sm">
              <div className="flex justify-between items-baseline gap-2">
                <span style={{ color: COLORS.ink }}>{i.name} × {i.qty}</span>
                <span style={{ color: COLORS.inkSoft }} className="text-xs flex-shrink-0">฿{fmtBaht((i.price || 0) * i.qty)}</span>
              </div>
              {i.addOns && i.addOns.length > 0 && (
                <p style={{ color: COLORS.caramelDark }} className="text-[11px] mt-0.5">
                  + {i.addOns.map((a) => a.name).join(", ")}
                </p>
              )}
              {i.note && i.note.trim() && (
                <p style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="text-[11px] font-medium rounded-lg px-2 py-1 mt-1 mb-1 flex items-start gap-1">
                  <Pencil size={10} className="mt-0.5 flex-shrink-0" /> {i.note}
                </p>
              )}
            </div>
          ))}
        </div>

        {/* ยอดรวม + ปุ่มโทร + ปุ่มจัดส่ง */}
        <div style={{ borderTop: `1px dashed ${COLORS.line}` }} className="pt-2.5 mt-1 flex items-end justify-between gap-2">
          <div className="min-w-0">
            {order.discount && Number(order.discount.baht) > 0 && (
              <div className="text-xs mb-0.5">
                <span style={{ color: COLORS.sage }} className="font-semibold">
                  ส่วนลด {order.discount.label || ("โค้ด " + (order.discount.code || ""))} -฿{fmtBaht(order.discount.baht)}
                </span>
              </div>
            )}
            <span style={{ color: COLORS.caramelDark }} className="font-bold text-sm">฿{fmtBaht(total)}</span>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            {order.phone && (
              <a
                href={`tel:${order.phone.replace(/\D/g, "")}`}
                style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }}
                className="text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
              >
                <Phone size={12} /> โทร
              </a>
            )}
            {order.status === "done" ? (
              <button
                onClick={() => onAdvance(order.id)}
                style={{ background: COLORS.sage, color: "#FFF9F0" }}
                className="text-xs font-semibold px-3.5 py-2 rounded-full flex-shrink-0 active:scale-95 transition-transform flex items-center gap-1"
              >
                {/* รับที่ร้าน: กด "รับสินค้าแล้ว" — ลูกค้ามารับของแล้ว | จัดส่ง: กด "กำลังจัดส่ง" */}
                {order.method === "pickup" ? <ChefHat size={12} /> : <Truck size={12} />}{" "}
                {order.method === "pickup" ? "รับสินค้าแล้ว" : "กำลังจัดส่ง"}
              </button>
            ) : (
              <button
                onClick={() => setConfirmRevertId(order.id)}
                style={{ background: "#FFFFFF", color: COLORS.sage, border: `1px solid ${COLORS.sage}` }}
                className="text-xs font-semibold px-3.5 py-2 rounded-full flex-shrink-0 active:scale-95 transition-transform flex items-center gap-1"
              >
                {/* กดซ้ำ = ย้อนกลับ (delivered/received → done) */}
                {order.method === "pickup" ? <ChefHat size={12} /> : <Truck size={12} />}{" "}
                {order.method === "pickup" ? "รับสินค้าแล้ว" : "จัดส่งเสร็จแล้ว"}
              </button>
            )}
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold mb-1">
        คิวจัดส่ง
      </h1>
      <p style={{ color: COLORS.inkSoft }} className="text-xs mb-5">
        เรียงตามวันและเวลาที่ลูกค้าเลือก · ทั้งหมด {totalScheduled} ออร์เดอร์
      </p>

      {totalScheduled === 0 && unscheduled.length === 0 && pickups.length === 0 && (
        <div className="text-center py-20" style={{ color: COLORS.inkSoft }}>
          <Truck size={32} className="mx-auto mb-2 opacity-50" />
          ยังไม่มีออร์เดอร์ที่ต้องจัดส่ง
        </div>
      )}

      {pickups.length > 0 && (
        <div className="mb-5">
          <div className="flex items-center gap-2 mb-2 px-1">
            <ChefHat size={14} style={{ color: COLORS.caramelDark }} />
            <span style={{ color: COLORS.ink }} className="text-sm font-bold">รับที่ร้าน</span>
            <span style={{ color: COLORS.inkSoft }} className="text-xs">({pickups.length} ออร์เดอร์)</span>
          </div>
          <div className="space-y-2.5 md:grid md:grid-cols-2 md:gap-2.5 md:space-y-0 xl:grid-cols-3">{pickups.map(renderCard)}</div>
        </div>
      )}

      {sortedDateKeys.map((dateK) => (
        <div key={dateK} className="mb-5">
          <div className="flex items-center gap-2 mb-2 px-1">
            <CalendarIcon size={14} style={{ color: COLORS.caramelDark }} />
            <span style={{ color: COLORS.ink }} className="text-sm font-bold">{formatDeliveryDateLabel(dateK)}</span>
            <span style={{ color: COLORS.inkSoft }} className="text-xs">({groupsByDate[dateK].length} ออร์เดอร์)</span>
          </div>
          <div className="space-y-2.5 md:grid md:grid-cols-2 md:gap-2.5 md:space-y-0 xl:grid-cols-3">{groupsByDate[dateK].map(renderCard)}</div>
        </div>
      ))}

      {unscheduled.length > 0 && (
        <div>
          <div className="flex items-center gap-2 mb-2 px-1">
            <span style={{ color: COLORS.inkSoft }} className="text-sm font-bold">ส่งตอนนี้ / ไม่ระบุเวลา</span>
            <span style={{ color: COLORS.inkSoft }} className="text-xs">({unscheduled.length} ออร์เดอร์)</span>
          </div>
          <div className="space-y-2.5 md:grid md:grid-cols-2 md:gap-2.5 md:space-y-0 xl:grid-cols-3">{unscheduled.map(renderCard)}</div>
        </div>
      )}

      {/* ป็อปอัพยืนยันย้อนกลับการจัดส่ง — กดปุ่ม "จัดส่งเสร็จแล้ว" ซ้ำอีกครั้งเพื่อยกเลิกการจัดส่งสำเร็จ เผื่อกดผิด */}
      {confirmRevertId && (
        <div className="fixed inset-0 z-40 flex items-center justify-center px-8">
          <SheetLock />
          <div onClick={() => setConfirmRevertId(null)} className="absolute inset-0 bg-black/30" />
          <div style={{ background: "#FFFFFF", borderRadius: 20 }} className="relative w-full max-w-xs p-5 text-center">
            <p style={{ color: COLORS.ink }} className="text-sm font-bold mb-1">ย้อนกลับเป็นยังไม่จบ?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
              ออร์เดอร์ #{orders.find((o) => o.id === confirmRevertId)?.orderNo || ""} จะกลับไปอยู่ในคิว
              และต้องกด "กำลังจัดส่ง"/"รับสินค้าแล้ว" ใหม่อีกครั้ง — ยืนยันว่าจะย้อนกลับไหม?
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmRevertId(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                className="flex-1 text-xs font-semibold py-2.5 rounded-xl bg-white"
              >
                ยกเลิก
              </button>
              <button
                onClick={() => { onAdvance(confirmRevertId); setConfirmRevertId(null); }}
                style={{ background: "#C0533F", color: "#FFF" }}
                className="flex-1 text-xs font-semibold py-2.5 rounded-xl"
              >
                ย้อนกลับ
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STAFF DASHBOARD (สรุปยอดขาย) =================
// สรุปยอดขายให้พนักงาน/เจ้าของร้านดูภาพรวม: ยอดขายรวม, ขายเมนูไหนดี,
// และตัวเลือกเสริม (เช่น แยกน้ำแข็ง/เพิ่มท็อปปิ้ง) ถูกเลือกกี่ครั้ง
// นับจาก "ออร์เดอร์ที่เข้ามา" ทั้งหมดในช่วงเวลาที่เลือก (ทุกสถานะ ไม่ว่าจะใหม่/กำลังทำ/เสร็จแล้ว)
// ================= STAFF: จัดการโปรโมชั่น (ตัวต่อ) =================
// โปรใหม่เก็บในฟิลด์ rules (โครงสร้างอยู่บนสุดของส่วนโปรโมชั่นตัวต่อ) — โปรเก่า 5 แบบ (type: discount/freeAddOn/code/byoc/threshold)
// ยังทำงานเหมือนเดิม และเวลาเปิดแก้จะแปลงเป็นฟอร์มตัวต่ออัตโนมัติ เมื่อบันทึกจะกลายเป็นโปรแบบ rules

// ---- ตัวช่วยแปลง/สรุปสำหรับฟอร์มตัวต่อ ----
// ชื่อเมนูจาก id
const menuNameById = (menu, id) => {
  const m = (menu || []).find((x) => x.id === id);
  return m ? m.name : id;
};
// ตัวเลือกเพิ่ม (ท็อปปิ้ง/แอดออน) ทั้งหมดในระบบ — แต่ละตัวเลือก id ไม่ซ้ำข้ามเมนู
const allAddOnOptions = (menu) => {
  const out = [];
  (menu || []).forEach((m) =>
    (m.addOns || []).forEach((g) =>
      (g.options || []).forEach((o) => out.push({ menuId: m.id, menuName: m.name, id: o.id, name: o.name, price: Number(o.price) || 0 }))
    )
  );
  return out;
};
// ชื่อท็อปปิ้งไม่ซ้ำ (เรียงตามที่เจอ) — ตัวต่อเลือกท็อปปิ้งด้วยชื่อ แล้วกำหนดขอบเขตเมนู
const uniqueAddOnNames = (menu) => {
  const names = [];
  allAddOnOptions(menu).forEach((o) => { if (!names.includes(o.name)) names.push(o.name); });
  return names;
};
// เปลี่ยนชื่อท็อปปิ้งที่เลือก + ขอบเขตเมนู → id ของตัวเลือกจริง (เครื่องคำนวณใช้ id)
const resolveAddonIds = (names, scope, menuIds, menu) =>
  allAddOnOptions(menu)
    .filter((o) => names.includes(o.name) && (scope !== "some" || menuIds.includes(o.menuId)))
    .map((o) => o.id);
// โปรเก่า 5 แบบ → โครงสร้าง rules (สำหรับแปลงตอนเปิดแก้ + โชว์การ์ด)
const promoToRules = (p, menu) => {
  if (!p) return null;
  if (p.rules) return p.rules;
  const r = { conds: [], target: "all", action: "percent", actionAmount: 0, actionUnit: "baht", limitMax: 0 };
  const isBaht = Number(p.discountBaht) > 0;
  if (p.type === "discount") {
    r.target = p.itemIds && p.itemIds.length ? "items" : "all";
    if (p.itemIds && p.itemIds.length) r.targetIds = [...p.itemIds];
    r.action = isBaht ? "baht" : "percent";
    r.actionAmount = isBaht ? Number(p.discountBaht) : Number(p.discountPercent) || 0;
  } else if (p.type === "freeAddOn") {
    r.target = "addons";
    r.action = "free";
    r.addonIds = [...(p.addOnIds || [])];
    // ขอบเขตเมนู = เมนูเจ้าของตัวเลือกที่เลือกจริง (กันแปลงแล้วความหมายเพี้ยน)
    r.addonMenuScope = "some";
    r.addonMenuIds = [...new Set(allAddOnOptions(menu).filter((o) => (p.addOnIds || []).includes(o.id)).map((o) => o.menuId))];
  } else if (p.type === "code") {
    r.conds = ["code"];
    r.code = String(p.code || "").toUpperCase();
    r.target = "cart";
    r.action = isBaht ? "baht" : "percent";
    r.actionAmount = isBaht ? Number(p.discountBaht) : Number(p.discountPercent) || 0;
  } else if (p.type === "byoc") {
    r.conds = ["byoc"];
    r.target = "cart";
    r.action = "baht";
    r.actionAmount = Number(p.discountBaht) || 0;
    r.pickupOnly = p.pickupOnly !== false;
  } else if (p.type === "threshold") {
    r.conds = ["minSpend"];
    r.minSpendTiers = [{ min: Number(p.minSpend) || 0, amount: Number(p.discountBaht) || 0 }];
    r.target = "cart";
    r.action = "baht";
  }
  return r;
};
// ฟอร์มตัวต่อว่าง (โปรใหม่)
const emptyBuilderForm = () => ({
  name: "",
  active: true,
  conds: [], // code | minSpend | minQty | contains | pickup | byoc | time | days
  codeVal: "",
  spendTiers: [{ t: "", d: "" }],
  qtyTiers: [{ t: "", d: "" }],
  containsIds: [],
  timeFrom: "",
  timeTo: "",
  days: [],
  target: "all", // all | items | addons | cart
  targetMenuIds: [],
  addonNames: [],
  addonScope: "all", // all = ทุกเมนู | some = เฉพาะเมนูที่เลือก
  addonMenuIds: [],
  action: "percent", // percent | baht | free | bogo | nth | combo
  amtVal: "",
  mixTargets: false, // เฉพาะ action=bogo — true = นับรวมจำนวนชิ้นข้ามทุกเมนูที่เลือก (คละเมนูได้) แทนที่จะนับแยกทีละเมนู
  nthN: "",
  nthAmt: "",
  nthUnit: "percent",
  comboIds: [],
  comboMode: "price", // price = ชุดละ ฿X | percent | baht
  comboPrice: "",
  limitVal: "",
  pickupOnly: true, // เก็บของโปรนำแก้วมาเองเดิม (ไม่โชว์ในฟอร์ม แต่ไม่ให้หายตอนแก้)
  maxUsesVal: "", // จำกัดจำนวนครั้งที่ใช้โค้ดได้ทั้งหมด ("" = ไม่จำกัด)
  perCustomer: false, // จำกัด 1 ครั้งต่อลูกค้า
});
// rules → ฟอร์มตัวต่อ (เปิดแก้โปรเดิม/โปรตัวต่อ)
const rulesToBuilderForm = (r, menu) => {
  const opts = allAddOnOptions(menu);
  const f = emptyBuilderForm();
  f.conds = [...((r && r.conds) || [])];
  f.codeVal = (r && r.code) || "";
  if (r && r.minSpendTiers && r.minSpendTiers.length) f.spendTiers = r.minSpendTiers.map((x) => ({ t: String(x.min), d: String(x.amount) }));
  if (r && r.minQtyTiers && r.minQtyTiers.length) f.qtyTiers = r.minQtyTiers.map((x) => ({ t: String(x.min), d: String(x.amount) }));
  f.containsIds = [...((r && r.containsIds) || [])];
  f.timeFrom = (r && r.timeFrom) || "";
  f.timeTo = (r && r.timeTo) || "";
  f.days = [...((r && r.days) || [])];
  f.target = (r && r.target) || "all";
  // action=combo ใช้เป้าหมาย "ทุกเมนู" เสมอ (ชุดกำหนดจากเมนูที่เลือกในฟิลด์ comboIds) — เผื่อโหลดโปรเก่า
  // ที่เคยบันทึกผิดเป็น target อื่น (ก่อนจะซ่อนตัวเลือกเป้าหมายออกจากฟอร์มตอนเลือก action=combo)
  if (r && r.action === "combo") f.target = "all";
  f.targetMenuIds = [...((r && r.targetIds) || [])];
  if (r && r.target === "addons") {
    f.addonNames = [...new Set(opts.filter((o) => (r.addonIds || []).includes(o.id)).map((o) => o.name))];
    f.addonScope = r.addonMenuScope || "all";
    f.addonMenuIds = [...((r && r.addonMenuIds) || [])];
  }
  f.action = (r && r.action) || "percent";
  if (r && (r.action === "percent" || r.action === "baht" || r.action === "bogo")) f.amtVal = String(r.actionAmount || "");
  if (r && r.action === "bogo") f.mixTargets = !!r.mixTargets;
  if (r && r.action === "nth") { f.nthN = String(r.actionN || ""); f.nthAmt = String(r.actionAmount || ""); f.nthUnit = r.actionUnit || "percent"; }
  if (r && r.action === "combo") { f.comboIds = [...(r.comboIds || [])]; f.comboMode = r.comboMode || "price"; f.comboPrice = String(r.actionAmount || ""); }
  f.limitVal = r && Number(r.limitMax) > 0 ? String(r.limitMax) : "";
  f.pickupOnly = !r || r.pickupOnly !== false;
  return f;
};
// โปรที่มีอยู่ (maxUses/perCustomer เก็บอยู่นอก rules ที่ระดับโปรโมชั่น) → ฟอร์มตัวต่อ
const promoUsageToBuilderForm = (f, promo) => {
  f.maxUsesVal = promo && Number(promo.maxUses) > 0 ? String(promo.maxUses) : "";
  f.perCustomer = !!(promo && promo.perCustomer);
  return f;
};
// ฟอร์มตัวต่อ → โครงสร้าง rules (บันทึก)
const builderFormToRules = (f, menu) => {
  const r = {
    conds: [...f.conds],
    target: f.target,
    action: f.action,
    actionAmount: 0,
    actionUnit: "baht",
    limitMax: Number(f.limitVal) > 0 ? Math.max(1, Math.floor(Number(f.limitVal))) : 0,
    pickupOnly: f.pickupOnly !== false,
  };
  if (f.conds.includes("code")) r.code = String(f.codeVal || "").trim().toUpperCase();
  if (f.conds.includes("minSpend")) r.minSpendTiers = f.spendTiers.filter((x) => Number(x.t) > 0 && Number(x.d) > 0).map((x) => ({ min: Number(x.t), amount: Number(x.d) }));
  if (f.conds.includes("minQty")) r.minQtyTiers = f.qtyTiers.filter((x) => Number(x.t) > 0 && Number(x.d) > 0).map((x) => ({ min: Number(x.t), amount: Number(x.d) }));
  if (f.conds.includes("contains")) r.containsIds = [...f.containsIds];
  if (f.conds.includes("time")) { r.timeFrom = f.timeFrom; r.timeTo = f.timeTo; }
  if (f.conds.includes("days")) r.days = [...f.days];
  if (f.target === "items") r.targetIds = [...f.targetMenuIds];
  if (f.target === "addons") {
    r.addonMenuScope = f.addonScope;
    if (f.addonScope === "some") r.addonMenuIds = [...f.addonMenuIds];
    r.addonIds = resolveAddonIds(f.addonNames, f.addonScope, f.addonMenuIds, menu);
  }
  if (f.action === "percent" || f.action === "baht") r.actionAmount = Number(f.amtVal) || 0;
  if (f.action === "bogo") { r.actionAmount = Math.max(2, Math.floor(Number(f.amtVal)) || 2); r.mixTargets = !!f.mixTargets; }
  if (f.action === "nth") { r.actionN = Math.max(2, Math.floor(Number(f.nthN)) || 2); r.actionAmount = Number(f.nthAmt) || 0; r.actionUnit = f.nthUnit; }
  if (f.action === "combo") { r.comboIds = [...f.comboIds]; r.comboMode = f.comboMode; r.actionAmount = Number(f.comboPrice) || 0; }
  return r;
};
// ประโยคสรุปโปรตัวต่อสำหรับการ์ด (เช่น "โค้ด SAVE10 → ลด 10% จากยอดรวมทั้งออร์เดอร์")
const ruleDescribe = (r, menu) => {
  if (!r) return "";
  const mName = (id) => menuNameById(menu, id);
  const parts = [];
  const conds = r.conds || [];
  if (conds.includes("code")) parts.push(`โค้ด ${r.code}`);
  if (conds.includes("minSpend")) parts.push(`ซื้อครบ฿${(r.minSpendTiers || []).map((x) => `${x.min}→฿${x.amount}`).join(" / ")}`);
  if (conds.includes("minQty")) parts.push(`ซื้อครบ ${(r.minQtyTiers || []).map((x) => `${x.min} ชิ้น→฿${x.amount}`).join(" / ")}`);
  if (conds.includes("contains")) parts.push(`มี ${(r.containsIds || []).map(mName).join(" + ")} ในตะกร้า`);
  if (conds.includes("pickup")) parts.push("เฉพาะรับที่ร้าน");
  if (conds.includes("byoc")) parts.push("นำแก้วมาเอง");
  if (conds.includes("time")) parts.push(`${r.timeFrom}–${r.timeTo}`);
  if (conds.includes("days")) parts.push(`วัน${[...(r.days || [])].sort().map((d) => "อา จ อ พ พฤ ศ ส".split(" ")[d]).join(",")}`);
  let tgt;
  if (r.target === "all") tgt = "ทุกเมนู";
  else if (r.target === "items") tgt = `เฉพาะ ${(r.targetIds || []).map(mName).join(" + ")}`;
  else if (r.target === "addons") {
    const opts = allAddOnOptions(menu).filter((o) => (r.addonIds || []).includes(o.id));
    const names = [...new Set(opts.map((o) => o.name))];
    tgt = `ท็อปปิ้ง ${names.join(" + ") || "…"}${r.addonMenuScope === "some" ? ` (เฉพาะ ${(r.addonMenuIds || []).map(mName).join(" + ")})` : " (ทุกเมนู)"}`;
  } else tgt = "ยอดรวมทั้งออร์เดอร์";
  let act;
  if (r.action === "percent") act = `ลด ${r.actionAmount}%`;
  else if (r.action === "baht") act = `ลด ฿${r.actionAmount}`;
  else if (r.action === "free") act = "ฟรี";
  else if (r.action === "bogo") act = `1แถม1 (ฟรี 1 ทุก ${r.actionAmount} ชิ้น${r.mixTargets ? " คละเมนูได้" : ""})`;
  else if (r.action === "nth") act = `ชิ้นที่ ${r.actionN} ลด ${r.actionAmount}${r.actionUnit === "baht" ? " บาท" : "%"}`;
  else if (r.action === "combo") act = `ชุด ${(r.comboIds || []).map(mName).join(" + ")} ${r.comboMode === "price" ? `฿${r.actionAmount}/ชุด` : `ลด ${r.actionAmount}${r.comboMode === "percent" ? "%" : " บาท"}`}`;
  const limit = Number(r.limitMax) > 0 ? ` (สูงสุด ${r.limitMax} ชิ้น/ออร์เดอร์)` : "";
  return (parts.length ? parts.join(" + ") + " → " : "") + act + " จาก" + tgt + limit;
};

// โปรที่ active อยู่ ที่อ้างอิงเมนู id นี้อยู่ (เป้าหมาย/ชุด/เงื่อนไข "ต้องมีเมนูนี้ในตะกร้า") — ทั้งโปรเก่าและโปรตัวต่อ
// ใช้เตือนพนักงานก่อนลบเมนู กันโปรที่ตั้งไว้เงียบๆ หยุดทำงานโดยไม่รู้ตัว
const promosReferencingMenuItem = (itemId, promos) =>
  (promos || []).filter((p) => {
    if (!p || !p.active) return false;
    if (p.rules) {
      const r = p.rules;
      if (r.target === "items" && (r.targetIds || []).includes(itemId)) return true;
      if (r.action === "combo" && (r.comboIds || []).includes(itemId)) return true;
      if ((r.conds || []).includes("contains") && (r.containsIds || []).includes(itemId)) return true;
      return false;
    }
    return !!(p.itemIds && p.itemIds.includes(itemId));
  });
// โปรที่ active อยู่ ที่อ้างอิงตัวเลือกเพิ่ม (ท็อปปิ้ง) id นี้อยู่ — ทั้งโปรเก่าและโปรตัวต่อ
const promosReferencingAddOn = (optionId, promos) =>
  (promos || []).filter((p) => {
    if (!p || !p.active) return false;
    if (p.rules) return p.rules.target === "addons" && (p.rules.addonIds || []).includes(optionId);
    return !!(p.addOnIds && p.addOnIds.includes(optionId));
  });

// ปุ่มเลือกแบบเม็ด (ใช้ในฟอร์มตัวต่อ — เลือกจากรายการจริง ไม่ใช่พิมพ์เอง กันพิมพ์ผิด)
const BuilderChip = ({ on, onClick, children, activeBg, activeColor }) => (
  <button
    type="button"
    onClick={onClick}
    style={{
      background: on ? activeBg || COLORS.caramel : "#FFFFFF",
      color: on ? activeColor || "#FFF9F0" : COLORS.inkSoft,
      border: `1px solid ${on ? activeBg || COLORS.caramel : COLORS.line}`,
    }}
    className="px-3 py-1.5 rounded-full text-xs font-medium active:scale-95 transition-transform"
  >
    {children}
  </button>
);
// ปุ่มสลับหน่วย % / ฿ (แบบเดียวกับ mockup — ตัวที่เลือกเป็นสีส้ม ตัวที่ไม่เลือกเป็นสีขาว)
const UnitToggle = ({ value, onChange, options }) => (
  <div className="flex gap-1.5">
    {options.map((o) => (
      <button
        key={o.value}
        type="button"
        onClick={() => onChange(o.value)}
        style={{
          background: value === o.value ? COLORS.caramel : "#FFFFFF",
          color: value === o.value ? "#FFF9F0" : COLORS.ink,
          border: `1px solid ${value === o.value ? COLORS.caramel : COLORS.line}`,
        }}
        className="min-w-[42px] px-3 py-2 rounded-xl text-sm font-semibold"
      >
        {o.label}
      </button>
    ))}
  </div>
);

function StaffPromoView({ promos, updatePromos, menu }) {
  const [editing, setEditing] = useState(null); // id ของโปรโมชั่นที่กำลังแก้ หรือ "new"
  const [confirmDelete, setConfirmDelete] = useState(null); // id ที่รอยืนยันลบ
  const [form, setForm] = useState(emptyBuilderForm); // ฟอร์มตัวต่อ (เงื่อนไข/เป้าหมาย/ส่วนลด)

  const startNew = () => {
    seedIdCounter(menu, promos); // กันโปรโมชั่นใหม่ได้ id ซ้ำกับตัวเก่า (บั๊ก id ซ้ำข้าม session)
    setEditing("new");
    setConfirmDelete(null);
    setForm(emptyBuilderForm());
  };

  const startEdit = (p) => {
    seedIdCounter(menu, promos); // กัน id ใหม่ที่สร้างตอนแก้ซ่อมไม่ให้ชนกับของเดิม
    setEditing(p.id);
    setConfirmDelete(null);
    // โปรเก่า 5 แบบ → rules → ฟอร์มตัวต่อ (บันทึกครั้งถัดไปจะกลายเป็นโปรแบบ rules)
    const r = promoToRules(p, menu);
    const f = rulesToBuilderForm(r, menu);
    f.name = p.name || "";
    f.active = p.active !== false;
    promoUsageToBuilderForm(f, p);
    setForm(f);
  };

  const toggleId = (arr, id) => (arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id]);

  // ขั้นบันได — แก้ไข/เพิ่ม/ลบขั้น
  const setTier = (key, i, field, val) =>
    setForm((f) => ({ ...f, [key]: f[key].map((row, idx) => (idx === i ? { ...row, [field]: val } : row)) }));
  const addTier = (key) => setForm((f) => ({ ...f, [key]: [...f[key], { t: "", d: "" }] }));
  const removeTier = (key, i) => setForm((f) => ({ ...f, [key]: f[key].length > 1 ? f[key].filter((_, idx) => idx !== i) : f[key] }));

  // ใช้ขั้นบันได (ซื้อครบ) กับส่วนลด %/บาท — ส่วนลดอยู่ในแต่ละขั้น ไม่ต้องกรอกแยก
  const tiered =
    (form.conds.includes("minSpend") || form.conds.includes("minQty")) &&
    (form.action === "percent" || form.action === "baht");

  // ---------- ตรวจสอบฟอร์มตัวต่อ (โชว์เหตุผลใต้สรุปสด + ปิดปุ่มบันทึก) ----------
  const validationMsg = useMemo(() => {
    const f = form;
    if (!f.name.trim()) return "ตั้งชื่อโปรโมชั่นก่อน";
    if (f.conds.includes("code") && !f.codeVal.trim()) return "กรอกโค้ดส่วนลด";
    if (f.conds.includes("code") && f.maxUsesVal.trim() && !(Number(f.maxUsesVal) > 0)) return "จำกัดจำนวนใช้โค้ดต้องเป็นตัวเลขมากกว่า 0";
    if (f.conds.includes("minSpend") && !f.spendTiers.some((x) => Number(x.t) > 0 && Number(x.d) > 0)) return "กรอกขั้นซื้อครบให้ครบ (ยอดขั้นต่ำ + จำนวนที่ลด)";
    if (f.conds.includes("minQty") && !f.qtyTiers.some((x) => Number(x.t) > 0 && Number(x.d) > 0)) return "กรอกขั้นซื้อครบชิ้นให้ครบ (จำนวนชิ้น + จำนวนที่ลด)";
    if (f.conds.includes("contains") && f.containsIds.length === 0) return "เลือกเมนูที่จะต้องมีในตะกร้า";
    if (f.conds.includes("time") && (!f.timeFrom || !f.timeTo)) return "กรอกเวลาช่วงโปรโมชั่นให้ครบ (เริ่ม–จบ)";
    if (f.conds.includes("days") && f.days.length === 0) return "เลือกวันอย่างน้อย 1 วัน";
    if (f.target === "items" && f.targetMenuIds.length === 0) return "เลือกเมนูอย่างน้อย 1 เมนู";
    if (f.target === "addons") {
      if (f.addonNames.length === 0) return "เลือกท็อปปิ้งอย่างน้อย 1 รายการ";
      if (f.addonScope === "some" && f.addonMenuIds.length === 0) return "เลือกเมนูที่จะใช้ท็อปปิ้งฟรี";
    }
    if ((f.action === "percent" || f.action === "baht") && !tiered && !(Number(f.amtVal) > 0)) return "กรอกจำนวนส่วนลด";
    if (f.action === "bogo" && !(Number(f.amtVal) >= 2)) return "กรอกจำนวนชิ้น (เช่น 2 = ซื้อ 2 จ่าย 1)";
    if (f.action === "nth" && (!(Number(f.nthN) >= 2) || !(Number(f.nthAmt) > 0))) return "กรอกชิ้นที่ (เช่น 2) และจำนวนที่ลด";
    if (f.action === "combo") {
      if (f.comboIds.length < 2) return "เลือกเมนูในชุดอย่างน้อย 2 ตัว";
      if (!(Number(f.comboPrice) > 0)) return "กรอกราคา/ส่วนลดของชุด";
      if (f.target !== "all") return "ราคารวมชุดใช้เป้าหมาย \"ทุกเมนู\" เท่านั้น — เปลี่ยนเป้าหมายเป็นทุกเมนู (ชุดกำหนดจากเมนูที่เลือกด้านล่างอยู่แล้ว)";
    }
    if (f.action === "free" && f.target === "cart") return "ทำให้ยอดรวมทั้งออร์เดอร์ฟรีไม่ได้ — ฟรีใช้กับเมนู/ท็อปปิ้งเท่านั้น";
    if ((f.action === "bogo" || f.action === "nth") && (f.target === "addons" || f.target === "cart")) return "1แถม1 / ชิ้นที่N ใช้กับเมนูเท่านั้น";
    return "";
  }, [form, tiered]);

  const save = () => {
    if (validationMsg) return;
    const existing = promos.find((p) => p.id === editing); // ข้อมูลเดิม (ถ้าแก้) — เก็บจำนวนการใช้โค้ดไว้ไม่ให้หาย
    const promo = {
      id: editing === "new" ? nextId() : editing,
      name: form.name.trim(),
      active: form.active,
      rules: builderFormToRules(form, menu),
      // เคลียร์ฟิลด์แบบโปรเก่าทิ้ง (กันหักซ้ำ 2 รอบผ่านเส้นทางเก่า + เส้นทางตัวต่อ)
      type: "",
      discountPercent: 0,
      discountBaht: 0,
      minSpend: 0,
      itemIds: [],
      addOnIds: [],
      code: "",
      pickupOnly: true,
      uses: existing && Number(existing.uses) > 0 ? Number(existing.uses) : 0,
      usedBy: existing && Array.isArray(existing.usedBy) ? existing.usedBy : [],
      maxUses: Number(form.maxUsesVal) > 0 ? Math.max(1, Math.floor(Number(form.maxUsesVal))) : 0,
      perCustomer: !!form.perCustomer,
    };
    updatePromos((prev) => (editing === "new" ? [...prev, promo] : prev.map((p) => (p.id === editing ? promo : p))));
    setEditing(null);
  };

  const remove = (id) => {
    updatePromos((prev) => prev.filter((p) => p.id !== id));
    if (editing === id) setEditing(null);
    setConfirmDelete(null);
  };

  const toggleActive = (id) => {
    updatePromos((prev) => prev.map((p) => (p.id === id ? { ...p, active: !p.active } : p)));
  };

  const isCodePromo = (p) => p.type === "code" || (p.rules && (p.rules.conds || []).includes("code"));

  const discountText = (p) => (Number(p.discountBaht) > 0 ? `฿${p.discountBaht}` : `${p.discountPercent}%`);

  // สรุปเงื่อนไขของโปรโมชั่นสำหรับแสดงในการ์ด (โปรเก่า + โปรตัวต่อ)
  const describe = (p) => {
    if (p.rules) return ruleDescribe(p.rules, menu);
    const target = !p.itemIds || p.itemIds.length === 0 ? "ทุกเมนู" : `เฉพาะ ${p.itemIds.length} เมนู`;
    if (p.type === "discount") return `ลด ${discountText(p)} · ${target}`;
    if (p.type === "code") return `โค้ด “${p.code}” · ลด ${discountText(p)} จากยอดรวม`;
    if (p.type === "byoc") return `นำแก้วมาเอง · ลด ${discountText(p)} จากยอดรวม${p.pickupOnly === false ? " · รับที่ร้าน/จัดส่งได้" : " · เฉพาะรับที่ร้าน"}`;
    if (p.type === "threshold") return `ซื้อครบ ฿${p.minSpend} ลด ${discountText(p)} (อัตโนมัติ)`;
    return `ตัวเลือกฟรี ${(p.addOnIds || []).length} รายการ · ${target}`;
  };

  const typeColor = (t) =>
    t === "discount"
      ? COLORS.caramelDark
      : t === "freeAddOn"
        ? COLORS.sage
        : t === "code"
          ? "#8A5A44"
          : t === "byoc"
            ? "#5B7A8C"
            : "#B5652E";

  // ป้ายประเภทของการ์ด (โปรตัวต่อ → ป้ายตามส่วนลด)
  const badgeInfo = (p) => {
    if (p.rules) {
      const labels = { percent: "ลด %", baht: "ลดบาท", free: "ของแถมฟรี", bogo: "1แถม1", nth: "ชิ้นที่ N", combo: "ราคารวมชุด" };
      return { label: labels[p.rules.action] || "ตัวต่อ", color: COLORS.caramelDark };
    }
    return { label: PROMO_TYPE_LABEL[p.type] || p.type, color: typeColor(p.type) };
  };

  // ประโยคสรุปสดของฟอร์มตัวต่อ
  const builderSummary = useMemo(() => {
    const f = form;
    const parts = [];
    if (f.conds.includes("code")) {
      parts.push(`กรอกโค้ด ${f.codeVal ? f.codeVal.toUpperCase() : "…"}`);
      if (Number(f.maxUsesVal) > 0) parts.push(`ใช้ได้รวม ${f.maxUsesVal} ครั้ง`);
      if (f.perCustomer) parts.push("จำกัด 1 ครั้ง/คน");
    }
    if (f.conds.includes("minSpend")) parts.push(`ซื้อครบ ${f.spendTiers.filter((x) => Number(x.t) > 0).map((x) => `฿${x.t}→฿${x.d || "…"}`).join(" / ")}`);
    if (f.conds.includes("minQty")) parts.push(`ซื้อครบ ${f.qtyTiers.filter((x) => Number(x.t) > 0).map((x) => `${x.t}ชิ้น→฿${x.d || "…"}`).join(" / ")}`);
    if (f.conds.includes("contains")) parts.push(`ต้องมี ${f.containsIds.length ? f.containsIds.map((id) => menuNameById(menu, id)).join(" + ") : "เมนูที่เลือก"} ในตะกร้า`);
    if (f.conds.includes("pickup")) parts.push("เฉพาะรับที่ร้าน");
    if (f.conds.includes("byoc")) parts.push("ติ๊กนำแก้วมาเอง");
    if (f.conds.includes("time")) parts.push(`เฉพาะช่วง ${f.timeFrom || "…"}–${f.timeTo || "…"}`);
    if (f.conds.includes("days")) {
      const ds = [...f.days].sort().map((d) => "อา จ อ พ พฤ ศ ส".split(" ")[d]).join(", ");
      if (ds) parts.push(`เฉพาะวัน ${ds}`);
    }
    let tgt = { all: "ทุกเมนู", items: "เฉพาะเมนูที่เลือก", addons: "ท็อปปิ้งที่เลือก", cart: "ยอดรวมทั้งออร์เดอร์" }[f.target];
    if (f.target === "items" && f.targetMenuIds.length) tgt = "เฉพาะเมนู " + f.targetMenuIds.map((id) => menuNameById(menu, id)).join(" + ");
    if (f.target === "addons" && f.addonNames.length) {
      const scopeTxt = f.addonScope === "all" ? "ทุกเมนู" : "เฉพาะ " + (f.addonMenuIds.length ? f.addonMenuIds.map((id) => menuNameById(menu, id)).join(" + ") : "เมนูที่เลือก");
      tgt = "ท็อปปิ้ง " + f.addonNames.join(" + ") + " (" + scopeTxt + ")";
    }
    let act;
    if (tiered) act = ""; // ส่วนลดอยู่ในแต่ละขั้นแล้ว
    else if (f.action === "percent") act = `ลด ${f.amtVal || "…"}%`;
    else if (f.action === "baht") act = `ลด ฿${f.amtVal || "…"}`;
    else if (f.action === "free") act = "ฟรี";
    else if (f.action === "bogo") act = `ฟรี 1 ทุก ${f.amtVal || "…"} ชิ้น${f.mixTargets ? " (คละเมนูได้)" : ""}`;
    else if (f.action === "nth") act = `ชิ้นที่ ${f.nthN || "…"} ลด ${f.nthAmt || "…"}${f.nthUnit === "baht" ? " บาท" : "%"}`;
    else if (f.action === "combo") {
      const cnames = f.comboIds.length ? f.comboIds.map((id) => menuNameById(menu, id)).join(" + ") : "…";
      act = f.comboMode === "price" ? `ชุด ${cnames} ฿${f.comboPrice || "…"}` : `ชุด ${cnames} ลด ${f.comboPrice || "…"}${f.comboMode === "percent" ? "%" : " บาท"}`;
    }
    const limit = f.limitVal && ["free", "bogo", "nth", "combo"].includes(f.action) ? ` (สูงสุด ${f.limitVal} ชิ้น/ออร์เดอร์)` : "";
    const suffix = f.action === "combo" ? (f.comboMode === "price" ? " /ชุด" : " จากราคารวมชุด") : " จาก" + tgt;
    return ((parts.length ? parts.join(" + ") + (act ? " → " : " · ") : "") + act + suffix + limit).replace(/\s{2,}/g, " ");
  }, [form, menu, tiered]);

  // คำแนะนำ/คำเตือนใต้สรุปสด
  const builderHint = useMemo(() => {
    const f = form;
    if (f.action === "free" && f.target === "cart") return "⚠ ทำให้ยอดรวมทั้งออร์เดอร์ฟรีไม่ได้ — ฟรีใช้กับเมนู/ท็อปปิ้งเท่านั้น";
    if (f.action === "combo" && f.comboIds.length < 2) return `⚠ เลือกเมนูในชุดอย่างน้อย 2 ตัว (ตอนนี้ ${f.comboIds.length} ตัว)`;
    if ((f.action === "bogo" || f.action === "nth") && (f.target === "addons" || f.target === "cart")) return "⚠ 1แถม1 / ชิ้นที่N ใช้กับเมนูเท่านั้น — เปลี่ยนเป้าหมายเป็น 'เฉพาะเมนูที่เลือก'";
    if (f.action === "bogo" && f.target === "items" && f.mixTargets && f.targetMenuIds.length < 2) return "💡 ติ๊กคละเมนูไว้ แต่เลือกเมนูไว้แค่ 1 ตัว — เลือกอย่างน้อย 2 เมนูถึงจะคละกันได้จริง";
    if (f.action === "nth" && f.target === "items") return "💡 'ชิ้นที่ N' นับต่อเมนูที่เลือก เช่น ชาไทยแก้ว 2 / ชาเขียวแก้ว 2";
    if (f.action === "combo" && !f.conds.includes("contains")) return "💡 ราคารวมชุด ควรต่อกับเงื่อนไข 'ต้องมีเมนู X ในตะกร้า' ด้วย (กำหนดเมนูในชุด)";
    if (f.conds.includes("minSpend") && f.conds.includes("minQty")) return "💡 เลือกเงื่อนไขซื้อครบแบบเดียว (บาท หรือ ชิ้น) จะชัดกว่า";
    if (tiered) return "💡 ใช้ขั้นบันไดอยู่ — ส่วนลดอยู่ในแต่ละขั้นแล้ว ไม่ต้องกรอกซ้ำ";
    return "เงื่อนไขหลายข้อ = ต้องผ่านครบทุกข้อ · เปิด/ปิดได้ · แก้ได้ตลอด";
  }, [form, tiered]);

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <div className="flex items-center justify-between mb-1">
        <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold">
          โปรโมชั่น
        </h1>
        <button
          onClick={startNew}
          style={{ background: COLORS.caramel, color: "#FFF9F0" }}
          className="text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
        >
          <Plus size={14} /> เพิ่มโปรโมชั่น
        </button>
      </div>
      <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
        สร้างเองได้เป็นสิบแบบด้วยตัวต่อ (เงื่อนไข + เป้าหมาย + ส่วนลด) — ลดราคา · โค้ด · 1แถม1 · แก้วที่ 2 · ชุด · Happy Hour · ซื้อครบขั้นบันได ฯลฯ — ลูกค้าเห็นผลทันทีทุกเครื่อง
      </p>

      {promos.length === 0 && (
        <div style={{ background: "#FFFFFF", border: `1px dashed ${COLORS.line}` }} className="rounded-2xl p-6 text-center">
          <ShoppingBag size={28} className="mx-auto mb-2 opacity-40" style={{ color: COLORS.caramelDark }} />
          <p style={{ color: COLORS.ink }} className="text-sm font-semibold">ยังไม่มีโปรโมชั่น</p>
          <p style={{ color: COLORS.inkSoft }} className="text-xs mt-1">กด "เพิ่มโปรโมชั่น" เพื่อเริ่ม เช่น ลด 10% ชาไทยเย็น หรือแถมไข่มุกฟรี</p>
        </div>
      )}

      <div className="space-y-2.5 md:grid md:grid-cols-2 md:gap-2.5 md:space-y-0 xl:grid-cols-3 2xl:grid-cols-4">
        {promos.map((p) => {
          // จำนวนการใช้โค้ด — อ่านจากฟิลด์ usage (ใหม่) หรือ uses เดิมในตัวโปรโมชั่น (ข้อมูลเก่า)
          const promoUsesCount = Number((p._usage && p._usage.uses) || p.uses) || 0;
          return (
          <div
            key={p.id}
            style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}`, opacity: p.active ? 1 : 0.55 }}
            className="rounded-2xl p-3.5"
          >
            <div className="flex items-center justify-between gap-2 mb-1">
              <span style={{ background: COLORS.peachSoft, color: badgeInfo(p).color }} className="text-[11px] font-bold px-2 py-0.5 rounded-full">
                {badgeInfo(p).label}
              </span>
              <button onClick={() => toggleActive(p.id)} className="flex-shrink-0">
                <Chip tone={p.active ? "sage" : "caramel"}>{p.active ? "เปิดใช้" : "ปิดใช้"}</Chip>
              </button>
            </div>
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">{p.name}</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mt-0.5">{describe(p)}</p>
            {isCodePromo(p) && (Number(p.maxUses) > 0 || p.perCustomer) && (
              <p style={{ color: COLORS.caramelDark }} className="text-[11px] font-medium mt-0.5">
                {Number(p.maxUses) > 0
                  ? `ใช้แล้ว ${promoUsesCount}/${p.maxUses} ครั้ง · เหลือ ${Math.max(0, Number(p.maxUses) - promoUsesCount)} ครั้ง`
                  : ""}
                {Number(p.maxUses) > 0 && p.perCustomer ? " · " : ""}
                {p.perCustomer ? "1 ครั้งต่อลูกค้า" : ""}
              </p>
            )}
            <div className="flex items-center justify-end gap-3 mt-2 pt-2" style={{ borderTop: `1px solid ${COLORS.line}` }}>
              <button onClick={() => startEdit(p)} style={{ color: COLORS.inkSoft }} className="text-xs font-semibold flex items-center gap-1">
                <Pencil size={13} /> แก้ไข
              </button>
              <button onClick={() => setConfirmDelete(p.id)} style={{ color: "#C0533F" }} className="text-xs font-semibold flex items-center gap-1">
                <Trash2 size={13} /> ลบ
              </button>
            </div>
          </div>
          );
        })}
      </div>

      {/* ยืนยันลบ */}
      {confirmDelete && (
        <div className="fixed inset-0 z-40 flex items-center justify-center px-8">
          <SheetLock />
          <div onClick={() => setConfirmDelete(null)} className="absolute inset-0 bg-black/30" />
          <div style={{ background: "#FFFFFF", borderRadius: 20 }} className="relative w-full max-w-xs p-5 text-center">
            <p style={{ color: COLORS.ink }} className="text-sm font-bold mb-1">ลบโปรโมชั่นนี้เลยไหม?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
              {promos.find((p) => p.id === confirmDelete)?.name} — ลูกค้าจะเห็นราคาปกติทันที
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmDelete(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                className="flex-1 text-xs font-semibold py-2.5 rounded-xl bg-white"
              >
                ยกเลิก
              </button>
              <button onClick={() => remove(confirmDelete)} style={{ background: "#C0533F", color: "#FFF" }} className="flex-1 text-xs font-semibold py-2.5 rounded-xl">
                ลบโปรโมชั่น
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ฟอร์มเพิ่ม/แก้ไข — ตัวต่อโปรโมชั่น */}
      {editing && (
        <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
          <SheetLock />
          {/* เลื่อนเนื้อหาด้านในเอง — SheetLock ล็อก scroll หน้าข้างหลังไม่ให้ไหลไปโดนบนจอใหญ่ */}
          <div
            style={{ overflowY: "auto", overscrollBehavior: "contain" }}
            className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8"
          >
            <div className="flex items-center justify-between mb-4">
              <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                {editing === "new" ? "เพิ่มโปรโมชั่นใหม่" : "แก้ไขโปรโมชั่น"}
              </h2>
              <button onClick={() => setEditing(null)} style={{ color: COLORS.inkSoft }}>
                <X size={20} />
              </button>
            </div>

            <div className="space-y-4">
              {/* ชื่อโปรโมชั่น */}
              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ชื่อโปรโมชั่น</label>
                <input
                  value={form.name}
                  onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))}
                  placeholder="เช่น ลด 10% ชาไทยเย็น / ไข่มุกฟรี / โค้ด SAVE10"
                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                  className="w-full rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none focus:ring-2"
                />
              </div>

              {/* ① เงื่อนไข — เลือกได้หลายข้อ (AND) */}
              <div>
                <div className="flex items-baseline gap-1.5 mb-1.5">
                  <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium">① เงื่อนไข</label>
                  <span style={{ color: COLORS.inkSoft, opacity: 0.75 }} className="text-[10px]">เลือกได้หลายข้อ = ต้องผ่านครบทุกข้อ</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  <BuilderChip
                    on={form.conds.length === 0}
                    onClick={() => setForm((f) => ({ ...f, conds: [] }))}
                  >
                    ไม่มีเงื่อนไข
                  </BuilderChip>
                  {[
                    { key: "code", label: "กรอกโค้ด" },
                    { key: "minSpend", label: "ซื้อครบ ฿X" },
                    { key: "minQty", label: "ซื้อครบ X ชิ้น" },
                    { key: "contains", label: "มีเมนู X ในตะกร้า" },
                    { key: "pickup", label: "เฉพาะรับที่ร้าน" },
                    { key: "byoc", label: "นำแก้วมาเอง" },
                    { key: "time", label: "เฉพาะช่วงเวลา" },
                    { key: "days", label: "เฉพาะวัน" },
                  ].map((c) => (
                    <BuilderChip
                      key={c.key}
                      on={form.conds.includes(c.key)}
                      onClick={() =>
                        setForm((f) => ({
                          ...f,
                          conds: f.conds.includes(c.key) ? f.conds.filter((x) => x !== c.key) : [...f.conds, c.key],
                        }))
                      }
                    >
                      {c.label}
                    </BuilderChip>
                  ))}
                </div>

                {form.conds.includes("code") && (
                  <div className="mt-2">
                    <input
                      value={form.codeVal}
                      onChange={(e) => setForm((f) => ({ ...f, codeVal: e.target.value.toUpperCase() }))}
                      placeholder="เช่น SAVE10"
                      className="w-full rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none uppercase"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1">ลูกค้ากรอกโค้ดนี้ที่หน้าชำระเงินเพื่อรับส่วนลด</p>

                    <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mt-3 mb-1">จำกัดจำนวนใช้โค้ด (รวมทุกคน)</label>
                    <input
                      value={form.maxUsesVal}
                      onChange={(e) => setForm((f) => ({ ...f, maxUsesVal: digitsOnly(e.target.value) }))}
                      placeholder="ไม่ระบุ = ไม่จำกัด"
                      inputMode="numeric"
                      className="w-32 rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1">เช่น 50 = โค้ดนี้ใช้ได้รวมกัน 50 ครั้ง (ทุกลูกค้ารวมกัน) แล้วปิดอัตโนมัติ</p>

                    <button
                      type="button"
                      onClick={() => setForm((f) => ({ ...f, perCustomer: !f.perCustomer }))}
                      className="flex items-center gap-2 mt-3"
                    >
                      <span
                        className="w-5 h-5 rounded-md flex items-center justify-center"
                        style={{
                          border: `1.5px solid ${form.perCustomer ? COLORS.caramel : COLORS.line}`,
                          background: form.perCustomer ? COLORS.caramel : "#fff",
                        }}
                      >
                        {form.perCustomer && <span style={{ color: "#fff" }} className="text-xs leading-none">✓</span>}
                      </span>
                      <span style={{ color: COLORS.ink }} className="text-sm">จำกัด 1 ครั้งต่อลูกค้า</span>
                    </button>
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1 ml-7">ลูกค้าคนเดิมใช้โค้ดนี้ซ้ำไม่ได้ (เช่น โค้ดเพื่อนแนะนำ)</p>
                  </div>
                )}

                {form.conds.includes("minSpend") && (
                  <div className="mt-2">
                    <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ซื้อครบ (ขั้นบันได — ลดเป็นบาท)</label>
                    {form.spendTiers.map((row, i) => (
                      <div key={i} className="flex items-center gap-1.5 mb-1.5">
                        <span style={{ color: COLORS.inkSoft }} className="text-xs">฿</span>
                        <input
                          value={row.t}
                          onChange={(e) => setTier("spendTiers", i, "t", digitsOnly(e.target.value))}
                          placeholder="เช่น 200"
                          inputMode="numeric"
                          className="w-24 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                        />
                        <span style={{ color: COLORS.inkSoft }} className="text-xs">→ ลด ฿</span>
                        <input
                          value={row.d}
                          onChange={(e) => setTier("spendTiers", i, "d", digitsOnly(e.target.value))}
                          placeholder="เช่น 20"
                          inputMode="numeric"
                          className="w-20 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                        />
                        {form.spendTiers.length > 1 && (
                          <button onClick={() => removeTier("spendTiers", i)} style={{ color: "#C0533F" }} className="text-xs font-bold px-1">✕</button>
                        )}
                      </div>
                    ))}
                    <button onClick={() => addTier("spendTiers")} style={{ color: COLORS.caramelDark }} className="text-xs font-semibold">+ เพิ่มขั้น (ซื้อมากลดมาก)</button>
                  </div>
                )}

                {form.conds.includes("minQty") && (
                  <div className="mt-2">
                    <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ซื้อครบจำนวนชิ้น (ขั้นบันได — ลดเป็นบาท)</label>
                    {form.qtyTiers.map((row, i) => (
                      <div key={i} className="flex items-center gap-1.5 mb-1.5">
                        <input
                          value={row.t}
                          onChange={(e) => setTier("qtyTiers", i, "t", digitsOnly(e.target.value))}
                          placeholder="เช่น 3"
                          inputMode="numeric"
                          className="w-20 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                        />
                        <span style={{ color: COLORS.inkSoft }} className="text-xs">ชิ้น → ลด ฿</span>
                        <input
                          value={row.d}
                          onChange={(e) => setTier("qtyTiers", i, "d", digitsOnly(e.target.value))}
                          placeholder="เช่น 15"
                          inputMode="numeric"
                          className="w-20 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                        />
                        {form.qtyTiers.length > 1 && (
                          <button onClick={() => removeTier("qtyTiers", i)} style={{ color: "#C0533F" }} className="text-xs font-bold px-1">✕</button>
                        )}
                      </div>
                    ))}
                    <button onClick={() => addTier("qtyTiers")} style={{ color: COLORS.caramelDark }} className="text-xs font-semibold">+ เพิ่มขั้น (ซื้อมากลดมาก)</button>
                  </div>
                )}

                {form.conds.includes("contains") && (
                  <div className="mt-2">
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-1">เลือกจากเมนูจริง — ต้องมีครบทุกตัวที่เลือกในตะกร้า</p>
                    <div className="flex flex-wrap gap-1.5">
                      {menu.map((m) => (
                        <BuilderChip
                          key={m.id}
                          on={form.containsIds.includes(m.id)}
                          onClick={() => setForm((f) => ({ ...f, containsIds: toggleId(f.containsIds, m.id) }))}
                          activeBg={COLORS.peachSoft}
                          activeColor={COLORS.caramelDark}
                        >
                          {m.name}
                        </BuilderChip>
                      ))}
                    </div>
                  </div>
                )}

                {form.conds.includes("time") && (
                  <div className="mt-2 flex items-center gap-2">
                    <input
                      type="time"
                      value={form.timeFrom}
                      onChange={(e) => setForm((f) => ({ ...f, timeFrom: e.target.value }))}
                      className="rounded-xl px-3 py-2 text-sm bg-white outline-none"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                    <span style={{ color: COLORS.inkSoft }} className="text-xs">ถึง</span>
                    <input
                      type="time"
                      value={form.timeTo}
                      onChange={(e) => setForm((f) => ({ ...f, timeTo: e.target.value }))}
                      className="rounded-xl px-3 py-2 text-sm bg-white outline-none"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                  </div>
                )}

                {form.conds.includes("days") && (
                  <div className="mt-2 flex flex-wrap gap-1.5">
                    {[1, 2, 3, 4, 5, 6, 0].map((d) => (
                      <BuilderChip
                        key={d}
                        on={form.days.includes(d)}
                        onClick={() =>
                          setForm((f) => ({
                            ...f,
                            days: f.days.includes(d) ? f.days.filter((x) => x !== d) : [...f.days, d],
                          }))
                        }
                        activeBg={COLORS.sage}
                      >
                        {"อา จ อ พ พฤ ศ ส".split(" ")[d]}
                      </BuilderChip>
                    ))}
                  </div>
                )}
              </div>

              {/* ② เป้าหมาย — ซ่อนไว้เมื่อเลือก action=ราคารวมชุด เพราะชุดกำหนดเป้าหมายจากเมนูที่เลือกในขั้นตอนที่ ③ อยู่แล้ว
                  (เดิมเลือกเป้าหมายอื่นได้พร้อมกัน แต่ค่านั้นไม่เคยถูกใช้จริง ทำให้ดูเหมือนตั้งได้แต่จริงๆ ไม่มีผล
                   หรือแย่กว่านั้นคือกลายเป็นหักคนละแบบไปเลยถ้าเลือก "ยอดรวมทั้งออร์เดอร์") */}
              {form.action !== "combo" && (
              <div>
                <div className="flex items-baseline gap-1.5 mb-1.5">
                  <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium">② เป้าหมาย</label>
                  <span style={{ color: COLORS.inkSoft, opacity: 0.75 }} className="text-[10px]">ลดกับอะไร</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { key: "all", label: "ทุกเมนู" },
                    { key: "items", label: "เฉพาะเมนูที่เลือก" },
                    { key: "addons", label: "ท็อปปิ้งที่เลือก" },
                    { key: "cart", label: "ยอดรวมทั้งออร์เดอร์" },
                  ].map((t) => (
                    <BuilderChip
                      key={t.key}
                      on={form.target === t.key}
                      onClick={() => setForm((f) => ({ ...f, target: t.key }))}
                    >
                      {t.label}
                    </BuilderChip>
                  ))}
                </div>

                {form.target === "items" && (
                  <div className="mt-2">
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-1">เลือกเมนู (เลือกได้หลายตัว — ส่วนลดคิดแยกต่อเมนู)</p>
                    <div className="flex flex-wrap gap-1.5">
                      {menu.map((m) => (
                        <BuilderChip
                          key={m.id}
                          on={form.targetMenuIds.includes(m.id)}
                          onClick={() => setForm((f) => ({ ...f, targetMenuIds: toggleId(f.targetMenuIds, m.id) }))}
                          activeBg={COLORS.peachSoft}
                          activeColor={COLORS.caramelDark}
                        >
                          {m.name}
                        </BuilderChip>
                      ))}
                    </div>
                  </div>
                )}

                {form.target === "addons" && (
                  <div className="mt-2 space-y-2">
                    <div>
                      <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-1">1) เลือกท็อปปิ้ง (เลือกได้หลายตัว)</p>
                      <div className="flex flex-wrap gap-1.5">
                        {uniqueAddOnNames(menu).length === 0 ? (
                          <p style={{ color: COLORS.inkSoft }} className="text-[11px]">ยังไม่มีท็อปปิ้งในเมนู — ไปเพิ่มที่หน้าจัดการเมนูก่อน</p>
                        ) : (
                          uniqueAddOnNames(menu).map((n) => (
                            <BuilderChip
                              key={n}
                              on={form.addonNames.includes(n)}
                              onClick={() => setForm((f) => ({ ...f, addonNames: toggleId(f.addonNames, n) }))}
                              activeBg={COLORS.sage}
                            >
                              {n}
                            </BuilderChip>
                          ))
                        )}
                      </div>
                    </div>
                    <div>
                      <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-1">2) ใช้กับเมนูไหน</p>
                      <div className="flex gap-1.5 mb-1.5">
                        <BuilderChip on={form.addonScope === "all"} onClick={() => setForm((f) => ({ ...f, addonScope: "all" }))}>
                          ทุกเมนู
                        </BuilderChip>
                        <BuilderChip on={form.addonScope === "some"} onClick={() => setForm((f) => ({ ...f, addonScope: "some" }))}>
                          เฉพาะเมนูที่เลือก
                        </BuilderChip>
                      </div>
                      {form.addonScope === "some" && (
                        <div className="flex flex-wrap gap-1.5">
                          {menu.map((m) => (
                            <BuilderChip
                              key={m.id}
                              on={form.addonMenuIds.includes(m.id)}
                              onClick={() => setForm((f) => ({ ...f, addonMenuIds: toggleId(f.addonMenuIds, m.id) }))}
                              activeBg={COLORS.peachSoft}
                              activeColor={COLORS.caramelDark}
                            >
                              {m.name}
                            </BuilderChip>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
              )}

              {/* ③ ส่วนลด */}
              <div>
                <div className="flex items-baseline gap-1.5 mb-1.5">
                  <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium">③ ส่วนลด</label>
                  <span style={{ color: COLORS.inkSoft, opacity: 0.75 }} className="text-[10px]">ลดยังไง</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { key: "percent", label: "ลดเป็น %" },
                    { key: "baht", label: "ลดเป็นบาท" },
                    { key: "free", label: "ทำให้ฟรี" },
                    { key: "bogo", label: "ฟรี 1 ทุก X ชิ้น", sub: "1แถม1" },
                    { key: "nth", label: "ชิ้นที่ N ลด", sub: "แก้วที่ 2 ลด 50%" },
                    { key: "combo", label: "ราคารวมชุด", sub: "X+Y" },
                  ].map((a) => (
                    <button
                      key={a.key}
                      type="button"
                      onClick={() => setForm((f) => ({ ...f, action: a.key, target: a.key === "combo" ? "all" : f.target }))}
                      style={{
                        background: form.action === a.key ? COLORS.caramel : "#FFFFFF",
                        color: form.action === a.key ? "#FFF9F0" : COLORS.inkSoft,
                        border: `1px solid ${form.action === a.key ? COLORS.caramel : COLORS.line}`,
                      }}
                      className="px-3 py-1.5 rounded-full text-xs font-medium flex flex-col items-center leading-tight"
                    >
                      <span>{a.label}</span>
                      {a.sub && <span className="text-[9px]" style={{ opacity: 0.85 }}>{a.sub}</span>}
                    </button>
                  ))}
                </div>

                {/* จำนวนส่วนลด — ซ่อนถ้าใช้ขั้นบันได (ส่วนลดอยู่ในแต่ละขั้นแล้ว) */}
                {["percent", "baht", "bogo"].includes(form.action) && !tiered && (
                  <div className="mt-2 flex items-center gap-2">
                    <input
                      value={form.amtVal}
                      onChange={(e) => setForm((f) => ({ ...f, amtVal: digitsOnly(e.target.value) }))}
                      placeholder={form.action === "percent" ? "เช่น 10" : form.action === "bogo" ? "เช่น 2" : "เช่น 20"}
                      inputMode="numeric"
                      className="w-28 rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                    <span style={{ color: COLORS.inkSoft }} className="text-xs font-medium">
                      {form.action === "percent" ? "%" : form.action === "bogo" ? "ชิ้น (ซื้อ X จ่าย X-1)" : "บาท"}
                    </span>
                  </div>
                )}

                {/* คละเมนูได้ — เฉพาะ 1แถม1 (bogo) เช่น "ซื้อ 2 คละเมนูในหมวดเบเกอรี่ แถม 1" แทนที่จะบังคับเมนูเดียวกัน 2 ชิ้น */}
                {form.action === "bogo" && form.target !== "cart" && form.target !== "addons" && (
                  <label className="mt-2 flex items-center gap-2 cursor-pointer select-none">
                    <input
                      type="checkbox"
                      checked={form.mixTargets}
                      onChange={(e) => setForm((f) => ({ ...f, mixTargets: e.target.checked }))}
                      className="w-4 h-4 rounded"
                      style={{ accentColor: COLORS.caramel }}
                    />
                    <span style={{ color: COLORS.ink }} className="text-xs font-medium">
                      คละเมนูได้ (รวมทุกเมนูที่เลือกเป็นกองเดียว แถมชิ้นที่ถูกที่สุด)
                    </span>
                  </label>
                )}

                {form.action === "nth" && (
                  <div className="mt-2 flex items-center gap-1.5 flex-wrap">
                    <span style={{ color: COLORS.inkSoft }} className="text-xs">ชิ้นที่</span>
                    <input
                      value={form.nthN}
                      onChange={(e) => setForm((f) => ({ ...f, nthN: digitsOnly(e.target.value) }))}
                      placeholder="เช่น 2"
                      inputMode="numeric"
                      className="w-16 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                    <span style={{ color: COLORS.inkSoft }} className="text-xs">ลด</span>
                    <input
                      value={form.nthAmt}
                      onChange={(e) => setForm((f) => ({ ...f, nthAmt: digitsOnly(e.target.value) }))}
                      placeholder="เช่น 50"
                      inputMode="numeric"
                      className="w-20 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                    />
                    <UnitToggle
                      value={form.nthUnit}
                      onChange={(v) => setForm((f) => ({ ...f, nthUnit: v }))}
                      options={[
                        { value: "percent", label: "%" },
                        { value: "baht", label: "฿" },
                      ]}
                    />
                  </div>
                )}

                {form.action === "combo" && (
                  <div className="mt-2 space-y-2">
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px]">เลือกเมนูในชุด (อย่างน้อย 2 ตัว — ซื้อครบทั้งชุดในตะกร้าถึงได้ส่วนลด)</p>
                    <div className="flex flex-wrap gap-1.5">
                      {menu.map((m) => (
                        <BuilderChip
                          key={m.id}
                          on={form.comboIds.includes(m.id)}
                          onClick={() => setForm((f) => ({ ...f, comboIds: toggleId(f.comboIds, m.id) }))}
                          activeBg={COLORS.peachSoft}
                          activeColor={COLORS.caramelDark}
                        >
                          {m.name}
                        </BuilderChip>
                      ))}
                    </div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <UnitToggle
                        value={form.comboMode}
                        onChange={(v) => setForm((f) => ({ ...f, comboMode: v }))}
                        options={[
                          { value: "price", label: "ชุดละ ฿X" },
                          { value: "percent", label: "%" },
                          { value: "baht", label: "฿" },
                        ]}
                      />
                      <input
                        value={form.comboPrice}
                        onChange={(e) => setForm((f) => ({ ...f, comboPrice: digitsOnly(e.target.value) }))}
                        placeholder={form.comboMode === "price" ? "เช่น 50" : form.comboMode === "percent" ? "เช่น 20" : "เช่น 10"}
                        inputMode="numeric"
                        className="w-24 rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none"
                        style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                      />
                      <span style={{ color: COLORS.inkSoft }} className="text-xs font-medium">
                        {form.comboMode === "price" ? "฿/ชุด (ตั้งราคาชุดตายตัว)" : form.comboMode === "percent" ? "% จากราคาเต็มทั้งชุด" : "บาท จากราคาเต็มทั้งชุด"}
                      </span>
                    </div>
                  </div>
                )}

                {/* จำกัดสูงสุด — ฟรี / 1แถม1 / ชิ้นN / ชุด */}
                {["free", "bogo", "nth", "combo"].includes(form.action) && (
                  <div className="mt-2">
                    <div className="flex items-center gap-1.5">
                      <span style={{ color: COLORS.inkSoft }} className="text-xs">จำกัดสูงสุด</span>
                      <input
                        value={form.limitVal}
                        onChange={(e) => setForm((f) => ({ ...f, limitVal: digitsOnly(e.target.value) }))}
                        placeholder="1"
                        inputMode="numeric"
                        className="w-16 rounded-xl px-3 py-2 text-sm bg-white outline-none"
                        style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                      />
                      <span style={{ color: COLORS.inkSoft }} className="text-xs">ชิ้นต่อออร์เดอร์ (เว้นว่าง = ไม่จำกัด)</span>
                    </div>
                    <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1">
                      {form.action === "free" && "เว้นว่าง = ฟรีทุกชิ้นที่สั่ง · ใส่ 1 = ฟรีแค่ 1 ชิ้นต่อออร์เดอร์ (ของแถม)"}
                      {form.action === "bogo" && "เว้นว่าง = ฟรีทุกคู่ · ใส่ 1 = ฟรีสูงสุด 1 ชิ้นต่อออร์เดอร์ แม้สั่ง 10 แก้ว"}
                      {form.action === "nth" && "เว้นว่าง = ทุกเมนูที่เลือกได้ส่วนลด · ใส่ 1 = ชิ้นที่ N ลดแค่ 1 ครั้งต่อออร์เดอร์"}
                      {form.action === "combo" && "เว้นว่าง = ทุกชุดได้ส่วนลด · ใส่ 2 = ลดแค่ 2 ชุดต่อออร์เดอร์"}
                    </p>
                  </div>
                )}
              </div>

              {/* สรุปสด + คำเตือน */}
              <div style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-3.5">
                <p style={{ color: COLORS.inkSoft }} className="text-[11px] font-medium mb-1">สรุปโปรโมชั่น (ลูกค้าจะเห็นแบบนี้)</p>
                <p style={{ color: COLORS.ink }} className="text-sm font-semibold leading-snug">{builderSummary}</p>
                <p style={{ color: validationMsg ? "#C0533F" : COLORS.caramelDark }} className="text-[11px] mt-1.5">
                  {validationMsg || builderHint}
                </p>
              </div>

              {/* เปิด/ปิด */}
              <div className="flex items-center justify-between pt-1">
                <button onClick={() => setForm((f) => ({ ...f, active: !f.active }))} className="flex items-center gap-2">
                  <span
