// so these are simple hand-drawn SVGs matching the same size/color/className API) ----------

  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} style={style} {...rest}>
      {children}

  );
}

// หมวดเมนูเริ่มต้น — พนักงานเพิ่ม/ลบ/แก้ชื่อได้ที่หน้าจัดการเมนู (บันทึกใน config/categories)
const DEFAULT_CATEGORIES = [
  { id: "drink", label: "เครื่องดื่ม" },
  { id: "bakery", label: "เบเกอรี่" },
];
// ใช้เป็นชื่อสำรองเมื่อหาหมวดไม่เจอ (ข้อมูลเก่าที่ยังมี category id เดิม เช่น "drink"/"bakery")
const CATEGORY_LABEL = { drink: "เครื่องดื่ม", bakery: "เบเกอรี่" };
// ชื่อหมวดจากลิสต์หมวดปัจจุบัน — หมวดใหม่ที่พนักงานสร้างจะได้ชื่อตรง ๆ
const categoryLabel = (id, categories) => {
  const c = (categories || []).find((x) => x.id === id);
  return (c && c.label) || CATEGORY_LABEL[id] || id;
};

let idCounter = 100;
const nextId = () => `m${idCounter++}`;
let addOnIdCounter = 100;
const nextAddOnId = () => `ao${addOnIdCounter++}`;
// แปลงเลขไทย (๐-๙) เป็นเลขอารบิกก่อนกรองตัวเลข — กันมือถือที่ตั้งคีย์บอร์ดเป็นเลขไทยพิมพ์ในช่องตัวเลขแล้วโดนกรองทิ้งหมด
const toArabicDigits = (s) => String(s || "").replace(/[๐-๙]/g, (d) => "๐๑๒๓๔๕๖๗๘๙".indexOf(d));
// ใช้แทน .replace(/[^0-9]/g, "") ตรงๆ ในช่องตัวเลขของฟอร์มตัวต่อโปรโมชั่น — รองรับทั้งเลขอารบิกและเลขไทย
const digitsOnly = (s) => toArabicDigits(s).replace(/[^0-9]/g, "");
// เหมือน digitsOnly แต่เก็บจุดทศนิยมไว้ด้วย — ใช้กับช่องที่กรอกทศนิยมได้ (ต้นทุน/หน่วย, จำนวนสต็อก, สูตรวัตถุดิบ)
const decimalDigitsOnly = (s) => toArabicDigits(s).replace(/[^0-9.]/g, "");
// โชว์ราคา/ยอดเงินให้อ่านง่าย — ถ้ามีเศษสตางค์ (เช่นจากส่วนลด %) บังคับ 2 ตำแหน่งทศนิยมเสมอ (40.50 ไม่ใช่ 40.5)
// แต่ถ้าเป็นจำนวนเต็มพอดี (ราคาปกติส่วนใหญ่) โชว์แบบจำนวนเต็มตามเดิม ไม่ใส่ .00 ให้รกจอ
// ใส่ , คั่นหลักพันให้เผื่อกรณีตัวเลขใหญ่ (ยอดขายรวม ฯลฯ)
const fmtBaht = (n) => {
  const num = Number(n) || 0;
  const rounded = Math.round(num * 100) / 100;
  return Number.isInteger(rounded) ? rounded.toLocaleString("th-TH") : rounded.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
let addOnGroupIdCounter = 100;
const nextAddOnGroupId = () => `g${addOnGroupIdCounter++}`;
let stockIdCounter = 100;
const nextStockId = () => `s${stockIdCounter++}`;
let expenseIdCounter = 100;
const nextExpenseId = () => `e${expenseIdCounter++}`;
let salesRoundIdCounter = 100;
const nextSalesRoundId = () => `sr${salesRoundIdCounter++}`;
let roundEntryIdCounter = 100;
const nextRoundEntryId = () => `re${roundEntryIdCounter++}`;

// หาตัวเลือกเพิ่ม (ท็อปปิ้ง/แอดออน) ที่ลูกค้าเลือก — จาก id ตัวเลือก + id กลุ่ม (gid)
// ใช้ผูกสต็อก/ต้นทุนของท็อปปิ้ง: เมนูไหนมี option นี้ ต้องหาค่า recipe/cost ของ option นั้นให้เจอ
const findMenuOption = (menuItem, addOn) => {
  if (!menuItem || !addOn) return null;
  const groups = normalizeAddOnGroups(menuItem.addOns);
  // ตัวเลือกใหม่จะติด gid มา — หาตรงกลุ่มก่อน
  if (addOn.gid) {
    const g = groups.find((grp) => grp.id === addOn.gid);
    const o = g && (g.options || []).find((opt) => opt.id === addOn.id);
    if (o) return o;
  }
  // ตัวเก่าที่ไม่มี gid — เทียบด้วย id + ชื่อ
  for (const g of groups) {
    const o = (g.options || []).find((opt) => opt.id === addOn.id && opt.name === addOn.name);
    if (o) return o;
  }
  return null;
};

// หน่วยนับสต็อกที่ให้พนักงานเลือก
const STOCK_UNITS = ["ชิ้น", "ถุง", "กล่อง", "ขวด", "แก้ว", "กก.", "กรัม", "ลิตร", "มิลลิลิตร"];
// หมวดรายจ่ายที่ให้พนักงานเลือก
const EXPENSE_CATEGORIES = ["วัตถุดิบ", "บรรจุภัณฑ์", "ค่าเช่า", "ค่าน้ำไฟ", "เงินเดือน", "ค่าเดินทาง", "อุปกรณ์", "อื่นๆ"];

// ตั้งค่าเลขลำดับ id ของ add-on ให้ต่อจาก id ที่มีอยู่แล้วในเมนูปัจจุบัน
// (กัน id ซ้ำข้าม session — เดิม id เริ่มนับที่ 100 ใหม่ทุกครั้งที่โหลดหน้า ทำให้ id ที่สร้างคนละครั้งชนกัน
// เช่น มี "ao100" สองตัวคนละกลุ่ม พอกดตัวเลือกหนึ่ง ตัวเลือกอีกกลุ่มถูกติ๊กตามไปด้วย)
const seedAddOnCounters = (menu) => {
  let max = 100;
  const consider = (id) => {
    const n = parseInt(String(id || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  };
  (menu || []).forEach((m) => {
    (m.addOns || []).forEach((entry) => {
      if (!entry || typeof entry !== "object") return;
      if (Array.isArray(entry.options)) {
        consider(entry.id); // group id
        entry.options.forEach((o) => consider(o.id)); // option ids
      } else if (entry.id) {
        consider(entry.id); // legacy flat option
      }
    });
  });
  addOnIdCounter = max + 1;
  addOnGroupIdCounter = max + 1;
};

// ตั้งค่าเลขลำดับ id ของเมนู/โปรโมชั่น ให้ต่อจาก id ที่มีอยู่แล้วในข้อมูลปัจจุบัน
// (กัน id ซ้ำข้าม session — เดิม id เริ่มนับที่ 100 ใหม่ทุกครั้งที่โหลดหน้า ทำให้ของที่สร้าง
// คนละ session ได้ id ชนกัน เช่น โปรโมชั่นตัวใหม่ได้ m100 ซ้ำกับตัวเก่า พอ id ซ้ำ
// แก้/ลบ/เปิดปิดตัวเดียวจะกระทบทุกตัวที่ id ตรงกัน — อาการเดียวกับบั๊ก add-on เดิมที่แก้ไปแล้ว)
const seedIdCounter = (menu, promos) => {
  let max = 100;
  const consider = (id) => {
    const n = parseInt(String(id || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  };
  (menu || []).forEach((m) => consider(m && m.id));
  (promos || []).forEach((p) => consider(p && p.id));
  idCounter = Math.max(idCounter, max + 1);
};

// แปลงข้อมูลตัวเลือกเพิ่มให้เป็นรูปแบบ "กลุ่ม" เสมอ — รองรับข้อมูลเก่า (list ราบ [{id,name,price}])
// และข้อมูลที่บันทึกแบบไม่ครบโครงสร้าง (เช่น [{id,name}] ไม่มีราคา) ด้วย โดยมองเป็น 1 กลุ่มที่ไม่บังคับเลือก
const normalizeAddOnGroups = (addOns) => {
  if (!Array.isArray(addOns)) return [];
  const first = addOns[0];
  if (first && typeof first === "object" && !Array.isArray(first.options)) {
    // เป็นตัวเลือกเดี่ยวแบบเก่า (ไม่ใช่กลุ่ม) — ราคาที่หายไปให้ถือเป็น 0 บาท
    return [{
      id: "g-legacy",
      name: "",
      required: false,
      options: addOns.map((a) => ({ id: a.id, name: a.name || "", price: Number(a.price) || 0 })),
    }];
  }
  return addOns;
};

// ก่อนบันทึก ให้การันตีว่า id ของกลุ่ม/ตัวเลือกในเมนูนี้ไม่ซ้ำกัน — ถ้าข้อมูลเก่ามี id ซ้ำ
// (จากบั๊กเดิมที่ id เริ่มนับใหม่ทุก session) จะสร้าง id ใหม่ให้ตัวที่ซ้ำทันที
const ensureUniqueAddOnIds = (groups) => {
  const seen = new Set();
  return (groups || []).map((g) => {
    let gid = g.id;
    if (seen.has(gid)) gid = nextAddOnGroupId();
    seen.add(gid);
    const options = (g.options || []).map((o) => {
      let oid = o.id;
      if (seen.has(oid)) oid = nextAddOnId();
      seen.add(oid);
      return { ...o, id: oid };
    });
    return { ...g, id: gid, options };
  });
};

// ---------- โปรโมชั่น (promotions) ----------
// ประเภท: discount = ลดราคาเมนู (เป็น % หรือบาท) | freeAddOn = ท็อปปิ้ง/แอดออนฟรี | code = โค้ดส่วนลด (เป็น % หรือบาท) | byoc = นำแก้วมาเอง (ลดเป็นบาท) | threshold = ซื้อครบตามยอดแล้วลด (อัตโนมัติ)
// โครงสร้าง: { id, name, type, active, discountPercent, discountBaht, minSpend, itemIds ([] = ทุกเมนู), addOnIds, code }
const PROMO_TYPE_LABEL = { discount: "ลดราคาเมนู", freeAddOn: "ท็อปปิ้งฟรี", code: "โค้ดส่วนลด", byoc: "เอาแก้วมาเอง", threshold: "ซื้อครบลด" };

// ตรวจ/ซ่อม id โปรโมชั่นให้ไม่ซ้ำกัน — ถ้ามี id ซ้ำหรือไม่มี id จะสร้าง id ใหม่ให้ตัวที่ซ้ำ
// (ข้อมูลที่พังจากบั๊กเดิม: id เริ่มนับ 100 ใหม่ทุก session → โปรโมชั่นที่สร้างข้าม session ได้ id
// ชนกัน พอ id ซ้ำ แก้/ลบ/เปิดปิดตัวเดียวจะกระทบทุกตัวที่ id ตรงกัน) คืน { items, changed }
const ensureUniquePromoIds = (items) => {
  let max = 100;
  const seen = new Set();
  let changed = false;
  // ให้ counter เลยทุก id ที่มีอยู่ในลิสต์นี้ก่อน (กัน id ใหม่ที่สร้างเพื่อซ่อมชนกับของเดิม)
  (items || []).forEach((p) => {
    const n = parseInt(String((p && p.id) || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  });
  idCounter = Math.max(idCounter, max + 1);
  const fixed = (items || []).map((p) => {
    if (!p || typeof p !== "object") return p;
    const id = p.id && !seen.has(p.id) ? p.id : nextId();
    if (id !== p.id) changed = true;
    seen.add(id);
    return id === p.id ? p : { ...p, id };
  });
  return { items: fixed, changed };
};

// ---------- กัน id ซ้ำข้าม session สำหรับสต็อก / รายจ่าย / รอบการขาย ----------
// บั๊กเดียวกันกับเมนู/โปรโมชั่น: ตัวนับ id ของหน้าเหล่านี้เริ่ม 100 ใหม่ทุกครั้งที่โหลดหน้า
// ทำให้ของที่สร้างคนละ session ได้ id ชนกัน (เช่น รายจ่ายตัวใหม่ได้ e100 ซ้ำกับตัวเก่า)
// พอ id ซ้ำ แก้/ลบ/นับตัวเดียวจะกระทบทุกตัวที่ id ตรงกัน — วิธีแก้เหมือนที่ใช้กับโปรโมชั่น:
// 1) seed ตัวนับต่อจาก id สูงสุดที่มีอยู่แล้ว  2) ซ่อม id ที่ซ้ำ/หายให้ใหม่ตอนโหลดข้อมูล

// ตั้งค่าเลขลำดับ id ของสต็อก ให้ต่อจาก id ที่มีอยู่แล้วในข้อมูลปัจจุบัน
const seedStockCounter = (stockItems) => {
  let max = 100;
  (stockItems || []).forEach((s) => {
    const n = parseInt(String((s && s.id) || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  });
  stockIdCounter = Math.max(stockIdCounter, max + 1);
};

// ตั้งค่าเลขลำดับ id ของรายจ่าย ให้ต่อจาก id ที่มีอยู่แล้วในข้อมูลปัจจุบัน
const seedExpenseCounter = (expenses) => {
  let max = 100;
  (expenses || []).forEach((e) => {
    const n = parseInt(String((e && e.id) || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  });
  expenseIdCounter = Math.max(expenseIdCounter, max + 1);
};

// ตั้งค่าเลขลำดับ id ของรอบการขาย (sr…) และรายการเบิก/ฝากในรอบ (re…) ให้ต่อจาก id ที่มีอยู่แล้ว
// ต้องดูทั้งรอบที่เปิดอยู่ (active) และประวัติรอบที่ปิดไปแล้ว (history)
const seedSalesRoundCounters = (salesRound) => {
  let maxRound = 100;
  let maxEntry = 100;
  const consider = (r) => {
    if (!r || typeof r !== "object") return;
    const n = parseInt(String(r.id || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > maxRound) maxRound = n;
    (r.entries || []).forEach((en) => {
      const m = parseInt(String((en && en.id) || "").replace(/^\D+/, ""), 10);
      if (!Number.isNaN(m) && m > maxEntry) maxEntry = m;
    });
  };
  consider(salesRound && salesRound.active);
  ((salesRound && salesRound.history) || []).forEach(consider);
  salesRoundIdCounter = Math.max(salesRoundIdCounter, maxRound + 1);
  roundEntryIdCounter = Math.max(roundEntryIdCounter, maxEntry + 1);
};

// ซ่อม id สต็อกที่ซ้ำ/หายให้ไม่ซ้ำกัน — คืน { items, changed } ถ้าพบ id ซ้ำจะให้ id ใหม่กับตัวที่ซ้ำ
const ensureUniqueStockIds = (items) => {
  let max = 100;
  const seen = new Set();
  let changed = false;
  (items || []).forEach((s) => {
    const n = parseInt(String((s && s.id) || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  });
  stockIdCounter = Math.max(stockIdCounter, max + 1);
  const fixed = (items || []).map((s) => {
    if (!s || typeof s !== "object") return s;
    const id = s.id && !seen.has(s.id) ? s.id : nextStockId();
    if (id !== s.id) changed = true;
    seen.add(id);
    return id === s.id ? s : { ...s, id };
  });
  return { items: fixed, changed };
};

// ซ่อม id รายจ่ายที่ซ้ำ/หายให้ไม่ซ้ำกัน — คืน { items, changed }
const ensureUniqueExpenseIds = (items) => {
  let max = 100;
  const seen = new Set();
  let changed = false;
  (items || []).forEach((e) => {
    const n = parseInt(String((e && e.id) || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > max) max = n;
  });
  expenseIdCounter = Math.max(expenseIdCounter, max + 1);
  const fixed = (items || []).map((e) => {
    if (!e || typeof e !== "object") return e;
    const id = e.id && !seen.has(e.id) ? e.id : nextExpenseId();
    if (id !== e.id) changed = true;
    seen.add(id);
    return id === e.id ? e : { ...e, id };
  });

// ซ่อม id รอบการขาย + รายการเบิก/ฝากที่ซ้ำ/หายให้ไม่ซ้ำกัน — คืน { active, history, changed }
// (ตรวจทั้งรอบที่เปิดอยู่และประวัติ โดยใช้แผนที่ id กลางร่วมกัน กันรอบใหม่ได้ id ชนกับรอบเก่า)
const ensureUniqueSalesRoundIds = (round) => {
  if (!round) return { active: null, history: [], changed: false };
  let maxRound = 100;
  let maxEntry = 100;
  const seenRounds = new Set();
  const seenEntries = new Set();
  let changed = false;
  const bump = (r) => {
    if (!r || typeof r !== "object") return;
    const n = parseInt(String(r.id || "").replace(/^\D+/, ""), 10);
    if (!Number.isNaN(n) && n > maxRound) maxRound = n;
    (r.entries || []).forEach((en) => {
      const m = parseInt(String((en && en.id) || "").replace(/^\D+/, ""), 10);
      if (!Number.isNaN(m) && m > maxEntry) maxEntry = m;
    });
  };
  bump(round.active);
  (round.history || []).forEach(bump);
  salesRoundIdCounter = Math.max(salesRoundIdCounter, maxRound + 1);
  roundEntryIdCounter = Math.max(roundEntryIdCounter, maxEntry + 1);
  const fixRound = (r) => {
    if (!r || typeof r !== "object") return r;
    const rid = r.id && !seenRounds.has(r.id) ? r.id : nextSalesRoundId();
    if (rid !== r.id) changed = true;
    seenRounds.add(rid);
    const entries = (r.entries || []).map((en) => {
      if (!en || typeof en !== "object") return en;
      const eid = en.id && !seenEntries.has(en.id) ? en.id : nextRoundEntryId();
      if (eid !== en.id) changed = true;
      seenEntries.add(eid);
      return eid === en.id ? en : { ...en, id: eid };
    });
    return rid === r.id ? { ...r, entries } : { ...r, id: rid, entries };
  };
  return {
    active: round.active ? fixRound(round.active) : null,
    history: (round.history || []).map(fixRound),
    changed,
  };
};

// % ลดสูงสุดของเมนูนี้จากโปรโมชั่นลดราคาที่เปิดใช้ (ตรงกับเมนู หรือเป็น "ทุกเมนู")
const discountPercentFor = (itemId, promos) =>
  Math.max(0, ...(promos || [])
    .filter(
      (p) =>
        p && p.active && p.type === "discount" &&
        (!p.itemIds || p.itemIds.length === 0 || p.itemIds.includes(itemId))
    )
    .map((p) => Number(p.discountPercent) || 0));

// ส่วนลดเป็นบาทสูงสุดของเมนูนี้ (โปรโมชั่น "ลดราคาเมนู" แบบระบุบาท เช่น ลด 5 บาท)
const discountBahtFor = (itemId, promos) =>
  Math.max(0, ...(promos || [])
    .filter(
      (p) =>
        p && p.active && p.type === "discount" &&
        (!p.itemIds || p.itemIds.length === 0 || p.itemIds.includes(itemId))
    )
    .map((p) => Number(p.discountBaht) || 0));

// ราคาเมนูหลังหักส่วนลด (หัก % ก่อน แล้วค่อยหักบาท — ปัดเป็นสตางค์)
// รวมทั้งโปรเก่า (type=discount) และโปรตัวต่อ (rules — หักเฉพาะแบบหน่วยที่เช็คเงื่อนไขเวลา/วันได้)
// now: timestamp ที่ใช้เช็คเงื่อนไขเวลา/วัน — ส่งเข้ามาจาก state ที่ tick เองได้ (ไม่งั้นราคาจะค้างจนกว่าจะมี re-render อื่น)
const effectiveItemPrice = (item, promos, now) => {
  if (!item) return 0;
  let pct = discountPercentFor(item.id, promos);
  let baht = discountBahtFor(item.id, promos);
  const ru = ruleUnitDiscountFor(item.id, promos, now || Date.now());
  pct = Math.max(pct, ru.pct);
  baht = Math.max(baht, ru.baht);
  let price = item.price;
  if (pct > 0) price = Math.round(price * (100 - pct)) / 100;
  if (baht > 0) price = Math.max(0, Math.round((price - baht) * 100) / 100);
  return price;
};

// ป้ายส่วนลดบนการ์ดเมนู เช่น "-10%" หรือ "-฿5" (ถ้ามีทั้งสองอย่างแสดงรวมกัน)
const discountLabelFor = (item, promos, now) => {
  if (!item) return "";
  let pct = discountPercentFor(item.id, promos);
  let baht = discountBahtFor(item.id, promos);
  const ru = ruleUnitDiscountFor(item.id, promos, now || Date.now());
  pct = Math.max(pct, ru.pct);
  baht = Math.max(baht, ru.baht);
  if (pct > 0 && baht > 0) return `-${pct}% -฿${baht}`;
  if (pct > 0) return `-${pct}%`;
  if (baht > 0) return `-฿${baht}`;
  return "";
};

// ตัวเลือกเพิ่มนี้ฟรีไหม (โปรเก่า freeAddOn + โปรตัวต่อแบบท็อปปิ้งฟรี — ตรงกับเมนู)
const isAddOnFree = (itemId, optionId, promos, now) =>
  (promos || []).some(
    (p) =>
      p && p.active && p.type === "freeAddOn" &&
      (!p.itemIds || p.itemIds.length === 0 || p.itemIds.includes(itemId)) &&
      (p.addOnIds || []).includes(optionId)
  ) || ruleIsAddOnFree(itemId, optionId, promos, now || Date.now());

const effectiveAddOnPrice = (itemId, option, promos, now) =>
  isAddOnFree(itemId, option && option.id, promos, now) ? 0 : Number((option && option.price) || 0);

// ================= โปรโมชั่นแบบตัวต่อ (rule-based) =================
// โปรใหม่เก็บในฟิลด์ rules: { conds:[], code, minSpendTiers:[{min,amount}], minQtyTiers:[],
//   containsIds:[], timeFrom, timeTo, days:[], pickupOnly, target:"all|items|addons|cart",
//   targetIds:[], addonIds:[], addonMenuScope:"all|some", addonMenuIds:[],
//   action:"percent|baht|free|bogo|nth|combo", actionAmount, actionUnit:"percent|baht",
//   actionN, comboIds:[], comboMode:"price|percent|baht", limitMax }
// โปรเก่า (type: discount/freeAddOn/code/byoc/threshold) ยังใช้โค้ดเดิมไม่ถูกแตะ —
// เวลาเปิดแก้จะแปลงเป็นฟอร์มตัวต่อ และเมื่อบันทึกจะกลายเป็นโปรแบบ rules

// ขั้นที่ผ่านสูงสุดของขั้นบันได (เช่น ฿200→฿20 / ฿400→฿50 — ยอด 350 ได้ขั้น ฿200)
const bestTier = (tiers, value) => {
  const list = (tiers || []).filter((x) => x && value >= (Number(x.min) || 0));
  if (!list.length) return null;
  return list.reduce((a, b) => (Number(a.min) > Number(b.min) ? a : b));
};
// เงื่อนไข "เฉพาะช่วงเวลา" เช่น 14:00–17:00
const ruleTimeMatches = (r, now) => {
  if (!r.conds || !r.conds.includes("time")) return true;
  const d = new Date(now);
  const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return (!r.timeFrom || hm >= r.timeFrom) && (!r.timeTo || hm <= r.timeTo);
};
// เงื่อนไข "เฉพาะวัน" (0 = อาทิตย์ … 6 = เสาร์)
const ruleDayMatches = (r, now) => {
  if (!r.conds || !r.conds.includes("days")) return true;
  const d = new Date(now);
  return !r.days || r.days.length === 0 || r.days.includes(d.getDay());
};
// เงื่อนไขที่เช็คได้เฉพาะเมื่อมีตะกร้า/วิธีรับ/โค้ด/แก้ว — ใช้ในหน้าชำระเงิน
const ruleCartConditionsMet = (r, ctx, promo) => {
  const conds = r.conds || [];
  // โค้ดของโปรตัวต่อ ต้องกดปุ่ม "ใช้โค้ด" แล้วผ่านการตรวจ (พิมพ์ตรง + ยังไม่ครบโควตา/ยังไม่เคยใช้) มาก่อน
  // เหมือนกับโค้ดโปรแบบเก่าทุกประการ — ผูกกับ appliedPromoId ที่ส่งมาจาก applyPromoCode() เท่านั้น
  // (ไม่ใช้วิธีจับคู่ข้อความสดจาก ctx.code ตรงๆ อีกต่อไป กันหักส่วนลดอัตโนมัติตอนพิมพ์ก่อนกดยืนยัน
  // และกันข้อความแจ้งเตือน/ป้ายยืนยันไม่ตรงกับโปรที่ใช้จริง)
  if (conds.includes("code") && (ctx && ctx.appliedPromoId) !== (promo && promo.id)) return false;
  if (conds.includes("pickup") && (ctx && ctx.deliveryMethod) !== "pickup") return false;
  if (conds.includes("byoc")) {
    if (!(ctx && ctx.bringCup)) return false;
    if (r.pickupOnly !== false && (ctx && ctx.deliveryMethod) !== "pickup") return false;
  }
  const cart = (ctx && ctx.cart) || [];
  if (conds.includes("contains") && (r.containsIds || []).length) {
    const inCart = new Set(cart.map((c) => c.menuId));
    if (!r.containsIds.every((id) => inCart.has(id))) return false;
  }
  const subtotal = (ctx && ctx.subtotal) || 0;
  if (conds.includes("minSpend") && !bestTier(r.minSpendTiers, subtotal)) return false;
  if (conds.includes("minQty")) {
    const totalQty = cart.reduce((s, c) => s + (Number(c.qty) || 0), 0);
    if (!bestTier(r.minQtyTiers, totalQty)) return false;
  }
  return true;
};
// เงื่อนไขที่อิสระจากตะกร้า (เวลา/วัน) — เช็คได้ที่หน้าเมนู
const ruleMenuConditionsMet = (r, now) => ruleTimeMatches(r, now) && ruleDayMatches(r, now);
// โปรแบบนี้หักราคาหน่วยตอนเพิ่มลงตะกร้าแล้ว (หน้าเมนู) — ต้องไม่หักซ้ำที่หน้าชำระเงิน
const ruleIsUnitLevel = (r) => {
  const simpleConds = !(r.conds || []).some((c) => ["code", "pickup", "byoc", "minSpend", "minQty", "contains"].includes(c));
  if (!simpleConds) return false;
  if ((r.target === "all" || r.target === "items") && (r.action === "percent" || r.action === "baht")) return true;
  // ท็อปปิ้งฟรีที่มี "จำกัดสูงสุด" ต้องนับรวมทั้งออร์เดอร์ — ตอนเพิ่มลงตะกร้าทีละชิ้นยังไม่รู้ว่าออร์เดอร์
  // สุดท้ายจะมีกี่ชิ้น เลยต้องส่งไปคำนวณที่ตะกร้ารวม (cart-level) แทน ไม่งั้น limitMax จะไม่มีผลเลย
  if (r.target === "addons" && r.action === "free" && !(Number(r.limitMax) > 0)) return true;
  return false;
};
// ส่วนลดหน่วยของโปรตัวต่อ (หน้าเมนู + ตอนเพิ่มลงตะกร้า) — ใช้สูงสุดของทุกโปรที่ตรง
const ruleUnitDiscountFor = (itemId, promos, now) => {
  let pct = 0;
  let baht = 0;
  (promos || []).forEach((p) => {
    if (!p || !p.active || !p.rules) return;
    const r = p.rules;
    if (r.target !== "all" && r.target !== "items") return;
    if (r.action !== "percent" && r.action !== "baht") return;
    if (!ruleIsUnitLevel(r) || !ruleMenuConditionsMet(r, now)) return;
    if (r.target === "items" && !(r.targetIds || []).includes(itemId)) return;
    if (r.action === "percent") pct = Math.max(pct, Number(r.actionAmount) || 0);
    else baht = Math.max(baht, Number(r.actionAmount) || 0);
  });
  return { pct, baht };
};
// ท็อปปิ้งนี้ฟรีไหมจากโปรตัวต่อ (หน้าเมนู + ตอนเพิ่มลงตะกร้า)
const ruleIsAddOnFree = (itemId, optionId, promos, now) =>
  (promos || []).some((p) => {
    if (!p || !p.active || !p.rules) return false;
    const r = p.rules;
    if (r.target !== "addons" || r.action !== "free") return false;
    if (!ruleIsUnitLevel(r) || !ruleMenuConditionsMet(r, now)) return false;
    if (r.addonMenuScope === "some" && !(r.addonMenuIds || []).includes(itemId)) return false;
    return (r.addonIds || []).includes(optionId);
  });
const ruleAmtText = (amount, isPct) => (isPct ? ` ${amount}%` : ` ฿${amount}`);
// ส่วนลดตะกร้า (หน้าชำระเงิน) — โปรตัวต่อทุกแบบที่ไม่ได้หักราคาหน่วยไว้
// คืน { baht, label, promoId } — baht หักจากยอดรวม, label ไว้โชว์สรุป, promoId ไว้กดนับการใช้โค้ด
const computeRuleCartDiscount = (cart, promos, ctx) => {
  const now = (ctx && ctx.now) || Date.now();
  const subtotal = (ctx && ctx.subtotal) || 0;
  const cartQty = cart.reduce((s, c) => s + (Number(c.qty) || 0), 0);
  let totalBaht = 0;
  const labels = [];
  let promoId = "";
  let promoPerCustomer = false;
  (promos || []).forEach((p) => {
    if (!p || !p.active || !p.rules) return;
    const r = p.rules;
    if (!ruleTimeMatches(r, now) || !ruleDayMatches(r, now)) return;
    if (ruleIsUnitLevel(r)) return; // หักไปแล้วตอนเพิ่มลงตะกร้า — กันหักซ้ำ
    if (!ruleCartConditionsMet(r, ctx, p)) return;
    let baht = 0;
    let label = "";
    if (r.target === "cart") {
      if (r.conds.includes("minSpend") && (r.minSpendTiers || []).length) {
        const tier = bestTier(r.minSpendTiers, subtotal);
        baht = Number((tier && tier.amount) || 0);
        label = `ซื้อครบลด ${ruleAmtText(baht, false)}`;
      } else if (r.conds.includes("minQty") && (r.minQtyTiers || []).length) {
        const tier = bestTier(r.minQtyTiers, cartQty);
        baht = Number((tier && tier.amount) || 0);
        label = `ซื้อครบ ${tier ? tier.min : ""} ชิ้น ลด ${ruleAmtText(baht, false)}`;
      } else if (r.action === "percent") {
        baht = Math.round(subtotal * (Number(r.actionAmount) || 0)) / 100;
        label = `ลด ${ruleAmtText(Number(r.actionAmount) || 0, true)}`;
      } else if (r.action === "combo") {
        // action=combo ไม่รองรับ target=cart (ราคาชุดคำนวณจากเมนูในชุดเท่านั้น ไม่ใช่ยอดรวมทั้งบิล)
        // กันไว้เผื่อมีข้อมูลเก่าก่อนแก้ฟอร์ม — ไม่ให้หักผิดเป็นส่วนลดยอดรวมทั้งบิล
        baht = 0;
      } else {
        baht = Number(r.actionAmount) || 0;
        label = `ลด ${ruleAmtText(baht, false)}`;
      }
      baht = Math.min(baht, subtotal);
    } else if (r.target === "items" || r.target === "all") {
      const targets = cart.filter((c) => r.target === "all" || (r.targetIds || []).includes(c.menuId));
      if (r.action === "percent" || r.action === "baht") {
        // ส่วนลด %/บาท เฉพาะเมนูที่เลือก แต่มีเงื่อนไขตะกร้า (เช่น ต้องมีเมนู X ในตะกร้า / ซื้อครบ) —
        // ยังไม่ได้หักตอนเพิ่มลงตะกร้า (ruleIsUnitLevel ข้ามไว้) ต้องคิดที่นี่
        // หมายเหตุ: c.price คือราคาต่อหน่วยอยู่แล้ว (ราคาหน่วยหลังหักโปรตอนเพิ่มลงตะกร้า) — อย่าหารด้วย qty
        targets.forEach((c) => {
          const unit = c.price;
          const d = r.action === "percent" ? Math.round(unit * (Number(r.actionAmount) || 0)) / 100 : Math.min(Number(r.actionAmount) || 0, unit);
          baht += Math.round(d * (Number(c.qty) || 1) * 100) / 100;
        });
        label = `ลด${ruleAmtText(Number(r.actionAmount) || 0, r.action === "percent")}`;
      } else if (r.action === "bogo") {
        const X = Math.max(1, Number(r.actionAmount) || 2);
        let cnt = 0;
        if (r.mixTargets) {
          // คละเมนูได้ — รวมจำนวนชิ้นของทุกเมนูในเป้าหมายเป็นกองเดียว แล้วแถมของที่ "ถูกที่สุด"
          // เป็นวิธีมาตรฐานที่ร้านทำกัน (ลูกค้าไม่ได้เลือกว่าตัวไหนฟรี แต่ร้านไม่ขาดทุนเกินจำเป็น)
          const units = [];
          targets.forEach((c) => {
            const q = Number(c.qty) || 0;
            for (let i = 0; i < q; i++) units.push(c.price);
          });
          units.sort((a, b) => a - b); // เรียงถูก→แพง ให้ตัวถูกสุดโดนฟรีก่อน
          let freeUnits = Math.floor(units.length / X);
          if (Number(r.limitMax) > 0) freeUnits = Math.min(freeUnits, Number(r.limitMax));
          for (let i = 0; i < freeUnits; i++) baht += Math.round(units[i] * 100) / 100;
          cnt = freeUnits;
        } else {
          // แบบเดิม — นับแยกทีละเมนู ต้องซื้อเมนูเดียวกันครบ X ชิ้นถึงจะได้ฟรีของเมนูนั้น
          // จำกัดสูงสุด (limitMax) นับรวมข้ามเมนูเป็นก้อนเดียวทั้งออร์เดอร์ (ไม่ใช่แยกทีละเมนู)
          // เรียงเมนูราคาถูกไปแพงก่อน กันร้านขาดทุนเกินจำเป็นเวลาโดนตัดโควตา (แบบเดียวกับโหมดคละเมนู)
          const perMenuFree = [...targets]
            .sort((a, b) => a.price - b.price)
            .map((c) => ({ c, freeUnits: Math.floor((Number(c.qty) || 0) / X) }));
          perMenuFree.forEach(({ c, freeUnits }) => {
            if (Number(r.limitMax) > 0) freeUnits = Math.min(freeUnits, Math.max(0, Number(r.limitMax) - cnt));
            if (freeUnits > 0) {
              baht += Math.round(freeUnits * c.price * 100) / 100;
              cnt += freeUnits;
            }
          });
        }
        label = r.mixTargets ? `1แถม1 คละเมนู (ฟรี ${cnt} ชิ้น)` : `1แถม1 (ฟรี ${cnt} ชิ้น)`;
      } else if (r.action === "nth") {
        const N = Math.max(1, Number(r.actionN) || 2);
        let cnt = 0;
        targets.forEach((c) => {
          const unit = c.price;
          if ((Number(c.qty) || 0) < N) return;
          if (Number(r.limitMax) > 0 && cnt >= Number(r.limitMax)) return;
          const d = r.actionUnit === "baht" ? Math.min(Number(r.actionAmount) || 0, unit) : Math.round(unit * (Number(r.actionAmount) || 0)) / 100;
          baht += Math.round(d * 100) / 100;
          cnt += 1;
        });
        label = `ชิ้นที่ ${N} ลด${ruleAmtText(Number(r.actionAmount) || 0, r.actionUnit === "percent")}`;
      } else if (r.action === "free") {
        // จำกัดสูงสุด (limitMax) นับรวมข้ามเมนูเป็นก้อนเดียวทั้งออร์เดอร์ (ไม่ใช่แยกทีละเมนู)
        // เรียงเมนูราคาถูกไปแพงก่อน กันร้านขาดทุนเกินจำเป็นเวลาโดนตัดโควตา
        let cnt = 0;
        [...targets].sort((a, b) => a.price - b.price).forEach((c) => {
          const unit = c.price;
          let freeUnits = 1;
          if (Number(r.limitMax) > 0) freeUnits = Math.min(freeUnits, Math.max(0, Number(r.limitMax) - cnt));
          if (freeUnits > 0) {
            baht += Math.round(freeUnits * unit * 100) / 100;
            cnt += freeUnits;
          }
        });
        label = `ของแถมฟรี ${cnt} ชิ้น`;
      } else if (r.action === "combo" && (r.comboIds || []).length >= 2) {
        const setIds = r.comboIds;
        const qtyPer = setIds.map((id) => {
          const c = cart.find((x) => x.menuId === id);
          return c ? Number(c.qty) || 0 : 0;
        });
        const numSets = Math.min(...qtyPer);
        if (numSets > 0) {
          const fullPrice = setIds.reduce((s, id) => {
            const c = cart.find((x) => x.menuId === id);
            return s + (c ? c.price : 0);
          }, 0);
          let perSet = 0;
          if (r.comboMode === "price") perSet = fullPrice - (Number(r.actionAmount) || 0);
          else if (r.comboMode === "percent") perSet = Math.round(fullPrice * (Number(r.actionAmount) || 0)) / 100;
          else perSet = Number(r.actionAmount) || 0;
          perSet = Math.max(0, Math.min(perSet, fullPrice));
          baht = Math.round(perSet * numSets * 100) / 100;
          label = `ราคารวมชุด (${numSets} ชุด)`;
        }
      }
      baht = Math.min(baht, subtotal);
    } else if (r.target === "addons") {
      // ท็อปปิ้งฟรีแบบมีเงื่อนไขตะกร้า (เช่น ซื้อครบแล้วไข่มุกฟรี) หรือมี "จำกัดสูงสุด" ที่ต้องนับรวมทั้งออร์เดอร์
      // — คืนเงินราคา add-on ที่ควรฟรี (แบบไม่มีเงื่อนไข+ไม่จำกัดถูกหักเป็นราคาหน่วยตอนเพิ่มลงตะกร้าแล้ว — ruleIsUnitLevel ข้ามไว้ข้างบน)
      const freeOptIds = r.addonIds || [];
      let freeCnt = 0;
      cart.forEach((c) => {
        if (r.addonMenuScope === "some" && !(r.addonMenuIds || []).includes(c.menuId)) return;
        (c.addOns || []).forEach((a) => {
          if (!freeOptIds.includes(a.id)) return;
          if (Number(r.limitMax) > 0 && freeCnt >= Number(r.limitMax)) return;
          baht += Math.round((Number(a.price) || 0) * (Number(c.qty) || 1));
          freeCnt += 1;
        });
      });
      baht = Math.round(baht * 100) / 100;
      label = `ท็อปปิ้งฟรี ${freeCnt} รายการ`;
    }
    if (baht > 0) {
      totalBaht += baht;
      if (label) labels.push(label);
    }
    // จด id ของโปรที่ใช้โค้ด (เพื่อนับการใช้ตอนสั่งสำเร็จ) — เฉพาะตัวที่เงื่อนไขโค้ดผ่าน
    if ((r.conds || []).includes("code") && !promoId) {
      promoId = p.id;
      promoPerCustomer = !!p.perCustomer;
    }
  });
  return { baht: Math.round(totalBaht * 100) / 100, label: labels.join(" + "), promoId, perCustomer: promoPerCustomer };
};

// ข้อความโค้ดของโปรโมชั่น (รองรับทั้งโปรเก่า type:"code" และโปรตัวต่อที่เงื่อนไขมี code)
const promoCodeText = (p) =>
  p && p.rules && (p.rules.conds || []).includes("code") ? String(p.rules.code || "") : p && p.type === "code" ? String(p.code || "") : "";
// % ของโปรโมชั่น (รองรับทั้งโปรเก่าและโปรตัวต่อ — โปรตัวต่อแบบบาท/อื่นๆ คืน 0)
const promoDiscountPercent = (p) =>
  p && p.rules
    ? p.rules.action === "percent" ? Number(p.rules.actionAmount) || 0 : 0
    : Number(p && p.discountPercent) || 0;
// ฿ ของโปรโมชั่น (รองรับทั้งโปรเก่าและโปรตัวต่อ — โปรตัวต่อแบบ % คืน 0)
const promoDiscountBaht = (p) =>
  p && p.rules
    ? p.rules.action === "baht" ? Number(p.rules.actionAmount) || 0 : 0
    : Number(p && p.discountBaht) || 0;
// หาโค้ดส่วนลดที่เปิดใช้และตรงกับที่กรอก (ไม่สนตัวพิมพ์เล็ก-ใหญ่) — ทั้งโปรเก่าและโปรตัวต่อ
const findPromoCode = (code, promos) => {
  const c = String(code || "").trim().toUpperCase();
  if (!c) return null;
  return (promos || []).find((p) => p && p.active && String(promoCodeText(p) || "").trim().toUpperCase() === c) || null;
};

// ยอดรวมออร์เดอร์ (หักส่วนลดโค้ดแล้ว) — ใช้ในหน้าพนักงาน/แดชบอร์ด/ใบหลักฐาน
const calcOrderTotal = (order) => {
  const subtotal = ((order && order.items) || []).reduce((s, i) => s + i.price * i.qty, 0);
  const discount = (order && order.discount && Number(order.discount.baht)) || 0;
  return Math.round(Math.max(0, subtotal - discount) * 100) / 100;
};

// ---- สถานะการจ่ายเงินของออร์เดอร์ ----
// จ่ายแล้ว = โอน + แนบสลิปตอนสั่ง | ยังไม่จ่าย = เก็บเงินตอนรับของ (เงินสด หรือ เก็บปลายทาง)
// ออร์เดอร์เก่า (ไม่มีฟิลด์ paid) คิดจาก: มีสลิปและไม่ใช่เงินสด = จ่ายแล้ว / เงินสด = ยังไม่จ่าย
const orderIsPaid = (order) =>
  order.paid === true ? true : order.paid === false ? false : !!(order.slip && order.paymentMethod !== "cash");
// ออร์เดอร์นี้ต้องเก็บเงินตอนรับของไหม (เงินสด หรือ ลูกค้าเลือก "เก็บปลายทาง") — คนส่งต้องรู้
// ออร์เดอร์เก่า (ไม่มีฟิลด์ collectOnDelivery) คิดจาก: เงินสด = ต้องเก็บตอนรับของ
const orderCollectsOnDelivery = (order) =>
  order.collectOnDelivery === true ? true : order.collectOnDelivery === false ? false : order.paymentMethod === "cash";
// เวลาที่ออร์เดอร์เข้ามาแบบกระชับ เช่น "14:32" — ไว้โชว์ในบรรทัดรายละเอียดการ์ดออร์เดอร์
const formatOrderTime = (ms) => {
  const d = new Date(ms);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};

// ---------- Delivery scheduling helpers ----------
// ช่วงเวลาจัดส่งให้ลูกค้าเลือก (ทุก 30 นาที ตั้งแต่ 09:00-20:00) — ปรับช่วงเวลาได้ตามเวลาเปิด-ปิดร้านจริง
const DELIVERY_TIME_SLOTS = (() => {
  const slots = [];
  for (let h = 9; h <= 20; h++) {
    slots.push(`${String(h).padStart(2, "0")}:00`);
    if (h < 20) slots.push(`${String(h).padStart(2, "0")}:30`);
  }
  return slots;
})();

// สร้างช่วงเวลาจัดส่ง (ทุก 30 นาที) จากเวลาเปิด-ปิดจัดส่งที่ร้านตั้งไว้ในหน้าจัดการเมนู
// เช่น "09:00"–"20:00" → [09:00, 09:30, ..., 20:00] — ถ้าไม่ได้ตั้ง ใช้ค่าเริ่มต้น 09:00–20:00
const buildTimeSlots = (start, end) => {
  const toMin = (t) => {
    const [h, m] = String(t || "").split(":").map(Number);
    return Number.isFinite(h) ? h * 60 + (Number.isFinite(m) ? m : 0) : 0;
  };
  const s = toMin(start);
  const e = Math.max(toMin(end), s + 30);
  const slots = [];
  for (let t = s; t <= e; t += 30) {
    slots.push(`${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`);
  }
  return slots;
};
// จำกัดเวลาให้อยู่ในรูปแบบ HH:MM เสมอ (ใช้กับ input time ที่อาจได้ค่าเปล่า)
const clampTimeInput = (v, fallback) => {
  const s = String(v || "").trim();
  return /^\d{2}:\d{2}$/.test(s) ? s : fallback;
};

const pad2 = (n) => String(n).padStart(2, "0");
// ฟอร์แมตเบอร์โทรไทยขณะกรอก: เก็บเฉพาะเลข จำกัด 10 หลัก แล้วใส่ - อัตโนมัติแบบ 0xx-xxx-xxxx
const formatPhoneInput = (raw) => {
  const digits = String(raw || "").replace(/\D/g, "").slice(0, 10);
  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
  return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
};
// ตรวจรูปแบบเบอร์โทร: ต้องเป็นเลข 10 หลัก ขึ้นต้น 0 (เช่น 081-234-5678) — กันเบอร์ปลอม/พิมพ์ผิด
const isValidPhone = (phone) => /^0\d{9}$/.test(String(phone || "").replace(/\D/g, ""));
// คืนค่า YYYY-MM-DD ของวันนั้น (ใช้เป็นค่า min ของ input date และค่าตั้งต้น "วันนี้"/"พรุ่งนี้")
const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const tomorrowKey = () => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return dateKey(d);
};
// สร้างตัวเลือกวันที่ล่วงหน้า 7 วันไว้ให้ลูกค้าแตะเลือกเร็ว ๆ (ไม่ต้องเปิด date picker ทุกครั้ง)
const upcomingDateOptions = (days = 7) => {
  const out = [];
  const THAI_WEEKDAYS = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
  const THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  for (let i = 0; i < days; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    out.push({
      key: dateKey(d),
      label: i === 0 ? "วันนี้" : i === 1 ? "พรุ่งนี้" : `${THAI_WEEKDAYS[d.getDay()]} ${d.getDate()} ${THAI_MONTHS[d.getMonth()]}`,
    });
  }
  return out;
};
// แปลง YYYY-MM-DD ให้เป็นข้อความไทยอ่านง่าย เช่น "จ. 11 ส.ค." ใช้โชว์ในการ์ดออร์เดอร์ฝั่งพนักงาน
const formatDeliveryDateLabel = (key) => {
  if (!key) return "-";
  if (key === todayKey()) return "วันนี้";
  if (key === tomorrowKey()) return "พรุ่งนี้";
  const THAI_WEEKDAYS = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
  const THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return `${THAI_WEEKDAYS[dt.getDay()]} ${dt.getDate()} ${THAI_MONTHS[dt.getMonth()]}`;
};

// ย่อ/บีบอัดรูป (เช่น รูปสลิปจากกล้องมือถือที่ไฟล์ใหญ่ 3-5MB+) ก่อนอัปโหลด
// โดยลดความกว้าง/สูงสูงสุดและแปลงเป็น JPEG คุณภาพ ~0.8 — ลดขนาดไฟล์ลงมาก
// (มักเหลือแค่หลักร้อย KB) ทำให้อัปโหลดขึ้น Firebase Storage เร็วขึ้นมาก
// โดยที่ยังคมชัดพอสำหรับอ่านสลิปโอนเงินตามปกติ
// คืนค่าเป็น { dataUrl, blob }
function compressImage(file, maxDimension = 1280, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      if (width > maxDimension || height > maxDimension) {
        if (width >= height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL("image/jpeg", quality);
      canvas.toBlob(
        (blob) => resolve({ dataUrl, blob: blob || file }),
        "image/jpeg",
        quality
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("อ่านรูปไม่สำเร็จ"));
    };
    img.src = objectUrl;
  });
}

// บีบอัดรูป QR โดยเฉพาะ — ต่างจาก compressImage (JPEG) เพราะ QR เป็นภาพขาว-ดำ
// ที่ต้องเก็บขอบคมชัด: JPEG จะเบลอขอบกลมมนทำให้สแกนยาก/พัง เลยแปลงเป็น PNG แบบ lossless
// + ย่อขนาดแทน (จากกล้องหลาย MB เหลือหลักร้อย KB แต่ QR ยังคมเหมือนเดิม)
// คืนค่าเป็น { dataUrl, blob }
function compressQrImage(file, maxDimension = 1200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      if (width > maxDimension || height > maxDimension) {
        if (width >= height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false; // กันขอบเบลอตอนย่อขนาด — QR ต้องขอบคม
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(
        (blob) => {
          if (!blob) return reject(new Error("บีบอัดไม่สำเร็จ"));
          const reader = new FileReader();
          reader.onload = () => resolve({ dataUrl: reader.result, blob });
          reader.onerror = () => reject(new Error("อ่านรูปไม่สำเร็จ"));
          reader.readAsDataURL(blob);
        },
        "image/png"
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("อ่านรูปไม่สำเร็จ"));
    };
    img.src = objectUrl;
  });
}

// ถอด QR จากรูป (data URL) ด้วย jsQR — คืน { ok, data } / { ok: null } ถ้าโหลดตัวถอดไม่สำเร็จ
async function decodeQrFromImage(dataUrl) {
  try {
    if (typeof jsQR !== "function") return { ok: null, data: "" };
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
      img.src = dataUrl;
    });
    const canvas = document.createElement("canvas");
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const res = jsQR(imageData.data, imageData.width, imageData.height);
    return res && res.data ? { ok: true, data: res.data } : { ok: false, data: "" };
  } catch (e) {
    return { ok: false, data: "" };
  }
}

// แปลงขนาดไฟล์เป็นข้อความอ่านง่าย (เช่น 3.2 MB / 240 KB)
const formatBytes = (bytes) => {
  if (!Number.isFinite(bytes) || bytes < 0) return "";
  return bytes >= 1024 * 1024
    ? (bytes / (1024 * 1024)).toFixed(1) + " MB"
    : Math.max(1, Math.round(bytes / 1024)) + " KB";
};

// เสียง/สั่นเตือนตอนมีออร์เดอร์ใหม่เข้ามาในหน้าพนักงาน — สร้างเสียง "ติ๊ง-ต่อง" สั้น ๆ
// ด้วย Web Audio API เอง ไม่ต้องใช้ไฟล์เสียงภายนอก (บางเบราว์เซอร์ต้องมีการแตะหน้าจอ
// มาก่อนอย่างน้อย 1 ครั้งถึงจะเล่นเสียงได้ ซึ่งพนักงานกด PIN เข้ามาแล้วนับเป็นการแตะแล้ว)
function playNewOrderAlert() {
  try {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200, 100, 400]);
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const playTone = (freq, startTime, duration, peakGain = 0.5) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    };
    // เสียงยาวขึ้นและดังขึ้น: เล่นทำนอง "ติ๊ง-ต่อง-ติ๊ง-ต่อง" ซ้ำ 2 รอบ กินเวลารวมกว่า 2 วินาที
    const now = ctx.currentTime;
    const pattern = [
      [880, 0, 0.18],
      [1175, 0.19, 0.22],
      [880, 0.46, 0.18],
      [1175, 0.65, 0.32],
    ];
    // รอบที่ 1 + รอบที่ 2 (เว้นช่วงสั้น ๆ ระหว่างรอบ)
    const cycleLength = 1.1;
    [0, cycleLength].forEach((cycleOffset) => {
      pattern.forEach(([freq, offset, duration]) => {
        playTone(freq, now + cycleOffset + offset, duration, 0.5);
      });
    });
  } catch (err) {
    console.error("Play new-order alert failed:", err);
  }
}

// พูดแจ้งเตือนออร์เดอร์ใหม่เป็นประโยคด้วยเสียง (Text-to-Speech) — ต่อจากเสียง "ติ๊ง-ต่อง"
// เพื่อให้พนักงานรู้ทันทีว่า "มีออเดอร์ใหม่เข้ามา" พร้อมเลขออเดอร์/จำนวนโดยไม่ต้องดูหน้าจอ
// ใช้ speechSynthesis ของเบราว์เซอร์ ตั้งภาษาไทย (ถ้าเครื่องมีเสียงไทยจะใช้เสียงไทย ถ้าไม่มี
// จะใช้เสียงเริ่มต้นแทน) — บางเบราว์เซอร์ต้องมีการแตะหน้าจอมาก่อน 1 ครั้งถึงจะพูดได้
// ซึ่งพนักงานกด PIN เข้ามาแล้วนับว่าแตะแล้ว ถ้าเครื่องไหนพูดไม่ได้ก็เงียบ ๆ ไม่มีผลกับแอป
const THAI_NUM_WORDS = ["", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
const THAI_DIGIT_WORDS = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
// อ่านเลขออร์เดอร์ทีละหลัก (เช่น 123 -> "หนึ่ง สอง สาม") กันไม่ให้เครื่องอ่านรวบเป็นจำนวนเต็ม
// (เช่น "หนึ่งแสนสองหมื่นสามพัน") ซึ่งฟังยากและช้ากว่าการอ่านทีละตัว
function speakOrderNoDigits(orderNo) {
  return String(orderNo)
    .split("")
    .map((ch) => (ch >= "0" && ch <= "9" ? THAI_DIGIT_WORDS[Number(ch)] : ""))
    .filter(Boolean)
    .join(" ");
}
function speakNewOrderAlert(count, orderNo) {
  try {
    if (!window.speechSynthesis) return;
    // สร้างประโยค: 1 ออเดอร์ -> "มีออเดอร์ใหม่เข้ามา ออเดอร์ที่ 1 2 3 4 5 6" (อ่านทีละหลัก) / หลายออเดอร์ -> "มีออเดอร์ใหม่เข้ามา 3 ออเดอร์"
    let text;
    const n = Number(count) || 1;
    if (n > 1) {
      const word = n <= 9 ? THAI_NUM_WORDS[n] : String(n);
      text = `มีออเดอร์ใหม่เข้ามา ${word} ออเดอร์`;
    } else if (orderNo) {
      text = `มีออเดอร์ใหม่เข้ามา ออเดอร์ที่ ${speakOrderNoDigits(orderNo)}`;
    } else {
      text = "มีออเดอร์ใหม่เข้ามา";
    }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "th-TH";
    utter.rate = 1.35;
    utter.pitch = 1.1;
    // เลือกเสียงไทยถ้ามี (getVoices อาจยังว่างตอนโหลดแรก — ถ้าไม่มีก็ปล่อยให้ใช้เสียงเริ่มต้น)
    const voices = window.speechSynthesis.getVoices();
    const thVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("th"));
    if (thVoice) utter.voice = thVoice;
    // ตัดเสียงที่ยังพูดค้างอยู่ก่อน กันประโยคซ้อนทับกัน แล้วค่อยพูดประโยคใหม่
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
    }
    window.speechSynthesis.speak(utter);
  } catch (err) {
    console.error("Speak new-order alert failed:", err);
  }
}

// ล็อกการเลื่อนหน้าข้างหลังเมื่อมีชีต/ฟอร์ม/ป็อปอัพเปิดอยู่ — บน iPad/จอใหญ่ scroll จะได้ไม่ไหลไปโดนหน้าเมนูข้างหลัง
function SheetLock() {
  useEffect(() => {
    const prevBody = document.body.style.overflow;
    const prevHtml = document.documentElement.style.overflow;
    document.body.style.overflow = "hidden";
    document.documentElement.style.overflow = "hidden";
    return () => {
      document.body.style.overflow = prevBody;
      document.documentElement.style.overflow = prevHtml;
    };
  }, []);
  return null;
}

// ================= CUSTOMER VIEW =================
function CustomerView({ menu, cart, setCart, onCheckout, shopOpen, menuLoaded, promos, shopName, shopSlogan, categories, shopHours }) {
  const [openCat, setOpenCat] = useState("all");
  const [showCart, setShowCart] = useState(false);
  const [noteOpenFor, setNoteOpenFor] = useState(null);
  const [addOnSheetFor, setAddOnSheetFor] = useState(null); // menu item currently picking add-ons for
  const [detailFor, setDetailFor] = useState(null); // เมนูที่เปิดหน้ารายละเอียด (ตัวที่ไม่มีตัวเลือกเพิ่ม)
  const [zoomImg, setZoomImg] = useState(null); // กำลังดูรูปเมนูใหญ่ (lightbox)
  // ตัวเลือกที่เลือกไว้ เก็บเป็นคีย์ "groupId::optionId" — กันกรณี id ตัวเลือกซ้ำกันคนละกลุ่ม
  // (ข้อมูลเก่าที่บันทึกด้วยบั๊ก id ซ้ำ) ทำให้กดตัวเลือกหนึ่งแล้วไปติ๊กอีกตัวเลือกในกลุ่มอื่นตาม
  const [selectedAddOnKeys, setSelectedAddOnKeys] = useState([]);
  const [editingCartId, setEditingCartId] = useState(null); // กำลังแก้ไขรายการในตะกร้าอันไหน (null = เพิ่มใหม่)
  // เวลาปัจจุบัน (อัปเดตทุก 30 วินาที) — ใช้เช็คโปรโมชั่นแบบ "เฉพาะช่วงเวลา/วัน" ที่หน้าเมนู
  // ไม่งั้นราคา/ป้ายส่วนลดจะค้างจนกว่าจะมีอะไรอื่นทำให้หน้าจอ re-render เอง
  const [nowTs, setNowTs] = useState(() => Date.now());
  useEffect(() => {
    const t = setInterval(() => setNowTs(Date.now()), 30000);
    return () => clearInterval(t);
  }, []);

  const tabs = ["all", ...(categories || DEFAULT_CATEGORIES).map((c) => c.id)];
  // แสดงเมนูทุกตัว (รวมตัวที่สินค้าหมด — จะแสดงจาง ๆ + กดสั่งไม่ได้) ไม่กรองเมนูที่ `active: false` ออก
  const visibleMenu = menu.filter(
    (m) => openCat === "all" || m.category === openCat
  );

  // แต่ละ "รายการในตะกร้า" คือ 1 คอมโบของ (เมนู + ชุดตัวเลือกเพิ่มที่เลือก) — ระบุด้วย cartId
  // เพื่อให้สั่งเมนูเดียวกันแต่ตัวเลือกต่างกันได้หลายแบบพร้อมกันในออร์เดอร์เดียว
  const addToCart = (item, selectedAddOns = []) => {
    const cartId = selectedAddOns.length
      ? `${item.id}::${selectedAddOns.map((a) => a.id).sort().join(",")}`
      : item.id;
    // ราคาเมนูหลังหักโปรโมชั่นลดราคา + ตัวเลือก (ตัวที่ฟรีจากโปรโมชั่นท็อปปิ้งฟรีจะคิด ฿0)
    const unitPrice =
      effectiveItemPrice(item, promos, nowTs) +
      selectedAddOns.reduce((s, a) => s + (Number(a.price) || 0), 0);
    setCart((prev) => {
      const existing = prev.find((c) => c.cartId === cartId);
      if (existing) {
        return prev.map((c) => (c.cartId === cartId ? { ...c, qty: c.qty + 1 } : c));
      }
      return [
        ...prev,
        { cartId, menuId: item.id, name: item.name, price: unitPrice, basePrice: item.price, addOns: selectedAddOns, qty: 1, note: "" },
      ];
    });
  };

  const changeQty = (cartId, delta) => {
    setCart((prev) =>
      prev
        .map((c) => (c.cartId === cartId ? { ...c, qty: c.qty + delta } : c))
        .filter((c) => c.qty > 0)
    );
  };

  const setItemNote = (cartId, text) => {
    setCart((prev) => prev.map((c) => (c.cartId === cartId ? { ...c, note: text } : c)));
  };

  const openAddOnSheet = (item) => {
    setAddOnSheetFor(item);
    setSelectedAddOnKeys([]);
    setEditingCartId(null);
  };

  const toggleAddOn = (groupId, optionId) => {
    const key = `${groupId}::${optionId}`;
    setSelectedAddOnKeys((prev) => {
      if (prev.includes(key)) return prev.filter((k) => k !== key);
      // กลุ่มที่ตั้ง "เลือกได้ 1 ข้อ" — เลือกอันใหม่แล้วปลดอันเก่าในกลุ่มเดียวกันอัตโนมัติ (แบบ radio)
      const grp = normalizeAddOnGroups(addOnSheetFor.addOns).find((g) => g.id === groupId);
      if (grp && grp.single) return [...prev.filter((k) => !k.startsWith(`${groupId}::`)), key];
      return [...prev, key];
    });
  };

  const closeAddOnSheet = () => {
    setAddOnSheetFor(null);
    setEditingCartId(null);
  };

  const confirmAddOnSheet = () => {
    const groups = normalizeAddOnGroups(addOnSheetFor.addOns);
    // ใช้ราคาหลังโปรโมชั่นท็อปปิ้งฟรีเหมือนที่แสดงในชีต (ตัวที่ฟรีจะคิด ฿0 ในตะกร้า)
    // เดิมใช้ราคาเต็มของตัวเลือก ทำให้ท็อปปิ้งที่โชว์ "ฟรี" ยังโดนคิดเงินในตะกร้า
    const allOptions = groups.flatMap((g) =>
      (g.options || []).map((o) => ({ ...o, gid: g.id, price: effectiveAddOnPrice(addOnSheetFor.id, o, promos, nowTs) }))
    );
    const selected = allOptions.filter((a) => selectedAddOnKeys.includes(`${a.gid}::${a.id}`));
    if (editingCartId) {
      updateCartItem(editingCartId, selected);
      // แก้ไขเสร็จแล้ว — เปิดตะกร้ากลับให้เห็นรายการที่อัปเดตแล้วทันที
      setShowCart(true);
    } else {
      addToCart(addOnSheetFor, selected);
    }
    setAddOnSheetFor(null);
    setEditingCartId(null);
  };

  // เปิดชีตเลือกตัวเลือกเพื่อแก้ไขรายการในตะกร้า — ติ๊กคืนชุดตัวเลือกที่เลือกไว้เดิมให้อัตโนมัติ
  const openEditCartItem = (cartItem) => {
    const item = menu.find((m) => m.id === cartItem.menuId);
    if (!item) return;
    const groups = normalizeAddOnGroups(item.addOns);
    // ตัวเลือกในตะกร้าเก็บ gid (รหัสกลุ่ม) ไว้แล้ว ใช้ตรงนั้นเลย — กัน id ตัวเลือกซ้ำกันคนละกลุ่ม
    // (ข้อมูลเก่ามีบั๊ก id ซ้ำ เช่น "ไม่แยกน้ำแข็ง" กับ "ไข่มุก" เป็น ao100 เหมือนกัน)
    // ตัวเก่าที่ไม่มี gid เผื่อเทียบด้วย (รหัสกลุ่ม + ชื่อตัวเลือก) ให้หายังไงก็ยังตรงกัน
    const keys = (cartItem.addOns || []).map((a) => {
      if (a.gid) return `${a.gid}::${a.id}`;
      const g = groups.find((grp) => (grp.options || []).some((o) => o.id === a.id && o.name === a.name));
      return `${g ? g.id : "?"}::${a.id}`;
    });
    setEditingCartId(cartItem.cartId);
    setAddOnSheetFor(item);
    setSelectedAddOnKeys(keys);
    // ปิดหน้าต่างตะกร้าก่อนเปิดชีตแก้ไข — กันสองหน้าต่างซ้อนทับกัน (ตะกร้าถูกเรนเดอร์ทีหลังจะบังส่วนล่างของชีต)
    setShowCart(false);
  };

  // บันทึกการแก้ไขรายการในตะกร้า — ถ้าชุดตัวเลือกใหม่ตรงกับรายการอื่นที่มีอยู่แล้ว ให้รวมจำนวนเข้าด้วยกัน
  const updateCartItem = (oldCartId, selected) => {
    const oldItem = cart.find((c) => c.cartId === oldCartId);
    if (!oldItem) return;
    const menuItem = menu.find((m) => m.id === oldItem.menuId);
    if (!menuItem) return;
    const newCartId = selected.length
      ? `${menuItem.id}::${selected.map((a) => a.id).sort().join(",")}`
      : menuItem.id;
    const unitPrice =
      effectiveItemPrice(menuItem, promos, nowTs) +
      selected.reduce((s, a) => s + (Number(a.price) || 0), 0);
    setCart((prev) => {
      const withoutOld = prev.filter((c) => c.cartId !== oldCartId);
      const existing = withoutOld.find((c) => c.cartId === newCartId);
      if (existing) {
        return withoutOld.map((c) =>
          c.cartId === newCartId ? { ...c, qty: c.qty + oldItem.qty } : c
        );
      }
      return [
        ...withoutOld,
        { cartId: newCartId, menuId: menuItem.id, name: menuItem.name, price: unitPrice, basePrice: menuItem.price, addOns: selected, qty: oldItem.qty, note: oldItem.note || "" },
      ];
    });
  };

  // ลบรายการออกจากตะกร้า
  const removeCartItem = (cartId) => {
    setCart((prev) => prev.filter((c) => c.cartId !== cartId));
  };

  const total = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
  const cartCount = cart.reduce((sum, c) => sum + c.qty, 0);
  // โปรโมชั่น "ซื้อครบ" — คำนวณอัตโนมัติจากยอดรวมตะกร้า (ลูกค้าไม่ต้องทำอะไร)
  const thresholdPromo = (promos || []).find((p) => p && p.active && p.type === "threshold");
  const thresholdMet = !!thresholdPromo && total >= (Number(thresholdPromo.minSpend) || 0);
  const thresholdBaht = thresholdMet ? Math.min(Number(thresholdPromo.discountBaht) || 0, total) : 0;
  const displayTotal = total - thresholdBaht;

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="relative">
      {/* Header */}
      <div
        style={{ background: COLORS.caramel }}
        className="px-5 pt-6 pb-8 rounded-b-[28px] text-center relative overflow-hidden"
      >
        <div
          style={{ background: COLORS.peach, opacity: 0.25 }}
          className="absolute -top-10 -right-10 w-40 h-40 rounded-full"
        />
        <h1
          style={{ fontFamily: "'Itim', sans-serif", color: "#FFF9F0" }}
          className="text-3xl font-semibold break-words px-1"
        >
          {shopName || "น้ำหวาน & เบเกอรี่"}
        </h1>
        <p style={{ color: "#F2DDBE" }} className="text-sm mt-1">
          {shopSlogan || "อบใหม่ทุกวัน · ปั่นสดทุกแก้ว"}
        </p>
        <div className="mt-3 flex justify-center">
          <span
            style={{
              background: shopOpen ? "rgba(122,139,111,0.25)" : "rgba(192,83,63,0.25)",
              color: shopOpen ? "#E4EADD" : "#F3D9D3",
            }}
            className="text-xs font-semibold px-3 py-1 rounded-full inline-flex items-center gap-1.5"
          >
            <span
              style={{ background: shopOpen ? "#9FD98A" : "#E07A63" }}
              className="w-1.5 h-1.5 rounded-full flex-shrink-0"
            />
            {shopOpen ? "ร้านเปิดอยู่" : "ร้านปิดอยู่ขณะนี้"}
          </span>
        </div>
        <p style={{ color: "#F2DDBE" }} className="text-[11px] mt-2">
          เปิดบริการ {shopHours && shopHours.openTime ? `${shopHours.openTime} – ${shopHours.closeTime || "20:00"} น.` : "09:00 – 20:00 น."}
        </p>
      </div>

      {!shopOpen && (
        <div className="px-5 mt-4">
          <div
            style={{ background: "#F3D9D3", border: "1px solid #E3B7AC", color: "#8A3A2B" }}
            className="rounded-2xl px-4 py-3.5 text-sm font-medium text-center"
          >
            ขออภัย ขณะนี้ร้านปิดรับออร์เดอร์ชั่วคราว กรุณากลับมาสั่งใหม่ในช่วงที่ร้านเปิดนะครับ
          </div>
        </div>
      )}

      {/* Category tabs — ล็อกไว้ตอนร้านปิด กดเปลี่ยนหมวดไม่ได้ */}

        {tabs.map((cat) => (
          <button
            key={cat}
            onClick={() => shopOpen && setOpenCat(cat)}
            disabled={!shopOpen}
            style={{
              background: openCat === cat ? (shopOpen ? COLORS.caramel : "#D9CBB5") : "#FFFFFF",
              color: openCat === cat ? "#FFF9F0" : COLORS.inkSoft,
              border: `1px solid ${openCat === cat ? (shopOpen ? COLORS.caramel : "#D9CBB5") : COLORS.line}`,
              opacity: shopOpen ? 1 : 0.55,
            }}
            className="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap flex-shrink-0 transition-colors disabled:cursor-not-allowed"
          >
            {cat === "all" ? "ทั้งหมด" : categoryLabel(cat, categories)}
          </button>
        ))}
      </div>

      {/* Menu list — ตอนร้านปิด ยังให้ดูเมนูได้แต่กดสั่งไม่ได้ (ปุ่มจางลง + ปิดการทำงาน) */}
      <div className="px-5 mt-4 pb-32 space-y-3" style={{ opacity: shopOpen ? 1 : 0.6 }}>
        {!menuLoaded && (
          // กำลังโหลดเมนูจาก Firestore — แสดงโครงร่าง (skeleton) แทนเมนู seed
          // เพื่อไม่ให้ตอนเปิดหน้าแรกเห็นรูปที่เป็นลิงก์สต็อก ก่อนจะเปลี่ยนเป็นรูปจริงของร้าน
          <div className="space-y-3">
            {[0, 1, 2].map((i) => (
              <div key={i} style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-2xl p-4 flex gap-3 items-start">
                <div className="w-20 h-20 rounded-xl flex-shrink-0 animate-pulse" style={{ background: COLORS.paper }} />
                <div className="flex-1 space-y-2 py-1">
                  <div className="h-3.5 w-24 rounded animate-pulse" style={{ background: COLORS.paper }} />
                  <div className="h-3 w-36 rounded animate-pulse" style={{ background: COLORS.paper }} />
                  <div className="h-3 w-10 rounded animate-pulse" style={{ background: COLORS.paper }} />
                </div>
              </div>
            ))}
          </div>
        )}
        {menuLoaded && visibleMenu.length === 0 && (
          <div className="text-center py-16" style={{ color: COLORS.inkSoft }}>
            ยังไม่มีเมนูในหมวดนี้
          </div>
        )}
        {menuLoaded && visibleMenu.map((item) => {
          const Icon = CATEGORY_ICONS[item.category] || Utensils;
          const hasAddOns = item.addOns && item.addOns.length > 0;
          // สินค้าหมด = ลูกค้ายังเห็นเมนูอยู่ แต่จางลง + กดสั่งไม่ได้ (พนักงานปิดที่ฟอร์มแก้ไขเมนู)
          const soldOut = item.active === false;
          // ราคาหลังโปรโมชั่นลดราคาเมนู (ถ้ามี) — แสดงราคาเดิมขีดฆ่า + ป้าย %
          const discountedPrice = effectiveItemPrice(item, promos, nowTs);
          const hasDiscount = discountedPrice < item.price;
          // สำหรับเมนูที่ไม่มีตัวเลือกเพิ่ม ใช้ cartId ตรงกับ item.id ตรง ๆ (พฤติกรรมเดิม)
          const inCart = !hasAddOns ? cart.find((c) => c.cartId === item.id) : null;
          // สำหรับเมนูที่มีตัวเลือกเพิ่ม อาจมีหลายรายการในตะกร้าที่มาจากเมนูเดียวกัน
          // (คนละชุดตัวเลือก) รวมจำนวนทั้งหมดไว้โชว์เป็นตัวเลขเดียว
          const qtyInCart = hasAddOns
            ? cart.filter((c) => c.menuId === item.id).reduce((s, c) => s + c.qty, 0)
            : 0;
          return (
            <div
              key={item.id}
              onClick={(e) => {
                // กันการกดปุ่มในตัวการ์ด (+, จำนวน) ไปเปิดหน้าสั่งซื้อด้วย
                if (e.target && e.target.closest && e.target.closest("button")) return;
                if (soldOut || !shopOpen) return;
                // แตะการ์ด = เข้าไปหน้าสั่งซื้อ (มีตัวเลือก → ชีตเลือกตัวเลือก / ไม่มี → หน้ารายละเอียด)
                if (hasAddOns) openAddOnSheet(item);
                else setDetailFor(item);
              }}
              style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}`, opacity: soldOut ? 0.55 : 1, cursor: "pointer" }}
              className="rounded-2xl p-4 flex gap-3 items-start"
            >
              {item.img ? (
                <img
                  src={item.img}
                  alt={item.name}
                  onClick={(e) => { e.stopPropagation(); setZoomImg(item.img); }}
                  className="w-20 h-20 rounded-xl object-cover flex-shrink-0"
                  style={{ border: `1px solid ${COLORS.line}`, cursor: "zoom-in" }}
                />
              ) : (
                <div
                  style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }}
                  className="w-20 h-20 rounded-xl flex items-center justify-center flex-shrink-0"
                >
                  <Icon className="w-8 h-8" />
                </div>
              )}
              <div className="flex-1 min-w-0">
                <h3 style={{ color: COLORS.ink }} className="font-semibold text-[15px]">
                  {item.name}
                  {soldOut && (
                    <span style={{ background: COLORS.paper, color: COLORS.inkSoft }} className="text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1.5 align-middle">
                      หมดแล้ว
                    </span>
                  )}
                </h3>
                <p style={{ color: COLORS.inkSoft }} className="text-xs mt-0.5 leading-relaxed">
                  {item.desc}
                </p>
                <div className="flex items-center justify-between mt-2.5">
                  <span style={{ color: COLORS.caramelDark }} className="font-bold text-sm">
                    {hasDiscount && (
                      <span style={{ color: COLORS.inkSoft }} className="line-through font-normal text-xs mr-1">฿{fmtBaht(item.price)}</span>
                    )}
                    ฿{fmtBaht(discountedPrice)}
                    {hasDiscount && (
                      <span style={{ background: "#F3D9D3", color: "#C0533F" }} className="text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1.5 align-middle">
                        {discountLabelFor(item, promos, nowTs)}
                      </span>
                    )}
                  </span>
                  {hasAddOns ? (
                    <div className="flex items-center gap-2">
                      {qtyInCart > 0 && (
                        <span style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-xs font-semibold px-2 py-1 rounded-full">
                          ในตะกร้า {qtyInCart}
                        </span>
                      )}
                      <button
                        onClick={() => shopOpen && !soldOut && openAddOnSheet(item)}
                        disabled={!shopOpen || soldOut}
                        style={{ background: shopOpen && !soldOut ? COLORS.caramel : "#D9CBB5", color: "#FFF9F0" }}
                        className="w-8 h-8 rounded-full flex items-center justify-center active:scale-90 transition-transform disabled:cursor-not-allowed"
                      >
                        <Plus size={16} />
                      </button>
                    </div>
                  ) : !inCart ? (
                    <button
                      onClick={() => shopOpen && !soldOut && addToCart(item)}
                      disabled={!shopOpen || soldOut}
                      style={{ background: shopOpen && !soldOut ? COLORS.caramel : "#D9CBB5", color: "#FFF9F0" }}
                      className="w-8 h-8 rounded-full flex items-center justify-center active:scale-90 transition-transform disabled:cursor-not-allowed"
                    >
                      <Plus size={16} />
                    </button>
                  ) : (
                    <div
                      style={{ background: COLORS.peachSoft }}
                      className="flex items-center gap-3 rounded-full px-1"
                    >
                      <button
                        onClick={() => changeQty(item.id, -1)}
                        style={{ color: COLORS.caramelDark }}
                        className="w-7 h-7 flex items-center justify-center active:scale-90"
                      >
                        <Minus size={14} />
                      </button>
                      <span style={{ color: COLORS.ink }} className="text-sm font-semibold w-4 text-center">
                        {inCart.qty}
                      </span>
                      <button
                        onClick={() => !soldOut && changeQty(item.id, 1)}
                        style={{ color: soldOut ? COLORS.inkSoft : COLORS.caramelDark, opacity: soldOut ? 0.5 : 1 }}
                        className="w-7 h-7 flex items-center justify-center active:scale-90"
                      >
                        <Plus size={14} />
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* หน้ารายละเอียดเมนู (ตัวที่ไม่มีตัวเลือกเพิ่ม) — แตะที่การ์ดเพื่อเปิด */}
      {detailFor && (() => {
        const dInCart = cart.find((c) => c.cartId === detailFor.id);
        return (
          <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
            <SheetLock />
            <div style={{ overflowY: "auto", overscrollBehavior: "contain" }} className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8">
              <div className="flex items-center justify-between mb-3">
                <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">{detailFor.name}</h2>
                <button onClick={() => setDetailFor(null)} style={{ color: COLORS.inkSoft }}>
                  <X size={20} />
                </button>
              </div>
              {detailFor.img && (
                <img
                  src={detailFor.img}
                  alt={detailFor.name}
                  onClick={() => setZoomImg(detailFor.img)}
                  className="w-full h-52 object-cover rounded-2xl mb-3"
                  style={{ cursor: "zoom-in" }}
                />
              )}
              <p style={{ color: COLORS.inkSoft }} className="text-sm leading-relaxed mb-2">{detailFor.desc}</p>
              <p style={{ color: COLORS.caramelDark }} className="font-bold text-lg mb-4">฿{fmtBaht(effectiveItemPrice(detailFor, promos, nowTs))}</p>
              {dInCart ? (
                <div className="flex items-center justify-between">
                  <span style={{ color: COLORS.inkSoft }} className="text-sm">จำนวนในตะกร้า</span>
                  <div style={{ background: COLORS.peachSoft }} className="flex items-center gap-3 rounded-full px-1.5 py-1">
                    <button onClick={() => changeQty(detailFor.id, -1)} style={{ color: COLORS.caramelDark }} className="w-8 h-8 flex items-center justify-center"><Minus size={16} /></button>
                    <span style={{ color: COLORS.ink }} className="text-sm font-semibold w-5 text-center">{dInCart.qty}</span>
                    <button onClick={() => changeQty(detailFor.id, 1)} style={{ color: COLORS.caramelDark }} className="w-8 h-8 flex items-center justify-center"><Plus size={16} /></button>
                  </div>
                </div>
              ) : (
                <PrimaryButton full onClick={() => addToCart(detailFor)}>
                  เพิ่มลงตะกร้า ฿{fmtBaht(effectiveItemPrice(detailFor, promos, nowTs))}
                </PrimaryButton>
              )}
            </div>
          </div>
        );
      })()}

      {/* ดูรูปเมนูใหญ่ (lightbox) — แตะที่รูปเมนูเพื่อเปิด */}
      {zoomImg && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75" onClick={() => setZoomImg(null)}>
          <SheetLock />
          <img src={zoomImg} alt="" className="max-w-[92vw] max-h-[85vh] rounded-2xl shadow-2xl" onClick={(e) => e.stopPropagation()} />
          <button onClick={() => setZoomImg(null)} style={{ position: "absolute", top: 16, right: 16, color: "#FFF", background: "rgba(0,0,0,0.4)" }} className="w-10 h-10 rounded-full flex items-center justify-center">
            <X size={22} />
          </button>
        </div>
      )}

      {/* Add-on picker sheet — opens when a menu item has selectable extras */}
      {addOnSheetFor && (() => {
        const groups = normalizeAddOnGroups(addOnSheetFor.addOns);
        // ราคาแต่ละตัวเลือกหลังใช้โปรโมชั่นท็อปปิ้งฟรี — ตัวที่ฟรีจะกลายเป็น ฿0
        const allOptions = groups.flatMap((g) =>
          (g.options || []).map((o) => ({ ...o, gid: g.id, price: effectiveAddOnPrice(addOnSheetFor.id, o, promos, nowTs) }))
        );
        const selectedOptions = allOptions.filter((a) => selectedAddOnKeys.includes(`${a.gid}::${a.id}`));
        // กลุ่มที่บังคับเลือก ต้องมีตัวเลือกอย่างน้อย 1 รายการที่ถูกเลือก ถึงจะกดยืนยันได้
        const missingRequired = groups.some(
          (g) => g.required && !(g.options || []).some((o) => selectedAddOnKeys.includes(`${g.id}::${o.id}`))
        );
        return (
          <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
            <SheetLock />
            <div style={{ overflowY: "auto", overscrollBehavior: "contain" }} className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8">
              <div className="flex items-center justify-between mb-1">
                <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                  {addOnSheetFor.name}
                </h2>
                <button onClick={closeAddOnSheet} style={{ color: COLORS.inkSoft }}>
                  <X size={20} />
                </button>
              </div>
              {addOnSheetFor.img && (
                <img
                  src={addOnSheetFor.img}
                  alt={addOnSheetFor.name}
                  onClick={() => setZoomImg(addOnSheetFor.img)}
                  className="w-full h-44 object-cover rounded-2xl mb-3"
                  style={{ cursor: "zoom-in" }}
                />
              )}
              {addOnSheetFor.desc && (
                <p style={{ color: COLORS.inkSoft }} className="text-sm leading-relaxed mb-3">
                  {addOnSheetFor.desc}
                </p>
              )}
              {editingCartId && (
                <p style={{ color: COLORS.caramelDark }} className="text-xs font-semibold mb-2">
                  กำลังแก้ไขรายการในตะกร้า
                </p>
              )}
              <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
                อ่านคำอธิบายใต้ชื่อกลุ่มเพื่อดูว่าต้องเลือกแบบไหน
              </p>
              <div className="space-y-4 mb-5">
                {groups.map((g) => (
                  <div key={g.id}>
                    <div className="flex items-baseline gap-1.5 flex-wrap mb-1.5">
                      <span style={{ color: COLORS.ink }} className="text-sm font-semibold">
                        {g.name || "ตัวเลือกเพิ่มเติม"}
                      </span>
                      {/* คำอธิบายว่าลูกค้าทำอะไรได้ — วงเล็บ เดียวกับชื่อกลุ่ม ฟอนต์เท่ากัน */}
                      <span style={{ color: COLORS.inkSoft }} className="text-sm">
                        ({g.required && g.single
                          ? "ต้องเลือก 1 อันพอดี"
                          : g.required
                            ? "ต้องเลือกอย่างน้อย 1 อัน"
                            : g.single
                              ? "เลือกได้สูงสุด 1 อัน หรือไม่เลือก"
                              : "เลือกกี่อันก็ได้ หรือไม่เลือก"})
                      </span>
                    </div>
                    <div className="space-y-2">
                      {(g.options || []).map((a) => {
                        const checked = selectedAddOnKeys.includes(`${g.id}::${a.id}`);
                        return (
                          <button
                            key={a.id}
                            onClick={() => toggleAddOn(g.id, a.id)}
                            style={{
                              background: checked ? COLORS.peachSoft : "#FFFFFF",
                              border: `1.5px solid ${checked ? COLORS.caramel : COLORS.line}`,
                            }}
                            className="w-full rounded-xl px-4 py-3 flex items-center justify-between text-left"
                          >
                            <span style={{ color: COLORS.ink }} className="text-sm font-medium">{a.name}</span>
                            <span className="flex items-center gap-2.5">
                              <span style={{ color: isAddOnFree(addOnSheetFor.id, a.id, promos, nowTs) ? COLORS.sage : COLORS.caramelDark }} className="text-xs font-bold">
                                {isAddOnFree(addOnSheetFor.id, a.id, promos, nowTs) ? "ฟรี" : `+฿${a.price}`}
                              </span>
                              <div
                                style={{
                                  border: `2px solid ${checked ? COLORS.caramel : COLORS.line}`,
                                  background: checked ? COLORS.caramel : "transparent",
                                  borderRadius: g.single ? 999 : 6,
                                }}
                                className="w-4 h-4 flex items-center justify-center flex-shrink-0"
                              >
                                {checked && (g.single ? <span className="w-1.5 h-1.5 rounded-full bg-white" /> : <Check size={10} color="#fff" />)}
                              </div>
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
              {missingRequired && (
                <p className="text-xs mb-2" style={{ color: "#C0533F" }}>
                  กรุณาเลือกอย่างน้อย 1 รายการในกลุ่มที่บังคับ
                </p>
              )}
              <PrimaryButton full onClick={confirmAddOnSheet} disabled={missingRequired}>
                {editingCartId ? "บันทึกการแก้ไข" : "เพิ่มลงตะกร้า"} · ฿
                {effectiveItemPrice(addOnSheetFor, promos, nowTs) + selectedOptions.reduce((s, a) => s + (Number(a.price) || 0), 0)}
              </PrimaryButton>
            </div>
          </div>
        );
      })()}

      {/* Floating cart bar — ซ่อนไว้ตอนร้านปิด กันลูกค้าไปต่อหน้าชำระเงินไม่ได้ */}
      {shopOpen && cartCount > 0 && !showCart && (
        <button
          onClick={() => setShowCart(true)}
          style={{ background: COLORS.ink }}
          className="fixed bottom-5 left-5 right-5 max-w-md mx-auto rounded-2xl px-5 py-4 flex items-center justify-between shadow-xl active:scale-[0.98] transition-transform"
        >
          <div className="flex items-center gap-2 text-white">
            <div className="relative">
              <ShoppingBag size={20} />
              <span
                style={{ background: COLORS.peach }}
                className="absolute -top-2 -right-2 text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold"
              >
                {cartCount}
              </span>
            </div>
            <span className="text-sm font-medium">ดูตะกร้า</span>
          </div>
          <span className="text-white font-bold">฿{fmtBaht(displayTotal)}</span>
        </button>
      )}

      {/* Cart — เต็มจอ (เหมือนหน้าชำระเงิน) กันหน้าเมนูข้างหลังเลื่อนตาม */}
      {showCart && (
        <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
          <SheetLock />
          <div className="px-5 pt-6 pb-2 flex-shrink-0">
            <button onClick={() => setShowCart(false)} style={{ color: COLORS.inkSoft }} className="flex items-center gap-1 text-sm mb-3">
              <ArrowLeft size={16} /> กลับไปสั่งเพิ่ม
            </button>
            <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold">
              ตะกร้าของคุณ
            </h1>
          </div>
          <div className="flex-1 overflow-y-auto px-5 space-y-3 pb-3" style={{ overscrollBehavior: "contain" }}>
              {cart.map((item) => (
                <div key={item.cartId} style={{ borderBottom: `1px solid ${COLORS.line}` }} className="pb-3">
                  <div className="flex items-center justify-between">
                    <div className="flex-1 min-w-0 pr-2">
                      <p style={{ color: COLORS.ink }} className="text-sm font-medium break-words">{item.name}</p>
                      {item.addOns && item.addOns.length > 0 && (
                        <p style={{ color: COLORS.caramelDark, fontSize: 12 }} className="mt-0.5">
                          + {item.addOns.map((a) => a.name).join(", ")}
                        </p>
                      )}
                      <p style={{ color: COLORS.inkSoft }} className="text-xs">
                        {item.basePrice > item.price && (
                          <span className="line-through mr-1">฿{fmtBaht(item.basePrice)}</span>
                        )}
                        ฿{fmtBaht(item.price)} × {item.qty}
                      </p>
                    </div>
                    <div style={{ background: COLORS.peachSoft }} className="flex items-center gap-3 rounded-full px-1">
                      <button onClick={() => changeQty(item.cartId, -1)} style={{ color: COLORS.caramelDark }} className="w-7 h-7 flex items-center justify-center">
                        <Minus size={14} />
                      </button>
                      <span style={{ color: COLORS.ink }} className="text-sm font-semibold w-4 text-center">{item.qty}</span>
                      <button onClick={() => changeQty(item.cartId, 1)} style={{ color: COLORS.caramelDark }} className="w-7 h-7 flex items-center justify-center">
                        <Plus size={14} />
                      </button>
                    </div>
                  </div>

                  {noteOpenFor === item.cartId ? (
                    <textarea
                      autoFocus
                      value={item.note || ""}
                      onChange={(e) => setItemNote(item.cartId, e.target.value)}
                      onBlur={() => setNoteOpenFor(null)}
                      placeholder="เช่น ไม่ใส่น้ำแข็ง, หวานน้อย, แพ้ถั่ว..."
                      rows={2}
                      style={{
                        background: "#FFFFFF",
                        border: `1px solid ${COLORS.line}`,
                        color: COLORS.ink,
                      }}
                      className="w-full rounded-xl px-3 py-2 text-sm resize-none placeholder:text-[13px] focus:outline-none mt-2"
                    />
                  ) : (
                    <div className="flex items-center gap-3 mt-2">
                      <button
                        onClick={() => setNoteOpenFor(item.cartId)}
                        style={{ color: item.note ? COLORS.caramelDark : COLORS.inkSoft }}
                        className="flex items-center gap-1 text-xs flex-1 min-w-0"
                      >
                        <Pencil size={11} />
                        <span className="truncate">{item.note ? item.note : "เพิ่มหมายเหตุ"}</span>
                      </button>
                      {item.addOns && item.addOns.length > 0 && (
                        <button
                          onClick={() => openEditCartItem(item)}
                          style={{ color: COLORS.caramelDark }}
                          className="text-xs font-semibold flex items-center gap-1 flex-shrink-0"
                        >
                          <Pencil size={11} /> แก้ไข
                        </button>
                      )}
                      <button
                        onClick={() => removeCartItem(item.cartId)}
                        style={{ color: "#C0533F" }}
                        className="text-xs font-semibold flex-shrink-0"
                      >
                        ลบ
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div style={{ borderTop: `1px solid ${COLORS.line}`, paddingBottom: "max(1rem, env(safe-area-inset-bottom))" }} className="px-5 py-4 flex-shrink-0">
              {thresholdPromo &&
                (thresholdMet ? (
                  <div className="flex items-center justify-between text-xs mb-1.5">
                    <span style={{ color: COLORS.sage }} className="font-semibold">ส่วนลด ซื้อครบ ฿{fmtBaht(thresholdPromo.minSpend)}</span>
                    <span style={{ color: COLORS.sage }} className="font-semibold">-฿{fmtBaht(thresholdBaht)}</span>
                  </div>
                ) : (
                  <p style={{ color: COLORS.caramelDark }} className="text-[11px] font-semibold mb-1.5">
                    ซื้อเพิ่มอีก ฿{fmtBaht(Math.max(0, (Number(thresholdPromo.minSpend) || 0) - total))} รับส่วนลด ฿{fmtBaht(thresholdPromo.discountBaht)}
                  </p>
                ))}
              <div className="flex items-center justify-between mb-3">
                <span style={{ color: COLORS.inkSoft }} className="text-sm">ยอดรวม</span>
                <span style={{ color: COLORS.ink }} className="text-lg font-bold">฿{fmtBaht(displayTotal)}</span>
              </div>
              <PrimaryButton
                full
                onClick={() => {
                  setShowCart(false);
                  onCheckout();
                }}
              >
                <CreditCard size={18} /> ไปหน้าชำระเงิน
              </PrimaryButton>
            </div>
        </div>
      )}
    </div>
  );
}

// ================= CHECKOUT VIEW =================
function CheckoutView({ cart, onBack, onPaid, orders, promos, uid, shopQr, deliveryHours }) {
  const [method, setMethod] = useState("cash"); // default: จ่ายเงินสด (จ่ายตอนรับของ) — บัตรเครดิตยังไม่รองรับ เลยไม่มีตัวเลือก
  const [collectOnDelivery, setCollectOnDelivery] = useState(false); // โอนแต่เลือก "เก็บปลายทาง" = ไม่ต้องแนบสลิป (จ่ายตอนรับของ)
  const [paying, setPaying] = useState(false);
  const [compressing, setCompressing] = useState(false);
  const [slipImg, setSlipImg] = useState(null); // { dataUrl, url } — url == dataUrl เสมอ (เก็บฝังใน Firestore ตรง ๆ)
