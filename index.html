        <div className="flex items-center justify-between mb-1">
          <p style={{ color: COLORS.ink }} className="text-sm font-semibold flex items-center gap-1.5">
            <QrCode size={15} style={{ color: COLORS.caramelDark }} /> ตั้งค่าร้าน
          </p>
          {shopSavedFlash && (
            <span style={{ color: COLORS.sage }} className="text-[11px] font-semibold flex items-center gap-1">
              <Check size={13} /> บันทึกแล้ว
            </span>
          )}
        </div>          <p style={{ color: COLORS.inkSoft }} className="text-xs mb-3">
          ชื่อร้านที่ลูกค้าเห็น โค้ดพร้อมเพย์สำหรับรับเงิน และเวลาที่ให้บริการ
        </p>

        <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ชื่อร้าน</label>
        <input
          value={shopNameInput}
          onChange={(e) => setShopNameInput(e.target.value)}
          placeholder="ชื่อร้านของคุณ"
          className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
          style={{ background: COLORS.cream, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
        />

        <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mt-3 mb-1">คำขวัญ / คอนเซปร้าน</label>
        <input
          value={shopSloganInput}
          onChange={(e) => setShopSloganInput(e.target.value)}
          placeholder="เช่น อบใหม่ทุกวัน · ปั่นสดทุกแก้ว"
          className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
          style={{ background: COLORS.cream, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
        />
        <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1">ข้อความสั้น ๆ ที่โชว์ใต้ชื่อร้านบนหน้าลูกค้า</p>

        <div className="grid grid-cols-2 gap-2 mt-3">
          <div>
            <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">เวลาเปิดร้าน</label>
            <input
              type="time"
              value={openTimeInput}
              onChange={(e) => setOpenTimeInput(e.target.value)}
              className="w-full rounded-xl px-3 py-2 text-sm outline-none bg-white"
              style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            />
          </div>
          <div>
            <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">เวลาปิดร้าน</label>
            <input
              type="time"
              value={closeTimeInput}
              onChange={(e) => setCloseTimeInput(e.target.value)}
              className="w-full rounded-xl px-3 py-2 text-sm outline-none bg-white"
              style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            />
          </div>
          <div>
            <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">จัดส่งเริ่มเวลา</label>
            <input
              type="time"
              value={deliveryOpenInput}
              onChange={(e) => setDeliveryOpenInput(e.target.value)}
              className="w-full rounded-xl px-3 py-2 text-sm outline-none bg-white"
              style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            />
          </div>
          <div>
            <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">จัดส่งถึงเวลา</label>
            <input
              type="time"
              value={deliveryCloseInput}
              onChange={(e) => setDeliveryCloseInput(e.target.value)}
              className="w-full rounded-xl px-3 py-2 text-sm outline-none bg-white"
              style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
            />
          </div>
        </div>
        <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1.5 leading-relaxed">
          ช่วงเวลาจัดส่งที่ลูกค้าเลือกได้ (ทุก 30 นาที) — วันนี้จะเหลือเฉพาะเวลาที่ยังไม่ผ่านไปเท่านั้น ถ้าร้านเปิด 10 โมงก็ตั้งจัดส่งเริ่ม 10:00 ได้
        </p>

        <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mt-3 mb-1">โค้ด QR (พร้อมเพย์)</label>
        <div className="flex items-center gap-3">
          <img
            src={shopQrInput}
            alt="QR พร้อมเพย์"
            className="w-20 h-20 rounded-xl object-contain flex-shrink-0"
            style={{ border: `1px solid ${COLORS.line}`, background: "#FFFFFF" }}
          />
          <button
            onClick={() => qrInputRef.current && qrInputRef.current.click()}
            style={{ color: COLORS.caramelDark, border: `1.5px solid ${COLORS.caramel}` }}
            className="rounded-xl px-3.5 py-2.5 text-xs font-semibold flex items-center gap-1.5"
          >
            <UploadCloud size={14} /> เปลี่ยนรูป QR
          </button>
          <input ref={qrInputRef} type="file" accept="image/*" className="hidden" onChange={handleQrUpload} />
        </div>
        <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1.5 leading-relaxed">
          อัปโหลดรูป QR พร้อมเพย์ (ที่ธนาคารออกให้) — ลูกค้าจะเห็นรูปนี้ตอนชำระเงินทันที
        </p>

        {/* ผลการบีบอัดอัตโนมัติ: ขนาดก่อน → หลัง (หรือใช้ไฟล์เดิมถ้าเล็กพออยู่แล้ว) */}
        {qrCompressInfo && !qrCompressInfo.kept && (
          <div
            style={{ background: COLORS.sageSoft, color: COLORS.sage }}
            className="text-[11px] font-medium rounded-xl px-3 py-2 mt-2 flex items-center gap-1.5"
          >
            <Check size={12} className="flex-shrink-0" />
            <span>บีบอัดอัตโนมัติ {formatBytes(qrCompressInfo.before)} → {formatBytes(qrCompressInfo.after)} (PNG ไม่เสียคุณภาพ)</span>
          </div>
        )}
        {qrCompressInfo && qrCompressInfo.kept && (
          <div
            style={{ background: COLORS.sageSoft, color: COLORS.sage }}
            className="text-[11px] font-medium rounded-xl px-3 py-2 mt-2 flex items-center gap-1.5"
          >
            <Check size={12} className="flex-shrink-0" />
            <span>ไฟล์ {formatBytes(qrCompressInfo.after)} เล็กพออยู่แล้ว — ใช้ไฟล์เดิม ไม่บีบอัดซ้ำ (ยังคมชัด)</span>
          </div>
        )}

        {/* ผลตรวจว่า QR ยังอ่านได้ไหมหลังบีบอัด (ถอดจริงด้วย jsQR) */}
        {qrVerify && qrVerify.ok === true && (
          <div
            style={{ background: COLORS.sageSoft, color: COLORS.sage }}
            className="text-[11px] font-medium rounded-xl px-3 py-2 mt-2 flex items-start gap-1.5"
          >
            <Check size={12} className="mt-0.5 flex-shrink-0" />
            <span className="break-all leading-relaxed">
              ✓ QR ยังอ่านได้หลังบีบอัด — ข้อมูล: {qrVerify.data.length > 60 ? qrVerify.data.slice(0, 60) + "…" : qrVerify.data}
            </span>
          </div>
        )}
        {qrVerify && qrVerify.ok === false && (
          <div
            style={{ background: "#F3D9D3", color: "#8A3A2B" }}
            className="text-[11px] font-medium rounded-xl px-3 py-2 mt-2 flex items-start gap-1.5"
          >
            <AlertTriangle size={12} className="mt-0.5 flex-shrink-0" />

          </div>

          <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1.5">
            โหลดตัวตรวจ QR ไม่สำเร็จบนเครื่องนี้ — ข้ามการตรวจ (รูปยังใช้งานได้ตามปกติ)
          </p>
        )}

          <button
            onClick={verifyQrAgain}
            style={{ color: COLORS.caramelDark, border: `1.5px solid ${COLORS.caramel}` }}

            <Check size={13} /> ตรวจสอบว่า QR สแกนได้ไหม
          </button>

          onClick={saveShopSettings}
          style={{ background: COLORS.ink, color: "#FFF9F0" }}
          className="w-full rounded-xl py-2.5 text-sm font-semibold mt-3 active:scale-[0.99] transition-transform"

        <div className="space-y-2 mb-3">
          {(categories || DEFAULT_CATEGORIES).map((c) => (
            <div
              key={c.id}
              draggable
              data-cat-id={c.id}
              data-touch-label={c.label}
              onClick={(e) => {
                // แตะ/คลิกที่แถว = เปิดฟอร์มแก้ไข/ลบหมวด (กันปุ่มภายใน และกันคลิกหลังลากเสร็จ)
                if (e.target && e.target.closest && e.target.closest("button, input, select, textarea, a, label")) return;

              }}
              onDragStart={(e) => {
                setDragCat(c.id);

                e.dataTransfer.effectAllowed = "move";

                  e.dataTransfer.setData("text/plain", c.id);

        </div>

                  if (e.target && e.target.closest && e.target.closest("button, input, select, textarea, a, label")) return;
                  if (Date.now() - lastTouchDragEndRef.current < 700) return;
                  startEdit(item);
                }}
                onDragStart={(e) => {
                  setDragItem({ id: item.id, cat: item.category });
                  e.dataTransfer.effectAllowed = "move";
                  try {
                    e.dataTransfer.setData("text/plain", item.id);
                    e.dataTransfer.setDragImage(makeDragImage(item.name), 12, 12);
                  } catch (_) {}
                }}
                onDragOver={(e) => {
                  e.preventDefault();
                  e.dataTransfer.dropEffect = "move";
                  const id = e.currentTarget.dataset.itemId;
                  const cat = e.currentTarget.dataset.cat;
                  if (overItem && overItem.id === id) return;
                  setOverItem({ id, cat });
                }}
                onDragLeave={(e) => {
                  if (e.currentTarget.contains(e.relatedTarget)) return;
                  // เก็บค่า id ก่อนเรียก setState — ห้ามแตะ e.currentTarget ในฟังก์ชันอัปเดต
                  // (React ปล่อย currentTarget เป็น null หลัง event จบ แล้วค่อยเรียกอัปเดต → crash)
                  const leaveId = e.currentTarget.dataset.itemId;
                  setOverItem((o) => (o && o.id === leaveId ? null : o));
                }}
                onDrop={(e) => {
                  e.preventDefault();
                  dropItem(dragItem, { id: e.currentTarget.dataset.itemId, cat: e.currentTarget.dataset.cat });
                  setDragItem(null);
                  setOverItem(null);
                }}
                onDragEnd={() => { setDragItem(null); setOverItem(null); lastTouchDragEndRef.current = Date.now(); }}
                style={{
                  cursor: "pointer",
                  background: overItem && overItem.id === item.id ? COLORS.peachSoft : "#FFFFFF",

                      </p>

                  </div>
                </div>
              </div>

                <X size={20} />
              </button>
            </div>
            <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ชื่อหมวด</label>
            <input
              value={catEditName}
              onChange={(e) => setCatEditName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); saveCategory(); } }}
              placeholder="ชื่อหมวด"
              style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink, background: "#FFFFFF" }}
              className="w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
            />
            <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1.5">
              ชื่อหมวดคือแท็บที่ลูกค้าเห็นบนหน้าสั่งของ — เปลี่ยนแล้วอัปเดตทั้งร้านทันที
            </p>

              <button
                type="button"
                onClick={deleteCatFromForm}
                style={confirmDelCat === editingCat.id ? { background: "#C0533F", color: "#FFF" } : { border: `1px solid #C0533F`, color: "#C0533F" }}
                className="rounded-xl px-4 py-2.5 text-sm font-semibold flex-shrink-0"
              >
                {confirmDelCat === editingCat.id ? "กดอีกครั้งเพื่อยืนยัน" : "ลบหมวด"}
              </button>
              <PrimaryButton full onClick={saveCategory} disabled={!catEditName.trim()}>
                บันทึก
              </PrimaryButton>
            </div>
            <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-2">
              เมื่อลบหมวด เมนูที่อยู่ในหมวดนี้จะย้ายไปหมวดแรกที่เหลืออยู่โดยอัตโนมัติ
            </p>
          </div>
        </div>
      )}

      {/* Edit/new drawer */}
      {editing && (
        <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">

          {/* เลื่อนเนื้อหาด้านในเอง — SheetLock ล็อก scroll หน้าข้างหลังไม่ให้ไหลไปโดนบนจอใหญ่ */}
          <div style={{ overflowY: "auto", overscrollBehavior: "contain" }} className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8">
            <div className="flex items-center justify-between mb-4">
              <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                {editing === "new" ? "เพิ่มเมนูใหม่" : "แก้ไขเมนู"}
              </h2>
              <button onClick={() => setEditing(null)} style={{ color: COLORS.inkSoft }}>
                <X size={20} />
              </button>
            </div>

            <div className="space-y-3">
              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">รูปเมนู</label>
                <div className="flex items-center gap-3">
                  {form.img ? (
                    <img src={form.img} alt="" className="w-16 h-16 rounded-xl object-cover" style={{ border: `1px solid ${COLORS.line}` }} />
                  ) : (
                    <div style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="w-16 h-16 rounded-xl flex items-center justify-center text-[10px] text-center px-1">

                    style={{ border: `1.5px dashed ${COLORS.line}`, color: COLORS.caramelDark }}

                      border: `1px solid ${form.category === c.id ? COLORS.caramel : COLORS.line}`,

                    className="px-4 py-2 rounded-full text-xs font-medium"

              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">ชื่อเมนู</label>

                <input

                />
                <p style={{ color: COLORS.inkSoft }} className="text-[11px] mt-1">
                  ใช้คำนวณกำไร/ขาดทุนในแท็บบัญชี (ยอดขาย − ต้นทุน = กำไรขั้นต้น)

              </div>

              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">

                </label>
                {Object.keys(form.recipe).length === 0 && (
                  <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-2">
                    {stockItems.length === 0
                      ? "ยังไม่มีรายการสต็อก — ไปที่แท็บ \"สต็อก\" แล้วเพิ่มวัตถุดิบก่อน แล้วกลับมาผูกที่นี่"
                      : "ยังไม่ได้ผูกสต็อก — กด \"+ เพิ่มวัตถุดิบ\" แล้วเลือกว่าเมนูนี้ใช้อะไรบ้าง กี่หน่วยต่อ 1 แก้ว/ชิ้น"}
                  </p>
                )}
                <div className="space-y-2 mb-2">
                  {Object.entries(form.recipe).map(([sid, qty]) => {
                    const stock = stockItems.find((s) => s.id === sid);
                    return (
                      <div key={sid} style={{ background: "#FFFFFF", border: `1px solid ${COLORS.line}` }} className="rounded-xl p-2.5 flex items-center gap-2">
                        <select
                          value={sid}
                          onChange={(e) => {
                            const v = e.target.value;
                            setForm((f) => {
                              const next = { ...f.recipe };
                              delete next[sid];
                              if (v) next[v] = f.recipe[sid] || "";
                              return { ...f, recipe: next };
                            });
                          }}
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                          className="flex-1 min-w-0 rounded-lg px-2 py-2 text-sm bg-white outline-none"
                        >
                          <option value="">เลือกวัตถุดิบ…</option>
                          {stockItems.map((s) => (
                            <option key={s.id} value={s.id}>
                              {s.name} ({s.unit})
                            </option>
                          ))}
                        </select>
                        <input
                          value={qty}
                          onChange={(e) => setForm((f) => ({ ...f, recipe: { ...f.recipe, [sid]: decimalDigitsOnly(e.target.value) } }))}
                          placeholder="จำนวน"
                          inputMode="decimal"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                          className="w-20 rounded-lg px-2 py-2 text-sm bg-white outline-none text-center"
                        />
                        <span style={{ color: COLORS.inkSoft }} className="text-[11px] flex-shrink-0 w-10">
                          {stock ? stock.unit : "หน่วย"}
                        </span>
                        <button
                          type="button"
                          onClick={() =>
                            setForm((f) => {
                              const next = { ...f.recipe };
                              delete next[sid];
                              return { ...f, recipe: next };
                            })
                          }
                          style={{ color: "#C0533F" }}
                          className="flex-shrink-0"
                        >
                          <Trash2 size={14} />
                        </button>
                      </div>
                    );
                  })}
                </div>
                <button
                  type="button"
                  onClick={() => {
                    const firstUnused = stockItems.find((s) => !(s.id in form.recipe));
                    if (!firstUnused) return;
                    setForm((f) => ({ ...f, recipe: { ...f.recipe, [firstUnused.id]: "" } }));
                  }}
                  disabled={stockItems.length === 0 || stockItems.every((s) => s.id in form.recipe)}
                  style={{ border: `1.5px dashed ${COLORS.line}`, color: COLORS.caramelDark }}
                  className="w-full rounded-xl py-2.5 text-xs font-semibold bg-white disabled:opacity-40"
                >
                  + เพิ่มวัตถุดิบ
                </button>
              </div>

              <div>
                <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">
                  ตัวเลือกเพิ่ม (ท็อปปิ้ง / แอดออน)
                </label>
                {form.addOns.length === 0 && (
                  <p style={{ color: COLORS.inkSoft }} className="text-[11px] mb-2">
                    ยังไม่มีกลุ่มตัวเลือก — กด "+ เพิ่มกลุ่มตัวเลือก" แล้วตั้งชื่อกลุ่ม เช่น "ท็อปปิ้ง" พร้อมใส่ตัวเลือกย่อยในกลุ่ม
                  </p>
                )}
                <div className="space-y-2.5 mb-2">
                  {form.addOns.map((g) => (
                    <div
                      key={g.id}
                      data-group-id={g.id}
                      data-touch-label={g.name || "กลุ่มตัวเลือก"}
                      draggable
                      onDragStart={(e) => {
                        setDragGroup(g.id);
                        e.dataTransfer.effectAllowed = "move";
                        e.dataTransfer.setDragImage(makeDragImage(g.name || "กลุ่มตัวเลือก"), 12, 12);
                      }}
                      onDragEnd={() => { setDragGroup(null); setOverGroup(null); }}
                      onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (overGroup !== g.id) setOverGroup(g.id); }}
                      onDragLeave={(e) => {
                        if (e.currentTarget.contains(e.relatedTarget)) return;
                        const leaveId = e.currentTarget.dataset.groupId;
                        setOverGroup((o) => (o === leaveId ? null : o));
                      }}
                      onDrop={(e) => { e.preventDefault(); reorderGroup(dragGroup, g.id); setDragGroup(null); setOverGroup(null); }}
                      style={{
                        background: "#FFFFFF",
                        border: `1px solid ${overGroup === g.id && dragGroup && dragGroup !== g.id ? COLORS.caramel : COLORS.line}`,
                        opacity: dragGroup === g.id ? 0.4 : 1,
                        cursor: "grab",
                      }}
                      className="rounded-xl p-3 space-y-2.5 transition-all"
                    >
                      {/* หัวกลุ่ม: ลากทั้งแถวนี้เพื่อสลับลำดับกลุ่ม (เหมือนลากเมนู/หมวดในหน้าจัดการเมนู) + ชื่อ + ปุ่มบังคับเลือก + ลบกลุ่ม */}
                      <div className="flex items-center gap-2">
                        <span style={{ color: COLORS.inkSoft, opacity: 0.6 }} className="flex-shrink-0">
                          <GripVertical size={16} />
                        </span>
                        <input
                          value={g.name}
                          onChange={(e) => updateGroup(g.id, { name: e.target.value })}
                          placeholder="ชื่อกลุ่ม เช่น ท็อปปิ้ง / ระดับความหวาน"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                          className="flex-1 min-w-0 rounded-lg px-3 py-2 text-sm bg-white outline-none"
                        />
                        <button
                          type="button"
                          onClick={() => updateGroup(g.id, { required: !g.required })}
                          style={{
                            background: g.required ? COLORS.caramel : COLORS.sageSoft,
                            color: g.required ? "#FFF9F0" : COLORS.sage,
                          }}
                          className="text-[11px] font-bold px-2.5 py-1.5 rounded-full flex-shrink-0 active:scale-95 transition-transform"
                          title={g.required ? "ลูกค้าต้องเลือกอย่างน้อย 1 รายการในกลุ่มนี้" : "ลูกค้าสามารถไม่เลือกก็ได้"}
                        >
                          {g.required ? "บังคับเลือก" : "ไม่บังคับ"}
                        </button>
                        {/* เลือกได้สูงสุด 1 ข้อ (แบบเดียว) หรือเลือกได้หลายข้อ */}
                        <button
                          type="button"
                          onClick={() => updateGroup(g.id, { single: !g.single })}
                          style={{
                            background: g.single ? COLORS.caramel : COLORS.sageSoft,
                            color: g.single ? "#FFF9F0" : COLORS.sage,
                          }}
                          className="text-[11px] font-bold px-2.5 py-1.5 rounded-full flex-shrink-0 active:scale-95 transition-transform"
                          title={g.single ? "ลูกค้าเลือกได้สูงสุด 1 รายการในกลุ่มนี้ (เช่น ระดับความหวาน)" : "ลูกค้าเลือกกี่รายการก็ได้ในกลุ่มนี้ (เช่น ท็อปปิ้ง)"}
                        >
                          {g.single ? "เลือกได้ 1 ข้อ" : "เลือกได้หลายข้อ"}
                        </button>
                        <button
                          onClick={() => {
                            const refPromos = [...new Set((g.options || []).flatMap((o) => promosReferencingAddOn(o.id, promos)))];
                            if (refPromos.length && confirmDelGroup !== g.id) {
                              setConfirmDelGroup(g.id);
                              setTimeout(() => setConfirmDelGroup((cur) => (cur === g.id ? null : cur)), 3500);
                              return;
                            }
                            removeGroup(g.id);
                          }}
                          title={(() => {
                            const refPromos = [...new Set((g.options || []).flatMap((o) => promosReferencingAddOn(o.id, promos)))];
                            return refPromos.length
                              ? `⚠ มีตัวเลือกในกลุ่มนี้ที่ใช้ในโปรโมชั่นที่เปิดอยู่: ${refPromos.map((p) => p.name).join(", ")} — กดอีกครั้งเพื่อยืนยันลบทั้งกลุ่ม`
                              : undefined;
                          })()}
                          style={{ color: "#C0533F" }}
                          className="flex-shrink-0"
                        >
                          {confirmDelGroup === g.id ? <span className="text-[9px] font-bold px-1">ยืนยัน?</span> : <Trash2 size={14} />}
                        </button>
                      </div>
                      {/* ตัวเลือกย่อยในกลุ่ม — แต่ละตัวแก้ชื่อ/ราคา/ต้นทุน + ผูกวัตถุดิบได้ + ลากสลับลำดับได้ (ย้ายข้ามกลุ่มไม่ได้) */}
                      {g.options && g.options.length > 0 ? (
                        <div className="space-y-1.5">
                          {g.options.map((o) => (
                            <div
                              key={o.id}
                              data-option-id={o.id}
                              data-group-id={g.id}
                              data-touch-label={o.name || "ตัวเลือก"}
                              draggable
                              onDragStart={(e) => {
                                e.stopPropagation(); // กันไม่ให้ event ทะลุขึ้นไปโดนแถวหัวกลุ่มด้านนอกจับเป็นลากกลุ่ม
                                setDragOption({ id: o.id, gid: g.id });
                                e.dataTransfer.effectAllowed = "move";
                                e.dataTransfer.setDragImage(makeDragImage(o.name || "ตัวเลือก"), 12, 12);
                              }}
                              onDragEnd={(e) => { e.stopPropagation(); setDragOption(null); setOverOption(null); }}
                              onDragOver={(e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                e.dataTransfer.dropEffect = "move";
                                if (!overOption || overOption.id !== o.id) setOverOption({ id: o.id, gid: g.id });
                              }}
                              onDragLeave={(e) => {
                                e.stopPropagation();
                                if (e.currentTarget.contains(e.relatedTarget)) return;
                                const leaveId = e.currentTarget.dataset.optionId;
                                setOverOption((op) => (op && op.id === leaveId ? null : op));
                              }}
                              onDrop={(e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                if (dragOption) dropOption(dragOption, { id: o.id, gid: g.id });
                                setDragOption(null);
                                setOverOption(null);
                              }}
                              style={{
                                background: COLORS.paper,
                                border: `1px solid ${overOption && overOption.id === o.id && dragOption && dragOption.id !== o.id && dragOption.gid === g.id ? COLORS.caramel : "transparent"}`,
                                opacity: dragOption && dragOption.id === o.id ? 0.4 : 1,
                                cursor: "grab",
                              }}
                              className="rounded-lg px-3 py-2 transition-all"
                            >
                              <div className="flex items-center gap-2">
                                <span style={{ color: COLORS.inkSoft, opacity: 0.6 }} className="flex-shrink-0">
                                  <GripVertical size={14} />
                                </span>
                                <input
                                  value={o.name}
                                  onChange={(e) => updateOption(g.id, o.id, { name: e.target.value })}
                                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                                  className="flex-1 min-w-0 rounded-lg px-2 py-1.5 text-sm bg-white outline-none"
                                />
                                <span style={{ color: COLORS.caramelDark }} className="text-[11px] font-bold flex-shrink-0">+฿</span>
                                <input
                                  value={o.price}
                                  onChange={(e) => updateOption(g.id, o.id, { price: digitsOnly(e.target.value) })}
                                  inputMode="numeric"
                                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                                  className="w-14 rounded-lg px-2 py-1.5 text-sm bg-white outline-none text-center"
                                />
                                <button
                                  onClick={() => {
                                    const refPromos = promosReferencingAddOn(o.id, promos);
                                    if (refPromos.length && confirmDelOption !== o.id) {
                                      setConfirmDelOption(o.id);
                                      setTimeout(() => setConfirmDelOption((cur) => (cur === o.id ? null : cur)), 3500);
                                      return;
                                    }
                                    removeOption(g.id, o.id);
                                  }}
                                  title={
                                    promosReferencingAddOn(o.id, promos).length
                                      ? `⚠ ใช้ในโปรโมชั่นที่เปิดอยู่: ${promosReferencingAddOn(o.id, promos).map((p) => p.name).join(", ")} — กดอีกครั้งเพื่อยืนยันลบ`
                                      : undefined
                                  }
                                  style={{ color: "#C0533F" }}
                                  className="flex-shrink-0"
                                >
                                  {confirmDelOption === o.id ? <span className="text-[9px] font-bold px-1">ยืนยัน?</span> : <Trash2 size={14} />}
                                </button>
                              </div>
                              {/* ต้นทุน + วัตถุดิบของท็อปปิ้งนี้ (ตัดสต็อกอัตโนมัติ) */}
                              <div className="flex items-center gap-1.5 mt-1.5">
                                <span style={{ color: COLORS.inkSoft }} className="text-[10px] flex-shrink-0">ต้นทุน</span>
                                <input
                                  value={o.cost != null ? String(o.cost) : ""}
                                  onChange={(e) => updateOption(g.id, o.id, { cost: decimalDigitsOnly(e.target.value) })}
                                  placeholder="฿"
                                  inputMode="decimal"
                                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                                  className="w-16 rounded-lg px-2 py-1 text-[11px] bg-white outline-none"
                                />
                                <span style={{ color: COLORS.inkSoft }} className="text-[10px] flex-shrink-0">ใช้วัตถุดิบ:</span>
                                {Object.keys(o.recipe || {}).length === 0 && (
                                  <span style={{ color: COLORS.inkSoft }} className="text-[10px]">ยังไม่ผูก</span>
                                )}
                              </div>
                              {Object.entries(o.recipe || {}).map(([sid, qty]) => {
                                const stock = stockItems.find((s) => s.id === sid);
                                return (
                                  <div key={sid} className="flex items-center gap-1.5 mt-1">
                                    <select
                                      value={sid}
                                      onChange={(e) => {
                                        const v = e.target.value;
                                        const recipe = { ...(o.recipe || {}) };
                                        delete recipe[sid];
                                        if (v) recipe[v] = o.recipe[sid] || "";
                                        updateOption(g.id, o.id, { recipe });
                                      }}
                                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                                      className="flex-1 min-w-0 rounded-lg px-2 py-1 text-[11px] bg-white outline-none"
                                    >
                                      <option value="">เลือกวัตถุดิบ…</option>
                                      {stockItems.map((s) => (
                                        <option key={s.id} value={s.id}>{s.name} ({s.unit})</option>
                                      ))}
                                    </select>
                                    <input
                                      value={qty}
                                      onChange={(e) =>
                                        updateOption(g.id, o.id, { recipe: { ...(o.recipe || {}), [sid]: decimalDigitsOnly(e.target.value) } })
                                      }
                                      placeholder="จำนวน"
                                      inputMode="decimal"
                                      style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                                      className="w-16 rounded-lg px-2 py-1 text-[11px] bg-white outline-none text-center"
                                    />
                                    <span style={{ color: COLORS.inkSoft }} className="text-[10px] w-8 flex-shrink-0">
                                      {stock ? stock.unit : "หน่วย"}
                                    </span>
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const recipe = { ...(o.recipe || {}) };
                                        delete recipe[sid];
                                        updateOption(g.id, o.id, { recipe });
                                      }}
                                      style={{ color: "#C0533F" }}
                                      className="flex-shrink-0"
                                    >
                                      <X size={12} />
                                    </button>
                                  </div>
                                );
                              })}
                              <button
                                type="button"
                                onClick={() => {
                                  const firstUnused = stockItems.find((s) => !((o.recipe || {})[s.id] !== undefined));
                                  if (!firstUnused) return;
                                  updateOption(g.id, o.id, { recipe: { ...(o.recipe || {}), [firstUnused.id]: "" } });
                                }}
                                disabled={stockItems.length === 0 || stockItems.every((s) => (o.recipe || {})[s.id] !== undefined)}
                                style={{ color: COLORS.caramelDark }}
                                className="text-[10px] font-semibold mt-1 disabled:opacity-40"
                              >
                                + วัตถุดิบ
                              </button>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <p style={{ color: COLORS.inkSoft }} className="text-[11px]">ยังไม่มีตัวเลือกในกลุ่มนี้</p>
                      )}
                      {/* ฟอร์มเพิ่มตัวเลือกในกลุ่มนี้ */}
                      <div className="flex gap-2">
                        <input
                          value={newOptionName[g.id] || ""}
                          onChange={(e) => setNewOptionName((m) => ({ ...m, [g.id]: e.target.value }))}
                          placeholder="ชื่อตัวเลือก เช่น เพิ่มไข่มุก"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                          className="flex-1 min-w-0 rounded-lg px-3 py-2 text-sm bg-white outline-none"
                        />
                        <input
                          value={newOptionPrice[g.id] || ""}
                          onChange={(e) => setNewOptionPrice((m) => ({ ...m, [g.id]: digitsOnly(e.target.value) }))}
                          placeholder="+฿"
                          inputMode="numeric"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                          className="w-16 rounded-lg px-3 py-2 text-sm bg-white outline-none"
                        />
                        <input
                          value={newOptionCost[g.id] || ""}
                          onChange={(e) => setNewOptionCost((m) => ({ ...m, [g.id]: decimalDigitsOnly(e.target.value) }))}
                          placeholder="ต้นทุน฿"
                          inputMode="decimal"
                          style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                          className="w-20 rounded-lg px-3 py-2 text-sm bg-white outline-none"
                        />
                        <button
                          type="button"
                          onClick={() => addOption(g.id)}
                          disabled={!(newOptionName[g.id] || "").trim() || !newOptionPrice[g.id]}
                          style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                          className="w-10 rounded-lg flex items-center justify-center flex-shrink-0 disabled:opacity-40"
                        >
                          <Plus size={16} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
                <button
                  type="button"
                  onClick={addGroup}
                  style={{ border: `1.5px dashed ${COLORS.line}`, color: COLORS.caramelDark }}
                  className="w-full rounded-xl py-2.5 text-xs font-semibold bg-white"
                >
                  + เพิ่มกลุ่มตัวเลือก
                </button>
              </div>
            </div>

            <div className="flex items-center justify-between pt-1 mt-4">
              <button onClick={() => setForm((f) => ({ ...f, active: !f.active }))} className="flex items-center gap-2">
                <span
                  style={{ background: form.active ? COLORS.sage : "#D8CBB8", width: 40, height: 22, borderRadius: 999 }}
                  className="relative inline-block"
                >
                  <span
                    style={{ left: form.active ? 20 : 3, background: "#FFF", width: 16, height: 16, borderRadius: 999, top: 3 }}
                    className="absolute transition-all"
                  />
                </span>
                <span style={{ color: COLORS.ink }} className="text-sm font-medium">
                  {form.active ? "มีของ (ลูกค้าสั่งได้)" : "สินค้าหมด (ลูกค้ากดสั่งไม่ได้)"}
                </span>
              </button>
            </div>

            {editing !== "new" && (() => {
              const refPromos = promosReferencingMenuItem(editing, promos);
              if (!refPromos.length) return null;
              return (
                <p style={{ color: "#C0533F" }} className="text-[11px] font-medium mt-2">
                  ⚠ เมนูนี้ถูกใช้ในโปรโมชั่นที่เปิดอยู่: {refPromos.map((p) => p.name).join(", ")} — ลบแล้วโปรนั้นจะหยุดหักส่วนลดให้เมนูนี้ทันที (โปรไม่ได้ถูกลบ แค่ใช้กับเมนูนี้ไม่ได้อีก)
                </p>
              );
            })()}

            <div className="flex gap-2 mt-4">
              {editing !== "new" && (
                <button
                  type="button"
                  onClick={() => {
                    if (!confirmDelMenu) {
                      setConfirmDelMenu(true);
                      setTimeout(() => setConfirmDelMenu(false), 3500);
                      return;
                    }
                    setConfirmDelMenu(false);
                    remove(editing);
                  }}
                  style={confirmDelMenu ? { background: "#C0533F", color: "#FFF" } : { border: `1px solid #C0533F`, color: "#C0533F" }}
                  className="rounded-xl px-4 py-2.5 text-sm font-semibold flex items-center gap-1.5 flex-shrink-0"
                >
                  <Trash2 size={15} /> {confirmDelMenu ? "กดอีกครั้งเพื่อยืนยัน" : "ลบเมนู"}
                </button>
              )}
              <PrimaryButton full onClick={save} disabled={!form.name.trim() || !form.price}>
                บันทึกเมนู
              </PrimaryButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STAFF ORDERS VIEW =================
function StaffOrdersView({ orders, recentOrderIds, onAdvance, onCancel, onRevive, onTransferGoods, onUntagTransfer, onDelete, onDeleteOrders, onMarkPaid, onUnmarkPaid }) {
  const [zoomedSlip, setZoomedSlip] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null); // order id รอ confirm ลบรายตัว
  const [deletePickOpen, setDeletePickOpen] = useState(false); // เปิดชีตติ๊กเลือกออร์เดอร์ที่จะลบ
  const [deletePickIds, setDeletePickIds] = useState([]); // id ออร์เดอร์ที่ติ๊กเลือกไว้
  const [confirmDeletePicked, setConfirmDeletePicked] = useState(false); // รอ confirm ลบที่เลือก
  const [confirmCancelId, setConfirmCancelId] = useState(null); // order id รอ confirm ยกเลิก
  const [cancelReason, setCancelReason] = useState(""); // สาเหตุการยกเลิก — พนักงานต้องกรอกก่อนยืนยัน
  const [confirmReviveId, setConfirmReviveId] = useState(null); // order id รอ confirm "ลูกค้ามารับของแล้ว" (ยกเลิกแล้วแต่มารับของ)
  const [transferFromId, setTransferFromId] = useState(null); // ออร์เดอร์ A (ยกเลิก+ทำแล้ว) ที่กำลังเลือกออร์เดอร์ให้ของ — เปิดชีต
  const [transferPair, setTransferPair] = useState(null); // { from, to } — รอ confirm โอนของจาก A ไปให้ B
  const [confirmUntagTransferId, setConfirmUntagTransferId] = useState(null); // รอ confirm ยกเลิกการโอนของ (กดจากปุ่มเดิมบนการ์ด A ที่โอนไปแล้ว)
  const [deleteCancelPickOpen, setDeleteCancelPickOpen] = useState(false); // เปิดชีตติ๊กเลือกออร์เดอร์ที่ยกเลิกที่จะลบ
  const [deleteCancelPickIds, setDeleteCancelPickIds] = useState([]); // id ออร์เดอร์ที่ยกเลิกที่ติ๊กเลือกไว้
  const [confirmDeleteCancelled, setConfirmDeleteCancelled] = useState(false); // รอ confirm ลบที่ยกเลิกที่เลือกไว้
  const [highlightNewId, setHighlightNewId] = useState(null); // ออร์เดอร์ใหม่ที่กำลังไฮไลต์ หลังกดปุ่ม "ไปดู"
  // จำนวนออร์เดอร์ที่ยังไม่ได้เริ่มทำ (สถานะ "ใหม่") — ใช้กับแถบเตือนกันลืม
  const unstartedNewCount = orders.filter((o) => o.status === "new").length;

  const advance = (id) => {
    onAdvance(id);
  };

  // กด "ไปดู" — เลื่อนจอไปหาออร์เดอร์ใหม่ใบแรกที่ยังไม่ได้เริ่มทำ + ไฮไลต์กะพริบชั่วคราว
  const goToNewOrder = () => {
    const first = sorted.find((o) => o.status === "new");
    if (!first) return;
    const el = document.getElementById(`order-card-${first.id}`);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      setHighlightNewId(first.id);
      setTimeout(() => setHighlightNewId(null), 2600);
    }
  };

  // บันทึกรูปสลิปของออร์เดอร์นี้ลงเครื่อง (ทีละใบ) — หลักฐานการชำระ/การรับสินค้า
  const downloadSlip = (order) => {
    const url = order.slip.url || order.slip.dataUrl;
    const a = document.createElement("a");
    a.href = url;
    a.download = `สลิป-ออร์เดอร์-${order.orderNo}.${url.startsWith("data:image/png") ? "png" : "jpg"}`;
    a.click();
  };

  const statusMeta = {
    new: { label: "ออร์เดอร์ใหม่", color: COLORS.caramel, bg: COLORS.peachSoft, action: "เริ่มทำ" },
    preparing: { label: "กำลังทำ", color: "#B08628", bg: "#F5EAC9", action: "เสร็จแล้ว" },
    done: { label: "เสร็จแล้ว", color: COLORS.sage, bg: COLORS.sageSoft, action: null },
    delivered: { label: "จัดส่งเสร็จแล้ว", color: "#FFFFFF", bg: COLORS.sage, action: null },
    received: { label: "รับสินค้าแล้ว", color: "#FFFFFF", bg: COLORS.sage, action: null },
    cancelled: { label: "ยกเลิกแล้ว", color: "#C0533F", bg: "#F3D9D3", action: null },
  };

  // เรียงแบบคิว (FIFO): ออร์เดอร์เก่าอยู่บนสุด — ออร์เดอร์ใหม่ที่เพิ่งเข้ามาต่อคิวล่าง (ไม่เด้งขึ้นบน)
  // พอกด "เสร็จแล้ว"/รับสินค้าแล้ว/จัดส่งแล้ว/ยกเลิก ออร์เดอร์จะไหลลงไปส่วนล่าง ออร์เดอร์ถัดไปค่อยขยับขึ้นมา
  const statusRank = { new: 0, preparing: 0, done: 1, delivered: 2, received: 2, cancelled: 3 };
  const sorted = [...orders].sort((a, b) => {
    const ra = statusRank[a.status] !== undefined ? statusRank[a.status] : 1;
    const rb = statusRank[b.status] !== undefined ? statusRank[b.status] : 1;
    if (ra !== rb) return ra - rb;
    return a.createdAt - b.createdAt;
  });
  // ออร์เดอร์ที่เสร็จสิ้นจริง ๆ (จัดส่งแล้ว + รับที่ร้านที่ทำเสร็จแล้ว) — รายการที่ลบได้
  // ออร์เดอร์จัดส่งที่แค่ "เสร็จแล้ว" ยังรออยู่ในคิวจัดส่ง จึงไม่นับรวม
  const finishedOrders = orders.filter(
    (o) => o.status === "delivered" || o.status === "received" || (o.status === "done" && o.method === "pickup")
  );
  const finishedCount = finishedOrders.length;
  const cancelledOrders = orders.filter((o) => o.status === "cancelled");
  const cancelledCount = cancelledOrders.length;

  // เปรียบเทียบรายการอาหาร 2 ออร์เดอร์ว่าตรงกันหรือไม่ (ชื่อ + จำนวน) — ใช้หาว่าออร์เดอร์ไหนรับของต่อได้
  const itemsMatch = (a, b) => {
    const norm = (items) =>
      (items || [])
        .map((i) => `${i.name}::${i.qty}`)
        .sort()
        .join("|");
    return norm(a) === norm(b);
  };
  // ออร์เดอร์ที่ยังทำอยู่ (ใหม่/กำลังทำ) — ตัวเลือกที่จะรับของจากออร์เดอร์ที่ยกเลิก
  const activeOrders = orders.filter((o) => o.status === "new" || o.status === "preparing");
  // ออร์เดอร์นี้ (ที่ยกเลิก + ทำเสร็จแล้ว + ยังไม่ได้โอนของ) มีออร์เดอร์อื่นที่รายการตรงกันไหม —
  // มี ถึงจะขึ้นปุ่ม "ใช้ของให้ออร์เดอร์อื่น"
  const hasMatchFor = (order) => activeOrders.some((o) => itemsMatch(order.items, o.items));

  return (
    <div style={{ background: COLORS.cream, minHeight: "100%" }} className="px-5 pt-6 pb-10">
      <div className="flex items-start justify-between gap-2 mb-1">
        <h1 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-2xl font-semibold">
          ออร์เดอร์เข้าร้าน
        </h1>
        <div className="flex items-center gap-1.5 flex-shrink-0">
          {cancelledCount > 0 && (
            <button
              onClick={() => {
                setDeleteCancelPickOpen(true);
                setDeleteCancelPickIds([]);
              }}
              style={{ color: "#C0533F", border: "1px solid #E3B7AC" }}
              className="text-[11px] font-semibold px-2.5 py-1.5 rounded-full flex items-center gap-1 flex-shrink-0"
            >
              <Trash2 size={12} /> ลบที่ยกเลิก ({cancelledCount})
            </button>
          )}
          {finishedCount > 0 && (
            <button
              onClick={() => {
                setDeletePickOpen(true);
                setDeletePickIds([]);
              }}
              style={{ color: "#C0533F", border: "1px solid #E3B7AC" }}
              className="text-[11px] font-semibold px-2.5 py-1.5 rounded-full flex items-center gap-1 flex-shrink-0"
            >
              <Trash2 size={12} /> ลบที่เสร็จแล้ว ({finishedCount})
            </button>
          )}
        </div>
      </div>
      <p style={{ color: COLORS.inkSoft }} className="text-xs mb-5">อัปเดตแบบเรียลไทม์เมื่อลูกค้าสั่ง</p>

      {/* แถบเตือนออเดอร์ใหม่ — เตือนค้างจนกว่าจะกด "เริ่มทำ" ครบ (กันลืมออเดอร์ที่มาต่อท้ายคิว FIFO) */}
      {unstartedNewCount > 0 && (
        <div
          style={{
            background: "linear-gradient(135deg, #C0533F, #A8442F)",
            boxShadow: "0 6px 18px rgba(192,83,63,0.35)",
          }}
          className="rounded-2xl px-4 py-3 mb-4 flex items-center gap-3"
        >
          <span style={{ background: "#FFD9A0" }} className="w-2.5 h-2.5 rounded-full animate-pulse flex-shrink-0" />
          <span style={{ color: "#FFF9F0" }} className="text-sm font-semibold flex-1 min-w-0">
            มีออเดอร์ใหม่ {unstartedNewCount} รายการ — ยังไม่ได้เริ่มทำ
          </span>
          <button
            onClick={goToNewOrder}
            style={{ background: "#FFF9F0", color: "#A8442F" }}
            className="rounded-full px-3.5 py-1.5 text-xs font-bold flex items-center gap-1 flex-shrink-0 active:scale-95 transition-transform"
          >
            ไปดู <ChevronDown size={12} />
          </button>
        </div>
      )}

      {sorted.length === 0 && (
        <div className="text-center py-20" style={{ color: COLORS.inkSoft }}>
          <ChefHat size={32} className="mx-auto mb-2 opacity-50" />
          ยังไม่มีออร์เดอร์เข้ามา
        </div>
      )}

      <div className="space-y-3 md:grid md:grid-cols-2 md:gap-3 md:space-y-0 xl:grid-cols-3">
        {sorted.map((order) => {
          const meta = statusMeta[order.status];
          // ออร์เดอร์จัดส่งที่ทำเสร็จแล้วกำลังรออยู่ในคิวจัดส่ง — ระบุให้พนักงานเห็นชัดเจน
          const metaLabel =
            order.status === "done" && order.method !== "pickup" ? "เสร็จแล้ว · รอจัดส่ง" : meta.label;
          const total = calcOrderTotal(order); // ยอดรวมหลังหักส่วนลดโค้ด (ถ้ามี)
          return (
            <div
              key={order.id}
              id={`order-card-${order.id}`}
              style={{
                background: "#FFFFFF",
                border: `1.5px solid ${highlightNewId === order.id ? COLORS.peach : COLORS.line}`,
                boxShadow:
                  highlightNewId === order.id
                    ? "0 0 0 4px rgba(242,164,107,0.4), 0 8px 20px rgba(242,164,107,0.3)"
                    : undefined,
              }}
              className="rounded-2xl p-4"
            >
              {/* หัวการ์ด: หมายเลขออร์เดอร์ + ป้ายใหม่ + สถานะ + ลบถาวร */}
              <div className="flex items-center justify-between gap-2 mb-1.5">
                <div className="flex items-center gap-2 min-w-0">
                  <span style={{ color: COLORS.ink }} className="font-bold text-sm flex-shrink-0">#{order.orderNo}</span>
                  {/* ป้าย "ใหม่!" ค้างจนกว่าจะกด "เริ่มทำ" (สถานะยังเป็น new) — ไม่หายเองตามเวลา */}
                  {order.status === "new" && (
                    <span
                      style={{ background: "#C0533F", color: "#FFF9F0" }}
                      className="text-[10px] font-bold px-2 py-1 rounded-full animate-pulse flex-shrink-0"
                    >
                      ใหม่!
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-1.5 flex-shrink-0">
                  <span
                    style={{ background: meta.bg, color: meta.color }}
                    className="text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 whitespace-nowrap"
                  >
                    {order.status === "preparing" && <Clock size={11} />}
                    {order.status === "done" && <Check size={11} />}
                    {order.status === "delivered" && <Truck size={11} />}
                    {order.status === "received" && <ChefHat size={11} />}
                    {order.status === "cancelled" && <X size={11} />}
                    {metaLabel}
                  </span>
                  <button
                    onClick={() => setConfirmDeleteId(order.id)}
                    style={{ color: COLORS.inkSoft }}
                    className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0"
                    aria-label="ลบออร์เดอร์นี้"
                  >
                    <Trash2 size={14} />
                  </button>
                </div>
              </div>

              {/* ข้อมูลลูกค้า: ชื่อ + เบอร์โทร + ที่อยู่ + เวลาเข้ามา — แยกบรรทัด อ่านง่าย */}
              <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">{order.customerName || "ไม่ระบุชื่อ"}</p>
              <div className="flex items-center gap-3 flex-wrap mt-0.5 mb-2">
                {order.phone && (
                  <span style={{ color: COLORS.inkSoft }} className="text-xs flex items-center gap-1">
                    <Phone size={11} /> {order.phone}
                  </span>
                )}
                {order.houseNo && (
                  <span style={{ color: COLORS.inkSoft }} className="text-xs flex items-center gap-1">
                    <MapPin size={11} /> {order.houseNo}
                  </span>
                )}
                <span style={{ color: COLORS.inkSoft }} className="text-xs flex items-center gap-1">
                  <Clock size={11} /> {formatOrderTime(order.createdAt)}
                </span>
              </div>

              {/* วิธีรับ + วิธีชำระเงิน */}
              <div className="flex items-center gap-1.5 flex-wrap mb-3">
                {order.method === "pickup" ? (
                  <Chip tone="sage">
                    <ChefHat size={11} /> รับที่ร้าน
                  </Chip>
                ) : order.deliveryDate && order.deliveryTime ? (
                  <Chip tone="sage">
                    <Truck size={11} /> {formatDeliveryDateLabel(order.deliveryDate)} {order.deliveryTime} น.
                  </Chip>
                ) : order.deliveryNow ? (
                  <Chip tone="sage">
                    <Truck size={11} /> ส่งตอนนี้ (เร็วที่สุด)
                  </Chip>
                ) : null}
                <PaymentStatusBadge order={order} onMarkPaid={onMarkPaid} onUnmarkPaid={onUnmarkPaid} />
                {order.slip?.dataUrl && (
                  <span style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="text-xs font-semibold px-2.5 py-1 rounded-full inline-flex items-center gap-1">
                    <QrCode size={11} /> แนบสลิปแล้ว
                  </span>
                )}
              </div>              {/* ออเดอร์ที่ได้ของสำเร็จรูปมา (โอนจากออร์เดอร์ที่ยกเลิก) — บอกพนักงานว่าไม่ต้องทำใหม่ */}
              {order.goodsFromOrderId && (
                <div style={{ background: COLORS.sage, color: "#FFF9F0" }} className="rounded-xl px-3 py-2 mb-2.5 flex items-center gap-2">
                  <ArrowLeft size={14} className="flex-shrink-0" />
                  <span className="text-xs font-bold">
                    ของมาจากออร์เดอร์ #{orders.find((o) => o.id === order.goodsFromOrderId)?.orderNo || ""}
                  </span>
                  <span className="text-[11px] font-medium opacity-90 ml-auto flex-shrink-0">ไม่ต้องทำใหม่</span>
                </div>
              )}

              {/* รายการอาหาร + ราคาต่อบรรทัด */}
              <div className="space-y-1.5 mb-2.5">
                {order.items.map((i) => (
                  <div key={i.cartId || i.id} className="text-sm">
                    <div className="flex justify-between items-baseline gap-2">
                      <span style={{ color: COLORS.ink }}>{i.name} × {i.qty}</span>
                      <span style={{ color: COLORS.inkSoft }} className="text-xs flex-shrink-0">฿{fmtBaht((i.price || 0) * i.qty)}</span>
                    </div>
                    {i.addOns && i.addOns.length > 0 && (
                      <p style={{ color: COLORS.caramelDark }} className="text-[11px] mt-0.5">
                        + {i.addOns.map((a) => a.name).join(", ")}
                      </p>
                    )}
                    {i.note && i.note.trim() && (
                      <p style={{ background: COLORS.peachSoft, color: COLORS.caramelDark }} className="text-[11px] font-medium rounded-lg px-2 py-1 mt-1 mb-1 flex items-start gap-1">
                        <Pencil size={10} className="mt-0.5 flex-shrink-0" /> {i.note}
                      </p>
                    )}

                  </div>
                ))}
              </div>
              {order.status === "cancelled" && order.cancelReason && (
                <p style={{ background: "#F3D9D3", color: "#8A3A2B" }} className="text-[11px] font-medium rounded-lg px-2 py-1.5 mb-2 flex items-start gap-1">
                  <X size={10} className="mt-0.5 flex-shrink-0" /> สาเหตุที่ยกเลิก: {order.cancelReason}
                </p>
              )}
              {order.status === "cancelled" && order.cancelledFrom === "done" && !order.goodsUsedByOrderId && (
                <p style={{ background: "#F3D9D3", color: "#8A3A2B" }} className="text-[11px] font-medium rounded-lg px-2 py-1.5 mb-2 flex items-start gap-1">
                  <AlertTriangle size={10} className="mt-0.5 flex-shrink-0" />
                  ทำเสร็จแล้วก่อนยกเลิก — ต้นทุนติดบัญชีเป็นขาดทุน ถ้ายังไม่ได้ใช้ของ กด "ลูกค้ามารับของแล้ว" หรือ "ใช้ของให้ออร์เดอร์อื่น"
                </p>
              )}
              {order.status === "cancelled" && order.goodsUsedByOrderId && (
                <div style={{ background: COLORS.sage, color: "#FFF9F0" }} className="rounded-xl px-3 py-2 mb-2 flex items-center gap-2">
                  <TransferArrowIcon size={15} className="flex-shrink-0" />
                  <span className="text-xs font-bold">
                    ของถูกใช้ให้ออร์เดอร์ #{orders.find((o) => o.id === order.goodsUsedByOrderId)?.orderNo || ""} แล้ว
                  </span>
                  <span className="text-[11px] font-medium opacity-90 ml-auto flex-shrink-0">ไม่นับขาดทุน</span>
                </div>
              )}
              {order.slip?.dataUrl && (
                <div
                  style={{ background: COLORS.paper, border: `1px solid ${COLORS.line}` }}
                  className="w-full rounded-xl p-2.5 mb-2 flex gap-2.5 items-center"
                >
                  <button
                    onClick={() => setZoomedSlip(order.slip.url || order.slip.dataUrl)}
                    className="flex-1 flex gap-2.5 items-center text-left min-w-0"
                  >
                    <img
                      src={order.slip.url || order.slip.dataUrl}
                      alt="สลิป"
                      className="w-11 h-14 rounded-lg object-cover flex-shrink-0"
                      style={{ border: `1px solid ${COLORS.line}` }}
                    />
                    <span style={{ color: COLORS.caramelDark }} className="text-xs font-semibold">
                      แตะเพื่อดูสลิปแบบเต็มจอ
                    </span>
                  </button>
                  <button
                    onClick={() => downloadSlip(order)}
                    title="บันทึกรูปสลิปลงเครื่อง"
                    aria-label="บันทึกรูปสลิปลงเครื่อง"
                    style={{ color: COLORS.sage, border: `1.5px solid ${COLORS.sage}` }}
                    className="flex-shrink-0 rounded-full px-2.5 py-1.5 text-[11px] font-semibold flex items-center gap-1"
                  >
                    <DownloadIcon size={12} /> บันทึกรูป
                  </button>
                </div>
              )}
              <div style={{ borderTop: `1px dashed ${COLORS.line}` }} className="pt-2.5 mt-1 flex items-end justify-between gap-2">
                <div className="min-w-0">
                  {order.discount && Number(order.discount.baht) > 0 && (
                    <div className="text-xs mb-0.5">
                      <span style={{ color: COLORS.sage }} className="font-semibold">
                        ส่วนลด {order.discount.label || ("โค้ด " + (order.discount.code || ""))} -฿{fmtBaht(order.discount.baht)}
                      </span>
                    </div>
                  )}
                  <span style={{ color: COLORS.caramelDark }} className="font-bold text-sm">฿{fmtBaht(total)}</span>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  {(order.status === "new" || order.status === "preparing" || order.status === "done") && (
                    <button
                      onClick={() => { setConfirmCancelId(order.id); setCancelReason(""); }}
                      style={{ color: "#C0533F", border: "1px solid #E3B7AC", background: "#FFFFFF" }}
                      className="text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
                    >
                      <X size={12} /> ยกเลิก
                    </button>
                  )}
                  {order.status === "cancelled" && !order.goodsUsedByOrderId && (
                    <button
                      onClick={() => setConfirmReviveId(order.id)}
                      style={{ background: COLORS.sage, color: "#FFF9F0" }}
                      className="text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
                    >
                      <Check size={12} /> ลูกค้ามารับของแล้ว
                    </button>
                  )}
                  {order.status === "cancelled" &&
                    order.cancelledFrom === "done" &&
                    (order.goodsUsedByOrderId ? (
                      <button
                        onClick={() => setConfirmUntagTransferId(order.id)}
                        style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                        className="text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
                      >
                        <ArrowLeft size={12} /> ยกเลิกการโอน
                      </button>
                    ) : hasMatchFor(order) ? (
                      <button
                        onClick={() => setTransferFromId(order.id)}
                        style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                        className="text-xs font-semibold px-3.5 py-2 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
                      >
                        <ShareIcon size={12} /> ใช้ของให้ออร์เดอร์อื่น
                      </button>
                    ) : null)}
                  {meta.action && (
                    <button
                      onClick={() => advance(order.id)}
                      style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                      className="text-xs font-semibold px-4 py-2 rounded-full active:scale-95 transition-transform"
                    >
                      {meta.action}
                    </button>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <ImageLightbox src={zoomedSlip} onClose={() => setZoomedSlip(null)} />

      {/* ยืนยันก่อนลบรายตัว — กันกดพลาดของหาย */}
      {confirmDeleteId && (
        <div
          onClick={() => setConfirmDeleteId(null)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">ลบออร์เดอร์นี้เลยไหม?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">ลบแล้วกู้คืนไม่ได้</p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmDeleteId(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยกเลิก
              </button>
              <button
                onClick={() => { onDelete(confirmDeleteId); setConfirmDeleteId(null); }}
                style={{ background: "#C0533F", color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ลบเลย
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ชีตติ๊กเลือกออร์เดอร์ที่เสร็จแล้วเพื่อลบทีละรายการ — กันกดลบทั้งก้อนพลาด */}
      {deletePickOpen && (
        <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
          <SheetLock />
          <div className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8 flex flex-col">
            <div className="flex items-center justify-between mb-1">
              <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                เลือกออร์เดอร์ที่ต้องการลบ
              </h2>
              <button onClick={() => setDeletePickOpen(false)} style={{ color: COLORS.inkSoft }}>
                <X size={20} />
              </button>
            </div>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-2">
              ติ๊กเฉพาะรายการที่เสร็จสิ้นแล้วและอยากลบ ({finishedCount} รายการที่ลบได้)
            </p>
            <button
              onClick={() => {
                setDeletePickIds((prev) =>
                  prev.length === finishedOrders.length && finishedOrders.length > 0
                    ? []
                    : finishedOrders.map((o) => o.id)
                );
              }}
              style={{ color: COLORS.caramelDark }}
              className="text-xs font-semibold self-start mb-2"
            >
              {deletePickIds.length === finishedOrders.length && finishedOrders.length > 0
                ? "ไม่เลือกทั้งหมด"
                : "เลือกทั้งหมด"}
            </button>

            <div style={{ overscrollBehavior: "contain" }} className="flex-1 min-h-0 overflow-y-auto space-y-2 pb-3">
              {finishedOrders.map((order) => {
                const checked = deletePickIds.includes(order.id);
                const total = calcOrderTotal(order);
                return (
                  <button
                    key={order.id}
                    onClick={() =>
                      setDeletePickIds((prev) =>
                        checked ? prev.filter((id) => id !== order.id) : [...prev, order.id]
                      )
                    }
                    style={{
                      background: "#FFFFFF",
                      border: `1.5px solid ${checked ? COLORS.caramel : COLORS.line}`,
                    }}
                    className="w-full rounded-2xl px-4 py-3 flex items-center gap-3 text-left"
                  >
                    <div
                      style={{
                        border: `2px solid ${checked ? COLORS.caramel : COLORS.line}`,
                        background: checked ? COLORS.caramel : "transparent",
                      }}
                      className="w-5 h-5 rounded flex items-center justify-center flex-shrink-0"
                    >
                      {checked && <Check size={12} color="#fff" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">
                        #{order.orderNo} · {order.customerName || "ไม่ระบุชื่อ"}
                      </p>
                      <p style={{ color: COLORS.inkSoft }} className="text-xs truncate">
                        {order.method === "pickup"
                          ? "รับที่ร้าน"
                          : order.deliveryDate && order.deliveryTime
                          ? `จัดส่ง ${formatDeliveryDateLabel(order.deliveryDate)} ${order.deliveryTime} น.`
                          : order.deliveryNow
                          ? "จัดส่งตอนนี้"
                          : "จัดส่ง"}{" "}
                        · ฿{fmtBaht(total)}
                      </p>
                    </div>
                  </button>
                );
              })}
            </div>

            <div style={{ borderTop: `1px solid ${COLORS.line}` }} className="pt-3 mt-1 flex gap-2">
              <button
                onClick={() => setDeletePickOpen(false)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-3 text-sm font-semibold"
              >
                ยกเลิก
              </button>
              <button
                onClick={() => {
                  if (deletePickIds.length > 0) setConfirmDeletePicked(true);
                }}
                disabled={deletePickIds.length === 0}
                style={{
                  background: deletePickIds.length > 0 ? "#C0533F" : "#D8C9B8",
                  color: "#FFF9F0",
                }}
                className="flex-1 rounded-xl py-3 text-sm font-semibold disabled:cursor-not-allowed"
              >
                ลบ {deletePickIds.length} รายการ
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ยืนยันลบออร์เดอร์ที่ติ๊กเลือกไว้ */}
      {confirmDeletePicked && (
        <div
          onClick={() => setConfirmDeletePicked(false)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">
              ลบ {deletePickIds.length} รายการที่เลือกเลยไหม?
            </p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
              ลบแล้วกู้คืนไม่ได้ (ไม่กระทบออร์เดอร์ใหม่/กำลังทำ/รอจัดส่ง)
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmDeletePicked(false)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยกเลิก
              </button>
              <button
                onClick={() => {
                  onDeleteOrders(deletePickIds);
                  setConfirmDeletePicked(false);
                  setDeletePickOpen(false);
                  setDeletePickIds([]);
                }}
                style={{ background: "#C0533F", color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ลบเลย
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ยืนยันก่อนยกเลิกออร์เดอร์รายตัว — เช่นลูกค้าโทรมายกเลิกที่ร้าน */}
      {confirmCancelId && (
        <div
          onClick={() => setConfirmCancelId(null)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">ยกเลิกออร์เดอร์นี้เลยไหม?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-3">
              ใช้เมื่อลูกค้าติดต่อมายกเลิก — ออร์เดอร์จะถูกทำเครื่องหมาย "ยกเลิกแล้ว" และไม่นับรวมในยอดขาย
            </p>
            <label style={{ color: COLORS.inkSoft }} className="text-xs font-medium block mb-1">สาเหตุที่ยกเลิก (จำเป็น)</label>
            <textarea
              value={cancelReason}
              onChange={(e) => setCancelReason(e.target.value)}
              placeholder="เช่น ลูกค้าขอเปลี่ยนใจ / สินค้าหมด / โทรขอยกเลิก"
              rows={2}
              style={{ border: `1px solid ${cancelReason.trim() ? COLORS.caramel : "#E3B7AC"}`, color: COLORS.ink }}
              className="w-full rounded-xl px-3.5 py-2.5 text-sm bg-white outline-none resize-none mb-4"
            />
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmCancelId(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ไม่ยกเลิก
              </button>
              <button
                onClick={() => { onCancel(confirmCancelId, cancelReason); setConfirmCancelId(null); setCancelReason(""); }}
                disabled={!cancelReason.trim()}
                style={{ background: cancelReason.trim() ? "#C0533F" : "#D8C9B8", color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold disabled:cursor-not-allowed"
              >
                ยืนยันยกเลิก
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ยืนยัน "ลูกค้ามารับของแล้ว" — ออร์เดอร์ที่ยกเลิกไปแล้วแต่มารับของ/รับสินค้าจริง */}
      {confirmReviveId && (
        <div
          onClick={() => setConfirmReviveId(null)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">ลูกค้ามารับของแล้ว?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
              ออร์เดอร์ #{orders.find((o) => o.id === confirmReviveId)?.orderNo || ""} จะกลับเป็น "รับสินค้าแล้ว"/"จัดส่งเสร็จแล้ว"
              และนับรวมยอดขาย — ถ้ายังไม่จ่าย อย่าลืมกด "เก็บเงินแล้ว"
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmReviveId(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยังไม่ใช่
              </button>
              <button
                onClick={() => { onRevive(confirmReviveId); setConfirmReviveId(null); }}
                style={{ background: COLORS.sage, color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยืนยัน รับของแล้ว
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ชีตเลือกออร์เดอร์ที่จะเอาของไปให้ — ของจากออร์เดอร์ที่ยกเลิก+ทำเสร็จแล้ว เอาไปให้ออร์เดอร์ใหม่ที่สั่งเหมือนกัน */}
      {transferFromId && (() => {
        const src = orders.find((o) => o.id === transferFromId);
        return (
          <div style={{ background: COLORS.cream }} className="fixed inset-0 z-40 flex flex-col">
            <SheetLock />
            <div className="relative flex-1 min-h-0 w-full max-w-2xl mx-auto rounded-t-[28px] p-5 pb-8 flex flex-col">
              <div className="flex items-center justify-between mb-1">
                <h2 style={{ fontFamily: "'Itim', sans-serif", color: COLORS.ink }} className="text-lg font-semibold">
                  เอาของให้ออร์เดอร์ไหน
                </h2>
                <button onClick={() => setTransferFromId(null)} style={{ color: COLORS.inkSoft }}>
                  <X size={20} />
                </button>
              </div>
              <p style={{ color: COLORS.inkSoft }} className="text-xs mb-2">
                ของจากออร์เดอร์ #{src?.orderNo || ""} (ทำเสร็จแล้ว แต่ยกเลิก) — เลือกออร์เดอร์ที่จะเอาของไปให้
                (ใบที่รายการตรงกันมีป้ายเขียว "ตรงกับของที่มี")
              </p>
              <div className="flex-1 min-h-0 overflow-y-auto space-y-2 pb-3" style={{ overscrollBehavior: "contain" }}>
                {activeOrders.length === 0 && (
                  <p style={{ color: COLORS.inkSoft }} className="text-xs py-8 text-center">
                    ยังไม่มีออร์เดอร์ที่กำลังทำอยู่
                  </p>
                )}
                {activeOrders.map((b) => {
                  const matched = src ? itemsMatch(src.items, b.items) : false;
                  return (
                    <button
                      key={b.id}
                      onClick={() => { setTransferPair({ from: transferFromId, to: b.id }); setTransferFromId(null); }}
                      style={{ background: "#FFFFFF", border: `1.5px solid ${matched ? COLORS.sage : COLORS.line}` }}
                      className="w-full rounded-2xl px-4 py-3 flex items-center gap-3 text-left"
                    >
                      <div className="flex-1 min-w-0">
                        <p style={{ color: COLORS.ink }} className="text-sm font-semibold truncate">
                          #{b.orderNo} · {b.customerName || "ไม่ระบุชื่อ"}
                        </p>
                        <p style={{ color: COLORS.inkSoft }} className="text-xs truncate">
                          {b.items.map((i) => `${i.name} × ${i.qty}`).join(", ")} · ฿{fmtBaht(calcOrderTotal(b))}
                        </p>
                      </div>
                      {matched && (
                        <span style={{ background: COLORS.sageSoft, color: COLORS.sage }} className="text-[11px] font-bold px-2 py-1 rounded-full flex-shrink-0">
                          ตรงกับของที่มี
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* ยืนยันโอนของจากออร์เดอร์ที่ยกเลิก (A) ไปให้ออร์เดอร์ใหม่ (B) */}
      {transferPair && (
        <div
          onClick={() => setTransferPair(null)}
          style={{ background: "rgba(20,14,8,0.55)" }}
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
        >
          <SheetLock />
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: "#FFFFFF" }}
            className="w-full max-w-sm rounded-2xl p-5"
          >
            <p style={{ color: COLORS.ink }} className="text-sm font-semibold mb-1">เอาของให้ออร์เดอร์นี้เลยไหม?</p>
            <p style={{ color: COLORS.inkSoft }} className="text-xs mb-4">
              ออร์เดอร์ #{orders.find((o) => o.id === transferPair.from)?.orderNo || ""} (ยกเลิก) → ออร์เดอร์ #
              {orders.find((o) => o.id === transferPair.to)?.orderNo || ""} — ของจะไม่นับขาดทุน
              และออร์เดอร์ใหม่จะไม่ตัดสต็อกซ้ำตอนทำเสร็จ
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setTransferPair(null)}
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ไม่เอาแล้ว
              </button>
              <button
                onClick={() => { onTransferGoods(transferPair.from, transferPair.to); setTransferPair(null); }}
                style={{ background: COLORS.caramel, color: "#FFF9F0" }}
                className="flex-1 rounded-xl py-2.5 text-sm font-semibold"
              >
                ยืนยัน โอนของ
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ยืนยันยกเลิกการโอนของ — กดจากปุ่มเดิมบนการ์ด A ที่โอนไปแล้ว (เลือก B ผิด/เปลี่ยนใจ) */}
      {confirmUntagTransferId && (
        <div
